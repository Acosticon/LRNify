<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lydmåler – LRNify</title>
<meta name="description" content="Lydmåler – visualiser lydnivået i klasserommet og hold ro under aktiviteter. Gratis verktøy fra LRNify.">

<meta property="og:type" content="website">
<meta property="og:title" content="Lydmåler – LRNify">
<meta property="og:description" content="Lydmåler – visualiser lydnivået i klasserommet og hold ro under aktiviteter. Gratis verktøy fra LRNify.">
<meta property="og:url" content="https://lrnify.no/tools/lyd/index.html">
<meta property="og:locale" content="nb_NO">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Lydmåler – LRNify",
  "url": "https://lrnify.no/tools/lyd/index.html",
  "description": "Lydmåler – visualiser lydnivået i klasserommet og hold ro under aktiviteter. Gratis verktøy fra LRNify.",
  "inLanguage": "nb-NO",
  "isAccessibleForFree": true,
  "provider": {
    "@type": "Organization",
    "name": "LRNify",
    "url": "https://lrnify.no/"
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#fff9f0;--ink:#2b2118;--yellow:#facc15;
  --card:#fff;--muted:#7a6f63;
  --green:#1a8a5a;--amber:#d97706;--red:#dc2626;
}
body{
  font-family:'Nunito',sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:28px 20px;gap:24px;
  transition:background .5s;
}
body.state-ok{background:var(--cream)}
body.state-warn{background:#fff7e0}
body.state-loud{background:#fff0f0}

h1{font-family:'Chewy',cursive;font-size:clamp(2rem,5vw,2.8rem);
  transform:rotate(-1.5deg);display:inline-block}
h1 b{color:var(--yellow);-webkit-text-stroke:2px var(--ink);font-weight:400}

.main-card{
  background:var(--card);border:4px solid var(--ink);
  box-shadow:0 10px 0 var(--ink);
  padding:36px 40px;width:100%;max-width:520px;
  display:flex;flex-direction:column;align-items:center;gap:28px;
  transform:rotate(.4deg);
  transition:background .4s,border-color .4s;
}

/* BIG STATUS ICON + LABEL */
.status-icon{
  font-size:clamp(4rem,18vw,7rem);
  line-height:1;
  transition:transform .15s;
  animation:none;
}
.status-icon.bounce{animation:boing .25s cubic-bezier(.36,.07,.19,.97)}
@keyframes boing{0%,100%{transform:scale(1)}40%{transform:scale(1.25) rotate(-5deg)}70%{transform:scale(.92) rotate(2deg)}}

.status-label{
  font-family:'Chewy',cursive;font-size:clamp(2rem,8vw,3rem);
  color:var(--ink);transition:color .3s;text-align:center;line-height:1
}
.state-ok .status-label{color:var(--green)}
.state-warn .status-label{color:var(--amber)}
.state-loud .status-label{color:var(--red)}

/* METER BAR */
.meter-wrap{
  width:100%;display:flex;flex-direction:column;gap:8px
}
.meter-track{
  width:100%;height:36px;
  border:4px solid var(--ink);
  background:var(--cream);
  position:relative;overflow:hidden;
}
.meter-fill{
  height:100%;width:0%;
  transition:width .08s linear;
  background:var(--green);
}
.meter-peak{
  position:absolute;top:0;bottom:0;width:4px;
  background:var(--ink);opacity:.7;
  transition:left .05s linear;
}
.meter-threshold{
  position:absolute;top:0;bottom:0;width:4px;background:var(--ink);opacity:.5
}
.meter-labels{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--muted)}

/* THRESHOLD SLIDERS */
.sliders{width:100%;display:flex;flex-direction:column;gap:12px}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row label{font-weight:800;font-size:15px;min-width:110px}
input[type=range]{flex:1;accent-color:var(--ink);height:6px;cursor:pointer}
.slider-val{
  min-width:40px;text-align:right;
  font-family:'Chewy',cursive;font-size:1.2rem
}

/* BUTTONS */
.controls{display:flex;gap:14px;width:100%}
.btn{
  flex:1;padding:14px 10px;
  border:4px solid var(--ink);
  font-family:'Chewy',cursive;font-size:1.5rem;
  cursor:pointer;letter-spacing:.03em;
  box-shadow:0 6px 0 var(--ink);
  transition:transform .1s,box-shadow .1s;
  background:var(--yellow);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.off{background:var(--card)}

/* GRAPH */
.graph-card{
  background:var(--card);border:4px solid var(--ink);
  box-shadow:0 8px 0 var(--ink);
  padding:20px 24px;width:100%;max-width:700px;
  display:flex;flex-direction:column;gap:14px;
  transform:rotate(-.4deg);
}
.graph-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.graph-title{font-family:'Chewy',cursive;font-size:1.5rem}
.window-btns{display:flex;gap:0;border:3px solid var(--ink);overflow:hidden}
.win-btn{
  padding:7px 16px;border:none;border-right:3px solid var(--ink);
  font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;
  cursor:pointer;background:var(--cream);color:var(--ink);transition:background .12s;
}
.win-btn:last-child{border-right:none}
.win-btn.active{background:var(--yellow)}
.win-btn:hover:not(.active){background:#fff3cd}
.graph-wrap{position:relative;width:100%}
canvas#graph-canvas{
  width:100%;height:180px;
  border:3px solid var(--ink);
  background:var(--cream);
  display:block;
}
.graph-axis-labels{
  display:flex;justify-content:space-between;
  font-size:12px;font-weight:800;color:var(--muted);margin-top:4px;
  padding:0 2px;
}

.main-card{max-width:700px}
</style>
</head>
<body class="state-ok">

<h1>🎙 Lyd<b>måler</b></h1>

<div class="main-card" id="main-card">
  <div class="status-icon" id="status-icon">😊</div>
  <div class="status-label" id="status-label">Stille og rolig</div>

  <div class="meter-wrap">
    <div class="meter-track" id="meter-track">
      <div class="meter-fill" id="meter-fill"></div>
      <div class="meter-peak" id="meter-peak" style="left:0%"></div>
      <div class="meter-threshold" id="thresh-warn-line"></div>
      <div class="meter-threshold" id="thresh-loud-line"></div>
    </div>
    <div class="meter-labels"><span>Stille</span><span>Høyt</span></div>
  </div>

  <div class="sliders">
    <div class="slider-row">
      <label>⚠️ Advarsel</label>
      <input type="range" id="warn-thresh" min="10" max="90" value="55" oninput="updateThresholds()">
      <span class="slider-val" id="warn-val">55%</span>
    </div>
    <div class="slider-row">
      <label>🔴 For høyt</label>
      <input type="range" id="loud-thresh" min="10" max="90" value="78" oninput="updateThresholds()">
      <span class="slider-val" id="loud-val">78%</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn off" id="start-btn" onclick="toggleMic()">🎙 Start</button>
  </div>

  <div class="permission-msg" id="perm-msg" style="display:none">
    Klikk «Tillat» i nettleseren for å gi tilgang til mikrofonen.
  </div>
</div>

<div class="graph-card">
  <div class="graph-header">
    <div class="graph-title">📈 Lydnivå over tid</div>
    <div class="window-btns">
      <button class="win-btn active" onclick="setWindow(1)">1 min</button>
      <button class="win-btn" onclick="setWindow(10)">10 min</button>
      <button class="win-btn" onclick="setWindow(30)">30 min</button>
      <button class="win-btn" onclick="setWindow(90)">90 min</button>
    </div>
  </div>
  <div class="graph-wrap">
    <canvas id="graph-canvas"></canvas>
  </div>
  <div class="graph-axis-labels" id="graph-axis-labels">
    <span>0:00</span><span></span><span></span><span></span><span>1:00</span>
  </div>
</div>

<script>
// ╔══════════════════════════════════════════════════╗
// ║  JUSTERBARE VERDIER – endre disse etter behov   ║
// ╚══════════════════════════════════════════════════╝
const CONFIG = {
  // Sensitivitet: hvor mye rå mikrofonsignal skaleres opp.
  // Lavere = roligere, høyere = mer sensitiv.
  // Prøv: 1.0 (rolig) → 1.4 (standard) → 2.0 (veldig sensitiv)
  SCALE: 0.4,

  // Standard-terskler (%) – kan også justeres med sliderene i UI
  DEFAULT_WARN: 55,   // gul advarsel over denne
  DEFAULT_LOUD: 78,   // rød alarm over denne

  // Hoveddisplay-baren (dbSmooth): tung glatting, rolig bevegelse
  // Tallene er vekter per animasjonsframe (~60/sek).
  // Høyere attack-vekt = raskere opp. Høyere decay-vekt = tregere ned.
  // Prøv attack: 0.05–0.20, decay: 0.01–0.05
  SMOOTH_ATTACK: 0.05,
  SMOOTH_DECAY:  0.01,

  // Toppmarkør (dbPeak): rask opp, langsom ned
  // Prøv attack: 0.50–0.80, decay: 0.04–0.10
  PEAK_ATTACK: 0.50,
  PEAK_DECAY:  0.04,
};
// ══════════════════════════════════════════════════

let audioCtx=null, analyser=null, source=null, stream=null;
let animId=null;
let running=false;
let dbSmooth=0;   // heavily smoothed – drives the display bar and state
let dbPeak=0;     // fast-attack, slow-decay – drives the peak marker
let warnT=CONFIG.DEFAULT_WARN, loudT=CONFIG.DEFAULT_LOUD;
let lastState='ok';
// Store one sample per second: {t: ms since epoch, v: 0-100}
const graphData=[];         // never cleared on window change
let windowMins=1;           // currently selected window
let startTime=null;         // when mic was first started (epoch ms)
let lastSampleTime=0;       // last time we pushed a sample (epoch ms)
const SAMPLE_INTERVAL=1000; // one sample per second

const canvas=document.getElementById('graph-canvas');
const ctx2d=canvas.getContext('2d');

function setWindow(mins){
  windowMins=mins;
  document.querySelectorAll('.win-btn').forEach(b=>{
    b.classList.toggle('active',b.textContent.startsWith(mins+' ') ||
      (mins===1&&b.textContent==='1 min')||(mins===10&&b.textContent==='10 min')||
      (mins===30&&b.textContent==='30 min')||(mins===90&&b.textContent==='90 min'));
  });
  drawGraph();
}

function fmtTime(secs){
  const m=Math.floor(secs/60),s=secs%60;
  return m+':'+(s<10?'0':'')+s;
}

function drawGraph(){
  // Size canvas to actual pixel size for sharpness
  const rect=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  ctx2d.scale(dpr,dpr);
  const W=rect.width, H=rect.height;

  const windowMs=windowMins*60*1000;
  const now=Date.now();
  // X axis always starts at 0 (= startTime), length = windowMs
  const xStart=startTime||now;
  const xEnd=xStart+windowMs;

  // Background
  ctx2d.fillStyle='#fff9f0';
  ctx2d.fillRect(0,0,W,H);

  // Grid lines (horizontal: 0, 25, 50, 75, 100%)
  ctx2d.strokeStyle='#e0dbd4';
  ctx2d.lineWidth=1;
  [0,25,50,75,100].forEach(pct=>{
    const y=H-(pct/100)*H;
    ctx2d.beginPath();ctx2d.moveTo(0,y);ctx2d.lineTo(W,y);ctx2d.stroke();
  });

  // Threshold bands (filled zones)
  // warn zone
  const yWarn=H-(warnT/100)*H;
  const yLoud=H-(loudT/100)*H;
  ctx2d.fillStyle='rgba(217,119,6,.10)';
  ctx2d.fillRect(0,yLoud,W,yWarn-yLoud);
  // loud zone
  ctx2d.fillStyle='rgba(220,38,38,.10)';
  ctx2d.fillRect(0,0,W,yLoud);

  // Threshold lines
  ctx2d.setLineDash([6,4]);
  ctx2d.lineWidth=2;
  ctx2d.strokeStyle='#d97706';
  ctx2d.beginPath();ctx2d.moveTo(0,yWarn);ctx2d.lineTo(W,yWarn);ctx2d.stroke();
  ctx2d.strokeStyle='#dc2626';
  ctx2d.beginPath();ctx2d.moveTo(0,yLoud);ctx2d.lineTo(W,yLoud);ctx2d.stroke();
  ctx2d.setLineDash([]);

  // Data line – only points within [xStart, xEnd]
  const pts=graphData.filter(p=>p.t>=xStart&&p.t<=xEnd);
  if(pts.length>1){
    ctx2d.lineWidth=2.5;
    ctx2d.lineJoin='round';
    ctx2d.beginPath();
    pts.forEach((p,i)=>{
      const x=((p.t-xStart)/windowMs)*W;
      const y=H-(p.v/100)*H;
      i===0?ctx2d.moveTo(x,y):ctx2d.lineTo(x,y);
    });
    // Colour the stroke based on average level – use gradient
    const grad=ctx2d.createLinearGradient(0,H,0,0);
    grad.addColorStop(0,FILL_HEX.ok);
    grad.addColorStop(warnT/100,FILL_HEX.ok);
    grad.addColorStop(warnT/100,FILL_HEX.warn);
    grad.addColorStop(loudT/100,FILL_HEX.warn);
    grad.addColorStop(loudT/100,FILL_HEX.loud);
    grad.addColorStop(1,FILL_HEX.loud);
    ctx2d.strokeStyle=grad;
    ctx2d.stroke();

    // Fill under curve
    ctx2d.lineTo(((pts[pts.length-1].t-xStart)/windowMs)*W, H);
    ctx2d.lineTo(((pts[0].t-xStart)/windowMs)*W, H);
    ctx2d.closePath();
    const fillGrad=ctx2d.createLinearGradient(0,0,0,H);
    fillGrad.addColorStop(0,'rgba(83,74,183,.18)');
    fillGrad.addColorStop(1,'rgba(83,74,183,.02)');
    ctx2d.fillStyle=fillGrad;
    ctx2d.fill();
  }

  // Current-time cursor
  if(startTime){
    const nowX=Math.min(((now-xStart)/windowMs)*W, W);
    ctx2d.strokeStyle='#2b2118';
    ctx2d.lineWidth=2;
    ctx2d.setLineDash([3,3]);
    ctx2d.beginPath();ctx2d.moveTo(nowX,0);ctx2d.lineTo(nowX,H);ctx2d.stroke();
    ctx2d.setLineDash([]);
  }

  // X-axis labels (5 ticks)
  const totalSecs=windowMins*60;
  const labels=document.getElementById('graph-axis-labels');
  labels.innerHTML='';
  for(let i=0;i<=4;i++){
    const s=Math.round((totalSecs/4)*i);
    const span=document.createElement('span');
    span.textContent=fmtTime(s);
    labels.appendChild(span);
  }
}

// ── AUDIO SETUP ──────────────────────────────────────────
function updateThresholds(){
  warnT=parseInt(document.getElementById('warn-thresh').value);
  loudT=parseInt(document.getElementById('loud-thresh').value);
  if(loudT<=warnT){loudT=warnT+5;document.getElementById('loud-thresh').value=loudT;}
  document.getElementById('warn-val').textContent=warnT+'%';
  document.getElementById('loud-val').textContent=loudT+'%';
  document.getElementById('thresh-warn-line').style.left=warnT+'%';
  document.getElementById('thresh-loud-line').style.left=loudT+'%';
  drawGraph(); // redraw so threshold lines update immediately
}

async function toggleMic(){
  if(running){stopMic();return;}
  document.getElementById('perm-msg').style.display='none';
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=1024;
    analyser.smoothingTimeConstant=0.5;
    source=audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    running=true;
    if(!startTime)startTime=Date.now(); // only set once; survives stop/start
    document.getElementById('start-btn').textContent='⏹ Stopp';
    document.getElementById('start-btn').classList.remove('off');
    loop();
  }catch(e){
    document.getElementById('perm-msg').style.display='block';
  }
}

function stopMic(){
  running=false;
  if(animId)cancelAnimationFrame(animId);
  if(source)source.disconnect();
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(audioCtx)audioCtx.close();
  audioCtx=analyser=source=stream=null;
  document.getElementById('start-btn').textContent='🎙 Start';
  document.getElementById('start-btn').classList.add('off');
  setUIState('ok');
  document.getElementById('meter-fill').style.width='0%';
  document.getElementById('meter-peak').style.left='0%';
  dbSmooth=0;
  dbPeak=0;
  drawGraph();
}

const dataArr=new Uint8Array(512);
function loop(){
  if(!running)return;
  animId=requestAnimationFrame(loop);
  analyser.getByteFrequencyData(dataArr);
  let sum=0;
  for(let i=0;i<dataArr.length;i++)sum+=dataArr[i]*dataArr[i];
  const rms=Math.sqrt(sum/dataArr.length);
  const pct=Math.min(100,rms/128*100*CONFIG.SCALE);

  // dbSmooth: tung glatting – styrer baren og tilstandsskifte
  if(pct>dbSmooth) dbSmooth=dbSmooth*(1-CONFIG.SMOOTH_ATTACK)+pct*CONFIG.SMOOTH_ATTACK;
  else             dbSmooth=dbSmooth*(1-CONFIG.SMOOTH_DECAY) +pct*CONFIG.SMOOTH_DECAY;

  // dbPeak: rask toppmarkør
  if(pct>dbPeak) dbPeak=dbPeak*(1-CONFIG.PEAK_ATTACK)+pct*CONFIG.PEAK_ATTACK;
  else           dbPeak=dbPeak*(1-CONFIG.PEAK_DECAY) +pct*CONFIG.PEAK_DECAY;

  const level=Math.round(dbSmooth);
  const peak=Math.round(dbPeak);

  document.getElementById('meter-fill').style.width=level+'%';
  document.getElementById('meter-fill').style.background=
    level>=loudT?FILLS.loud:level>=warnT?FILLS.warn:FILLS.ok;
  document.getElementById('meter-peak').style.left=Math.max(0,peak-0.5)+'%';
  document.getElementById('meter-peak').style.background=
    peak>=loudT?FILL_HEX.loud:peak>=warnT?FILL_HEX.warn:FILL_HEX.ok;

  // State based on smoothed display value – less jittery
  const state=level>=loudT?'loud':level>=warnT?'warn':'ok';
  if(state!==lastState){setUIState(state);lastState=state;}

  // Sample once per second (use peak for graph – more informative)
  const now=Date.now();
  if(now-lastSampleTime>=SAMPLE_INTERVAL){
    graphData.push({t:now,v:peak});
    lastSampleTime=now;
    drawGraph();
  }
}

function setUIState(state){
  document.body.className='state-'+state;
  document.getElementById('status-icon').textContent=ICONS[state];
  document.getElementById('status-label').textContent=LABELS[state];
  const iconEl=document.getElementById('status-icon');
  iconEl.classList.remove('bounce');
  void iconEl.offsetWidth;
  iconEl.classList.add('bounce');
}

// Redraw graph on resize
window.addEventListener('resize',drawGraph);

updateThresholds();
drawGraph();
</script>
</body>
</html>
