<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VM-quiz 2026</title>
  <style>
    :root {
      --bfk-purple: #6f1d82;
      --bfk-deep-purple: #431053;
      --bfk-gold: #f6b51d;
      --bfk-orange: #f07822;
      --bfk-white: #ffffff;
      --panel: rgba(255, 255, 255, 0.93);
      --shadow: rgba(28, 6, 39, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--bfk-white);
      background:
        radial-gradient(circle at 15% 10%, rgba(246, 181, 29, 0.28), transparent 26%),
        radial-gradient(circle at 86% 18%, rgba(240, 120, 34, 0.28), transparent 24%),
        linear-gradient(135deg, var(--bfk-deep-purple), var(--bfk-purple) 45%, #7a238a 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 520px;
      height: 520px;
      right: -170px;
      top: -130px;
      border: 24px solid rgba(246, 181, 29, 0.35);
      border-radius: 50%;
      box-shadow: 0 0 0 24px rgba(255, 255, 255, 0.06);
    }

    body::after {
      width: 760px;
      height: 230px;
      left: -190px;
      bottom: -110px;
      border-top: 10px solid rgba(246, 181, 29, 0.45);
      border-radius: 50%;
      transform: rotate(-8deg);
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    header {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 22px;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo-card {
      width: 118px;
      height: 118px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.96);
      padding: 10px;
      box-shadow: 0 20px 50px var(--shadow);
      transform: rotate(-2deg);
    }

    .logo-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 18px;
    }

    .hero {
      padding: 20px 22px;
      border-left: 8px solid var(--bfk-gold);
      background: rgba(67, 16, 83, 0.55);
      box-shadow: 0 18px 45px rgba(28, 6, 39, 0.24);
      border-radius: 24px;
      backdrop-filter: blur(4px);
    }

    .kicker {
      margin: 0 0 6px;
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--bfk-gold);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 5vw, 4.6rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      text-shadow: 0 5px 0 rgba(67, 16, 83, 0.6);
    }

    .subtitle {
      max-width: 820px;
      margin: 12px 0 0;
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.92);
    }


    .form-shell {
      padding: 12px;
      border-radius: 30px;
      background: linear-gradient(135deg, var(--bfk-gold), var(--bfk-orange), var(--bfk-gold));
      box-shadow: 0 26px 70px rgba(25, 6, 34, 0.45);
    }

    .form-card {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background: var(--panel);
      min-height: 520px;
    }

    .form-card::before {
      content: "VM 2026";
      position: absolute;
      right: 24px;
      top: 18px;
      color: rgba(111, 29, 130, 0.08);
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 1;
      pointer-events: none;
      white-space: nowrap;
    }

    iframe {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      min-height: 78vh;
      border: 0;
      background: #fff;
    }

    footer {
      margin-top: 18px;
      text-align: center;
      color: rgba(255, 255, 255, 0.86);
      font-size: 0.95rem;
    }

    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .sparkles span {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--bfk-gold);
      transform: rotate(45deg);
      box-shadow: 0 0 22px rgba(246, 181, 29, 0.85);
      opacity: 0.75;
    }

    .sparkles span:nth-child(1) { left: 8%; top: 18%; }
    .sparkles span:nth-child(2) { right: 12%; top: 42%; width: 12px; height: 12px; }
    .sparkles span:nth-child(3) { left: 20%; bottom: 12%; width: 10px; height: 10px; }
    .sparkles span:nth-child(4) { right: 28%; bottom: 20%; }

    @media (max-width: 760px) {
      header {
        grid-template-columns: 1fr;
      }

      .logo-card {
        width: 96px;
        height: 96px;
      }

      .hero {
        padding: 18px;
      }

      .form-shell {
        padding: 8px;
        border-radius: 22px;
      }

      .form-card {
        border-radius: 16px;
      }

      iframe {
        min-height: 82vh;
      }
    }
  </style>
</head>
<body>
  <div class="sparkles" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
  </div>

  <main class="page">
    <header>
      <div class="logo-card" aria-label="BFK-logo">
        <img src="image.png" alt="BFK" />
      </div>

      <section class="hero">
        <p class="kicker">BFK tippekonkurranse</p>
        <h1>VM-quiz 2026</h1>
        <p class="subtitle">Sett dine tips for gruppespill, sluttspill, Norge og turneringens store øyeblikk. <br> Frist for å sende inn svar er fredag 12.06 kl.20:00.</p>
      </section>
    </header>

    <section class="form-shell" aria-label="Innsendingsskjema">
      <div class="form-card">
        <iframe width="640px" height="480px" src="https://forms.office.com/Pages/ResponsePage.aspx?id=dvos3GS-00G5w66Zda2TZA5Ue_xDGfNKlia1i5uJwKFUOTlDQllEODVROEE5NVJBOU00V1RCRTJDUi4u&amp;embed=true" frameborder="0" marginwidth="0" marginheight="0" style="border: none; max-width:100%; max-height:100vh" allowfullscreen webkitallowfullscreen mozallowfullscreen msallowfullscreen> </iframe>
      </div>
    </section>

    <footer>
      BFK x VM 2026 • Husk å sende inn før fristen
    </footer>
  </main>
</body>
</html>
