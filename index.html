<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LRNify — Lær gjennom lek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff9f0;
    --ink:#2b2118;
    --yellow:#facc15;
    --card:#ffffff;
    --muted:#7a6f63;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Nunito',sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100%;
    -webkit-tap-highlight-color:transparent;
  }

  /* ===== HEADER ===== */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px;
    position:relative;
  }
  .logo{
    font-family:'Chewy',cursive;
    font-size:clamp(2rem,6vw,3rem);
    transform:rotate(-2deg);
    line-height:1;
    user-select:none;
  }
  .logo b{color:var(--yellow);-webkit-text-stroke:2px var(--ink);font-weight:400;}

  /* hamburger */
  .menu-btn{
    width:54px;height:54px;
    background:var(--yellow);
    border:4px solid var(--ink);
    box-shadow:0 6px 0 var(--ink);
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    transform:rotate(2deg);
  }
  .menu-btn:active{transform:rotate(2deg) translateY(4px);box-shadow:0 2px 0 var(--ink);}
  .menu-btn span{display:block;width:26px;height:4px;background:var(--ink);border-radius:2px;}

  /* drawer (voksent innhold gjemt her) */
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:min(320px,82vw);
    background:var(--card);
    border-left:4px solid var(--ink);
    box-shadow:-8px 0 0 rgba(43,33,24,.12);
    transform:translateX(100%);
    transition:transform .28s ease;
    z-index:50;
    padding:24px;
    display:flex;flex-direction:column;gap:6px;
  }
  .drawer.open{transform:translateX(0);}
  .drawer h2{font-family:'Chewy',cursive;font-size:1.6rem;margin-bottom:12px;}
  .drawer a{
    display:block;text-decoration:none;color:var(--ink);
    font-weight:800;font-size:1.05rem;
    padding:12px 14px;border:3px solid var(--ink);
    background:var(--cream);margin-bottom:4px;
    transition:background .15s;
  }
  .drawer a:hover,.drawer a:focus-visible{background:var(--yellow);outline:none;}
  .drawer .login{background:var(--yellow);}
  .drawer-close{
    align-self:flex-end;background:none;border:none;cursor:pointer;
    font-family:'Chewy',cursive;font-size:1.8rem;color:var(--muted);
    margin-bottom:4px;line-height:1;
  }
  .scrim{
    position:fixed;inset:0;background:rgba(43,33,24,.4);
    opacity:0;pointer-events:none;transition:opacity .28s;z-index:40;
  }
  .scrim.open{opacity:1;pointer-events:auto;}

  /* ===== HERO ===== */
  .hero{text-align:center;padding:8px 24px 28px;}
  .hero h1{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;font-weight:600;
    font-size:clamp(1.3rem,4vw,2rem);
    color:var(--ink);
  }


  /* ===== TOGGLE ===== */
  .mode-switch-wrap{
    display:flex;
    justify-content:center;
    padding:0 20px 28px;
  }
  .mode-switch{
    position:relative;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    width:min(760px,100%);
    background:var(--card);
    border:4px solid var(--ink);
    box-shadow:0 7px 0 var(--ink);
    overflow:hidden;
  }
  .mode-option{
    position:relative;
    z-index:2;
    border:0;
    background:transparent;
    color:var(--ink);
    font-family:'Nunito',sans-serif;
    font-weight:900;
    font-size:clamp(.85rem,2.6vw,1rem);
    padding:14px 12px;
    cursor:pointer;
  }
  .mode-option:focus-visible{
    outline:3px solid var(--yellow);
    outline-offset:-6px;
  }
  .mode-pill{
    position:absolute;
    z-index:1;
    top:0;
    left:0;
    width:33.3333%;
    height:100%;
    background:var(--yellow);
    border-right:4px solid var(--ink);
    transition:transform .22s ease;
  }
  .mode-switch[data-mode="tools"] .mode-pill{
    transform:translateX(100%);
    border-right:4px solid var(--ink);
    border-left:4px solid var(--ink);
  }
  .mode-switch[data-mode="aktiviteter"] .mode-pill{
    transform:translateX(200%);
    border-right:0;
    border-left:4px solid var(--ink);
  }
  .mode-option.active{color:var(--ink);}
  @media (max-width:520px){
    .mode-option{padding:12px 8px;font-size:.8rem;}
  }

  /* ===== GRID ===== */
  main{padding:0 20px 60px;max-width:1100px;margin:0 auto;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:22px;
  }
  .card{
    background:var(--card);
    border:4px solid var(--ink);
    box-shadow:0 8px 0 var(--ink);
    text-decoration:none;color:var(--ink);
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:transform .12s ease,box-shadow .12s ease;
    min-height:230px;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-4px) rotate(0deg);
    box-shadow:0 12px 0 var(--ink);
    outline:none;
  }
  .card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);}
  .card .art{
    position:relative;
    aspect-ratio:1/1;
    border-bottom:4px solid var(--ink);
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:var(--cream);
  }
  .card .art img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .card .art .icon-fallback{
    display:flex;align-items:center;justify-content:center;
    padding:26px;
  }
  .card .art .icon-fallback svg{width:72px;height:72px;}
  .card .label{
    padding:14px 16px;
    background:var(--card);
  }
  .card .art .size{
    position:absolute;
    top:8px;
    right:8px;
    background:var(--yellow);
    color:var(--ink);
    font-weight:800;
    font-size:.75rem;
    padding:4px 8px;
    border:2px solid var(--ink);
    border-radius:3px;
    z-index:10;
  }
  .card .art .lock{
    position:absolute;
    top:8px;
    left:8px;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
}
  .card .label .title{font-family:'Chewy',cursive;font-size:1.3rem;line-height:1.1;}
  .card .label .tag{font-weight:800;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}

  /* låst-tilstand (klar for Fase 2 — ikke aktiv ennå) */
  .card[data-locked="true"]{
    opacity:.6;
    pointer-events:none;
    position:relative;
  }
  .card[data-locked="true"]::after{
  content:'🔒';
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.7);
  font-size:3rem;
}
  footer{
    text-align:center;padding:24px;color:var(--muted);
    font-weight:700;font-size:.85rem;
    border-top:3px solid rgba(43,33,24,.12);
  }
</style>
</head>
<body>

  <header>
    <div class="logo">LRN<b>ify</b></div>
    <button class="menu-btn" id="menuBtn" aria-label="Åpne meny" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- Voksent innhold gjemt bak meny -->
  <div class="scrim" id="scrim"></div>
  <nav class="drawer" id="drawer" aria-label="Hovedmeny">
    <button class="drawer-close" id="drawerClose" aria-label="Lukk meny">✕</button>
    <h2>Meny</h2>
    <a href="#om">Om LRNify</a>
    <a href="tools/klassekart">Verktøy</a>
    <a href="#laereplan">Læreplan (LK20)</a>
    <a href="#skoler">For skoler</a>
    <a href="#kontakt">Kontakt</a>
    <!-- Aktiveres i Fase 2 (innlogging): -->
    <!-- <a class="login" href="#logginn">Logg inn</a> -->
  </nav>

  <section class="hero">
    <h1 id="pageTitle">Velg et spill og hopp inn</h1>
  </section>

  <section class="mode-switch-wrap" aria-label="Velg innholdstype">
    <div class="mode-switch" id="modeSwitch" data-mode="games">
      <button class="mode-option active" id="gamesMode" type="button" aria-pressed="true">Læringsspill</button>
      <button class="mode-option" id="toolsMode" type="button" aria-pressed="false">Klasseromsressurser</button>
      <button class="mode-option" id="activitiesMode" type="button" aria-pressed="false">Aktiviteter</button>
      <span class="mode-pill" aria-hidden="true"></span>
    </div>
  </section>

  <main>
    <div class="grid" id="grid" role="list" aria-label="Spill"></div>
  </main>

  <footer>LRNify · lær gjennom lek · © 2026</footer>

<script>

  balloon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 1 6 6c0 4-3 7-6 8-3-1-6-4-6-8a6 6 0 0 1 6-6z"/><path d="M12 17v2l-1.5 2h3L12 19"/></svg>',
  koblinger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 1 6 6c0 4-3 7-6 8-3-1-6-4-6-8a6 6 0 0 1 6-6z"/><path d="M12 17v2l-1.5 2h3L12 19"/></svg>',

/* =========================================================
   LÆRERRESSURSER / KLASSEROMSRESSURSER
   Disse ligger i tools/-mappen.
   Legg til flere ved å kopiere objektet under og endre title/file/category.
   ========================================================= */

    { title:"Klassekart", file:"klassekart/index.html", category:"Klasserom", icon:"worksheet", color:"#2563eb", size:"", locked:false },

];

/* =========================================================
   AKTIVITETER
   Disse ligger i aktiviteter/-mappen.
   Legg til flere ved å kopiere objektet under og endre title/file/category.
   ========================================================= */
const ACTIVITIES = [
  { title:"Think pair share", file:"tps/index.html", category:"Aktivitet", icon:"activity", color:"#d97706", size:"", locked:false },
  { title:"Poll", file:"poll/index.html", category:"Aktivitet", icon:"activity", color:"#d97706", size:"", locked:false },

/* Ekstra ikoner til lærerressurser */
Object.assign(ICONS, {
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/></svg>',

  cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="12" height="16" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v14"/></svg>',
  screen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 21h8"/><path d="M12 16v5"/></svg>',
  activity:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/></svg>'

const grid = document.getElementById('grid');
const pageTitle = document.getElementById('pageTitle');
const modeSwitch = document.getElementById('modeSwitch');
const gamesMode = document.getElementById('gamesMode');
const toolsMode = document.getElementById('toolsMode');
const activitiesMode = document.getElementById('activitiesMode');

let currentMode = 'games';

function getCardBasePath(){
  if(currentMode === 'games') return 'games/';
  if(currentMode === 'tools') return 'tools/';
  return 'aktiviteter/';
}

function getImageBasePath(){
  if(currentMode === 'games') return 'media/cards/';
  if(currentMode === 'tools') return 'media/tools/';
  return 'media/aktiviteter/';
}

function renderCards(items){
  grid.innerHTML = '';
  grid.setAttribute('aria-label', currentMode === 'games' ? 'Spill' : currentMode === 'tools' ? 'Lærerressurser' : 'Aktiviteter');

  items.forEach((g,i)=>{
    const a = document.createElement('a');
    a.className = 'card';
    a.href = g.locked ? '#' : (getCardBasePath() + g.file);
    a.setAttribute('role','listitem');
    a.setAttribute('aria-label', g.title + (g.locked ? ' (låst)' : '') );
    a.dataset.locked = g.locked;
    a.dataset.category = g.category;
    a.style.transform = 'rotate(' + ((i % 2 === 0) ? -1 : 1) + 'deg)';

    const folderName = g.file.replace(/\.html$/,'').split('/')[0];
    const imgPath = getImageBasePath() + folderName + '.png';

    a.innerHTML =
      '<div class="art" style="color:'+g.color+'">' +
      '<div class="size" aria-label="Størrelse: '+g.size+'">'+g.size+'</div>' +
        '<img src="'+imgPath+'" alt="" loading="lazy" ' +
          'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
        '<span class="icon-fallback" style="display:none">'+ (ICONS[g.icon]||ICONS.shield) +'</span>' +
      '</div>' +
      '<div class="label"><div class="title">'+g.title+'</div><div class="tag">'+g.category+'</div></div>';

    grid.appendChild(a);
  });
}

function getCurrentItems(){
  if(currentMode === 'games') return GAMES;
  if(currentMode === 'tools') return TEACHER_RESOURCES;
  return ACTIVITIES;
}

function setMode(mode){
  currentMode = mode;
  const isGames = mode === 'games';
  const isTools = mode === 'tools';
  const isActivities = mode === 'aktiviteter';

  modeSwitch.dataset.mode = mode;

  gamesMode.classList.toggle('active', isGames);
  toolsMode.classList.toggle('active', isTools);
  activitiesMode.classList.toggle('active', isActivities);

  gamesMode.setAttribute('aria-pressed', String(isGames));
  toolsMode.setAttribute('aria-pressed', String(isTools));
  activitiesMode.setAttribute('aria-pressed', String(isActivities));

  if(isTools){
    pageTitle.textContent = 'Velg en ressurs til klasserommet';
  }else if(isActivities){
    pageTitle.textContent = 'Velg en aktivitet til klasserommet';
  }else{
    pageTitle.textContent = 'Velg et spill og hopp inn';
  }

  renderCards(getCurrentItems());
}

gamesMode.addEventListener('click', () => setMode('games'));
toolsMode.addEventListener('click', () => setMode('tools'));
activitiesMode.addEventListener('click', () => setMode('aktiviteter'));

setMode('games');

/* meny */
const menuBtn=document.getElementById('menuBtn');
const drawer=document.getElementById('drawer');
const scrim=document.getElementById('scrim');
const drawerClose=document.getElementById('drawerClose');
function openMenu(){drawer.classList.add('open');scrim.classList.add('open');menuBtn.setAttribute('aria-expanded','true');}
function closeMenu(){drawer.classList.remove('open');scrim.classList.remove('open');menuBtn.setAttribute('aria-expanded','false');}
menuBtn.addEventListener('click',openMenu);
drawerClose.addEventListener('click',closeMenu);
scrim.addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
</script>
