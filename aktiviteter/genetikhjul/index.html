<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Genetisk Hjul — LRNify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --cream:#fff9f0;
    --yellow:#facc15;
    --ink:#1a1a1a;
    --dom:#f97316;
    --rec:#38bdf8;
    --green:#22c55e;
    --red:#ef4444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--cream);
    font-family:'Nunito',sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:16px; padding-bottom:40px;
  }
  h1{
    font-family:'Chewy',cursive; font-size:1.9rem; margin:8px 0 4px;
    text-align:center; color:var(--ink);
  }
  .sub{ font-weight:700; opacity:.65; margin-bottom:18px; text-align:center; font-size:.95rem;}
  .hidden{ display:none !important; }

  /* ── ROLLESKJERMER (elev / lærer / rollevalg) ── */
  .top-screen{ width:100%; display:flex; flex-direction:column; align-items:center; }

  /* ── KORT (elev-flyten) ── */
  .card{
    background:#fff; border:4px solid var(--ink); border-radius:22px;
    padding:22px 20px; width:100%; max-width:440px;
    box-shadow:6px 6px 0 var(--ink);
  }
  input[type=text]{
    width:100%; padding:14px 16px; border:3px solid var(--ink); border-radius:14px;
    font-family:'Nunito'; font-weight:800; font-size:1.1rem; margin-top:8px;
    background:var(--cream);
  }
  label.field-label{ font-weight:900; font-size:.9rem; text-transform:uppercase; letter-spacing:.03em; opacity:.7;}
  .btn{
    display:block; width:100%; border:4px solid var(--ink); border-radius:16px;
    background:var(--yellow); font-family:'Nunito'; font-weight:900; font-size:1.15rem;
    padding:16px; margin-top:16px; cursor:pointer; box-shadow:4px 4px 0 var(--ink);
    transition:transform .08s;
  }
  .btn:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .btn.secondary{ background:#fff; }
  .btn.big-choice{ font-size:1.3rem; padding:22px 16px; margin-top:14px; }
  .link-back{
    background:none; border:none; font-weight:800; opacity:.55; cursor:pointer;
    padding:0; margin-bottom:12px; font-size:.85rem; text-decoration:underline; font-family:'Nunito';
  }
  .sex-row{ display:flex; gap:12px; margin-top:10px; }
  .sex-btn{
    flex:1; border:4px solid var(--ink); border-radius:16px; padding:22px 8px;
    background:#fff; font-family:'Chewy'; font-size:2rem; cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
  }
  .sex-btn.active{ background:var(--yellow); }
  .progress{ display:flex; gap:6px; justify-content:center; margin:18px 0 8px; }
  .dot{ width:12px; height:12px; border-radius:50%; border:2px solid var(--ink); background:#fff; }
  .dot.done{ background:var(--green); }
  .dot.now{ background:var(--yellow); }
  .q-title{ font-family:'Chewy'; font-size:1.5rem; text-align:center; margin:4px 0 6px; }
  .q-text{ font-weight:800; text-align:center; font-size:1.15rem; margin-bottom:6px; }
  .choice-row{ display:flex; flex-direction:column; gap:12px; margin-top:14px; }
  .choice-btn{
    border:4px solid var(--ink); border-radius:16px; padding:18px; background:#fff;
    font-weight:900; font-size:1.1rem; cursor:pointer; box-shadow:4px 4px 0 var(--ink);
    text-align:left; display:flex; align-items:center; gap:12px;
  }
  .choice-btn .emoji{ font-size:1.6rem; }
  .choice-btn:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .wheel-wrap{ display:flex; justify-content:center; margin:18px 0 6px; }
  svg{ max-width:100%; height:auto; }
  .wheel-wrap > div.is-fullscreen{
    background:var(--cream); width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  .wheel-wrap > div.is-fullscreen svg{ width:92vmin; height:92vmin; max-width:none; }
  .status{ text-align:center; font-weight:800; margin-top:10px; opacity:.7; font-size:.9rem;}
  .center-msg{ text-align:center; font-weight:800; padding:30px 10px; }
  .final-emoji{ font-size:3rem; text-align:center; margin-bottom:6px;}
  .final-number{ font-family:'Chewy'; text-align:center; font-size:1.25rem; margin-top:8px; }
  .error{ color:var(--red); font-weight:800; text-align:center; margin-top:10px; }
  .action-row{ display:flex; gap:10px; margin-top:14px; }
  .action-row .btn{ margin-top:0; }

  /* ── LÆRER-DASHBORD ── */
  .topbar{
    display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap;
    margin-bottom:26px;
  }
  .topbar input[type=text]{ width:220px; margin-top:0; }
  .btn.icon-inline{ display:inline-block; width:auto; margin-top:0; }
  .btn.danger{ background:#fee2e2; }
  .code-pill{
    font-family:'Chewy'; font-size:1.6rem; background:#fff; border:4px solid var(--ink);
    border-radius:16px; padding:10px 22px; box-shadow:4px 4px 0 var(--ink);
  }
  .qr-mini{
    background:#fff; border:4px solid var(--ink); border-radius:14px; padding:6px;
    box-shadow:3px 3px 0 var(--ink); line-height:0; cursor:pointer;
  }
  .qr-mini img, .qr-mini canvas{ display:block; width:64px; height:64px; }
  .grid{
    display:grid; grid-template-columns:1.1fr .9fr; gap:26px; max-width:1200px; margin:0 auto; width:100%;
  }
  @media (max-width:880px){ .grid{ grid-template-columns:1fr; } }
  .panel{
    background:#fff; border:4px solid var(--ink); border-radius:22px; padding:22px;
    box-shadow:6px 6px 0 var(--ink);
  }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .panel-head h2{ font-family:'Chewy'; font-size:1.4rem; margin:0; }
  .icon-btn{
    border:2.5px solid var(--ink); border-radius:10px; background:#fff; cursor:pointer;
    font-size:1rem; padding:6px 9px; margin-left:6px; box-shadow:2px 2px 0 var(--ink);
  }
  .icon-btn:active{ transform:translate(1px,1px); box-shadow:none; }
  .wheel-holder{ display:flex; justify-content:center; flex-direction:column; align-items:center; }
  .wheel-holder svg{ max-width:100%; height:auto; }
  #wheel-panel.is-fullscreen{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--cream); border:none; box-shadow:none; border-radius:0;
  }
  #wheel-panel.is-fullscreen .wheel-holder svg{ width:82vmin; height:82vmin; }
  #wheel-panel.is-fullscreen .panel-head{ position:absolute; top:20px; right:20px; }
  #wheel-panel.is-fullscreen h2{ display:none; }
  .count-row{
    display:flex; justify-content:center; gap:26px; margin-bottom:18px; flex-wrap:wrap;
  }
  .count-box{ text-align:center; }
  .count-num{ font-family:'Chewy'; font-size:2.4rem; line-height:1; }
  .count-label{ font-weight:800; font-size:.85rem; opacity:.6; text-transform:uppercase; }
  .list-item{
    display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:2px dashed #e5e0d5;
  }
  .list-item:last-child{ border-bottom:none; }
  .rank{ font-family:'Chewy'; font-size:1.1rem; width:26px; text-align:center; opacity:.5;}
  .bar-wrap{ flex:1; }
  .bar-label{ font-weight:800; font-size:.92rem; display:flex; justify-content:space-between; margin-bottom:3px;}
  .bar-bg{ background:#f2ede0; border:2px solid var(--ink); border-radius:8px; height:14px; overflow:hidden;}
  .bar-fill{ height:100%; background:var(--yellow); }
  .name-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chip{
    background:var(--cream); border:2px solid var(--ink); border-radius:20px; padding:5px 12px;
    font-weight:800; font-size:.85rem;
  }
  .empty{ text-align:center; opacity:.5; font-weight:800; padding:20px 0; }
  #print-title{ display:none; }
  #dashboard{ width:100%; max-width:1200px; margin:0 auto; }

  footer{ margin-top:24px; opacity:.4; font-size:.8rem; font-weight:700; text-align:center; }

  /* QR fullskjerm-overlay */
  #qr-overlay{
    display:none; position:fixed; inset:0; background:var(--cream); z-index:9999;
    flex-direction:column; align-items:center; justify-content:center; gap:18px;
  }
  #qr-overlay.show{ display:flex; }
  #qr-overlay .code-pill{ font-size:2.2rem; }
  #qr-overlay-inner{ background:#fff; border:5px solid var(--ink); border-radius:20px; padding:20px; box-shadow:6px 6px 0 var(--ink); }
  #qr-overlay-inner img, #qr-overlay-inner canvas{ width:320px; height:320px; display:block; }
  #qr-overlay-close{ position:absolute; top:24px; right:24px; }
  #qr-overlay .hint{ font-weight:800; opacity:.6; }

  @media print{
    body *{ visibility:hidden; }
    #print-area, #print-area *{ visibility:visible; }
    #print-area{ position:absolute; top:0; left:0; width:100%; padding:0; }
    #print-title{ display:block; text-align:center; font-family:'Chewy',cursive; font-size:1.8rem; margin-bottom:14px; }
    .grid{ display:block !important; }
    .panel{ box-shadow:none !important; border:2px solid #000 !important; page-break-inside:avoid; margin-bottom:16px; }
    .panel-head .icon-btn{ display:none !important; }
    #name-panel{ display:none !important; }
  }
</style>
</head>
<body>

<h1>🧬 Genetisk Hjul</h1>
<div class="sub">Bygg din egen genetiske profil — og se klassens live</div>

<!-- ══ ROLLEVALG ══ -->
<div class="top-screen" id="screen-role">
  <div class="card" style="max-width:440px;">
    <label class="field-label">Hvem er du?</label>
    <button class="btn big-choice" onclick="goElevRolle()">🙋 Jeg er elev</button>
    <button class="btn big-choice secondary" onclick="goLarerRolle()">🎓 Jeg er lærer</button>
  </div>
</div>

<!-- ══ ELEV ══ -->
<div class="top-screen hidden" id="screen-elev">

  <!-- STEG 0: Klassekode -->
  <div class="card" id="step-kode">
    <button type="button" class="link-back" onclick="showTopScreen('screen-role')">← Bytt rolle</button>
    <label class="field-label">Klassekode (fra læreren)</label>
    <input type="text" id="elev-input-kode" placeholder="f.eks. 8B-HOST26" autocomplete="off"
           maxlength="24" spellcheck="false" autocapitalize="characters"
           style="text-transform:uppercase;">
    <button class="btn" onclick="goToNavn()">Neste →</button>
    <div class="error hidden" id="err-elev-kode"></div>
  </div>

  <!-- STEG 1: Navn + kjønn -->
  <div class="card hidden" id="step-navn">
    <label class="field-label">Fornavn</label>
    <input type="text" id="input-navn" placeholder="Skriv fornavnet ditt" autocomplete="off" maxlength="24">
    <label class="field-label" style="margin-top:16px; display:block;">Kjønn</label>
    <div class="sex-row">
      <div class="sex-btn" id="sex-m" onclick="setSex('M')">♂</div>
      <div class="sex-btn" id="sex-f" onclick="setSex('F')">♀</div>
    </div>
    <button class="btn" onclick="goToQuiz()">Start →</button>
    <div class="error hidden" id="err-navn"></div>
  </div>

  <!-- STEG 2: Spørsmål + hjul -->
  <div class="card hidden" id="step-quiz">
    <div class="progress" id="progress"></div>
    <div class="q-title" id="q-title"></div>
    <div class="q-text" id="q-text"></div>
    <div class="choice-row" id="choice-row"></div>
    <div class="wheel-wrap"><div id="wheel-holder"></div></div>
    <div class="status" id="status-text"></div>
  </div>

  <!-- STEG 3: Ferdig -->
  <div class="card hidden" id="step-done">
    <div class="final-emoji">🎉</div>
    <div class="center-msg">Takk! Profilen din er sendt inn og vises nå på tavla.</div>
    <div class="wheel-wrap"><div id="wheel-final"></div></div>
    <div class="final-number" id="final-number"></div>
    <div class="action-row">
      <button class="btn secondary" onclick="toggleFullscreen('wheel-final')">⛶ Fullskjerm</button>
      <button class="btn secondary" onclick="downloadWheelImage('wheel-final')">📷 Last ned bilde</button>
    </div>
    <button class="btn" onclick="location.reload()">Gjør på nytt</button>
  </div>
</div>

<!-- ══ LÆRER ══ -->
<div class="top-screen hidden" id="screen-larer">

  <div id="setup-bar" style="text-align:center;">
    <button type="button" class="link-back" onclick="showTopScreen('screen-role')">← Bytt rolle</button>
    <div class="topbar">
      <input type="text" id="larer-input-kode" placeholder="Skriv klassekode, f.eks. 8B-HOST26">
      <button class="btn icon-inline" onclick="startSession()">Start visning →</button>
    </div>
  </div>

  <div class="topbar hidden" id="active-bar">
    <span class="code-pill" id="code-display"></span>
    <div class="qr-mini" id="qr-mini" onclick="toggleQrFullscreen()" title="Klikk for stor QR"></div>
    <button class="btn icon-inline secondary" onclick="copyLink()">📋 Kopier lenke</button>
    <button class="btn icon-inline secondary" onclick="window.print()">🖨️ Skriv ut</button>
    <button class="btn icon-inline danger" onclick="resetKlasse()">🗑️ Nullstill klasse</button>
  </div>

  <div class="hidden" id="dashboard">
    <div id="print-title"></div>
    <div class="count-row">
      <div class="count-box"><div class="count-num" id="count-done">0</div><div class="count-label">Fullført</div></div>
    </div>

    <div class="grid" id="print-area">
      <div class="panel" id="wheel-panel">
        <div class="panel-head">
          <h2>Klassens genetiske hjul</h2>
          <span>
            <button class="icon-btn" onclick="toggleWheelFullscreen()" title="Fullskjerm">⛶</button>
            <button class="icon-btn" onclick="downloadWheelImage('wheel-agg','klassens-genetiske-hjul.png')" title="Last ned som bilde">📷</button>
          </span>
        </div>
        <div class="wheel-holder"><div id="wheel-agg"></div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>🏆 Vanligste trekk</h2></div>
        <div id="top-list"></div>
      </div>
    </div>

    <div class="panel" id="name-panel" style="max-width:1200px; margin:22px auto 0;">
      <div class="panel-head"><h2>Elever som har levert</h2></div>
      <div class="name-chips" id="name-chips"></div>
    </div>
  </div>
</div>

<div id="qr-overlay">
  <button class="btn secondary" id="qr-overlay-close" onclick="toggleQrFullscreen()">✕ Lukk</button>
  <div class="code-pill" id="qr-overlay-code"></div>
  <div id="qr-overlay-inner"></div>
  <div class="hint" id="qr-overlay-hint">Skann for å bli med i klassekoden</div>
</div>

<footer>LRNify · Genetisk Hjul</footer>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set, update, remove, get, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInAnonymously }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ============ FIREBASE CONFIG ============
   Samme prosjekt som resten av LRNify (poll-c6bd2). Reglene som slipper
   igjennom skrivingen under ligger i firebase/database.rules.json
   (grenen "genetikhjul") — se firebase/README.md.
=========================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBdbRSnz-02Cq2BITAcKY_mvWI5D91BYBM",
  authDomain: "poll-c6bd2.firebaseapp.com",
  databaseURL: "https://poll-c6bd2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "poll-c6bd2",
  storageBucket: "poll-c6bd2.firebasestorage.app",
  messagingSenderId: "541647069675",
  appId: "1:541647069675:web:d8ee426e242e7757dbf9ae"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const auth = getAuth(app);

/* Anonym pålogging — brukes bare av læreren (se claimOwner nedenfor), usynlig
   og uten konto/klikk. Elever sender inn uten å logge på i det hele tatt —
   reglene krever det ikke, se firebase/database.rules.json. Feiler
   påloggingen, eller er den ikke skrudd på i Firebase-konsollen, virker alt
   som før, bare uten eier-beskyttelsen på "Nullstill klasse". */
let uid = null;
let paalogging = null;
function ensureAuth(){
  if(uid) return Promise.resolve(uid);
  if(!paalogging){
    paalogging = signInAnonymously(auth)
      .then(cred => (uid = cred.user.uid))
      .catch(() => { paalogging = null; return null; });
  }
  return paalogging;
}

/* Klassekoden læreren velger selv, men den blir en nøkkel i databasen og må
   derfor holde seg til tegn Realtime Database godtar. */
const KODE_REGEX = /^[A-Z0-9-]{3,24}$/;
function normaliserKode(v){ return String(v || '').trim().toUpperCase(); }

/* ============ GENENE ============ */
const GENES = [
  { key:'T', navn:'Tunge-rulling', tittel:'Tunga 👅', sporsmal:'Kan du rulle tunga til et rør?',
    domLabel:'Kan rulle', recLabel:'Kan ikke rulle', domCode:'T-', recCode:'tt', yesIsDom:true,
    yesEmoji:'😛', noEmoji:'😐' },
  { key:'E', navn:'Øreflipp', tittel:'Øreflippen 👂', sporsmal:'Henger øreflippen din løst ned (ikke festet direkte til hodet)?',
    domLabel:'Løs øreflipp', recLabel:'Fast øreflipp', domCode:'E-', recCode:'ee', yesIsDom:true,
    yesEmoji:'👂', noEmoji:'👂' },
  { key:'H', navn:'Hårvirvel', tittel:'Hårvirvelen 🌀', sporsmal:'Virvler håret ditt med klokka, sett bakfra?',
    domLabel:'Med klokka', recLabel:'Mot klokka', domCode:'H-', recCode:'hh', yesIsDom:true,
    yesEmoji:'🌀', noEmoji:'🔄' },
  { key:'D', navn:'Tommelbøy', tittel:'Tommelen 👍', sporsmal:'Kan du bøye tommelen tydelig bakover ("haiker-tommel")?',
    domLabel:'Rett tommel', recLabel:'Haiker-tommel', domCode:'D-', recCode:'dd', yesIsDom:false,
    yesEmoji:'👍', noEmoji:'👍' },
  { key:'W', navn:'Hårfeste', tittel:'Hårfestet 📐', sporsmal:'Har du en tydelig spiss i hårfestet (widow\'s peak)?',
    domLabel:"Widow's peak", recLabel:'Rett hårfeste', domCode:'W-', recCode:'ww', yesIsDom:true,
    yesEmoji:'📐', noEmoji:'➖' },
  { key:'B', navn:'Øyefarge', tittel:'Øynene 👀', sporsmal:'Har du mørke (brune) øyne?',
    domLabel:'Mørke øyne', recLabel:'Lyse øyne', domCode:'B-', recCode:'bb', yesIsDom:true,
    yesEmoji:'🟤', noEmoji:'🔵' },
];

/* Hvilket av de 64 feltene en fullført profil havner i (1–64), i samme
   rekkefølge som ringene i det personlige hjulet (se renderPersonalWheel).
   Brukes av tavla til å vise hvilke tall klassen har "tatt". */
function computeWheelNumber(svar){
  let cum = 0;
  for(let i=0; i<GENES.length; i++){
    const bit = svar[GENES[i].key] === 'rec' ? 1 : 0;
    cum = cum*2 + bit;
  }
  return cum + 1;
}

/* ============ ROLLEVALG ============ */
function showTopScreen(id){
  document.querySelectorAll('.top-screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
window.showTopScreen = showTopScreen;
window.goElevRolle  = ()=> showTopScreen('screen-elev');
window.goLarerRolle = ()=> showTopScreen('screen-larer');

/* ══════════════════════════════════════════════════════════════
   ELEV
   ══════════════════════════════════════════════════════════════ */
let state = { kode:null, navn:null, kjonn:null, svar:{}, qIndex:0 };

window.goToNavn = function(){
  const v = normaliserKode(document.getElementById('elev-input-kode').value);
  if(!v){ showErr('err-elev-kode','Skriv inn klassekoden du fikk av læreren.'); return; }
  if(!KODE_REGEX.test(v)){
    showErr('err-elev-kode','Klassekoden kan bare inneholde bokstaver (A–Z), tall og bindestrek — 3 til 24 tegn.');
    return;
  }
  state.kode = v;
  document.getElementById('step-kode').classList.add('hidden');
  document.getElementById('step-navn').classList.remove('hidden');
  document.getElementById('input-navn').focus();
};

window.setSex = function(s){
  state.kjonn = s;
  document.getElementById('sex-m').classList.toggle('active', s==='M');
  document.getElementById('sex-f').classList.toggle('active', s==='F');
};

window.goToQuiz = function(){
  const v = document.getElementById('input-navn').value.trim();
  if(!v){ showErr('err-navn','Skriv inn fornavnet ditt.'); return; }
  if(v.length > 24){ showErr('err-navn','Bruk bare fornavnet — maks 24 tegn.'); return; }
  if(!state.kjonn){ showErr('err-navn','Velg kjønn.'); return; }
  state.navn = v;
  document.getElementById('step-navn').classList.add('hidden');
  document.getElementById('step-quiz').classList.remove('hidden');
  renderProgress();
  renderQuestion();
  renderPersonalWheel('wheel-holder', partialProfile());
};

function showErr(id,msg){
  const el = document.getElementById(id);
  el.textContent = msg; el.classList.remove('hidden');
}

function renderProgress(){
  const p = document.getElementById('progress');
  p.innerHTML = '';
  GENES.forEach((g,i)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (i < state.qIndex ? ' done' : i===state.qIndex ? ' now' : '');
    p.appendChild(d);
  });
}
function renderQuestion(){
  const g = GENES[state.qIndex];
  document.getElementById('q-title').textContent = g.tittel;
  document.getElementById('q-text').textContent = g.sporsmal;
  const row = document.getElementById('choice-row');
  row.innerHTML = '';
  const yesBtn = document.createElement('div');
  yesBtn.className = 'choice-btn'; yesBtn.innerHTML = `<span class="emoji">${g.yesEmoji}</span> Ja`;
  yesBtn.onclick = ()=>answer(g, true);
  const noBtn = document.createElement('div');
  noBtn.className = 'choice-btn'; noBtn.innerHTML = `<span class="emoji">${g.noEmoji}</span> Nei`;
  noBtn.onclick = ()=>answer(g, false);
  row.appendChild(yesBtn); row.appendChild(noBtn);
  document.getElementById('status-text').textContent = `Spørsmål ${state.qIndex+1} av ${GENES.length}`;
}
function answer(g, yes){
  const isDom = g.yesIsDom ? yes : !yes;
  state.svar[g.key] = isDom ? 'dom' : 'rec';
  // Først etter at qIndex er økt inkluderer partialProfile() ringen eleven
  // nettopp svarte på — ellers henger hjulet ett svar bak.
  state.qIndex++;
  renderPersonalWheel('wheel-holder', partialProfile());
  if(state.qIndex >= GENES.length){
    finishQuiz();
  } else {
    renderProgress();
    renderQuestion();
  }
}
function partialProfile(){
  return { kjonn: state.kjonn, svar: state.svar, upTo: state.qIndex };
}
function finishQuiz(){
  document.getElementById('step-quiz').classList.add('hidden');
  document.getElementById('step-done').classList.remove('hidden');
  const tall = renderPersonalWheel('wheel-final', { kjonn: state.kjonn, svar: state.svar, upTo: GENES.length });
  document.getElementById('final-number').textContent = tall ? `Din unike kombinasjon: nr. ${tall} av 64!` : '';
  submitToFirebase();
}
function submitToFirebase(){
  push(ref(db, 'genetikhjul/' + state.kode + '/elever'), {
    navn: state.navn,
    kjonn: state.kjonn,
    svar: state.svar,
    ts: Date.now()
  }).catch(err=>{
    document.getElementById('step-done').innerHTML =
      '<div class="center-msg">Kunne ikke sende inn 😕<br><small>' + err.message + '</small></div>' +
      '<button class="btn secondary" onclick="location.reload()">Prøv igjen</button>';
  });
}

/* ============ PERSONLIG HJUL (SVG) — ekte forgrenet gensirkel ============
   Hver ring deler bare den delen av sirkelen forrige ring smalnet inn til
   (dominant = første halvdel, recessiv = andre halvdel av forelderens bue),
   akkurat som et fysisk genetisk hjul man spinner gjennom. Etter alle 6
   ringene ender banen i ett av 64 like store felt i den ytterste, tynne
   ringen — elevens "tall". Se GENES-rekkefølgen for hvilken ring som er
   hvilket gen. */
const P_SIZE = 400, P_CX = 200, P_CY = 200, P_R0 = 28, P_RSTEP = 22, P_NUMRING_W = 18;

function pRingBounds(i){
  return i < GENES.length
    ? [P_R0 + i*P_RSTEP, P_R0 + (i+1)*P_RSTEP]
    : [P_R0 + GENES.length*P_RSTEP, P_R0 + GENES.length*P_RSTEP + P_NUMRING_W];
}

function renderPersonalWheel(holderId, profile){
  const holder = document.getElementById(holderId);
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox', `0 0 ${P_SIZE} ${P_SIZE}`);
  svg.setAttribute('width', P_SIZE); svg.setAttribute('height', P_SIZE);

  // spor (bakgrunn) for alle 6 gen-ringene + tallringen
  for(let i=0;i<=GENES.length;i++){
    const [rIn,rOut] = pRingBounds(i);
    [[0,180],[180,360]].forEach(([s,e])=>{
      const path = document.createElementNS(svgNS,'path');
      path.setAttribute('d', donutSectorPath(P_CX,P_CY,rIn,rOut,s,e));
      path.setAttribute('fill', '#fff9f0');
      path.setAttribute('stroke', '#1a1a1a');
      path.setAttribute('stroke-width', i < GENES.length ? '2' : '1.5');
      svg.appendChild(path);
    });
  }

  // fyll banen eleven har svart seg gjennom, ring for ring
  const upTo = profile.upTo !== undefined ? profile.upTo : GENES.length;
  let cum = 0;
  for(let i=0; i<upTo && i<GENES.length; i++){
    const bit = profile.svar[GENES[i].key] === 'rec' ? 1 : 0;
    cum = cum*2 + bit;
    const numSeg = Math.pow(2, i+1);
    const angW = 360/numSeg;
    const aStart = cum*angW, aEnd = aStart+angW;
    const [rIn,rOut] = pRingBounds(i);
    const path = document.createElementNS(svgNS,'path');
    path.setAttribute('d', donutSectorPath(P_CX,P_CY,rIn,rOut,aStart,aEnd));
    path.setAttribute('fill', bit===0 ? '#f97316' : '#38bdf8');
    path.setAttribute('stroke', '#1a1a1a');
    path.setAttribute('stroke-width', '2');
    svg.appendChild(path);
  }

  // tallfeltet (1–64) hele hjulet ender i, når alle 6 ringene er svart
  let tall = null;
  if(upTo >= GENES.length){
    const numSeg = 64;
    const angW = 360/numSeg;
    const aStart = cum*angW, aEnd = aStart+angW;
    const [rIn,rOut] = pRingBounds(GENES.length);
    const path = document.createElementNS(svgNS,'path');
    path.setAttribute('d', donutSectorPath(P_CX,P_CY,rIn,rOut,aStart,aEnd));
    path.setAttribute('fill', '#facc15');
    path.setAttribute('stroke', '#1a1a1a');
    path.setAttribute('stroke-width', '2');
    svg.appendChild(path);

    const midAngle = (aStart+aEnd)/2, midR = (rIn+rOut)/2;
    const [tx,ty] = pt(P_CX,P_CY,midR,midAngle);
    const text = document.createElementNS(svgNS,'text');
    text.setAttribute('x', tx); text.setAttribute('y', ty+3.5);
    text.setAttribute('text-anchor','middle');
    text.setAttribute('font-size','9'); text.setAttribute('font-weight','900');
    text.textContent = String(cum+1);
    svg.appendChild(text);
    tall = cum+1;
  }

  // kjønn — dekorativt senterfelt, ikke koblet til genetikken
  const rC = P_R0;
  [ [0,180,'F','#fbcfe8'], [180,360,'M','#bae6fd'] ].forEach(([s,e,sex,fallback])=>{
    const path = document.createElementNS(svgNS,'path');
    const [x1,y1] = pt(P_CX,P_CY,rC,s);
    const [x2,y2] = pt(P_CX,P_CY,rC,e);
    path.setAttribute('d', `M ${P_CX} ${P_CY} L ${x1} ${y1} A ${rC} ${rC} 0 0 1 ${x2} ${y2} Z`);
    path.setAttribute('fill', profile.kjonn === sex ? '#facc15' : fallback);
    path.setAttribute('stroke', '#1a1a1a');
    path.setAttribute('stroke-width', '2.5');
    svg.appendChild(path);
  });
  const symM = document.createElementNS(svgNS,'text');
  symM.setAttribute('x', P_CX - rC/2); symM.setAttribute('y', P_CY + 6);
  symM.setAttribute('text-anchor','middle'); symM.setAttribute('font-size','16');
  symM.setAttribute('font-weight','900'); symM.textContent = '♂';
  svg.appendChild(symM);
  const symF = document.createElementNS(svgNS,'text');
  symF.setAttribute('x', P_CX + rC/2); symF.setAttribute('y', P_CY + 6);
  symF.setAttribute('text-anchor','middle'); symF.setAttribute('font-size','16');
  symF.setAttribute('font-weight','900'); symF.textContent = '♀';
  svg.appendChild(symF);

  // ytterste ramme
  const [, outerR] = pRingBounds(GENES.length);
  const circle = document.createElementNS(svgNS,'circle');
  circle.setAttribute('cx',P_CX); circle.setAttribute('cy',P_CY); circle.setAttribute('r',outerR);
  circle.setAttribute('fill','none'); circle.setAttribute('stroke','#1a1a1a'); circle.setAttribute('stroke-width','3');
  svg.appendChild(circle);

  holder.innerHTML = '';
  holder.appendChild(svg);
  return tall;
}

let kode = null;
let audioCtx = null;
let prevCount = null; // null = ikke initialisert ennå (ingen lyd ved første last)
let students = {};

function getJoinUrl(){
  // Samme fil betjener både lærer og elev, så lærerens egen adresse (uten
  // ?kode=) er alltid riktig join-lenke for elevene — ingen egen konstant
  // å huske på å oppdatere hvis filen flytter.
  return location.origin + location.pathname + '?kode=' + encodeURIComponent(kode);
}

window.startSession = function(){
  const v = normaliserKode(document.getElementById('larer-input-kode').value);
  if(!v) return;
  if(!KODE_REGEX.test(v)){
    alert('Klassekoden kan bare inneholde bokstaver (A–Z), tall og bindestrek — 3 til 24 tegn.\nF.eks. 8B-HOST26');
    return;
  }
  kode = v;
  document.getElementById('larer-input-kode').value = v;

  // "lås opp" lyd på en brukerhandling (klikk), for at Web Audio skal få lov til å spille senere
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}

  document.getElementById('setup-bar').classList.add('hidden');
  document.getElementById('active-bar').classList.remove('hidden');
  document.getElementById('code-display').textContent = kode;
  document.getElementById('qr-overlay-code').textContent = kode;
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('print-title').textContent = 'Genetisk Hjul — Klasse ' + kode + ' — ' + new Date().toLocaleDateString('no-NO');
  history.replaceState(null,'','?kode=' + encodeURIComponent(kode));

  renderMiniQr();
  claimOwner();
  listen();
};

/* Merk klassekoden som "vår" hvis ingen har gjort det før. Reglene tillater
   bare å skrive owner når feltet er tomt, så den første tavla som starter
   visningen får eierskapet — og bare den kan nullstille klassen etterpå.
   Uten anonym pålogging skjer ingenting, og nullstilling er åpen som før. */
function claimOwner(){
  const kodeVedStart = kode;
  return ensureAuth().then(id => {
    if(!id || kodeVedStart !== kode) return;
    return get(ref(db, 'genetikhjul/' + kodeVedStart + '/owner')).then(snap => {
      if(snap.exists()) return;
      return update(ref(db, 'genetikhjul/' + kodeVedStart), { owner: id, createdAt: Date.now() }).catch(()=>{});
    });
  }).catch(()=>{});
}

/* ============ DISKRET LYD VED NY INNSENDING ============ */
function playDing(){
  if(!audioCtx) return;
  try{
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, now);
    o.frequency.exponentialRampToValueAtTime(1318, now+0.12);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.15, now+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now+0.55);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now+0.6);
  }catch(e){}
}

function renderDashboard(){
  const list = Object.values(students);
  const newCount = list.length;
  if(prevCount !== null && newCount > prevCount) playDing();
  prevCount = newCount;

  document.getElementById('count-done').textContent = newCount;

  const chipsEl = document.getElementById('name-chips');
  if(list.length === 0){
    chipsEl.innerHTML = '<div class="empty">Ingen har levert ennå — del lenken eller QR-koden!</div>';
  } else {
    chipsEl.innerHTML = list
      .sort((a,b)=>a.ts-b.ts)
      .map(s=>`<div class="chip">${escapeHtml(s.navn)}</div>`)
      .join('');
  }

  const stats = {};
  GENES.forEach(g=>{
    let dom=0, rec=0;
    list.forEach(s=>{
      const a = s.svar && s.svar[g.key];
      if(a==='dom') dom++;
      else if(a==='rec') rec++;
    });
    const total = dom+rec;
    stats[g.key] = {
      domPct: total ? Math.round(100*dom/total) : 0,
      recPct: total ? Math.round(100*rec/total) : 0,
      total
    };
  });

  const tallCounts = new Array(64).fill(0);
  list.forEach(s=>{
    if(!s.svar) return;
    tallCounts[computeWheelNumber(s.svar) - 1]++;
  });

  renderAggWheel(stats, list.length, tallCounts);
  renderTopList(stats);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ TOP LIST ============ */
function renderTopList(stats){
  const entries = [];
  GENES.forEach(g=>{
    const s = stats[g.key];
    if(s.total === 0) return;
    entries.push({ label: g.domLabel, pct: s.domPct, gene: g.navn });
    entries.push({ label: g.recLabel, pct: s.recPct, gene: g.navn });
  });
  entries.sort((a,b)=>b.pct-a.pct);
  const el = document.getElementById('top-list');
  if(entries.length === 0){
    el.innerHTML = '<div class="empty">Venter på data …</div>';
    return;
  }
  el.innerHTML = entries.slice(0,8).map((e,i)=>`
    <div class="list-item">
      <div class="rank">${i+1}</div>
      <div class="bar-wrap">
        <div class="bar-label"><span>${e.label} <small style="opacity:.5;">(${e.gene})</small></span><span>${e.pct}%</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${e.pct}%; background:${pctToColor(e.pct)};"></div></div>
      </div>
    </div>
  `).join('');
}

/* ============ HEATMAP-FARGE ============ */
function pctToColor(pct){
  const lo = [254,243,199];   // #fef3c7
  const hi = [194,65,12];     // #c2410c
  const t = Math.max(0,Math.min(1,pct/100));
  const rgb = lo.map((c,i)=>Math.round(c + (hi[i]-c)*t));
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}

/* ============ AGGREGERT HJUL (SVG heatmap + tallring) ============
   De 6 innerste ringene er MED VILJE ikke forgrenet som det personlige
   hjulet: en hel klasse fordelt på 64 mulige kombinasjoner ville gitt tomme
   felt de fleste steder. Her er hver ring uavhengig og deles i to etter hvor
   stor andel av klassen som svarte dominant/recessivt på akkurat det genet.
   Den ytterste, tynne ringen ER de 64 feltene (samme nummerering som det
   personlige hjulet, se computeWheelNumber) — den viser bare AT et tall er
   tatt, ikke fenotypen bak det, så den unngår problemet over. */
const A_SIZE = 520, A_CX = A_SIZE/2, A_CY = A_SIZE/2, A_R0 = 42, A_RSTEP = 30, A_NUMRING_W = 24;

function renderAggWheel(stats, n, tallCounts){
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox', `0 0 ${A_SIZE} ${A_SIZE}`);
  svg.setAttribute('width', A_SIZE); svg.setAttribute('height', A_SIZE);

  GENES.forEach((g,i)=>{
    const rIn = A_R0 + i*A_RSTEP, rOut = rIn + A_RSTEP;
    const s = stats[g.key];
    [ {range:[0,180], pct:s.domPct, label:g.domLabel}, {range:[180,360], pct:s.recPct, label:g.recLabel} ]
      .forEach(seg=>{
        const path = document.createElementNS(svgNS,'path');
        path.setAttribute('d', donutSectorPath(A_CX,A_CY,rIn,rOut,seg.range[0],seg.range[1]));
        path.setAttribute('fill', n>0 ? pctToColor(seg.pct) : '#fff9f0');
        path.setAttribute('stroke', '#1a1a1a');
        path.setAttribute('stroke-width', '2');
        svg.appendChild(path);
        if(n>0){
          const midAngle = (seg.range[0]+seg.range[1])/2;
          const midR = (rIn+rOut)/2;
          const [tx,ty] = pt(A_CX,A_CY,midR,midAngle);
          const text = document.createElementNS(svgNS,'text');
          text.setAttribute('x', tx); text.setAttribute('y', ty+4);
          text.setAttribute('text-anchor','middle');
          text.setAttribute('font-size','11');
          text.setAttribute('font-weight','900');
          text.setAttribute('fill', seg.pct > 55 ? '#fff' : '#1a1a1a');
          text.textContent = seg.pct + '%';
          svg.appendChild(text);
        }
      });
  });

  const rC = A_R0;
  const circle = document.createElementNS(svgNS,'circle');
  circle.setAttribute('cx',A_CX); circle.setAttribute('cy',A_CY); circle.setAttribute('r',rC);
  circle.setAttribute('fill','#facc15'); circle.setAttribute('stroke','#1a1a1a'); circle.setAttribute('stroke-width','2.5');
  svg.appendChild(circle);
  const text = document.createElementNS(svgNS,'text');
  text.setAttribute('x', A_CX); text.setAttribute('y', A_CY+5);
  text.setAttribute('text-anchor','middle'); text.setAttribute('font-size','14'); text.setAttribute('font-weight','900');
  text.textContent = n;
  svg.appendChild(text);

  // ytterste ring: alle 64 mulige tall, med de klassen faktisk har "tatt" markert
  const numRIn = A_R0 + GENES.length*A_RSTEP;
  const numROut = numRIn + A_NUMRING_W;
  for(let i=0;i<64;i++){
    const angW = 360/64;
    const aStart = i*angW, aEnd = aStart+angW;
    const count = tallCounts ? tallCounts[i] : 0;
    const path = document.createElementNS(svgNS,'path');
    path.setAttribute('d', donutSectorPath(A_CX,A_CY,numRIn,numROut,aStart,aEnd));
    path.setAttribute('fill', count>0 ? '#facc15' : '#fff9f0');
    path.setAttribute('stroke', '#1a1a1a');
    path.setAttribute('stroke-width', '1');
    svg.appendChild(path);

    const midAngle = (aStart+aEnd)/2, midR = (numRIn+numROut)/2;
    const [tx,ty] = pt(A_CX,A_CY,midR,midAngle);
    const text = document.createElementNS(svgNS,'text');
    text.setAttribute('x', tx); text.setAttribute('y', ty+3);
    text.setAttribute('text-anchor','middle');
    text.setAttribute('font-size','7.5');
    text.setAttribute('font-weight', count>0 ? '900' : '700');
    text.setAttribute('fill', count>0 ? '#1a1a1a' : '#c9bfa8');
    text.textContent = String(i+1) + (count>1 ? '×'+count : '');
    svg.appendChild(text);
  }

  const outerR = numROut;
  const circle2 = document.createElementNS(svgNS,'circle');
  circle2.setAttribute('cx',A_CX); circle2.setAttribute('cy',A_CY); circle2.setAttribute('r',outerR);
  circle2.setAttribute('fill','none'); circle2.setAttribute('stroke','#1a1a1a'); circle2.setAttribute('stroke-width','3');
  svg.appendChild(circle2);
  const innerFrame = document.createElementNS(svgNS,'circle');
  innerFrame.setAttribute('cx',A_CX); innerFrame.setAttribute('cy',A_CY); innerFrame.setAttribute('r',numRIn);
  innerFrame.setAttribute('fill','none'); innerFrame.setAttribute('stroke','#1a1a1a'); innerFrame.setAttribute('stroke-width','2');
  svg.appendChild(innerFrame);

  const holder = document.getElementById('wheel-agg');
  holder.innerHTML = '';
  holder.appendChild(svg);

  const legend = document.createElement('div');
  legend.style.textAlign = 'center';
  legend.style.marginTop = '10px';
  legend.style.fontWeight = '800';
  legend.style.fontSize = '.82rem';
  legend.style.opacity = '.65';
  legend.innerHTML = GENES.map((g,i)=>`Ring ${i+1}: ${g.navn}`).join(' &nbsp;·&nbsp; ')
    + ' &nbsp;·&nbsp; Ytterste ring: elevenes tall (1–64) — gult felt betyr minst én elev landet der';
  holder.appendChild(legend);
}

/* ============ FULLSKJERM (klassehjulet) ============ */
window.toggleWheelFullscreen = function(){
  const panel = document.getElementById('wheel-panel');
  if(!document.fullscreenElement){
    (panel.requestFullscreen || panel.webkitRequestFullscreen || function(){}).call(panel);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  }
};
document.addEventListener('fullscreenchange', ()=>{

// Standard klokke-vinkel: 0 = topp, medurs positiv
function pt(cx,cy,r,angleDeg){
  const a = (angleDeg) * Math.PI/180;
  return [cx + r*Math.sin(a), cy - r*Math.cos(a)];
}
function donutSectorPath(cx,cy,rInner,rOuter,startDeg,endDeg){
  const large = (endDeg-startDeg) > 180 ? 1 : 0;
  const [x1,y1] = pt(cx,cy,rOuter,startDeg);
  const [x2,y2] = pt(cx,cy,rOuter,endDeg);
  const [x3,y3] = pt(cx,cy,rInner,endDeg);
  const [x4,y4] = pt(cx,cy,rInner,startDeg);
  return `M ${x1} ${y1} A ${rOuter} ${rOuter} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${rInner} ${rInner} 0 ${large} 0 ${x4} ${y4} Z`;
}

window.toggleFullscreen = function(holderId){
  const holder = document.getElementById(holderId);
  if(!document.fullscreenElement){
    (holder.requestFullscreen || holder.webkitRequestFullscreen || function(){}).call(holder);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  }
};
document.addEventListener('fullscreenchange', ()=>{
  document.querySelectorAll('.wheel-wrap > div').forEach(el=>{
    el.classList.toggle('is-fullscreen', document.fullscreenElement === el);
  });
});

window.downloadWheelImage = function(holderId, filename){
  filename = filename || 'genetisk-hjul.png';
  const svg = document.querySelector('#'+holderId+' svg');
  if(!svg) return;
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const svgStr = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = function(){
    const scale = 2;
    const w = svg.viewBox.baseVal.width || svg.width.baseVal.value;
    const h = svg.viewBox.baseVal.height || svg.height.baseVal.value;
    const canvas = document.createElement('canvas');
    canvas.width = w*scale; canvas.height = h*scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff9f0';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.scale(scale,scale);
    ctx.drawImage(img,0,0);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob=>{
      const link = document.createElement('a');
      link.download = filename;
      link.href = URL.createObjectURL(blob);
      link.click();
    });
  };
  img.src = url;
};
