:root{
  --bg:#0a0c1a;
  --aA:#ff2e63; --aB:#ff8a3d;          /* venstre side (rosa→oransje) */
  --bA:#00d4ff; --bB:#7c3aed;          /* høyre side (cyan→lilla) */

  --ink:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  font-family:'Nunito',system-ui,sans-serif;
  color:var(--ink);
  user-select:none;
}

/* ---------- bakgrunn: drivende neon-orber ---------- */
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;filter:blur(90px);opacity:.5}
.orb{position:absolute;border-radius:50%;animation:drift 26s ease-in-out infinite alternate}
.orb:nth-child(1){width:44vw;height:44vw;left:-12vw;top:-14vw;background:#ff2e63}
.orb:nth-child(2){width:38vw;height:38vw;right:-10vw;bottom:-12vw;background:#7c3aed;animation-delay:-9s}
.orb:nth-child(3){width:26vw;height:26vw;right:16vw;top:-10vw;background:#00d4ff;animation-delay:-17s}
@keyframes drift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(6vw,8vh) scale(1.25)}
}

/* ---------- scene ---------- */
#stage{position:fixed;inset:0;z-index:1}
#stage.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translate(-6px,2px)}
  20%,80%{transform:translate(7px,-3px)}
  30%,50%,70%{transform:translate(-9px,4px)}
  40%,60%{transform:translate(8px,-4px)}
}

/* ---------- sidene ---------- */
.side{
  position:absolute;inset:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:filter .45s ease, opacity .45s ease;
}
.side.a{background:linear-gradient(135deg,var(--aA),var(--aB))}
.side.b{background:linear-gradient(315deg,var(--bA),var(--bB))}
/* subtil tekstur / dybde */
.side::before{content:'';position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,.16), transparent 55%),

  pointer-events:none}

/* skyv innholdet inn i hver sin halvdel (flex sentrerer i content-boksen) */
.side.a{padding-right:56%}
.side.b{padding-left:56%}
.opt{
  position:relative;max-width:40vw;text-align:center;padding:1rem;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.opt .txt{
  font-weight:900;line-height:1.12;
  font-size:clamp(1.5rem,4.6vmin + 1vw,4rem);
  text-shadow:0 3px 0 rgba(0,0,0,.22), 0 10px 34px rgba(0,0,0,.35);
  letter-spacing:.01em;
}
.opt .tag{
  display:inline-block;margin-bottom:1.1rem;
  font-family:'Bungee','Arial Black',sans-serif;font-size:clamp(.8rem,1.6vmin,1.15rem);
  background:rgba(0,0,0,.28);padding:.35em .9em;border-radius:999px;
  letter-spacing:.12em;
}
@media (hover:hover){
  .side:hover .opt{transform:scale(1.07)}
  .side:hover{filter:brightness(1.12) saturate(1.15)}
}

/* valgt / taper */
.side.won{filter:brightness(1.15) saturate(1.3);z-index:3}
.side.won .opt{transform:scale(1.13)}
.side.lost{filter:grayscale(.85) brightness(.45);}
.side.lost .opt{transform:scale(.92)}
.stamp{
  position:absolute;left:50%;top:-3.2em;transform:translateX(-50%) rotate(-9deg) scale(0);
  font-family:'Bungee','Arial Black',sans-serif;font-size:clamp(1rem,2.6vmin,1.7rem);
  color:#ffe600;border:4px solid #ffe600;border-radius:.4em;
  padding:.15em .55em;letter-spacing:.08em;
  text-shadow:0 2px 0 rgba(0,0,0,.4);box-shadow:0 6px 24px rgba(0,0,0,.35);
  background:rgba(0,0,0,.35);
  pointer-events:none;opacity:0;white-space:nowrap;
}
.side.won .stamp{animation:stampIn .45s cubic-bezier(.34,1.8,.64,1) forwards}
@keyframes stampIn{
  0%{opacity:0;transform:translateX(-50%) rotate(18deg) scale(2.6)}
  100%{opacity:1;transform:translateX(-50%) rotate(-9deg) scale(1)}
}

/* inn/ut-animasjon per dilemma */
.side.a.enter .opt{animation:inLeft .55s cubic-bezier(.22,1.4,.36,1) both}
.side.b.enter .opt{animation:inRight .55s cubic-bezier(.22,1.4,.36,1) both}
@keyframes inLeft{0%{opacity:0;transform:translateX(-14vw) scale(.85)}100%{opacity:1;transform:translateX(0) scale(1)}}
@keyframes inRight{0%{opacity:0;transform:translateX(14vw) scale(.85)}100%{opacity:1;transform:translateX(0) scale(1)}}

  width:clamp(72px,13vmin,120px);height:clamp(72px,13vmin,120px);
  display:flex;align-items:center;justify-content:center;

}
#vs .ring{position:absolute;inset:-6px;border-radius:50%;

  animation:spin 5s linear infinite;
  filter:drop-shadow(0 0 18px rgba(255,230,0,.5))}
#vs .core{position:absolute;inset:0;border-radius:50%;background:#12142a;
  display:flex;align-items:center;justify-content:center;
  border:3px solid rgba(255,255,255,.15)}
#vs .core span{font-family:'Bungee','Arial Black',sans-serif;font-size:clamp(1.5rem,4.4vmin,2.6rem);
  background:linear-gradient(180deg,#fff,#ffe600);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  transform:translateY(.05em)}
@keyframes spin{to{transform:rotate(360deg)}}
#vs.pop{animation:vsPop .5s cubic-bezier(.34,2,.64,1)}
@keyframes vsPop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-160deg)}100%{transform:translate(-50%,-50%) scale(1) rotate(0)}}

/* ---------- topplinje ---------- */
#top{
  position:fixed;top:0;left:0;right:0;z-index:6;
  display:flex;align-items:center;justify-content:space-between;
  padding:.9rem 1.1rem;gap:.8rem;pointer-events:none;

#logo{font-family:'Bungee','Arial Black',sans-serif;font-size:clamp(.85rem,2vmin,1.25rem);

#chip{

  padding:.45em 1.1em;border-radius:999px;white-space:nowrap;

#chip.flip{animation:chipFlip .45s cubic-bezier(.34,1.56,.64,1)}

#hud{display:flex;align-items:center;gap:.55rem;pointer-events:auto}

.hudbtn:hover{transform:scale(1.08);border-color:#ffe600}

/* ============================================================
   STATE
   ============================================================ */
const $ = id => document.getElementById(id);
const stage=$('stage'), sideA=$('sideA'), sideB=$('sideB'),
      txtA=$('txtA'), txtB=$('txtB'), chip=$('chip'),
      countEl=$('count'), nextBtn=$('next'), vs=$('vs');

let active = new Set(Object.keys(CATS));   // aktive kategorier
let bag = [];                              // shuffle-bag (indekser)
let current = null;
let picked = false;
let shown = 0;
let soundOn = true;

/* ---------- shuffle-bag: ingen repetisjon før alt er brukt ---------- */
function refillBag(){
  bag = DILEMMAS.map((d,i)=> active.has(d[0]) ? i : -1).filter(i=>i>=0);
  for(let i=bag.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [bag[i],bag[j]]=[bag[j],bag[i]];
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function nextDilemma(){
  if(bag.length===0) refillBag();
  if(bag.length===0) return;
  const idx = bag.pop();
  current = DILEMMAS[idx];
  picked = false;
  shown++;

  const cat = CATS[current[0]];

  // tekst + kategori-chip
  txtA.textContent = current[1];
  txtB.textContent = current[2];
  chip.textContent = `${cat.emoji} ${cat.name}`;
  chip.style.borderColor = cat.c1;
  chip.classList.remove('flip'); void chip.offsetWidth; chip.classList.add('flip');

  // farge-aksent per kategori: side B låner kategorien litt
  document.documentElement.style.setProperty('--bA', cat.c1==='#ff2e63' ? '#00d4ff' : cat.c1);
  document.documentElement.style.setProperty('--bB', '#7c3aed');

  // nullstill valg
  sideA.classList.remove('won','lost');
  sideB.classList.remove('won','lost');
  nextBtn.classList.remove('pulse');

  // inn-animasjoner
  for(const s of [sideA,sideB]){ s.classList.remove('enter'); void s.offsetWidth; s.classList.add('enter'); }
  vs.classList.remove('pop'); void vs.offsetWidth; vs.classList.add('pop');
  stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');

  countEl.textContent = '#'+shown;
  countEl.classList.remove('tick'); void countEl.offsetWidth; countEl.classList.add('tick');

  sfx('whoosh');
}

function pick(which){
  if(picked || !current) return;
  picked = true;
  const winner = which==='a' ? sideA : sideB;
  const loser  = which==='a' ? sideB : sideA;
  winner.classList.add('won');
  loser.classList.add('lost');
  nextBtn.classList.add('pulse');
  confettiBurst(which);
  sfx('win');
}

/* ============================================================
   KONFETTI
   ============================================================ */
const fx = $('fx'), ctx = fx.getContext('2d');
let parts = [];
function sizeFx(){ fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio; }
addEventListener('resize', sizeFx); sizeFx();

function confettiBurst(which){
  const colors = which==='a'
    ? ['#ff2e63','#ff8a3d','#ffe600','#ffffff']
    : ['#00d4ff','#7c3aed','#ffe600','#ffffff'];
  const px = (which==='a' ? innerWidth*0.27 : innerWidth*0.73)*devicePixelRatio;
  const py = innerHeight*0.5*devicePixelRatio;
  for(let i=0;i<140;i++){
    const ang = Math.random()*Math.PI*2, sp=(4+Math.random()*13)*devicePixelRatio;
    parts.push({
      x:px, y:py,
      vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-6*devicePixelRatio,
      w:(5+Math.random()*7)*devicePixelRatio, h:(8+Math.random()*10)*devicePixelRatio,
      r:Math.random()*Math.PI*2, vr:(Math.random()-.5)*.4,
      c:colors[Math.floor(Math.random()*colors.length)],
      life:60+Math.random()*40
    });
  }
}
(function loop(){
  requestAnimationFrame(loop);
  ctx.clearRect(0,0,fx.width,fx.height);
  if(!parts.length) return;
  const g = 0.35*devicePixelRatio;
  parts = parts.filter(p=>p.life>0 && p.y<fx.height+40);
  for(const p of parts){
    p.vy+=g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vx*=.985; p.life--;
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.globalAlpha = Math.min(1,p.life/25);
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  }
})();

/* ============================================================
   LYD — liten WebAudio-synth (ingen filer)
   ============================================================ */
let AC=null;
function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
/* mykt "pling": sinus-klokke med rask attack og lang, myk hale */
function pling(a,t,freq,vol=.10,dur=.6){
  // grunntone + svak oktav gir klokkefølelse uten skarphet
  [[freq,vol],[freq*2,vol*.25]].forEach(([f,v])=>{
    const o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(v,t+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t+dur+.05);
  });
}
function sfx(kind){
  if(!soundOn) return;
  try{
    const a=ac(), t=a.currentTime;
    if(kind==='whoosh'){
      // nytt dilemma: to lette pling opp (E5 → A5)
      pling(a,t,659.25,.08,.4);
      pling(a,t+.09,880,.07,.5);
    }else if(kind==='win'){
      // valg: myk dur-treklang som klokkespill (C5-E5-G5-C6)
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
        pling(a,t+i*.09,f,.09,.7);
      });
    }else if(kind==='blip'){
      pling(a,t,987.77,.06,.25);
    }
  }catch(e){}
}

/* ============================================================
   DIAGONAL — regn ut sømvinkel + clip-paths etter skjermform
   ============================================================ */
function layout(){
  const W=innerWidth, H=innerHeight;
  const portrait = H/W > 1.25;
  document.body.classList.toggle('portrait', portrait);
  const cut = 5.5; // % forskyvning
  if(!portrait){
    sideA.style.clipPath = `polygon(0 0, ${50+cut}% 0, ${50-cut}% 100%, 0 100%)`;
    sideB.style.clipPath = `polygon(${50+cut}% 0, 100% 0, 100% 100%, ${50-cut}% 100%)`;
    const ang = Math.atan((2*cut/100*W)/H)*180/Math.PI;
    const seam=$('seam');
    seam.style.width='7px'; seam.style.height='150%';
    seam.style.transform=`translate(-50%,-50%) rotate(${ang}deg)`;
  }else{
    sideA.style.clipPath = `polygon(0 0, 100% 0, 100% ${50-cut}%, 0 ${50+cut}%)`;
    sideB.style.clipPath = `polygon(0 ${50+cut}%, 100% ${50-cut}%, 100% 100%, 0 100%)`;
    const ang = Math.atan((2*cut/100*H)/W)*180/Math.PI;
    const seam=$('seam');
    seam.style.width='150%'; seam.style.height='7px';
    seam.style.transform=`translate(-50%,-50%) rotate(${-ang}deg)`;
  }
}
addEventListener('resize', layout);

/* ============================================================
   KATEGORI-VELGER
   ============================================================ */
const catOverlay=$('catOverlay'), catGrid=$('catGrid'), bankInfo=$('bankInfo');
function renderCats(){
  catGrid.innerHTML='';
  for(const [key,cat] of Object.entries(CATS)){
    const b=document.createElement('button');
    b.className='catchip'+(active.has(key)?' on':'');
    b.textContent=`${cat.emoji} ${cat.name}`;
    if(active.has(key)) b.style.background=`linear-gradient(120deg,${cat.c1},${cat.c2})`;
    b.onclick=()=>{
      if(active.has(key)){
        if(active.size===1) return;      // minst én kategori må være på
        active.delete(key);
      }else active.add(key);
      refillBag(); renderCats(); sfx('blip');
    };
    catGrid.appendChild(b);
  }
  const n = DILEMMAS.filter(d=>active.has(d[0])).length;
  bankInfo.textContent = `${n} dilemmaer i potten`;
}
$('catBtn').onclick=()=>{ renderCats(); catOverlay.classList.add('open'); sfx('blip'); };
$('catClose').onclick=()=>{ catOverlay.classList.remove('open'); sfx('blip'); };
$('catAll').onclick=()=>{ active=new Set(Object.keys(CATS)); refillBag(); renderCats(); sfx('blip'); };
catOverlay.addEventListener('click',e=>{ if(e.target===catOverlay) catOverlay.classList.remove('open'); });

/* ============================================================
   INPUT
   ============================================================ */
sideA.addEventListener('click',()=>pick('a'));
sideB.addEventListener('click',()=>pick('b'));
nextBtn.addEventListener('click',e=>{ e.stopPropagation(); nextDilemma(); });
$('sndBtn').onclick=e=>{
  soundOn=!soundOn;
  e.currentTarget.textContent = soundOn?'🔊':'🔇';
  if(soundOn) sfx('blip');
};
addEventListener('keydown',e=>{
  if(catOverlay.classList.contains('open')){
    if(e.key==='Escape') catOverlay.classList.remove('open');
    return;
  }
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); nextDilemma(); }
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp') pick('a');
  else if(e.key==='ArrowRight'||e.key==='ArrowDown') pick('b');
});

/* ============================================================
   START
   ============================================================ */
layout();
refillBag();
nextDilemma();
</script>
