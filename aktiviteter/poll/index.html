<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fff9f0;
    --ink:   #2b2118;
    --yellow:#facc15;
    --card:  #ffffff;
    --muted: #7a6f63;
    --green: #16a34a;
    --c1: #f59e0b;
    --c2: #2563eb;
    --c3: #ec4899;
    --c4: #16a34a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── HEADER ── */
  .site-header {
    width: 100%;
    max-width: 720px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 18px;
  }
  .logo {
    font-family: 'Chewy', cursive;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    transform: rotate(-2deg);
    line-height: 1;
    user-select: none;
    text-decoration: none;
    color: var(--ink);
  }
  .logo b { color: var(--yellow); -webkit-text-stroke: 2px var(--ink); font-weight: 400; }
  .logo-sub {
    font-family: 'Chewy', cursive;
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: var(--muted);
    transform: rotate(1deg);
    align-self: flex-end;
    padding-bottom: 4px;
  }

  /* ── SCREENS ── */
  .screen { display: none; width: 100%; max-width: 720px; animation: fadeIn .25s ease; }
  .screen.active { display: flex; flex-direction: column; gap: 18px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 4px solid var(--ink);
    box-shadow: 0 7px 0 var(--ink);
    padding: 22px 24px;
  }
  .card h2 {
    font-family: 'Chewy', cursive;
    font-size: 1.2rem;
    letter-spacing: .04em;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* ── INPUTS ── */
  input[type="text"], textarea {
    width: 100%;
    border: 3px solid var(--ink);
    background: var(--cream);
    padding: 12px 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--ink);
    outline: none;
    transition: box-shadow .15s;
  }
  input[type="text"]:focus, textarea:focus {
    box-shadow: 0 4px 0 var(--ink);
  }
  textarea { resize: vertical; min-height: 68px; }

  .option-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .opt-badge {
    width: 32px; height: 32px;
    border: 3px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Chewy', cursive;
    font-size: 1rem;
    flex-shrink: 0;
    color: var(--ink);
  }
  .opt-badge-1 { background: var(--c1); }
  .opt-badge-2 { background: var(--c2); color: #fff; }
  .opt-badge-3 { background: var(--c3); color: #fff; }
  .opt-badge-4 { background: var(--c4); color: #fff; }

  /* ── BUTTONS ── */
  button {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    cursor: pointer;
    border: 4px solid var(--ink);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn-primary {
    background: var(--yellow);
    color: var(--ink);
    width: 100%;
    padding: 16px;
    font-size: 1.1rem;
    box-shadow: 0 6px 0 var(--ink);
  }
  .btn-primary:hover  { transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink); }
  .btn-primary:active { transform: translateY(4px);  box-shadow: 0 2px 0 var(--ink); }
  .btn-primary:disabled { background: #e5e5e5; color: var(--muted); cursor: not-allowed; transform: none; box-shadow: 0 4px 0 var(--muted); }

  .btn-secondary {
    background: var(--cream);
    color: var(--ink);
    padding: 10px 20px;
    font-size: .95rem;
    box-shadow: 0 4px 0 var(--ink);
  }
  .btn-secondary:hover  { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
  .btn-secondary:active { transform: translateY(3px);  box-shadow: 0 1px 0 var(--ink); }

  .btn-danger {
    background: #dc2626;
    color: #fff;
    padding: 10px 20px;
    font-size: .95rem;
    box-shadow: 0 4px 0 var(--ink);
  }
  .btn-danger:hover  { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
  .btn-danger:active { transform: translateY(3px);  box-shadow: 0 1px 0 var(--ink); }

  .btn-back {
    background: none;
    border: none;
    box-shadow: none;
    color: var(--muted);
    font-size: .9rem;
    padding: 6px 0;
    text-align: center;
    align-self: center;
  }
  .btn-back:hover { color: var(--ink); }

  /* ── ROLE PICKER ── */
  .role-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .role-btn {
    background: var(--card);
    border: 4px solid var(--ink);
    box-shadow: 0 6px 0 var(--ink);
    padding: 28px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-family: 'Chewy', cursive;
    font-size: 1.3rem;
    color: var(--ink);
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .role-btn:hover  { transform: translateY(-3px); box-shadow: 0 9px 0 var(--ink); }
  .role-btn:active { transform: translateY(4px);  box-shadow: 0 2px 0 var(--ink); }
  .role-btn .emoji { font-size: 2.2rem; }

  /* ── ROOM CODE ── */
  .room-code-block {
    text-align: center;
    padding: 10px 0 6px;
  }
  .room-code-block .label {
    font-weight: 800;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .room-code-block .code {
    font-family: 'Chewy', cursive;
    font-size: clamp(2.8rem, 10vw, 4rem);
    letter-spacing: 8px;
    color: var(--ink);
    background: var(--yellow);
    border: 4px solid var(--ink);
    display: inline-block;
    padding: 6px 24px;
    box-shadow: 0 5px 0 var(--ink);
  }
  .room-code-block .hint {
    color: var(--muted);
    font-size: .82rem;
    font-weight: 700;
    margin-top: 10px;
  }

  /* ── PARTICIPANTS BADGE ── */
  .participants {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: .9rem;
    color: var(--muted);
  }
  .participants .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--green);
    border: 2px solid var(--ink);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .participants strong { color: var(--ink); }

  /* ── QUESTION DISPLAY ── */
  .question-display {
    background: var(--yellow);
    border: 3px solid var(--ink);
    padding: 16px 18px;
    font-size: 1.15rem;
    font-weight: 800;
    line-height: 1.4;
  }

  /* ── CHART ── */
  .chart-container { display: flex; flex-direction: column; gap: 12px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-badge {
    width: 34px; height: 34px;
    border: 3px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Chewy', cursive;
    font-size: 1rem;
    flex-shrink: 0;
    color: var(--ink);
  }
  .bar-text {
    min-width: 120px;
    max-width: 140px;
    font-size: .82rem;
    font-weight: 800;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar-track {
    flex: 1;
    background: var(--cream);
    border: 3px solid var(--ink);
    height: 34px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    transition: width .5s cubic-bezier(.4,0,.2,1);
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 8px;
    font-family: 'Chewy', cursive;
    font-size: .95rem;
    color: var(--ink);
    width: 0%;
  }
  .bar-count {
    min-width: 28px;
    text-align: right;
    font-weight: 900;
    font-size: .95rem;
    color: var(--ink);
  }

  /* ── JOIN CODE INPUT ── */
  #joinCodeInput {
    text-align: center;
    font-family: 'Chewy', cursive;
    font-size: 2.2rem;
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  /* ── ANSWER GRID (elev) ── */
  .answer-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .answer-btn {
    border: 4px solid var(--ink);
    box-shadow: 0 6px 0 var(--ink);
    min-height: 90px;
    font-family: 'Nunito', sans-serif;
    font-size: .95rem;
    font-weight: 900;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    text-align: center;
    padding: 14px 10px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, opacity .2s;
  }
  .answer-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 9px 0 var(--ink); }
  .answer-btn:active:not(:disabled){ transform: translateY(4px);  box-shadow: 0 2px 0 var(--ink); }
  .answer-btn:disabled { cursor: not-allowed; }
  .answer-btn.not-voted { opacity: .3; }
  .answer-btn .shape { font-size: 1.3rem; }
  .answer-btn-1 { background: var(--c1); }
  .answer-btn-2 { background: var(--c2); color: #fff; }
  .answer-btn-3 { background: var(--c3); color: #fff; }
  .answer-btn-4 { background: var(--c4); color: #fff; }

  /* ── STATUS ── */
  .status {
    text-align: center;
    padding: 12px 16px;
    font-weight: 800;
    font-size: .9rem;
    border: 3px solid var(--ink);
  }
  .status.voted   { background: var(--yellow); }
  .status.error   { background: #fee2e2; color: #991b1b; }
  .status.waiting { background: #dcfce7; color: #166534; }

  /* ── WAITING ANIM ── */
  .waiting-anim {
    text-align: center;
    padding: 36px 20px;
  }
  .waiting-anim .spinner {
    width: 44px; height: 44px;
    border: 5px solid #e5e5e5;
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .waiting-anim p { font-weight: 800; color: var(--muted); }

  /* ── TOOLBAR ROW ── */
  .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }

  @media (max-width: 480px) {
    .answer-grid { gap: 8px; }
    .answer-btn  { min-height: 78px; font-size: .85rem; }
    .bar-text    { min-width: 80px; max-width: 90px; }
    .room-code-block .code { font-size: 2.2rem; letter-spacing: 5px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">LRN<b>ify</b></div>
  <div class="logo-sub">KlassePoll</div>
</header>

<!-- ── ROLLE ── -->
<div class="screen active" id="screen-role">
  <div class="role-grid">
    <button class="role-btn" onclick="goTeacher()">
      <span class="emoji">🎓</span>Lærer
    </button>
    <button class="role-btn" onclick="goStudent()">
      <span class="emoji">🙋</span>Elev
    </button>
  </div>
</div>

<!-- ── LÆRER: OPPSETT ── -->
<div class="screen" id="screen-teacher-setup">
  <div class="card">
    <h2>Spørsmål</h2>
    <textarea id="questionInput" placeholder="Skriv spørsmålet her…" rows="2"></textarea>
  </div>
  <div class="card">
    <h2>Svaralternativer</h2>
    <div class="option-row"><div class="opt-badge opt-badge-1">A</div><input type="text" id="opt1" placeholder="Alternativ A" /></div>
    <div class="option-row"><div class="opt-badge opt-badge-2">B</div><input type="text" id="opt2" placeholder="Alternativ B" /></div>
    <div class="option-row"><div class="opt-badge opt-badge-3">C</div><input type="text" id="opt3" placeholder="Alternativ C" /></div>
    <div class="option-row"><div class="opt-badge opt-badge-4">D</div><input type="text" id="opt4" placeholder="Alternativ D" /></div>
  </div>
  <button class="btn-primary" onclick="createRoom()">Start avstemning</button>
  <button class="btn-back" onclick="showScreen('screen-role')">← Tilbake</button>
</div>

<!-- ── LÆRER: LIVE ── -->
<div class="screen" id="screen-teacher-live">
  <div class="toolbar">
    <div class="participants"><div class="dot"></div><strong id="participantCount">0</strong>&nbsp;svar</div>
    <div style="display:flex;gap:8px;">
      <button class="btn-secondary" onclick="newQuestion()">Nytt spørsmål</button>
      <button class="btn-danger" onclick="closeRoom()">Avslutt</button>
    </div>
  </div>
  <div class="card">
    <div class="room-code-block">
      <div class="label">Del denne koden med elevene</div>
      <div class="code" id="roomCodeDisplay">——</div>
      <div class="hint">Gå til samme side → velg Elev → skriv inn koden</div>
    </div>
  </div>
  <div class="card">
    <h2>Spørsmål</h2>
    <div class="question-display" id="liveQuestion">—</div>
  </div>
  <div class="card">
    <h2>Resultater</h2>
    <div class="chart-container" id="chartContainer"></div>
  </div>
</div>

<!-- ── ELEV: KODE ── -->
<div class="screen" id="screen-student-join">
  <div class="card">
    <h2>Romkode</h2>
    <input type="text" id="joinCodeInput" maxlength="6" placeholder="ABC123"
      autocomplete="off" autocorrect="off" spellcheck="false"
      oninput="this.value=this.value.toUpperCase()" />
  </div>
  <div class="card">
    <h2>Kallenavn (valgfritt)</h2>
    <input type="text" id="studentName" placeholder="La stå tomt for anonym" maxlength="20" />
  </div>
  <div id="joinError" class="status error" style="display:none;"></div>
  <button class="btn-primary" onclick="joinRoom()">Bli med</button>
  <button class="btn-back" onclick="showScreen('screen-role')">← Tilbake</button>
</div>

<!-- ── ELEV: VENTER ── -->
<div class="screen" id="screen-student-waiting">
  <div class="card">
    <div class="waiting-anim">
      <div class="spinner"></div>
      <p id="waitingMsg">Venter på læreren…</p>
    </div>
  </div>
</div>

<!-- ── ELEV: SVAR ── -->
<div class="screen" id="screen-student-answer">
  <div class="card">
    <h2>Spørsmål</h2>
    <div class="question-display" id="studentQuestion">—</div>
  </div>
  <div class="answer-grid" id="answerGrid"></div>
  <div id="voteStatus" class="status" style="display:none;"></div>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, off, remove }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInAnonymously }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBdbRSnz-02Cq2BITAcKY_mvWI5D91BYBM",
  authDomain: "poll-c6bd2.firebaseapp.com",
  databaseURL: "https://poll-c6bd2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "poll-c6bd2",
  storageBucket: "poll-c6bd2.firebasestorage.app",
  messagingSenderId: "541647069675",
  appId: "1:541647069675:web:d8ee426e242e7757dbf9ae"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* Anonym pålogging: helt usynlig for eleven, ingen konto og ingen klikk.
   Nettleseren får en tilfeldig id som sikkerhetsreglene bruker til å se
   forskjell på læreren (som lagde rommet) og elevene, og til å telle én
   stemme per enhet. Slår den feil — eller er anonym pålogging ikke skrudd
   på i Firebase — går alt som før, bare uten den ekstra beskyttelsen. */
const auth = getAuth(app);
let uid = null;
let paalogging = null;
function ensureAuth() {
  if (uid) return Promise.resolve(uid);
  // Bare én innlogging av gangen; feiler den, kan neste kall prøve på nytt.
  if (!paalogging) {
    paalogging = signInAnonymously(auth)
      .then(cred => (uid = cred.user.uid))
      .catch(() => { paalogging = null; return null; });
  }
  return paalogging;
}
ensureAuth();

let currentRoom    = null;
let currentListener = null;
let hasVoted       = false;

const COLORS = ['#f59e0b','#2563eb','#ec4899','#16a34a'];
const LABELS = ['A','B','C','D'];
const SHAPES = ['▲','◆','●','★'];

function makeCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}

window.showScreen = id => {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
};
window.goTeacher = () => showScreen('screen-teacher-setup');
window.goStudent = () => showScreen('screen-student-join');

/* ══ LÆRER ══ */
window.createRoom = async () => {
  const question = document.getElementById('questionInput').value.trim();
  const opts = [1,2,3,4].map(n => document.getElementById('opt'+n).value.trim());
  if (!question)                              { alert('Skriv et spørsmål først.'); return; }
  if (opts.filter(Boolean).length < 2)       { alert('Du trenger minst 2 svaralternativer.'); return; }

  const code = makeCode();
  currentRoom = code;

  const room = {
    question, options: opts,
    votes: { 0:0, 1:0, 2:0, 3:0 },
    open: true, createdAt: Date.now()
  };
  const owner = await ensureAuth();
  if (owner) room.owner = owner;

  await set(ref(db, `rooms/${code}`), room);

  document.getElementById('roomCodeDisplay').textContent = code;
  document.getElementById('liveQuestion').textContent    = question;
  renderChart(opts, { 0:0, 1:0, 2:0, 3:0 });
  showScreen('screen-teacher-live');
  startTeacherListener(code);
};

function startTeacherListener(code) {
  if (currentListener) off(ref(db, `rooms/${currentRoom}`), 'value', currentListener);
  currentListener = onValue(ref(db, `rooms/${code}`), snap => {
    if (!snap.exists()) return;
    const d = snap.val();
    const votes = d.votes || { 0:0,1:0,2:0,3:0 };
    const total = Object.values(votes).reduce((a,b)=>a+b,0);
    document.getElementById('participantCount').textContent = total;
    renderChart(d.options, votes);
  });
}

function renderChart(options, votes) {
  const total = Object.values(votes).reduce((a,b)=>a+b,0);
  const el    = document.getElementById('chartContainer');
  el.innerHTML = '';
  options.forEach((opt, i) => {
    if (!opt) return;
    const count = votes[i] || 0;
    const pct   = total > 0 ? Math.round(count / total * 100) : 0;
    const isLight = i === 0; // amber is light
    const textColor = isLight ? 'var(--ink)' : '#fff';
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <div class="bar-badge opt-badge-${i+1}" style="color:${isLight?'var(--ink)':'#fff'}">${LABELS[i]}</div>
      <div class="bar-text">${opt}</div>
      <div class="bar-track">
        <div class="bar-fill" style="background:${COLORS[i]};color:${textColor};width:0%">${pct > 8 ? pct+'%' : ''}</div>
      </div>
      <div class="bar-count">${count}</div>`;
    el.appendChild(row);
    requestAnimationFrame(() => {
      row.querySelector('.bar-fill').style.width = pct + '%';
    });
  });
}

window.newQuestion = async () => {
  if (!currentRoom) return;
  if (!confirm('Start ny runde? Alle svar nullstilles.')) return;
  if (currentListener) { off(ref(db, `rooms/${currentRoom}`), 'value', currentListener); currentListener = null; }
  await remove(ref(db, `rooms/${currentRoom}`));
  currentRoom = null;
  document.getElementById('questionInput').value = '';
  [1,2,3,4].forEach(n => document.getElementById('opt'+n).value = '');
  showScreen('screen-teacher-setup');
};

window.closeRoom = async () => {
  if (!currentRoom) return;
  if (!confirm('Avslutt rommet for alle?')) return;
  if (currentListener) { off(ref(db, `rooms/${currentRoom}`), 'value', currentListener); currentListener = null; }
  await remove(ref(db, `rooms/${currentRoom}`));
  currentRoom = null;
  showScreen('screen-role');
};

/* ══ ELEV ══ */
window.joinRoom = async () => {
  const code  = document.getElementById('joinCodeInput').value.trim().toUpperCase();
  const errEl = document.getElementById('joinError');
  errEl.style.display = 'none';

  if (code.length < 4) { showErr('Skriv inn romkoden du fikk av læreren.'); return; }

  const snap = await get(ref(db, `rooms/${code}`));
  if (!snap.exists())    { showErr('Fant ikke et rom med den koden.'); return; }
  if (!snap.val().open)  { showErr('Dette rommet er stengt.'); return; }

  const data  = snap.val();
  currentRoom = code;
  hasVoted    = false;

  document.getElementById('studentQuestion').textContent = data.question;
  renderAnswerButtons(data.options);
  showScreen('screen-student-answer');
  startStudentListener(code);

  function showErr(msg) { errEl.textContent = msg; errEl.style.display = 'block'; }
};

function startStudentListener(code) {
  if (currentListener) off(ref(db, `rooms/${currentRoom}`), 'value', currentListener);
  currentListener = onValue(ref(db, `rooms/${code}`), snap => {
    if (!snap.exists()) {
      document.getElementById('waitingMsg').textContent = 'Rommet er avsluttet av læreren.';
      showScreen('screen-student-waiting');
    }
  });
}

function renderAnswerButtons(options) {
  const grid   = document.getElementById('answerGrid');
  const status = document.getElementById('voteStatus');
  grid.innerHTML = '';
  status.style.display = 'none';
  hasVoted = false;

  options.forEach((opt, i) => {
    if (!opt) return;
    const btn = document.createElement('button');
    btn.className = `answer-btn answer-btn-${i+1}`;
    btn.innerHTML = `<span class="shape">${SHAPES[i]}</span>${opt}`;
    btn.onclick = () => castVote(i, options);
    grid.appendChild(btn);
  });
}

async function castVote(index, options) {
  if (hasVoted) return;
  hasVoted = true;

  document.querySelectorAll('.answer-btn').forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.add(i === index ? 'voted' : 'not-voted');
  });

  const status = document.getElementById('voteStatus');
  status.style.display = 'block';
  status.className = 'status voted';
  status.textContent = `Du stemte: ${LABELS[index]} – ${options[index]} ✓`;

  const svar = await sendVote(index);
  if (svar === 'ok') return;

  // Kom ikke fram: gi knappene tilbake så eleven kan prøve igjen.
  hasVoted = false;
  document.querySelectorAll('.answer-btn').forEach(btn => {
    btn.disabled = false;
    btn.classList.remove('voted', 'not-voted');
  });
  status.className = 'status error';
  status.textContent = svar === 'duplicate'
    ? 'Du har allerede stemt fra denne enheten.'
    : 'Fikk ikke sendt stemmen. Prøv en gang til.';
}

/* Stemmen og "denne enheten har stemt"-merket skrives i én operasjon, slik at
   reglene kan kreve at de følges ad. Leser to elever samme tellerverdi
   samtidig, avviser regelen den andre skrivingen — da leser vi på nytt i
   stedet for å miste stemmen. */
async function sendVote(index) {
  const voter = await ensureAuth();

  if (voter) {
    const alt = await get(ref(db, `rooms/${currentRoom}/voters/${voter}`)).catch(() => null);
    if (alt && alt.exists()) return 'duplicate';
  }

  for (let forsok = 0; forsok < 5; forsok++) {
    try {
      const snap = await get(ref(db, `rooms/${currentRoom}/votes/${index}`));
      const endring = { [`votes/${index}`]: (snap.exists() ? snap.val() : 0) + 1 };
      if (voter) endring[`voters/${voter}`] = true;
      await update(ref(db, `rooms/${currentRoom}`), endring);
      return 'ok';
    } catch (e) {
      await new Promise(r => setTimeout(r, 100 + Math.random() * 250));
    }
  }
  return 'error';
}
</script>
