<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#7dd3fc"/>
  <rect y="330" width="800" height="120" fill="#0369a1" opacity="0.35"/>
  <circle cx="140" cy="85" r="22" fill="#fff" opacity="0.5"/>
  <circle cx="660" cy="100" r="16" fill="#fff9f0" opacity="0.6"/>
  <circle cx="230" cy="390" r="9" fill="#fff9f0" opacity="0.6"/>
  <!-- skjul -->
  <path d="M 640 450 L 640 260 Q 700 220 760 260 L 760 450 Z" fill="#0369a1" opacity="0.25"/>
  <!-- Bjørg hummeren -->
  <g transform="translate(370,255)">
    <!-- hale -->
    <path d="M -260 -10 L -320 -50 L -300 -10 L -320 30 L -260 10 Z" fill="#c9503a" stroke="#2b2118" stroke-width="6" stroke-linejoin="round"/>
    <path d="M -270 -10 L -270 10" stroke="#2b2118" stroke-width="3" opacity="0.5"/>
    <!-- kropp -->
    <ellipse cx="-100" cy="0" rx="180" ry="72" fill="#d4634a" stroke="#2b2118" stroke-width="6"/>
    <path d="M -230 0 Q -100 -30 20 0 Q -100 30 -230 0 Z" fill="#c9503a" opacity="0.5"/>
    <!-- hode -->
    <ellipse cx="90" cy="0" rx="55" ry="48" fill="#d4634a" stroke="#2b2118" stroke-width="6"/>
    <!-- øyne på stilk -->
    <path d="M 60 -45 Q 50 -75 35 -85" stroke="#2b2118" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="33" cy="-87" r="10" fill="#2b2118"/>
    <path d="M 110 -45 Q 120 -75 135 -85" stroke="#2b2118" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="137" cy="-87" r="10" fill="#2b2118"/>
    <!-- briller (personlighet!) -->
    <circle cx="33" cy="-87" r="15" fill="none" stroke="#2b2118" stroke-width="4"/>
    <circle cx="137" cy="-87" r="15" fill="none" stroke="#2b2118" stroke-width="4"/>
    <line x1="48" y1="-87" x2="122" y2="-87" stroke="#2b2118" stroke-width="4"/>
    <!-- følehorn -->
    <path d="M 130 10 Q 220 -20 280 -60" stroke="#2b2118" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 130 20 Q 220 30 290 20" stroke="#2b2118" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- store klør -->
    <path d="M 40 60 Q 30 130 90 150 Q 140 145 130 105 Q 100 115 85 95 Q 100 80 90 60 Z" fill="#c9503a" stroke="#2b2118" stroke-width="6" stroke-linejoin="round"/>
    <path d="M -60 55 Q -90 120 -40 150 Q 10 150 5 108 Q -30 120 -45 95 Q -25 80 -35 55 Z" fill="#c9503a" stroke="#2b2118" stroke-width="6" stroke-linejoin="round"/>
    <!-- småbein -->
    <path d="M -150 45 Q -170 80 -190 100" stroke="#2b2118" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M -110 55 Q -125 95 -140 120" stroke="#2b2118" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M -190 30 Q -215 55 -240 70" stroke="#2b2118" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <text x="400" y="430" font-family="Nunito, sans-serif" font-weight="800" font-size="22" fill="#2b2118" text-anchor="middle" opacity="0.55">Midlertidig illustrasjon — byttes med foto fra akvariet</text>
</svg>
