<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post 4: Tell og finn — Akvarieløypa</title>
<link rel="stylesheet" href="loype.css">
</head>
<body>
<div id="loype-topp" class="ramme"></div>
<main class="ramme">
  <div class="kort kort--sea senter">
    <h1>⭐ Tell og finn</h1>
    <p id="intro"></p>
  </div>
  <div class="kort">
    <h2 class="senter" id="oppgave"></h2>
    <p class="liten senter" id="hint"></p>
    <div class="mellomrom"></div>
    <label for="svar"><strong>Skriv tallet dere kom fram til:</strong></label>
    <input type="number" id="svar" inputmode="numeric" min="0" max="99" enterkeyhint="done">
    <button class="knapp" id="lever">Vi er sikre! ✅</button>
  </div>
</main>

<script src="config.js"></script>
<script src="loype-core.js"></script>
<script>
  const POST_ID = 4;
  const CFG = LOYPE_CONFIG.post4;
  const MAKS = LOYPE_CONFIG.poster.find(p => p.id === POST_ID).maks;

  if (Loype.krevLag(POST_ID) && !Loype.sjekkAlleredeTatt(POST_ID)) {
    Loype.tegnTopp(POST_ID);
    document.getElementById("intro").textContent = CFG.intro;
    document.getElementById("oppgave").textContent = CFG.oppgave;
    document.getElementById("hint").textContent = "💡 " + CFG.hint;

    function lever() {
      const felt = document.getElementById("svar");
      const svar = parseInt(felt.value, 10);
      if (isNaN(svar)) { felt.focus(); return; }
      const avvik = Math.abs(svar - CFG.riktigSvar);
      const poeng = avvik === 0 ? CFG.fullPoeng : avvik === 1 ? CFG.naerPoeng : 0;
      Loype.fullforPost(POST_ID, poeng, MAKS);
    }

    document.getElementById("lever").addEventListener("click", lever);
    document.getElementById("svar").addEventListener("keydown", e => {
      if (e.key === "Enter") lever();
    });
  }
</script>
</body>
</html>
