<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nøkken og de syv minnene — Kittelsen-huset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#0a1110;          /* tjernmørke */
  --deep2:#15201b;         /* skoggrønn dybde */
  --tarn:#1a2825;          /* mørkt vann/panel */
  --tarn2:#24362f;         /* lysere mosegrønn panel */
  --mist:#aec7ba;          /* tåketekst */
  --mistdim:#728b82;
  --cream:#f1ead6;         /* gammelt papir */
  --paper:#e5dbc0;
  --ink:#292119;           /* blyant/brun-sort */
  --eye:#efe7a4;           /* Nøkkens øyne */
  --gold:#d4bd77;          /* dempet fragmentlys */
  --inga:#e7c6bd;          /* Ingas stemme */
  --wrong:#c15a4b;
  --right:#8bb981;
  --line:rgba(174,199,186,.24);
  --shadow:rgba(0,0,0,.55);
  --safe-bottom:max(28px, env(safe-area-inset-bottom));
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;overflow-x:hidden}
body{
  min-height:100%;overflow-x:hidden;overscroll-behavior-y:none;
  background:
    radial-gradient(ellipse at 50% 4%, rgba(173,199,186,.11), transparent 38%),
    radial-gradient(ellipse at 50% 100%, rgba(62,98,82,.34), transparent 44%),
    linear-gradient(180deg,#0a1110 0%,#101817 46%,#17251f 100%);
  font-family:'Nunito',sans-serif;color:var(--mist);
  font-size:17px;line-height:1.5;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;
}
#app{
  min-height:100vh;min-height:100svh;min-height:100dvh;display:flex;flex-direction:column;
  max-width:560px;margin:0 auto;position:relative;isolation:isolate;
  background:
    linear-gradient(180deg, rgba(10,17,16,.10), rgba(10,17,16,.34)),
    radial-gradient(ellipse at 50% 36%, rgba(143,181,173,.10), transparent 56%);
}
#app::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.36;
  background:
    linear-gradient(180deg, transparent 0 58%, rgba(205,221,194,.06) 58% 59%, transparent 59% 100%),
    repeating-linear-gradient(96deg, rgba(241,234,214,.035) 0 1px, transparent 1px 6px);
  mix-blend-mode:screen;
}
#app::after{
  content:'';position:absolute;left:-8%;right:-8%;bottom:-2%;height:28%;pointer-events:none;z-index:0;opacity:.26;
  background:radial-gradient(ellipse at 50% 100%, rgba(20,43,36,.96), transparent 72%);
}

/* ---------- tåke-atmosfære ---------- */
.fog{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fog::before,.fog::after{
  content:'';position:absolute;left:-30%;width:160%;height:42%;
  background:radial-gradient(ellipse at 50% 50%, rgba(143,181,173,.09), transparent 65%);
  animation:drift 22s ease-in-out infinite alternate;
}
.fog::before{top:6%}
.fog::after{bottom:4%;animation-duration:29s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
@media (prefers-reduced-motion:reduce){
  .fog::before,.fog::after{animation:none}
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ---------- header med Nøkkens øyne ---------- */
header{position:relative;z-index:2;padding:14px 18px 8px;text-align:center;flex:0 0 auto;background:linear-gradient(180deg,rgba(10,17,16,.90),rgba(10,17,16,.08))}
.eyes{display:flex;justify-content:center;gap:26px;height:22px;margin-bottom:6px}
.eye{
  width:30px;height:13px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 55%, var(--eye) 0%, #b8c86e 55%, transparent 78%);
  box-shadow:0 0 18px 4px rgba(233,242,166,.35), 0 0 46px 10px rgba(233,242,166,.12);
  animation:blink 6.5s infinite;
  transform-origin:center;
}
.eye:last-child{animation-delay:.08s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.06)}}
.eyes.calm .eye{opacity:.35;box-shadow:0 0 10px 2px rgba(233,242,166,.15)}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--cream);font-size:22px;letter-spacing:.04em}
.sub{font-size:12px;text-transform:uppercase;letter-spacing:.22em;color:var(--mistdim);margin-top:1px}
.progress{display:flex;justify-content:center;gap:7px;margin-top:9px}
.pdot{width:9px;height:9px;border-radius:50%;background:transparent;border:1.5px solid var(--mistdim)}
.pdot.done{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(250,204,21,.5)}
.pdot.finale{border-radius:2px;transform:rotate(45deg)}

/* ---------- hovedflate ---------- */
main{flex:1 1 auto;overflow-y:auto;position:relative;z-index:2;padding:6px 18px calc(24px + var(--safe-bottom));
  display:flex;flex-direction:column;scrollbar-width:thin;scroll-padding-bottom:calc(86px + var(--safe-bottom))}
.screen{display:none;flex:1;flex-direction:column}
.screen.active{display:flex}

.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.statusline{font-size:14px;color:var(--mistdim);text-align:center;margin-top:6px}
.landing{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:6px 0 12px}
.landing-card{
  position:relative;overflow:hidden;text-align:center;border:2px solid rgba(241,234,214,.22);border-radius:22px;
  background:
    linear-gradient(180deg, rgba(12,23,21,.70), rgba(23,37,31,.88)),
    radial-gradient(ellipse at 50% 18%, rgba(239,231,164,.12), transparent 34%);
  box-shadow:0 20px 50px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.05);
  padding:22px 16px 18px;
}
.landing-card::before{
  content:'';position:absolute;left:0;right:0;bottom:0;height:44%;opacity:.36;pointer-events:none;
  background:
    radial-gradient(ellipse at 18% 72%, rgba(214,189,119,.28), transparent 7%),
    radial-gradient(ellipse at 25% 58%, rgba(214,189,119,.18), transparent 5%),
    radial-gradient(ellipse at 50% 100%, rgba(43,73,58,.72), transparent 70%);
}
.intro-hero{position:relative;height:188px;margin:-4px -4px 12px;border-radius:18px;overflow:hidden;border:1px solid rgba(174,199,186,.18);
  background:
    radial-gradient(ellipse at 58% 52%, rgba(241,234,214,.32), transparent 17%),
    radial-gradient(ellipse at 46% 53%, rgba(241,234,214,.34), transparent 5%),
    radial-gradient(ellipse at 54% 54%, rgba(241,234,214,.34), transparent 5%),
    linear-gradient(180deg, rgba(114,139,130,.16), transparent 38%),
    linear-gradient(180deg, #18241f 0%, #1e312a 58%, #345c4f 100%);
}
.intro-hero::before{content:'';position:absolute;inset:0;opacity:.42;background:repeating-linear-gradient(104deg, rgba(241,234,214,.10) 0 1px, transparent 1px 6px)}
.intro-hero::after{content:'';position:absolute;left:43%;top:42%;width:76px;height:36px;border-radius:50%;opacity:.75;background:radial-gradient(ellipse at 40% 50%, var(--eye) 0 6px, transparent 8px),radial-gradient(ellipse at 60% 50%, var(--eye) 0 6px, transparent 8px),radial-gradient(ellipse at 50% 54%, rgba(18,20,18,.95), rgba(18,20,18,.70) 54%, transparent 56%);box-shadow:0 0 24px rgba(239,231,164,.22)}
.landing-kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:900;margin-bottom:6px}
.landing-title{font-family:'Cormorant Garamond',serif;color:var(--cream);font-size:38px;line-height:1.05;font-weight:700;letter-spacing:.015em;outline:none}
.landing-copy{color:var(--mist);font-size:17px;font-weight:700;max-width:36ch;margin:10px auto 0}
.landing-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.lang-row{display:flex;align-items:center;justify-content:center;margin-top:8px}
.lang-pill{display:inline-flex;gap:8px;align-items:center;border:1.5px solid rgba(174,199,186,.38);background:rgba(26,40,37,.82);color:var(--mist);border-radius:999px;padding:9px 13px;font:800 14px 'Nunito',sans-serif;cursor:pointer}
.flag{font-size:1.25em;line-height:1;display:inline-block}
.lang-pill .flag{font-size:1.15em}
.lang-pill:focus-visible,.lang-option:focus-visible{outline:3px solid var(--eye);outline-offset:3px}
.language-list{display:grid;gap:10px;margin-top:12px}
.lang-option{width:100%;text-align:left;border-radius:16px;border:2px solid rgba(41,33,25,.92);background:var(--cream);color:var(--ink);padding:14px;box-shadow:3px 3px 0 var(--shadow);font-family:'Nunito',sans-serif;cursor:pointer;display:flex;align-items:center;gap:12px}
.lang-option .flag{font-size:28px;flex:0 0 auto}
.lang-option strong{display:block;font-size:17px}.lang-option small{display:block;margin-top:3px;font-weight:800;color:#755f30}.lang-option[aria-current="true"]{outline:3px solid var(--eye);outline-offset:0}



/* ---------- Kittelsen-bilder ---------- */
.intro-hero.has-image{
  background-image:
    linear-gradient(180deg, rgba(7,12,12,.12), rgba(7,12,12,.72)),
    radial-gradient(ellipse at 50% 62%, rgba(7,12,12,.12), rgba(7,12,12,.64) 70%),
    var(--hero-img);
  background-size:cover;
  background-position:center 42%;
}
.intro-hero.has-image::after{display:none}
.artpanel{
  position:relative;overflow:hidden;border-radius:16px;border:1.5px solid rgba(174,199,186,.24);
  background:rgba(10,17,16,.42);box-shadow:inset 0 0 0 1px rgba(241,234,214,.04), 0 12px 28px rgba(0,0,0,.22);
  margin:0 0 14px;
}
.artpanel img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.86) contrast(1.03)}
.artpanel::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg, rgba(10,17,16,.05), rgba(10,17,16,.45));}
.artpanel.quest{height:172px}
.artpanel.quest img{object-position:center center}
.artpanel.eyes{height:126px}
.artpanel.eyes img{object-position:center center}
.artpanel.pesta{height:138px}
.artpanel.pesta img{object-position:center center}
.frag-img{
  width:100%;height:138px;border-radius:14px;overflow:hidden;margin:-6px 0 14px;
  border:1.5px solid rgba(41,33,25,.55);background:#151f1c;
}
.frag-img img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.82) contrast(1.05)}
.page.done{overflow:hidden;background:linear-gradient(180deg,var(--cream),var(--paper))}
.page-thumb{position:absolute;inset:0;z-index:0;opacity:.22;pointer-events:none;background:#14201c}
.page-thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.8) contrast(1.08)}
.page.done::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(241,234,214,.86),rgba(241,234,214,.54));pointer-events:none}
.page > .roman,.page > .ptitle{position:relative;z-index:2}
.page.done::after{z-index:3}
.diploma-mark{width:112px;height:62px;margin:0 auto 12px;border-radius:999px;overflow:hidden;border:1.5px solid rgba(41,33,25,.45);background:#111b18;opacity:.9}
.diploma-mark img{width:100%;height:100%;object-fit:cover;filter:saturate(.75) contrast(1.06)}

/* ---------- knapper ---------- */
.btn{
  display:block;width:100%;padding:14px;border-radius:14px;cursor:pointer;
  font-family:'Nunito',sans-serif;font-weight:900;font-size:17px;text-align:center;
  border:2px solid rgba(41,33,25,.96);background:linear-gradient(180deg,#ead898,var(--gold));color:var(--ink);
  box-shadow:3px 3px 0 var(--shadow), inset 0 1px 0 rgba(255,255,255,.22);transition:transform .07s, filter .12s;
  user-select:none;-webkit-user-select:none;
}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.55)}
.btn.ghost{background:rgba(36,54,47,.92);color:var(--mist);border-color:var(--mistdim);box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.btn.secondary{background:rgba(36,54,47,.92);color:var(--mist);border-color:var(--mistdim)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.page:focus-visible,.linklike:focus-visible,.codein:focus-visible,.taskin:focus-visible,.blank:focus-visible{outline:3px solid var(--eye);outline-offset:3px}
footer{flex:0 0 auto;padding:10px 18px calc(18px + var(--safe-bottom));position:relative;z-index:2;background:linear-gradient(180deg,transparent,rgba(10,17,16,.84));border-top:1px solid rgba(174,199,186,.10)}

/* ---------- hjem / minnebok ---------- */
.book{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0 14px}
.page{
  border-radius:14px;padding:12px 10px;min-height:86px;position:relative;width:100%;font-family:'Nunito',sans-serif;text-align:left;appearance:none;-webkit-appearance:none;
  border:2px solid rgba(43,33,24,.9);
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  background:linear-gradient(180deg,rgba(36,54,47,.96),rgba(23,37,31,.96));color:var(--mistdim);
}
.page .roman{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:700;letter-spacing:.14em}
.page .ptitle{font-weight:800;font-size:14.5px;line-height:1.25}
.page.open{background:linear-gradient(180deg,var(--cream),var(--paper));color:var(--ink);box-shadow:3px 3px 0 var(--shadow);cursor:pointer}
.page.open .roman{color:#8a6d1d}
.page:disabled{opacity:1;cursor:not-allowed}
.page.locked .ptitle{color:var(--mistdim)}
.page.locked::after{content:'✕';position:absolute;top:8px;right:10px;color:var(--mistdim);font-size:12px;font-weight:900}
.page.done::after{content:'✓';position:absolute;top:6px;right:10px;color:#3c7a3c;font-weight:900;font-size:15px}
.page.finale{grid-column:1 / -1;min-height:64px;text-align:center;align-items:center}
.coderow{display:flex;gap:8px;align-items:stretch}
.codein{
  flex:1;border-radius:14px;border:3px solid var(--ink);background:var(--cream);
  font-family:'Nunito',sans-serif;font-weight:900;font-size:20px;letter-spacing:.5em;text-align:center;
  color:var(--ink);text-transform:uppercase;padding:10px 4px 10px calc(4px + .5em);
  box-shadow:3px 3px 0 var(--shadow);min-width:0;
}
.codein::placeholder{letter-spacing:.18em;font-size:14px;color:#9a8f80;font-weight:800}
.coderow .btn{width:auto;padding:10px 18px;flex:0 0 auto}
.codemsg{min-height:22px;font-size:14px;font-weight:700;text-align:center;margin-top:8px;color:var(--wrong)}
.homelead{font-size:16px;text-align:center;margin:4px 0 2px}

/* ---------- Nøkken-tale ---------- */
.speech{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:8px 4px;cursor:pointer}
.nline{
  font-family:'Cormorant Garamond',serif;font-size:23px;line-height:1.45;color:var(--cream);
  font-weight:500;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s;
}
.nline.show{opacity:1;transform:none}
.nline.inga{color:var(--inga);font-style:italic}
.tapmore{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mistdim);text-align:center;margin-top:4px}

/* ---------- kort / oppgaver ---------- */
.card{
  background:linear-gradient(180deg,var(--cream),var(--paper));color:var(--ink);border:2px solid var(--ink);border-radius:16px;
  box-shadow:3px 3px 0 var(--shadow);padding:16px;margin-bottom:12px;
}
.card .eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:900;color:#8a6d1d;margin-bottom:6px}
.card p{font-size:16.5px;font-weight:700;line-height:1.5}
.card p + p{margin-top:8px}
.qtext{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;color:var(--cream);margin:6px 2px 14px;line-height:1.4}
.opt{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:linear-gradient(180deg,var(--cream),var(--paper));color:var(--ink);border:2px solid var(--ink);border-radius:14px;
  padding:13px 15px;margin-bottom:10px;font-family:'Nunito',sans-serif;font-weight:800;font-size:16.5px;
  box-shadow:3px 3px 0 var(--shadow);cursor:pointer;transition:transform .07s;line-height:1.35;min-height:48px;
}
.opt:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.55)}
.opt.sel{background:#fdeeb8;border-color:var(--ink)}
.opt.right{background:#dff2d8;border-color:#2f6b2f}
.opt.wrong{background:#f6d9d4;border-color:#9c3a2c;animation:shake .3s}
.opt svg{flex:0 0 auto}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.hintbox{
  background:rgba(36,54,47,.94);border:2px solid var(--line);border-radius:12px;padding:10px 12px;
  font-size:15px;font-weight:700;color:var(--eye);margin-bottom:10px;
}
.hintbox.explain{color:var(--cream)}
.demobox{
  border:2px dashed var(--mistdim);border-radius:12px;padding:8px 12px;margin-bottom:12px;
  font-size:13.5px;color:var(--mistdim);font-weight:700;
}
.demobox b{color:var(--mist)}
.taskin{
  width:100%;border-radius:14px;border:3px solid var(--ink);background:var(--cream);
  font-weight:900;font-size:22px;text-align:center;letter-spacing:.3em;color:var(--ink);
  padding:12px 4px;box-shadow:4px 4px 0 rgba(0,0,0,.55);margin-bottom:12px;
}
/* cloze */
.letter{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:16px;
  box-shadow:5px 5px 0 rgba(0,0,0,.55);padding:16px;margin-bottom:12px;
  font-family:'Cormorant Garamond',serif;font-size:19.5px;font-weight:600;line-height:1.75}
.blank{
  display:inline-flex;align-items:center;justify-content:center;min-width:72px;min-height:44px;text-align:center;border-bottom:3px solid var(--ink);
  font-family:'Nunito',sans-serif;font-weight:900;font-size:15px;color:#8a6d1d;
  padding:0 8px;margin:3px 2px;cursor:pointer;vertical-align:baseline;
}
.blank.filled{color:var(--ink)}
.blank.hot{background:#fdeeb8;border-radius:6px 6px 0 0}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{
  border:2px solid rgba(41,33,25,.96);background:linear-gradient(180deg,#ead898,var(--gold));color:var(--ink);border-radius:999px;
  font-family:'Nunito',sans-serif;font-weight:900;font-size:15px;padding:9px 15px;cursor:pointer;
  box-shadow:3px 3px 0 var(--shadow);
}
.chip.used{opacity:.28;pointer-events:none}
/* order */
.slotlist{margin-bottom:12px}
.slot{
  border:3px dashed var(--mistdim);border-radius:12px;min-height:44px;margin-bottom:8px;
  display:flex;align-items:center;gap:10px;padding:8px 12px;color:var(--mistdim);
  font-weight:800;font-size:15px;
}
.slot.filled{border-style:solid;border-color:var(--ink);background:var(--cream);color:var(--ink);
  box-shadow:3px 3px 0 rgba(0,0,0,.5);cursor:pointer}
.slot .num{font-family:'Cormorant Garamond',serif;font-weight:700;color:#8a6d1d;flex:0 0 auto}
/* fragment */
.fragwrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.frag{
  background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:18px;
  box-shadow:6px 6px 0 rgba(0,0,0,.6), 0 0 40px rgba(250,204,21,.25);
  padding:22px 18px;width:100%;
}
.frag .roman{font-family:'Cormorant Garamond',serif;letter-spacing:.2em;color:#8a6d1d;font-weight:700;font-size:14px}
.frag h2{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;margin:6px 0 8px;line-height:1.2}
.frag p{font-weight:700;font-size:16px;line-height:1.5}
.fraglabel{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:900;text-shadow:0 0 18px rgba(239,231,164,.16)}
/* finale / diplom */
.chest{
  font-family:'Cormorant Garamond',serif;font-size:44px;font-weight:700;letter-spacing:.24em;
  color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-radius:16px;
  box-shadow:6px 6px 0 rgba(0,0,0,.6);padding:14px 10px 14px calc(10px + .24em);text-align:center;margin:10px 0;
}
.diploma{
  background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:18px;
  box-shadow:6px 6px 0 rgba(0,0,0,.6);padding:22px 16px;text-align:center;margin-bottom:12px;
}
.diploma .dt{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.3em;color:#8a6d1d;font-weight:700}
.diploma h2{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;margin:6px 0}
.diploma p{font-weight:700;font-size:16px}
/* stasjonstopp */
.sthead{margin:2px 0 10px}
.sthead .roman{font-family:'Cormorant Garamond',serif;letter-spacing:.2em;color:var(--gold);font-weight:700;font-size:13px}
.sthead h2{font-family:'Cormorant Garamond',serif;color:var(--cream);font-size:26px;font-weight:600;line-height:1.15}
.steps{display:flex;gap:5px;margin-top:8px}
.sdot{height:4px;flex:1;border-radius:2px;background:var(--tarn2)}
.sdot.on{background:var(--gold)}
/* testpanel */
#testpanel{
  position:absolute;top:6px;left:6px;z-index:9;background:rgba(0,0,0,.75);border:1px solid var(--mistdim);
  border-radius:8px;padding:6px;font-size:10px;display:none;gap:4px;flex-wrap:wrap;max-width:170px;
}
#testpanel button{font-size:10px;padding:3px 6px;border-radius:6px;border:1px solid var(--mist);background:var(--tarn2);color:var(--mist);cursor:pointer}
.mini{font-size:13px;color:var(--mistdim);text-align:center;margin-top:8px}
.linklike{background:none;border:none;color:var(--mistdim);text-decoration:underline;font-family:'Nunito',sans-serif;font-size:13px;cursor:pointer}.mini a.linklike{display:inline-block}


/* v7: keep mobile footer safe without making the interface feel tiny */
.btn,.opt,.chip,.page{min-height:44px}
@media (max-width: 380px){
  body{font-size:16.5px}
  .landing-title{font-size:34px}
  .qtext{font-size:20px}
  .nline{font-size:22px}
  .opt{font-size:16px}
}

@supports not (height: 100dvh){
  #app{min-height:100vh}
}
@media (max-height: 660px){
  header{padding-top:10px;padding-bottom:6px}
  footer{padding-top:8px}
}

const QUESTS = { nb: QUEST_NB, nn: QUEST_NN, en: QUEST_EN, de: QUEST_DE };
let QUEST = QUEST_NB;

/* ============================================================
   MOTOR
   ============================================================ */
const $ = s => document.querySelector(s);
const main = $('#main'), footer = $('#footer');
const DEBUG_MODE = /[?&]test=1/.test(location.search);

function blankState(started=false, lang=CONFIG.DEFAULT_LANG){
  return { v:CONFIG.STATE_VERSION, started, lang, unlocked:[], done:[], cur:null, step:0 };
}
function load(){ try{ return JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY)); }catch(e){ return null; } }
function normalizeState(raw){
  const base = blankState(false, CONFIG.DEFAULT_LANG);
  if(!raw || typeof raw!=='object') return base;
  const ids = new Set(QUESTS.nb.stations.map(s=>s.id));
  const hasProgress = Array.isArray(raw.unlocked)&&raw.unlocked.length || Array.isArray(raw.done)&&raw.done.length || !!raw.cur;
  return {
    v:CONFIG.STATE_VERSION,
    started: Boolean(raw.started ?? hasProgress),
    lang: Object.keys(QUESTS).includes(raw.lang) ? raw.lang : CONFIG.DEFAULT_LANG,
    unlocked: Array.isArray(raw.unlocked) ? raw.unlocked.filter(id=>ids.has(id)) : [],
    done: Array.isArray(raw.done) ? raw.done.filter(id=>ids.has(id)) : [],
    cur: ids.has(raw.cur) ? raw.cur : null,
    step: Number.isInteger(raw.step) && raw.step>=0 ? raw.step : 0
  };
}
let state = normalizeState(load());
QUEST = QUESTS[state.lang] || QUESTS.nb;
function save(){ try{ localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function setLanguage(code){
  if(!QUESTS[code]) code = CONFIG.DEFAULT_LANG;
  state.lang = code;
  QUEST = QUESTS[state.lang] || QUESTS.nb;
  document.documentElement.lang = state.lang;
  save();
}
function station(id){ return QUEST.stations.find(s=>s.id===id); }
function stIndex(id){ return QUEST.stations.findIndex(s=>s.id===id); }
function esc(t){ const d=document.createElement('div'); d.textContent=t ?? ''; return d.innerHTML; }
function artAlt(img){
  if(!img || img.decorative) return '';
  if(typeof img.alt === 'string') return img.alt;
  return (img.alt && (img.alt[state.lang] || img.alt.nb)) || '';
}
function artImg(img, cls='artpanel', decorative=false){
  if(!img || !img.src) return '';
  const dec = decorative || img.decorative;
  const alt = dec ? '' : artAlt(img);
  return `<div class="${esc(cls)}" ${dec?'aria-hidden="true"':''}><img src="${esc(img.src)}" alt="${esc(alt)}" loading="lazy" decoding="async"></div>`;
}
function stationThumb(id){ return ART.thumbs && ART.thumbs[id] ? ART.thumbs[id] : null; }
function stepArt(st, step){
  if(!st || !step) return null;
  if(step.image) return step.image;
  if(st.id==='oya' && (step.nokkenq || (step.type==='mc' && step.correct===2))) return ART.steps.oya;
  if(st.id==='pesta' && step.type==='mc') return ART.steps.pesta;
  return null;
}

    "backToBook": "Zurück zum Erinnerungsbuch",
    "dateLocale": "de-DE"
  }
};
function tr(key){ return (UI[state.lang] && UI[state.lang][key]) || UI.nb[key] || key; }
function fmt(text, vars={}){ return String(text).replace(/\{(\w+)\}/g, (_,k)=> vars[k] ?? ''); }
function langFlag(code){ return (UI[code] || UI.nb).flag || ''; }
function currentLangName(){ return (UI[state.lang] || UI.nb).langName; }
function currentLangLabelHtml(){ return `<span class="flag" aria-hidden="true">${esc(langFlag(state.lang))}</span><span>${esc(currentLangName())}</span>`; }
function updateChrome(){
  document.documentElement.lang = state.lang;
  document.title = tr('documentTitle');
  const title = document.querySelector('header h1'); if(title) title.textContent = tr('gameTitle');
  const sub = document.querySelector('header .sub'); if(sub) sub.textContent = tr('siteTitle');
}
function focusFirst(){
  requestAnimationFrame(()=>{
    const target = main.querySelector('[data-autofocus], .landing-title, .homelead, .qtext, .sthead h2, .card');
    if(target){ target.setAttribute('tabindex','-1'); target.focus({preventScroll:true}); }
  });
}

function renderProgress(){
  const p = $('#progress'); if(!p) return;
  p.innerHTML='';
  QUEST.stations.forEach(s=>{
    const d=document.createElement('div');
    d.className='pdot'+(state.done.includes(s.id)?' done':'')+(s.id==='finale'?' finale':'');
    p.appendChild(d);
  });
  const pt=$('#progressText');
  if(pt){
    const doneCount=state.done.filter(id=>id!=='finale').length;
    pt.textContent = doneCount>=6 ? tr('progressFinale') : fmt(tr('progressCount'), {count:doneCount});
  }
}


/* ---------- FORSIDE / SPRÅK ---------- */
function showLanding(){
  state.cur=null; state.step=0; save(); updateChrome();
  renderProgress();
  $('#eyes').classList.remove('calm');
  main.innerHTML = `<section class="screen active landing" id="landing" lang="${state.lang}">
    <div class="landing-card">
      <div class="intro-hero has-image" style="--hero-img:url('media/nokken-hero.jpg')" aria-hidden="true"></div>
      <div class="landing-kicker">${esc(tr('kicker'))}</div>
      <h2 class="landing-title" data-autofocus>${esc(tr('welcome'))}</h2>
      <p class="landing-copy">${esc(tr('intro'))}</p>
      <div class="landing-actions">
        <button type="button" class="btn" id="startGame">${esc(tr('start'))}</button>
      </div>
    </div>
    <div class="lang-row"><button type="button" class="lang-pill" id="chooseLang" aria-label="${esc(tr('chooseLanguage'))}"><span aria-hidden="true">☾</span> <span>${esc(tr('language'))}:</span> ${currentLangLabelHtml()}</button></div>
    <p class="statusline">${esc(tr('langNote'))}</p>
  </section>`;
  footer.innerHTML='';
  $('#startGame').onclick = ()=>{ state.started=true; save(); showHome(); };
  $('#chooseLang').onclick = ()=>showLanguage('landing');
  main.scrollTop=0; focusFirst();
}

function showLanguage(returnTo='landing'){
  updateChrome();
  const options = Object.keys(QUESTS).map(code=>`<button type="button" class="lang-option" data-lang="${code}" lang="${code}" aria-current="${state.lang===code?'true':'false'}">
    <span class="flag" aria-hidden="true">${esc(UI[code].flag)}</span><span><strong>${esc(UI[code].langName)}</strong><small>${esc(UI[code].nativeName || UI[code].welcome)}</small></span>
  </button>`).join('');
  main.innerHTML = `<section class="screen active landing" id="language" lang="${state.lang}">
    <div class="landing-card">
      <div class="landing-kicker">${esc(tr('language'))}</div>
      <h2 class="landing-title" data-autofocus>${esc(tr('chooseLanguage'))}</h2>
      <div class="language-list">${options}</div>
    </div>
  </section>`;
  footer.innerHTML=`<button type="button" class="btn ghost" id="backLang">${esc(tr('back'))}</button>`;
  function goBack(){ returnTo==='home' && state.started ? showHome() : showLanding(); }
  main.querySelectorAll('.lang-option').forEach(btn=>{
    btn.onclick=()=>{ setLanguage(btn.dataset.lang); updateChrome(); goBack(); };
  });
  $('#backLang').onclick=goBack;
  main.scrollTop=0; focusFirst();
}

/* ---------- HJEM ---------- */
function showHome(msg){
  state.started=true; state.cur=null; state.step=0; save(); updateChrome();
  renderProgress();
  $('#eyes').classList.remove('calm');
  const doneCount = state.done.filter(id=>id!=='finale').length;
  const finaleReady = doneCount>=6;
  let pages='';
  QUEST.stations.forEach(s=>{
    const done=state.done.includes(s.id);
    const open=done || state.unlocked.includes(s.id) || (s.id==='finale'&&finaleReady);
    const cls='page'+(open?' open':' locked')+(done?' done':'')+(s.id==='finale'?' finale':'');
    const title = open ? s.title : (s.id==='finale' ? s.title : tr('lockedFindCode'));
    const aria = open ? fmt(tr('memoryAria'), {roman:s.roman, title}) : fmt(tr('lockedMemoryAria'), {roman:s.roman});
    const thumb = done && stationThumb(s.id) ? `<span class="page-thumb" aria-hidden="true"><img src="${esc(stationThumb(s.id))}" alt="" loading="lazy" decoding="async"></span>` : '';
    pages+=`<button type="button" class="${cls}" data-st="${s.id}" ${open?'':'disabled'} aria-label="${esc(aria)}">
      ${thumb}<div class="roman">${esc(tr('memory'))} ${s.roman}</div><div class="ptitle">${esc(title)}</div></button>`;
  });
  main.innerHTML = `<section class="screen active" id="home">
    <p class="homelead" data-autofocus>${doneCount===0
      ? tr('homeLeadStart')
      : (finaleReady ? tr('homeLeadFinale') : fmt(tr('homeLeadProgress'), {count:doneCount}))}</p>
    <div class="book">${pages}</div>
    <div class="coderow">
      <input id="code" class="codein" maxlength="3" placeholder="${esc(tr('codePlaceholder'))}" autocomplete="off" autocapitalize="characters" aria-label="${esc(tr('codeAria'))}">
      <button type="button" class="btn" id="unlock">${esc(tr('unlock'))}</button>
    </div>
    <div class="codemsg" id="codemsg" aria-live="polite" role="status">${msg?esc(msg):''}</div>
    <div class="mini"><button type="button" class="linklike" id="changeLang">${esc(tr('language'))}: ${esc(langFlag(state.lang))} ${esc(currentLangName())}</button> · <button type="button" class="linklike" id="reset">${esc(tr('reset'))}</button> · <a class="linklike" href="mailto:kontakt@lrnify.no">${esc(tr('questions'))}</a></div>
  </section>`;
  footer.innerHTML='';
  $('#unlock').onclick = tryCode;
  $('#code').addEventListener('keydown',e=>{ if(e.key==='Enter') tryCode(); });
  $('#changeLang').onclick = ()=>showLanguage('home');
  $('#reset').onclick = ()=>{ if(confirm(tr('resetConfirm'))){ const keepLang=state.lang; state=blankState(false,keepLang); setLanguage(keepLang); showLanding(); } };
  main.querySelectorAll('.page.open').forEach(el=>{
    el.onclick = ()=> openStation(el.dataset.st);
  });
  main.scrollTop=0; focusFirst();
}

function tryCode(){
  const v = ($('#code').value||'').trim().toUpperCase();
  const st = QUEST.stations.find(s=>s.code===v);
  if(!st){ $('#codemsg').textContent=tr('unknownCode'); return; }
  if(!state.unlocked.includes(st.id)) state.unlocked.push(st.id);
  save(); openStation(st.id);
}

/* ---------- STASJON ---------- */
function openStation(id){
  const st=station(id); if(!st) return;
  if(id==='finale' && state.done.filter(x=>x!=='finale').length<6){ showHome(tr('finaleLocked')); return; }
  if(state.done.includes(id)){ showHome(); return; }
  const prev=state.cur;
  state.cur=id;
  if(prev!==id) state.step=0; // nytt rom starter alltid fra begynnelsen
  if(!Number.isInteger(state.step) || state.step<0 || state.step>=st.steps.length) state.step=0;
  save(); renderStep();
}

let stepCtx = null; // per-steg tilstand (feiltelling, valg, osv.)

function renderStep(){
  updateChrome();
  const st=station(state.cur); const step=st.steps[state.step];
  stepCtx = { wrong:0, sel:new Set(), seq:[], blanks:[] };
  renderProgress();
  $('#eyes').classList.toggle('calm', !!step.inga);
  const dots = st.steps.map((_,i)=>`<div class="sdot${i<=state.step?' on':''}" aria-hidden="true"></div>`).join('');
  const head = `<div class="sthead"><div class="roman">${esc(tr('memory'))} ${st.roman}</div><h2 data-autofocus>${esc(st.title)}</h2><div class="steps" aria-hidden="true">${dots}</div></div>`;
  const R = { nokken:rNokken, cards:rCards, mc:rMC, input:rInput, choice:rChoice, cloze:rCloze, multiselect:rMulti, order:rOrder, fragment:rFragment, chest:rChest };
  main.innerHTML = `<section class="screen active">${step.type==='fragment'||step.type==='chest'?'':head}<div id="stepbody" style="display:flex;flex-direction:column;flex:1"></div></section>`;
  R[step.type](step, st);
  main.scrollTop=0; focusFirst();
}

function next(){
  const st=station(state.cur);
  state.step++;
  if(state.step>=st.steps.length){ completeStation(st); } else { save(); renderStep(); }
}
function completeStation(st){
  if(!state.done.includes(st.id)) state.done.push(st.id);
  state.cur=null; state.step=0; save();
  showHome();
}
function setFooter(label, fn, disabled){
  footer.innerHTML=`<button type="button" class="btn" id="fbtn"${disabled?' disabled aria-disabled="true"':''}>${esc(label)}</button>`;
  if(!disabled) $('#fbtn').onclick=fn;
}

/* ---------- steg: Nøkken taler ---------- */
function rNokken(step){
  const body=$('#stepbody');
  body.innerHTML = `<div class="speech" id="speech">${
    step.lines.map(l=>`<div class="nline${step.inga?' inga':''}">${esc(l)}</div>`).join('')
  }<div class="tapmore" id="tapmore">${esc(tr('tapShowFull'))}</div></div>`;
  const lines=[...body.querySelectorAll('.nline')];
  let shown=0;
  let timer=null;
  function updateFooter(){
    setFooter(shown<lines.length?tr('showFullText'):tr('continue'), ()=>{
      if(shown<lines.length){ clearInterval(timer); showAll(); }
      else next();
    });
  }
  function reveal(){
    if(shown<lines.length){
      lines[shown].classList.add('show'); shown++;
      if(shown===lines.length){ clearInterval(timer); $('#tapmore').textContent=tr('tapContinue'); }
      updateFooter();
    }
  }
  function showAll(){ while(shown<lines.length) reveal(); updateFooter(); }
  timer=setInterval(()=>{ reveal(); if(shown>=lines.length) clearInterval(timer); }, CONFIG.TYPE_DELAY);
  reveal(); updateFooter();
  $('#speech').onclick=()=>{ if(shown<lines.length){ clearInterval(timer); showAll(); } };
  stepCtx.auto=()=>{ clearInterval(timer); next(); };
}

/* ---------- steg: forståelseskort ---------- */
function rCards(step){
  const body=$('#stepbody'); let i=0;
  function draw(){
    const [eb,txt]=step.cards[i];
    body.innerHTML=`<div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <div class="card"><div class="eyebrow">${esc(eb)} · ${i+1}/${step.cards.length}</div><p>${esc(txt)}</p></div></div>`;
    setFooter(i<step.cards.length-1?tr('next'):tr('understand'), ()=>{ i++; if(i>=step.cards.length) next(); else draw(); });
  }
  draw();
  stepCtx.auto=()=>{ i=step.cards.length-1; next(); };
}

/* ---------- felles feil-håndtering ---------- */
function feedbackWrong(step, boxSel){
  stepCtx.wrong++;
  const box=$(boxSel);
  if(stepCtx.wrong>=CONFIG.MAX_WRONG){
    box.innerHTML=`<div class="hintbox explain">${esc(step.explain||step.hints[step.hints.length-1])}</div>`;
    return 'resolve';
  }
  const h=step.hints[Math.min(stepCtx.wrong-1, step.hints.length-1)];
  box.innerHTML=`<div class="hintbox">${esc(tr('nokkenName'))}: «${esc(h)}»</div>`;
  return 'retry';
}

/* ---------- steg: flervalg ---------- */
function rMC(step){
  const body=$('#stepbody');
  const opts = step.options.map((o,i)=>{
    const inner = step.sil ? SIL[o]+`<span>${esc(tr('silhouette'))} ${'ABC'[i]}</span>` : esc(o);
    return `<button class="opt" data-i="${i}">${inner}</button>`;
  }).join('');
  const img = stepArt(station(state.cur), step);
  body.innerHTML=`${step.jakt&&CONFIG.DEMO?`<div class="demobox"><b>${esc(tr('prototype'))}:</b> ${esc(step.demo)}</div>`:''}
    ${img ? artImg(img, `artpanel ${img.cls || 'quest'}`, false) : ''}
    <p class="qtext">${step.nokkenq?esc(tr('nokkenWhispers')):''}${esc(step.q)}</p>
    <div id="hint" aria-live="polite" role="status"></div><div id="opts">${opts}</div><div id="after"></div>`;
  footer.innerHTML='';
  let locked=false;
  body.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick=()=>{
      if(locked) return;
      const i=+btn.dataset.i;
      if(i===step.correct){ resolve(btn); }
      else{
        btn.classList.add('wrong'); setTimeout(()=>btn.classList.remove('wrong'),400);
        if(feedbackWrong(step,'#hint')==='resolve'){
          const rb=body.querySelector(`.opt[data-i="${step.correct}"]`); resolve(rb,true);
        }
      }
    };
  });
  function resolve(btn, auto){
    locked=true; btn.classList.add('right');
    if(!auto && step.explain) $('#hint').innerHTML=`<div class="hintbox explain">${esc(step.explain)}</div>`;
    if(step.aftercorrect) $('#after').innerHTML=`<p class="qtext" style="margin-top:12px">«${esc(step.aftercorrect)}»</p>`;
    setFooter(tr('continue'), next);
  }
  stepCtx.auto=()=>{ body.querySelector(`.opt[data-i="${step.correct}"]`).click(); setTimeout(next,20); };
  stepCtx.autoWrong=()=>{ const w=(step.correct+1)%step.options.length; body.querySelector(`.opt[data-i="${w}"]`).click(); };
}

/* ---------- steg: kode-input ---------- */
function rInput(step){
  const body=$('#stepbody');
  body.innerHTML=`${step.jakt&&CONFIG.DEMO?`<div class="demobox"><b>${esc(tr('prototype'))}:</b> ${esc(step.demo)}</div>`:''}
    <p class="qtext">${esc(step.q)}</p><div id="hint" aria-live="polite" role="status"></div>
    <input class="taskin" id="tin" maxlength="${step.maxlen}" inputmode="${step.inputmode||'text'}" autocomplete="off" aria-label="Svar">`;
  setFooter(tr('answer'), check);
  $('#tin').addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
  function check(){
    const v=($('#tin').value||'').trim().toUpperCase();
    if(v===step.answer.toUpperCase()){
      $('#hint').innerHTML=`<div class="hintbox explain">${esc(step.explain)}</div>`;
      $('#tin').style.borderColor='#2f6b2f'; setFooter(tr('continue'), next);
    } else {
      $('#tin').classList.add('wrong'); setTimeout(()=>$('#tin').classList.remove('wrong'),400);
      if(feedbackWrong(step,'#hint')==='resolve'){ $('#tin').value=step.answer; setFooter(tr('continue'), next); }
    }
  }
  stepCtx.auto=()=>{ $('#tin').value=step.answer; next(); };
  stepCtx.autoWrong=()=>{ $('#tin').value='0000'; check(); };
}

/* ---------- steg: valg med konsekvens ---------- */
function rChoice(step){
  const body=$('#stepbody');
  body.innerHTML=`<p class="qtext">${esc(step.q)}</p>
    <div id="opts">${step.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
    <div id="cons"></div>`;
  footer.innerHTML='';
  let picked=false;
  body.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick=()=>{
      if(picked) return; picked=true; btn.classList.add('sel');
      $('#cons').innerHTML=`<div class="card"><div class="eyebrow">${esc(tr('actualHappened'))}</div><p>${esc(step.consequence)}</p></div>`;
      setFooter(tr('continue'), next);
    };
  });
  stepCtx.auto=()=>{ body.querySelector('.opt').click(); setTimeout(next,20); };
}

/* ---------- steg: brevrekonstruksjon (cloze) ---------- */
function rCloze(step){
  const body=$('#stepbody');
  const html = step.text.map(part => typeof part==='number'
    ? `<span class="blank" data-b="${part}" role="button" tabindex="0" aria-label="${esc(fmt(tr('blankAria'), {num:part+1}))}">______</span>` : esc(part)).join('');
  body.innerHTML=`${step.jakt&&CONFIG.DEMO?`<div class="demobox"><b>${esc(tr('prototype'))}:</b> ${esc(step.demo)}</div>`:''}
    <p class="qtext" style="font-size:18px">${esc(step.intro)}</p><div id="hint" aria-live="polite" role="status"></div>
    <div class="letter" id="letter">${html}</div>
    <div class="bank" id="bank">${step.bank.map((w,i)=>`<button class="chip" data-w="${esc(w)}" data-c="${i}">${esc(w)}</button>`).join('')}</div>`;
  const blanks=[...body.querySelectorAll('.blank')];
  const fill = {};
  function firstEmpty(){ return blanks.find(b=>!fill.hasOwnProperty(b.dataset.b)); }
  function paint(){
    blanks.forEach(b=>{
      const has=fill.hasOwnProperty(b.dataset.b);
      b.classList.toggle('filled',has);
      b.classList.toggle('hot', b===firstEmpty());
      b.textContent = has ? fill[b.dataset.b].w : '______';
    });
    body.querySelectorAll('.chip').forEach(c=>{
      const used=Object.values(fill).some(f=>f.c===c.dataset.c);
      c.classList.toggle('used',used);
    });
    const complete = blanks.every(b=>fill.hasOwnProperty(b.dataset.b));
    setFooter(tr('checkLetter'), check, !complete);
  }
  body.querySelectorAll('.chip').forEach(c=>{
    c.onclick=()=>{ const t=firstEmpty(); if(!t) return; fill[t.dataset.b]={w:c.dataset.w,c:c.dataset.c}; paint(); };
  });
  blanks.forEach(b=>{
    const clear=()=>{ if(fill.hasOwnProperty(b.dataset.b)){ delete fill[b.dataset.b]; paint(); } };
    b.onclick=clear; b.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); clear(); } };
  });
  function check(){
    const ok = blanks.every(b=> fill[b.dataset.b] && fill[b.dataset.b].w===step.answers[+b.dataset.b]);
    if(ok){ $('#hint').innerHTML=`<div class="hintbox explain">${esc(tr('letterComplete'))}</div>`; setFooter(tr('continue'), next); }
    else{
      blanks.forEach(b=>{ if(fill[b.dataset.b] && fill[b.dataset.b].w!==step.answers[+b.dataset.b]){ delete fill[b.dataset.b]; } });
      paint();
      if(feedbackWrong(step,'#hint')==='resolve'){
        blanks.forEach(b=>{ const w=step.answers[+b.dataset.b]; fill[b.dataset.b]={w, c:String(step.bank.indexOf(w))}; });
        paint(); setFooter(tr('continue'), next);
      }
    }
  }
  paint();
  stepCtx.auto=()=>{ blanks.forEach(b=>{ const w=step.answers[+b.dataset.b]; fill[b.dataset.b]={w,c:String(step.bank.indexOf(w))}; }); next(); };
  stepCtx.autoWrong=()=>{ blanks.forEach(b=>{ fill[b.dataset.b]={w:step.bank[4],c:'4'}; }); check(); };
}

/* ---------- steg: velg flere ---------- */
function rMulti(step){
  const body=$('#stepbody');
  body.innerHTML=`<p class="qtext">${esc(step.q)}</p><div id="hint" aria-live="polite" role="status"></div>
    <div id="opts">${step.options.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false">${esc(o)}</button>`).join('')}</div>`;
  function paint(){
    body.querySelectorAll('.opt').forEach(b=>{
      const on=stepCtx.sel.has(+b.dataset.i);
      b.classList.toggle('sel',on); b.setAttribute('aria-pressed',on);
    });
    setFooter(fmt(tr('selectAnswer'), {selected:stepCtx.sel.size, total:step.pick}), check, stepCtx.sel.size!==step.pick);
  }
  body.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{ const i=+b.dataset.i;
      if(stepCtx.sel.has(i)) stepCtx.sel.delete(i);
      else if(stepCtx.sel.size<step.pick) stepCtx.sel.add(i);
      paint(); };
  });
  function check(){
    const ok = step.correct.every(i=>stepCtx.sel.has(i)) && stepCtx.sel.size===step.correct.length;
    if(ok){
      $('#hint').innerHTML=`<div class="hintbox explain">${esc(step.explain)}</div>`;
      step.correct.forEach(i=>body.querySelector(`.opt[data-i="${i}"]`).classList.add('right'));
      setFooter(tr('continue'), next);
    } else {
      [...stepCtx.sel].forEach(i=>{ if(!step.correct.includes(i)){ const b=body.querySelector(`.opt[data-i="${i}"]`); b.classList.add('wrong'); setTimeout(()=>b.classList.remove('wrong'),400); stepCtx.sel.delete(i); } });
      paint();
      if(feedbackWrong(step,'#hint')==='resolve'){
        stepCtx.sel=new Set(step.correct); paint();
        step.correct.forEach(i=>body.querySelector(`.opt[data-i="${i}"]`).classList.add('right'));
        setFooter(tr('continue'), next);
      }
    }
  }
  paint();
  stepCtx.auto=()=>{ stepCtx.sel=new Set(step.correct); next(); };
  stepCtx.autoWrong=()=>{ stepCtx.sel=new Set([1,4,0]); check(); };
}

/* ---------- steg: rekkefølge ---------- */
function rOrder(step){
  const body=$('#stepbody');
  const order=[...step.items.keys()];
  // deterministisk stokking (annenhver fra midten) så det aldri starter riktig
  const shuffled=[2,5,0,4,1,3].filter(i=>i<order.length);
  body.innerHTML=`<p class="qtext">${esc(step.q)}</p><div id="hint" aria-live="polite" role="status"></div>
    <div class="slotlist" id="slots">${step.items.map((_,i)=>`<div class="slot" data-s="${i}"><span class="num">${i+1}.</span><span class="lbl">${esc(tr('slotEmpty'))}</span></div>`).join('')}</div>
    <div class="bank" id="pool">${shuffled.map(i=>`<button class="chip" data-i="${i}">${esc(step.items[i])}</button>`).join('')}</div>`;
  function paint(){
    body.querySelectorAll('.slot').forEach((s,idx)=>{
      const v=stepCtx.seq[idx];
      s.classList.toggle('filled', v!==undefined);
      s.querySelector('.lbl').textContent = v!==undefined ? step.items[v] : tr('slotEmpty');
    });
    body.querySelectorAll('#pool .chip').forEach(c=>c.classList.toggle('used', stepCtx.seq.includes(+c.dataset.i)));
    setFooter(tr('showNokken'), check, stepCtx.seq.length!==step.items.length);
  }
  body.querySelectorAll('#pool .chip').forEach(c=>{
    c.onclick=()=>{ if(stepCtx.seq.length<step.items.length && !stepCtx.seq.includes(+c.dataset.i)){ stepCtx.seq.push(+c.dataset.i); paint(); } };
  });
  body.querySelectorAll('.slot').forEach((s,idx)=>{
    s.onclick=()=>{ if(stepCtx.seq[idx]!==undefined){ stepCtx.seq.splice(idx,1); paint(); } };
  });
  function check(){
    const ok = stepCtx.seq.every((v,i)=>v===i);
    if(ok){ $('#hint').innerHTML=`<div class="hintbox explain">${esc(tr('nokkenName'))}: «...${state.lang==='en'?'you remember. You remember everything.':'du husker. Du husker alt.'}»</div>`; setFooter(tr('continue'), next); }
    else{
      stepCtx.seq=stepCtx.seq.filter((v,i)=>v===i && stepCtx.seq.slice(0,i).every((x,j)=>x===j));
      // behold bare korrekt prefiks
      let keep=[]; for(let i=0;i<step.items.length;i++){ if(stepCtx.seq[i]===i) keep.push(i); else break; } stepCtx.seq=keep;
      paint();
      if(feedbackWrong(step,'#hint')==='resolve'){ stepCtx.seq=[...step.items.keys()]; paint(); setFooter(tr('continue'), next); }
    }
  }
  paint();
  stepCtx.auto=()=>{ stepCtx.seq=[...step.items.keys()]; next(); };
  stepCtx.autoWrong=()=>{ stepCtx.seq=[...step.items.keys()].reverse(); check(); };
}

/* ---------- steg: fragment ---------- */
function rFragment(step, st){
  const body=$('#stepbody');
  const img = step.image || ART.fragments[st.id];
  body.innerHTML=`<div class="fragwrap">
    <div class="fraglabel">${esc(fmt(tr('restored'), {roman:st.roman}))}</div>
    <div class="frag">${img ? artImg(img, 'frag-img', false) : ''}<div class="roman">✦</div><h2>${esc(step.h)}</h2><p>${esc(step.p)}</p></div>
  </div>`;
  setFooter(tr('addToBook'), next);
  stepCtx.auto=next;
}

/* ---------- steg: kiste + diplom ---------- */
function rChest(){
  const body=$('#stepbody');
  const d=new Date(); const ds=d.toLocaleDateString(tr('dateLocale'),{day:'numeric',month:'long',year:'numeric'});
  body.innerHTML=`<div style="flex:1;display:flex;flex-direction:column;justify-content:center">
    <p class="qtext" style="text-align:center">${esc(tr('chestText'))}</p>
    <div class="chest" id="chestcode">${CONFIG.CHEST_CODE}</div>
    <div class="diploma">
      ${artImg({src:'media/nokken-eyes.jpg', decorative:true}, 'diploma-mark', true)}
      <div class="dt">Kittelsen-huset · ${esc(ds)}</div>
      <h2>${esc(tr('guardianTitle'))}</h2>
      <p>${esc(tr('guardianText'))}</p>
    </div>
  </div>`;
  setFooter(tr('backToBook'), next);
  stepCtx.auto=next;
}

/* ---------- testpanel + hook ---------- */
function initTestPanel(){
  if(!DEBUG_MODE) return;
  const p=$('#testpanel'); p.style.display='flex';
  QUEST.stations.forEach(s=>{
    const b=document.createElement('button');
    b.textContent=(s.code||'FIN')+' '+s.roman;
    b.onclick=()=>{ if(s.code&&!state.unlocked.includes(s.id)) state.unlocked.push(s.id); save(); openStation(s.id); };
    p.appendChild(b);
  });
  const all=document.createElement('button'); all.textContent='fullfør 6';
  all.onclick=()=>{ QUEST.stations.filter(s=>s.code).forEach(s=>{ if(!state.done.includes(s.id)) state.done.push(s.id); }); save(); showHome(); };
  p.appendChild(all);
}

if(DEBUG_MODE){
window.__game = {

  state: ()=>JSON.parse(JSON.stringify(state)),
  open: code=>{ const st=QUEST.stations.find(s=>s.code===code)||station(code); if(!st) return false;
    if(st.code&&!state.unlocked.includes(st.id)) state.unlocked.push(st.id); save(); openStation(st.id); return true; },
  auto: ()=>{ if(state.cur===null) return false; if(stepCtx&&stepCtx.auto){ stepCtx.auto(); return true; } return false; },
  autoWrong: ()=>{ if(stepCtx&&stepCtx.autoWrong){ stepCtx.autoWrong(); return true; } return false; },
  hintVisible: ()=>{ const h=$('#hint'); return !!(h&&h.querySelector('.hintbox')); },
  reset: ()=>{ state=blankState(false,state.lang); save(); showLanding(); },
  home: ()=>showHome()

};
}

/* ---------- oppstart ---------- */
initTestPanel();
if(!state.started){
  showLanding();
} else if(state.cur && station(state.cur) && !state.done.includes(state.cur)){
  openStation(state.cur); // gjenoppta midt i et rom
} else {
  showHome();
}
</script>
