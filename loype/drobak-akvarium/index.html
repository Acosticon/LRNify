<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akvarieløypa — Drøbak Akvarium</title>
<link rel="stylesheet" href="loype.css">
</head>
<body>
<div id="loype-topp" class="ramme"></div>
<main class="ramme">
  <div class="kort kort--sea senter">
    <h1>🐠 Akvarieløypa</h1>
    <p>Velkommen til Drøbak Akvarium!</p>
  </div>

  <div class="kort" id="reg-kort">
    <h2>Slik gjør dere:</h2>
    <p>1️⃣ Finn de <strong>5 QR-kodene</strong> rundt i akvariet<br>
       2️⃣ Scan koden og løs oppgaven sammen<br>
       3️⃣ Samle poeng — kanskje dere havner på ukas toppliste? 🏆</p>
    <div class="mellomrom"></div>
    <label for="lagnavn"><strong>Hva heter laget deres?</strong></label>
    <input type="text" id="lagnavn" maxlength="40" placeholder="F.eks. Familien Blekksprut"
           autocomplete="off" enterkeyhint="go">
    <button class="knapp" id="start-knapp">Start løypa! 🚀</button>
    <p class="liten senter" id="feil-melding" role="alert" style="color:#b91c1c; display:none; margin-top:8px;">
      Skriv inn et lagnavn først! 😊</p>
  </div>

  <div class="kort senter" id="fortsett-kort" style="display:none;">
    <h2 id="fortsett-tittel"></h2>
    <div class="mellomrom"></div>
    <a class="knapp" id="fortsett-knapp" href="#">Fortsett løypa 🔍</a>
    <div class="mellomrom"></div>
    <button class="knapp knapp--sek" id="nytt-lag-knapp">Start på nytt med nytt lag</button>
  </div>
</main>

<script src="config.js"></script>
<script src="loype-core.js"></script>
<script>
  const state = Loype.hentState();
  const neste = new URLSearchParams(location.search).get("neste");

  if (state && state.lag) {
    // Allerede registrert: vis fortsett-valg i stedet for skjema
    document.getElementById("reg-kort").style.display = "none";
    const kort = document.getElementById("fortsett-kort");
    kort.style.display = "block";
    document.getElementById("fortsett-tittel").textContent =
      `Hei igjen, ${state.lag}! Dere har ${Loype.antallFullfort()} av ${LOYPE_CONFIG.poster.length} poster.`;
    const knapp = document.getElementById("fortsett-knapp");
    if (Loype.antallFullfort() >= LOYPE_CONFIG.poster.length) {
      knapp.href = "ferdig.html";
      knapp.textContent = "Se resultatet deres 🏆";
    } else {
      knapp.href = neste || LOYPE_CONFIG.poster.find(p => !state.poster[p.id]).url;
    }
    document.getElementById("nytt-lag-knapp").addEventListener("click", () => {
      if (confirm("Sikker? Da slettes poengene til laget deres.")) {
        Loype.nullstill();
        location.reload();
      }
    });
  }

  document.getElementById("start-knapp").addEventListener("click", startLag);
  document.getElementById("lagnavn").addEventListener("keydown", e => {
    if (e.key === "Enter") startLag();
  });

  function startLag() {
    const navn = document.getElementById("lagnavn").value.trim();
    if (!navn) {
      document.getElementById("feil-melding").style.display = "block";
      return;
    }
    Loype.registrer(navn);
    // Kom brukeren hit fra en scannet post? Send dem tilbake dit.
    location.href = neste || LOYPE_CONFIG.poster[0].url;
  }

  Loype.tegnTopp(null);
</script>
</body>
</html>
