<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fjordvokterne — Drøbak Akvarium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<!-- Firebase (compat) — brukes bare hvis CONFIG.FIREBASE er satt -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --cream:#fff9f0; --ink:#2b2118; --yellow:#facc15;
  --sea:#7dd3fc; --sea-deep:#0369a1; --sea-pale:#e6f6ff;
  --green:#4ade80; --red:#f87171; --sand:#fdf3d7;
  --border:3px solid var(--ink); --shadow:4px 4px 0 var(--ink);
}
html{-webkit-text-size-adjust:100%}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Nunito',sans-serif;background:var(--cream);color:var(--ink);
  font-size:19px;line-height:1.5;min-height:100vh;min-height:100dvh;
}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:100dvh;
  padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
          calc(32px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}

/* Bølgetopp */
.bolge{width:100%;height:26px;flex:0 0 auto;
  background:radial-gradient(circle at 12px -6px, transparent 14px, var(--sea) 15px, var(--sea) 17px, transparent 18px);
  background-size:34px 26px;margin-bottom:6px}

h1,h2,.display{font-family:'Chewy',cursive;font-weight:400;letter-spacing:.5px}
h1{font-size:2.1rem}h2{font-size:1.45rem}

.kort{background:#fff;border:var(--border);border-radius:16px;box-shadow:var(--shadow);
  padding:18px;margin-bottom:14px}
.kort--sea{background:var(--sea-pale)}
.kort--sand{background:var(--sand)}
.senter{text-align:center}.liten{font-size:.95rem;opacity:.78}.mellomrom{height:10px}

.knapp{display:block;width:100%;font-family:'Nunito',sans-serif;font-size:1.15rem;font-weight:800;
  padding:14px 18px;min-height:54px;background:var(--yellow);border:var(--border);border-radius:14px;
  box-shadow:var(--shadow);cursor:pointer;color:var(--ink);text-align:center;text-decoration:none;
  transition:transform .08s ease,box-shadow .08s ease}
.knapp:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.knapp--sek{background:#fff}
.knapp--valg{background:var(--sea-pale);margin-bottom:10px;text-align:left}
.knapp:disabled{opacity:.45;cursor:default}
.knapp.riktig{background:var(--green)}.knapp.feil{background:var(--red)}
.knapp:focus-visible,input:focus-visible,.brikke:focus-visible,.side:focus-visible{outline:4px solid var(--sea-deep);outline-offset:2px}

input[type="text"]{width:100%;font-family:'Nunito',sans-serif;font-size:1.15rem;font-weight:800;
  padding:13px 15px;border:var(--border);border-radius:14px;background:#fff}

/* Fjordboka: sideliste */
.side{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  border:var(--border);border-radius:14px;background:#fff;box-shadow:var(--shadow);
  padding:14px;margin-bottom:12px;font-weight:800;font-size:1.08rem;cursor:pointer;
  font-family:'Nunito',sans-serif;color:var(--ink)}
.side .ikon{font-size:1.9rem;width:44px;text-align:center;flex:0 0 auto}
.side .tekst{flex:1}
.side .status{font-size:.92rem;font-weight:700;opacity:.75;display:block}
.side.laast{background:var(--sand);box-shadow:2px 2px 0 var(--ink);opacity:.92}
.side.ferdig{background:var(--green)}
.side.finale-klar{background:var(--yellow);animation:pulsA 1.6s ease-in-out infinite}
@keyframes pulsA{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}

/* Kodefelt */
.koderad{display:flex;gap:10px}
.koderad input{flex:1;text-transform:uppercase;letter-spacing:.35em;text-align:center;font-size:1.3rem}
.koderad .knapp{width:auto;flex:0 0 auto;padding:10px 18px}
.kodemsg{min-height:22px;font-weight:800;text-align:center;margin-top:8px;color:#b91c1c}

/* Bjørg og dyrene snakker */
.bjorg{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.bjorg .fjes{flex:0 0 auto;width:52px;height:52px;border:var(--border);border-radius:50%;
  background:var(--sea-pale);display:grid;place-items:center;font-size:1.7rem;box-shadow:2px 2px 0 var(--ink)}
.boble{flex:1;background:#fff;border:var(--border);border-radius:14px;border-top-left-radius:4px;
  box-shadow:var(--shadow);padding:12px 14px;font-weight:700}
.boble .hvem{font-family:'Chewy',cursive;color:var(--sea-deep);display:block;margin-bottom:2px;font-size:1.1rem}
.bjorg.dyr .fjes{background:var(--sand)}

/* Stasjonsbilde — vises kun hvis bildet finnes og lastes */
.hero{display:none;border:var(--border);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);margin-bottom:14px}
.hero.harbilde{display:block}
.hero img{display:block;width:100%;height:190px;object-fit:cover}

/* Oppgaver */
.rutenett{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pool{display:flex;flex-direction:column;gap:8px}
.brikke{border:var(--border);border-radius:14px;background:#fff;box-shadow:var(--shadow);
  padding:14px 10px;min-height:72px;font-weight:800;font-size:1.05rem;font-family:'Nunito',sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;text-align:center;color:var(--ink);transition:transform .08s ease}
.pool .brikke{min-height:56px;padding:12px 14px}
@media (max-width:380px){.rutenett{grid-template-columns:1fr}.brikke{min-height:56px}}
.brikke:active{transform:scale(.96)}
.brikke.valgt{background:var(--sea);transform:scale(1.04);box-shadow:5px 5px 0 var(--ink)}
.brikke.riktig{background:var(--green);pointer-events:none}
.brikke.feil{animation:rist .3s}
.brikke .emoji{font-size:1.7rem}
.brikke--kilde{background:var(--sand)}
.brikke.dempet{opacity:.4;filter:grayscale(.3)}
@keyframes rist{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.bokser{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.boks{border:var(--border);border-radius:14px;background:var(--sand);box-shadow:var(--shadow);
  padding:10px;min-height:86px;font-weight:800;text-align:center;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.95rem;color:var(--ink)}
.boks .innhold{font-size:1.4rem;margin-top:6px;min-height:1.7rem}

.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.slot{border:var(--border);border-radius:12px;background:var(--sand);padding:10px 12px;font-weight:800;
  display:flex;gap:10px;cursor:pointer}
.slot .num{font-family:'Chewy',cursive;color:var(--sea-deep)}
.slot.fylt{background:#fff;box-shadow:var(--shadow)}

.forklaring{border:var(--border);border-radius:12px;background:var(--green);padding:10px 12px;
  font-weight:800;margin-top:10px;animation:sprett .3s ease}
@keyframes sprett{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}

/* Sidefylt-skjerm + diplom */
.fylt-side{background:var(--sand);border:var(--border);border-radius:16px;box-shadow:var(--shadow);
  padding:20px;text-align:center;animation:sprett .35s ease;margin-bottom:14px}
.fylt-side .stor{font-size:3rem}
.diplom{background:var(--sand);border:4px double var(--ink);border-radius:16px;box-shadow:var(--shadow);
  padding:22px 16px;text-align:center;margin-bottom:14px}
.diplom h2{font-size:1.7rem;color:var(--sea-deep)}
.diplom .lag{font-family:'Chewy',cursive;font-size:1.5rem;margin:8px 0}

/* Ed-løfter */
.lofte{display:flex;gap:10px;align-items:center;width:100%;text-align:left;
  border:var(--border);border-radius:14px;background:#fff;box-shadow:var(--shadow);
  padding:12px;margin-bottom:10px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;font-size:1rem;color:var(--ink)}
.lofte .boks-ikon{font-size:1.5rem;width:34px;flex:0 0 auto;text-align:center}
.lofte.avlagt{background:var(--green)}

/* Fjordvokter-veggen */
.vegg li{display:flex;align-items:center;gap:10px;border:var(--border);border-radius:12px;
  background:#fff;padding:11px 14px;margin-bottom:9px;font-weight:800;list-style:none}
.vegg li:first-child{background:var(--yellow)}
.vegg .lag{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vegg .naar{font-size:.9rem;opacity:.72;flex:0 0 auto;font-weight:700}

.tilbake{display:inline-block;font-weight:800;color:var(--sea-deep);text-decoration:none;
  margin-bottom:10px;cursor:pointer;background:none;border:none;font-family:'Nunito',sans-serif;font-size:1rem}
.skjerm{display:none}.skjerm.aktiv{display:block;animation:inn .25s ease}
@keyframes inn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#testpanel{display:none;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#testpanel button{font-size:.75rem;padding:4px 8px;border:2px solid var(--ink);border-radius:8px;background:#fff;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="bolge" aria-hidden="true"></div>
  <div id="testpanel"></div>
  <div id="skjermer"></div>
</div>

<script>
/* ============================================================
   FJORDVOKTERNE — Drøbak Akvarium
   Én fil: historie, stasjoner, tilstand, Firebase-vegg.
   Alt innhold redigeres i CONFIG og STASJONER under.
   Testing: ?debug=1 gir hurtigknapper, ?reset=1 nullstiller.
   ============================================================ */

const CONFIG = {
  storageKey: "lrnify_fjordvokterne",
  collection: "fjordvoktere",
  // Lim inn firebaseConfig her for ekte vegg. null = demo-modus (lokal vegg).
  FIREBASE: {
    apiKey: "AIzaSyBdbRSnz-02Cq2BITAcKY_mvWI5D91BYBM",
    authDomain: "poll-c6bd2.firebaseapp.com",
    databaseURL: "https://poll-c6bd2-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "poll-c6bd2",
    storageBucket: "poll-c6bd2.firebasestorage.app",
    messagingSenderId: "541647069675",
    appId: "1:541647069675:web:d8ee426e242e7757dbf9ae"
  },
  veggAntall: 8,

/* Bilder er valgfrie: mangler fila, vises emoji i stedet.
   Se bildeforslag.md for hva hvert bilde bør vise. */
const BILDER = {
  bjorg:   "media/bjorg-hummer.svg",
  torsk:   "media/torsk.svg",
  steinbit:"media/steinbit.svg",

const STASJONER = [

    id:"torsk", kode:"TOR", ikon:"🐟", tittel:"Torsken", bilde:"torsk",
    plassering:"ved torskeakvariet",
    intro:[
      {hvem:"Bjørg", tekst:"Der er han! Torvald Torsk. Da jeg var ung, var fjorden FULL av torsk. Nå er de nesten borte..."},
      {hvem:"Torvald Torsk", dyr:true, tekst:"Vannet er blitt for varmt for meg! Og maten min, de bittesmå raudåtene, har flyttet nordover til kaldere vann. Menneskene har til og med fredet meg — ingen får fiske torsk i Oslofjorden lenger."},
    ],
    oppgave:{
      type:"quiz",
      sporsmal:[
        { q:"Hvorfor er det forbudt å fiske torsk i Oslofjorden?",
          alt:["Torsken biter","Det er nesten ingen torsk igjen","Torsken smaker vondt","Fiskerne er på ferie"],
          riktig:1, forklaring:"Riktig! Det er blitt så få torsk at hver eneste en må få leve og lage torskebarn." },
        { q:"Hva skjer med torskens mat når fjorden blir varmere?",
          alt:["Den blir større","Den flytter til kaldere vann i nord","Den blir giftig","Ingenting"],
          riktig:1, forklaring:"Ja! De små dyrene torsken spiser trives i kaldt vann — så de svømmer nordover. Da blir torsken sulten." },
        { q:"Hvordan kjenner du igjen en torsk?",
          alt:["Den har en skjeggtråd under haka","Den er rosa","Den har vinger","Den lyser i mørket"],
          riktig:0, forklaring:"Stemmer! Skjeggtråden bruker torsken til å lete etter mat på bunnen. Se etter den i akvariet!" },
      ],
    },
    sideTekst:"Torsken trenger kaldt vann og fred. Derfor er den fredet i Oslofjorden — hver torsk teller!",
  },
  {
    id:"steinbit", kode:"STE", ikon:"🐡", tittel:"Steinbiten", bilde:"steinbit",
    plassering:"ved steinbiten",
    intro:[
      {hvem:"Bjørg", tekst:"Hysj... der ligger Sigrid Steinbit. Hun ser skummel ut med de tennene, men hun er en av mine eldste venner."},
      {hvem:"Sigrid Steinbit", dyr:true, tekst:"Skummel?! Jeg trenger sterke tenner for å knuse kråkeboller og skjell til middag! Men jeg skal si deg noe: jeg elsker KALDT vann. Blir fjorden varmere, må jeg flytte dypere ned — eller langt mot nord."},
    ],
    oppgave:{
      type:"match",
      instruks:"Koble sammen det som hører sammen! Trykk på en gul lapp — og så på svaret som passer.",
      par:[
        { a:"Tennene til Sigrid", b:"Knuser kråkeboller og skjell" },
        { a:"Nye tenner", b:"Vokser ut hvert eneste år!" },
        { a:"Kaldt vann", b:"Der trives steinbiten best" },
        { a:"Varmere fjord", b:"Da må steinbiten flytte" },
      ],
    },
    sideTekst:"Steinbiten får nye tenner hvert år og elsker kaldt vann. Varmere hav presser den nordover og nedover i dypet.",
  },
  {
    id:"rodhai", kode:"HAI", ikon:"🦈", tittel:"Rødhaien", bilde:"rodhai",
    plassering:"ved haien",
    intro:[
      {hvem:"Bjørg", tekst:"Og her er den nye naboen min — en småflekket rødhai! Før så vi dem nesten aldri her. Nå kommer det stadig flere sørfra."},
      {hvem:"Ruben Rødhai", dyr:true, tekst:"Hei! Ikke vær redd — jeg er en liten hai og helt ufarlig for mennesker. Jeg liker at vannet blir varmere, da trives jeg her. Og vet du hva? Barna mine vokser inne i noe som kalles en havfruepung!"},
    ],
    oppgave:{
      type:"rekkefolge",
      instruks:"Ruben forteller hvordan en rødhai blir til. Sett historien i riktig rekkefølge — trykk på lappene i tur!",
      steg:[
        "Mamma-haien fester en eggkapsel fast i tangen",
        "Ungen vokser inne i «havfruepungen» i mange måneder",
        "En bitteliten hai kryper ut av kapselen",
        "Haien vokser seg stor og jakter om natten",
      ],
    },
    sideTekst:"Rødhaien er en ny gjest som trives når fjorden blir varmere. Ungene vokser i eggkapsler kalt havfruepunger — let etter dem i fjæra!",
  },
  {
    id:"krabbe", kode:"KRA", ikon:"🦀", tittel:"Krabben", bilde:"krabbe",
    plassering:"ved krabbene",
    intro:[
      {hvem:"Bjørg", tekst:"Pass fingrene! Her bor Kåre Krabbe. Han har bodd i fjæra like lenge som meg — men han har fått noen nye naboer i det siste..."},
      {hvem:"Kåre Krabbe", dyr:true, tekst:"Nye naboer, ja! Noen dyr har ALLTID bodd her i fjorden. Men nå kommer det fremmede arter med varmere vann og med skip langveisfra. Stillehavsøstersen for eksempel — den vokser overalt og har knivskarpe skall!"},
    ],
    oppgave:{
      type:"sortering",
      instruks:"Hjelp Kåre å holde oversikt: hvem har alltid bodd i fjorden, og hvem er nye gjester?",
      kategorier:["Har alltid bodd her","Ny gjest i fjorden"],
      elementer:[
        { navn:"Taskekrabbe",       emoji:"🦀", kat:0 },
        { navn:"Blåskjell",         emoji:"🐚", kat:0 },
        { navn:"Sjøstjerne",        emoji:"⭐", kat:0 },
        { navn:"Stillehavsøsters",  emoji:"🦪", kat:1 },
        { navn:"Amerikansk hummer", emoji:"🦞", kat:1 },
        { navn:"Japansk drivtang",  emoji:"🌿", kat:1 },
      ],
    },
    sideTekst:"Fremmede arter som stillehavsøsters kommer med varmere vann og skipstrafikk. De kan ta plassen fra dyrene som alltid har bodd her.",
  },
  {
    id:"hummer", kode:"HUM", ikon:"🦞", tittel:"Bjørg selv", bilde:"hummer",
    plassering:"ved hummeren",
    intro:[
      {hvem:"Bjørg", tekst:"Og til slutt... meg! Jeg har levd i denne fjorden i over femti år. Tenk — hummere kan bli eldre enn bestemoren din! Men vi trenger hjelp for å klare oss."},
      {hvem:"Bjørg", tekst:"Nå vil jeg vite om DERE tenker som ekte fjordvoktere. Hva ville dere gjort?"},
    ],
    oppgave:{
      type:"dilemma",
      situasjoner:[
        { q:"Dere er med på krabbefiske og får en bitteliten hummer i teina. Hva gjør dere?",
          valg:[
            { tekst:"Slipper den forsiktig ut igjen", bra:true, svar:"Riktig! Små hummere må få vokse seg store. Det finnes til og med regler for hvor stor en hummer må være." },
            { tekst:"Tar den med hjem i et syltetøyglass", bra:false, svar:"Da får den aldri vokse opp og lage nye hummerbarn. Slipp den ut!" },
            { tekst:"Gir den til måkene", bra:false, svar:"Stakkars hummer! Den hører hjemme i fjorden — slipp den ut igjen." },
          ]},
        { q:"Dere ser en hummer med tusenvis av små egg under halen. Hva tenker en fjordvokter?",
          valg:[
            { tekst:"«Hun bærer på fremtidens hummere — hun må få være i fred!»", bra:true, svar:"Nettopp! Hummermødre med utrogn er strengt beskyttet. Hun bærer på tusenvis av småhummere." },
            { tekst:"«Så mange egg — det gjør ingenting om vi tar henne»", bra:false, svar:"Jo! Uten hummermødrene blir det ingen nye hummere i fjorden." },
            { tekst:"«Egg? Æsj!»", bra:false, svar:"Hehe — men de eggene er faktisk fjordens fremtid!" },
          ]},
        { q:"Dere finner en rar hummer med blågrønne klør som ser annerledes ut. Hva gjør dere?",
          valg:[
            { tekst:"Sier fra til en voksen — det kan være en amerikansk hummer!", bra:true, svar:"Smart! Amerikansk hummer er en fremmed art som kan gjøre norske hummere syke. Forskerne vil gjerne vite om den." },
            { tekst:"Later som ingenting", bra:false, svar:"Fremmede hummere kan skade oss norske hummere — si heller fra til en voksen!" },
            { tekst:"Slipper den ut et annet sted i fjorden", bra:false, svar:"Uff, da kan den spre seg videre. Si fra til en voksen i stedet." },
          ]},
      ],
    },
    sideTekst:"Hummere kan bli over femti år gamle. Med gode regler — og ekte fjordvoktere — kan de leve trygt i Oslofjorden.",

];

const ED = [
  "Vi lover å ta med søppel hjem fra fjæra — og gjerne plukke litt ekstra!",
  "Vi lover å slippe ut fisk og dyr som er for små eller fredet.",
  "Vi lover å fortelle andre om dyrene i Oslofjorden og hvorfor de trenger kaldt, rent vann.",
];

/* ---------------- tilstand ---------------- */
const url = new URLSearchParams(location.search);
const DEBUG = url.get("debug") === "1";
if (url.get("reset") === "1") localStorage.removeItem(CONFIG.storageKey);

function blank(){ return { started:false, lag:"", opplaast:[], ferdig:[], cur:null, levert:false }; }
let state = (()=>{ try { return { ...blank(), ...JSON.parse(localStorage.getItem(CONFIG.storageKey)) }; } catch { return blank(); } })();
function lagre(){ localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); }

/* ---------------- hjelpere ---------------- */
const $ = s => document.querySelector(s);
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function stokk(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function stasjon(id){ return STASJONER.find(s=>s.id===id); }
function alleFerdig(){ return state.ferdig.length >= STASJONER.length; }

function heroHtml(st){
  const src = BILDER[st.bilde];
  if(!src) return "";
  return `<div class="hero">
    <img src="${esc(src)}" alt="${esc(st.tittel)}"
      onload="this.parentElement.classList.add('harbilde')"
      onerror="this.parentElement.remove()">
  </div>`;
}
function bobler(intro){
  return intro.map(b=>`
    <div class="bjorg ${b.dyr?"dyr":""}">
      <div class="fjes" aria-hidden="true">${b.dyr ? (stasjonAvHvem(b.hvem)||"🐟") : "🦞"}</div>
      <div class="boble"><span class="hvem">${esc(b.hvem)}</span>${esc(b.tekst)}</div>
    </div>`).join("");
}
function stasjonAvHvem(hvem){
  const map={ "Torvald Torsk":"🐟","Sigrid Steinbit":"🐡","Ruben Rødhai":"🦈","Kåre Krabbe":"🦀" };
  return map[hvem];
}

/* ---------------- skjermbytte ---------------- */
function vis(html){
  $("#skjermer").innerHTML = `<div class="skjerm aktiv">${html}</div>`;
  window.scrollTo(0,0);
}

/* ---------------- landing ---------------- */
function visLanding(){
  vis(`
    <div class="kort kort--sea senter">
      <h1>Fjordvokterne</h1>
      <p style="font-weight:800">Drøbak Akvarium</p>
    </div>
    <div class="bjorg">
      <div class="fjes" aria-hidden="true">🦞</div>
      <div class="boble"><span class="hvem">Bjørg</span>
      Hei! Jeg er Bjørg, en gammel hummer. Jeg har levd i Oslofjorden i over femti år — og jeg husker hvordan fjorden var før.
      Nå endrer vannet seg fortere enn jeg rekker å skrive i Fjordboka mi. De fem siste sidene er tomme...
      Vil dere hjelpe meg å fylle dem?</div>
    </div>
    <div class="kort">
      <p><strong>Slik gjør dere:</strong></p>
      <p>1. Finn de fem dyrene mine rundt i akvariet<br>
      2. Ved hvert dyr henger en <strong>kode på tre bokstaver</strong><br>
      3. Tast koden her — hør historien, løs oppgaven, fyll en side!</p>
      <div class="mellomrom"></div>
      <label for="lag"><strong>Hva heter laget deres?</strong></label>
      <div class="mellomrom"></div>
      <input type="text" id="lag" maxlength="40" placeholder="F.eks. Familien Blekksprut" autocomplete="off" enterkeyhint="go">
      <p class="kodemsg" id="lagfeil" role="alert"></p>
      <button class="knapp" id="start">Vi hjelper Bjørg!</button>
    </div>`);
  const start = ()=>{
    const navn = $("#lag").value.trim();
    if(!navn){ $("#lagfeil").textContent = "Skriv inn et lagnavn først!"; return; }
    state = blank(); state.started = true; state.lag = navn; lagre();
    visHjem();
  };
  $("#start").addEventListener("click", start);
  $("#lag").addEventListener("keydown", e=>{ if(e.key==="Enter") start(); });
}

/* ---------------- hjem: Fjordboka ---------------- */
function visHjem(melding){
  const sider = STASJONER.map((st,i)=>{
    const ferdig = state.ferdig.includes(st.id);
    const laast = !ferdig && !state.opplaast.includes(st.id);
    return `<button class="side ${ferdig?"ferdig":laast?"laast":""}" data-id="${st.id}" ${laast?"disabled":""}>
      <span class="ikon" aria-hidden="true">${laast?"🔒":st.ikon}</span>
      <span class="tekst">Side ${i+1}: ${esc(st.tittel)}
        <span class="status">${ferdig?"Fylt ut ✓":laast?`Finn koden ${esc(st.plassering)}`:"Åpnet — trykk for å fortsette"}</span>
      </span>
    </button>`;
  }).join("");
  const finale = `<button class="side ${alleFerdig()?"finale-klar":"laast"}" data-id="__finale" ${alleFerdig()?"":"disabled"}>
      <span class="ikon" aria-hidden="true">${alleFerdig()?"⚓":"🔒"}</span>
      <span class="tekst">Siste side: Fjordvokter-eden
        <span class="status">${alleFerdig()?"Klar — trykk her!":"Fyll de fem sidene først"}</span>
      </span>
    </button>`;
  vis(`
    <div class="kort kort--sea senter">
      <h1>Fjordboka</h1>
      <p style="font-weight:800">Laget: ${esc(state.lag)}</p>
    </div>
    <div class="bjorg">
      <div class="fjes" aria-hidden="true">🦞</div>
      <div class="boble"><span class="hvem">Bjørg</span>${
        alleFerdig()
        ? "Alle fem sidene er fylt! Nå gjenstår bare én ting — trykk på den siste siden!"
        : "Finn dyrene mine i akvariet. Ved hvert dyr henger en kode på tre bokstaver — tast den her!"
      }</div>
    </div>
    ${alleFerdig() ? "" : `
    <div class="kort">
      <div class="koderad">
        <input type="text" id="kode" maxlength="3" placeholder="KODE" autocomplete="off" autocapitalize="characters" aria-label="Kode, tre bokstaver">
        <button class="knapp" id="laasopp">Lås opp</button>
      </div>
      <p class="kodemsg" id="kodemsg" aria-live="polite" role="status">${melding?esc(melding):""}</p>
    </div>`}
    ${sider}${finale}
    <p class="liten senter" style="margin-top:8px">Fjordvokterne · LRNify · <button class="tilbake" id="nullstill" style="font-size:.88rem">Start på nytt</button></p>`);

  if(!alleFerdig()){
    const provKode = ()=>{
      const k = $("#kode").value.trim().toUpperCase();
      const st = STASJONER.find(s=>s.kode===k);
      if(!st){ $("#kodemsg").textContent = "Hmm, den koden kjenner ikke Bjørg. Se godt etter ved dyrene!"; return; }
      if(!state.opplaast.includes(st.id)) state.opplaast.push(st.id);
      lagre(); apneStasjon(st.id);
    };
    $("#laasopp").addEventListener("click", provKode);
    $("#kode").addEventListener("input", e=>{ e.target.value = e.target.value.toUpperCase(); });
    $("#kode").addEventListener("keydown", e=>{ if(e.key==="Enter") provKode(); });
  }
  document.querySelectorAll(".side:not([disabled])").forEach(b=>{
    b.addEventListener("click", ()=>{
      const id = b.dataset.id;
      if(id==="__finale") visFinale();
      else if(state.ferdig.includes(id)) visSideFerdig(stasjon(id), true);
      else apneStasjon(id);
    });
  });
  $("#nullstill").addEventListener("click", ()=>{
    if(confirm("Starte helt på nytt? Da tømmes Fjordboka til laget deres.")){
      state = blank(); lagre(); visLanding();
    }
  });
}

/* ---------------- stasjon: historie → oppgave → side ---------------- */
function apneStasjon(id){
  state.cur = id; lagre();
  const st = stasjon(id);
  vis(`
    <button class="tilbake" id="tilbake">← Tilbake til Fjordboka</button>
    <div class="kort kort--sea senter"><h1>${st.ikon} ${esc(st.tittel)}</h1></div>
    ${heroHtml(st)}
    ${bobler(st.intro)}
    <button class="knapp" id="tiloppgave">Vi er klare for oppgaven!</button>`);
  $("#tilbake").addEventListener("click", visHjem);
  $("#tiloppgave").addEventListener("click", ()=>visOppgave(st));
}

function visOppgave(st){
  const o = st.oppgave;
  const ramme = inner => vis(`
    <button class="tilbake" id="tilbake">← Tilbake til Fjordboka</button>
    <div class="kort kort--sea senter"><h2>${st.ikon} ${esc(st.tittel)}</h2></div>
    ${inner}`);
  const fullfor = ()=>{
    if(!state.ferdig.includes(st.id)) state.ferdig.push(st.id);
    state.cur = null; lagre(); visSideFerdig(st, false);
  };

  /* --- quiz --- */
  if(o.type==="quiz"){
    let i=0;
    const tegn=()=>{
      const sp=o.sporsmal[i];
      ramme(`<div class="kort">
        <p class="liten senter">Spørsmål ${i+1} av ${o.sporsmal.length}</p>
        <h2 class="senter">${esc(sp.q)}</h2><div class="mellomrom"></div>
        <div id="alt">${sp.alt.map((a,j)=>`<button class="knapp knapp--valg" data-j="${j}">${esc(a)}</button>`).join("")}</div>
        <div id="fk"></div></div>`);
      $("#tilbake").addEventListener("click", visHjem);
      document.querySelectorAll("#alt .knapp").forEach(b=>b.addEventListener("click",()=>{
        const j=+b.dataset.j;
        if(j===sp.riktig){
          document.querySelectorAll("#alt .knapp").forEach(x=>x.disabled=true);
          b.classList.add("riktig");
          $("#fk").innerHTML=`<div class="forklaring">${esc(sp.forklaring)}</div>
            <div class="mellomrom"></div><button class="knapp" id="neste">Videre</button>`;
          $("#neste").addEventListener("click",()=>{ i++; i<o.sporsmal.length ? tegn() : fullfor(); });
        } else {
          b.classList.add("feil"); b.disabled=true;
          setTimeout(()=>b.classList.remove("feil"),350);
        }
      }));
    };
    tegn(); return;
  }

  /* --- match (par) --- */
  if(o.type==="match"){
    const venstre = stokk(o.par.map((p,i)=>({t:p.a,i})));
    const hoyre  = stokk(o.par.map((p,i)=>({t:p.b,i})));
    ramme(`<div class="kort">
      <p>${esc(o.instruks)}</p><div class="mellomrom"></div>
      <div class="rutenett" id="mv">${venstre.map(v=>`<button class="brikke brikke--kilde" data-i="${v.i}">${esc(v.t)}</button>`).join("")}</div>
      <div class="mellomrom"></div>
      <div class="rutenett" id="mh">${hoyre.map(h=>`<button class="brikke" data-i="${h.i}">${esc(h.t)}</button>`).join("")}</div></div>`);
    $("#tilbake").addEventListener("click", visHjem);
    let valgt=null, igjen=o.par.length;
    function settDemping(){
      document.querySelectorAll("#mv .brikke").forEach(x=>{
        const aktiv = x===valgt || x.classList.contains("riktig");
        x.classList.toggle("dempet", !!valgt && !aktiv);
      });
    }
    document.querySelectorAll("#mv .brikke").forEach(b=>b.addEventListener("click",()=>{
      if(b.classList.contains("riktig")) return;
      document.querySelectorAll("#mv .brikke").forEach(x=>x.classList.remove("valgt"));
      valgt=b; b.classList.add("valgt");
      settDemping();
    }));
    document.querySelectorAll("#mh .brikke").forEach(b=>b.addEventListener("click",()=>{
      if(!valgt || b.classList.contains("riktig")) return;
      if(b.dataset.i===valgt.dataset.i){
        b.classList.add("riktig"); valgt.classList.add("riktig"); valgt.classList.remove("valgt");
        valgt=null; settDemping();
        if(--igjen===0) setTimeout(fullfor,600);
      } else { b.classList.add("feil"); setTimeout(()=>b.classList.remove("feil"),350); }
    }));
    return;
  }

  /* --- rekkefølge --- */
  if(o.type==="rekkefolge"){
    let seq=[];
    // stokk til rekkefølgen garantert ikke starter riktig
    let brikker; do { brikker = stokk(o.steg.map((t,i)=>({t,i}))); } while(brikker[0].i===0);
    const tegn=()=>{
      ramme(`<div class="kort">
        <p>${esc(o.instruks)}</p><div class="mellomrom"></div>
        <div class="slots">${o.steg.map((_,i)=>`<div class="slot ${seq[i]!==undefined?"fylt":""}" data-s="${i}">
          <span class="num">${i+1}.</span><span>${seq[i]!==undefined?esc(o.steg[seq[i]]):"— trykk en lapp —"}</span></div>`).join("")}</div>
        <div class="rutenett" id="pool">${brikker.map(b=>`<button class="brikke" data-i="${b.i}" ${seq.includes(b.i)?"disabled style='opacity:.35'":""}>${esc(b.t)}</button>`).join("")}</div>
        <div id="fk"></div></div>`);
      $("#tilbake").addEventListener("click", visHjem);
      document.querySelectorAll("#pool .brikke:not([disabled])").forEach(b=>b.addEventListener("click",()=>{
        const i=+b.dataset.i;
        if(i===seq.length){ seq.push(i); seq.length===o.steg.length ? vinn() : tegn(); }
        else { b.classList.add("feil"); setTimeout(()=>b.classList.remove("feil"),350); }
      }));
      document.querySelectorAll(".slot.fylt").forEach(s=>s.addEventListener("click",()=>{
        const idx=+s.dataset.s;
        if(idx===seq.length-1){ seq.pop(); tegn(); } // kan angre siste
      }));
    };
    const vinn=()=>{
      tegn();
      $("#fk").innerHTML=`<div class="forklaring">Perfekt rekkefølge!</div>
        <div class="mellomrom"></div><button class="knapp" id="neste">Videre</button>`;
      $("#neste").addEventListener("click", fullfor);
    };
    tegn(); return;
  }

  /* --- sortering --- */
  if(o.type==="sortering"){
    let valgt=null, igjen=o.elementer.length;
    ramme(`<div class="kort">
      <p>${esc(o.instruks)}</p><div class="mellomrom"></div>
      <div class="rutenett" id="dyr">${stokk(o.elementer).map((e,i)=>`<button class="brikke" data-kat="${e.kat}" data-em="${e.emoji}">
        <span class="emoji" aria-hidden="true">${e.emoji}</span>${esc(e.navn)}</button>`).join("")}</div>
      <div class="bokser" id="bokser">${o.kategorier.map((k,i)=>`<button class="boks" data-b="${i}">${esc(k)}<div class="innhold"></div></button>`).join("")}</div></div>`);
    $("#tilbake").addEventListener("click", visHjem);
    document.querySelectorAll("#dyr .brikke").forEach(b=>b.addEventListener("click",()=>{
      if(b.classList.contains("riktig")) return;
      document.querySelectorAll("#dyr .brikke").forEach(x=>x.classList.remove("valgt"));
      valgt=b; b.classList.add("valgt");
    }));
    document.querySelectorAll(".boks").forEach(boks=>boks.addEventListener("click",()=>{
      if(!valgt) return;
      if(+valgt.dataset.kat === +boks.dataset.b){
        boks.querySelector(".innhold").textContent += valgt.dataset.em;
        valgt.classList.remove("valgt"); valgt.classList.add("riktig");
        valgt.style.opacity=".35"; valgt=null;
        if(--igjen===0) setTimeout(fullfor,600);
      } else {
        const v=valgt; v.classList.add("feil");
        setTimeout(()=>v.classList.remove("feil"),350);
      }
    }));
    return;
  }

  /* --- dilemma --- */
  if(o.type==="dilemma"){
    let i=0;
    const tegn=()=>{
      const d=o.situasjoner[i];
      ramme(`<div class="kort">
        <p class="liten senter">Situasjon ${i+1} av ${o.situasjoner.length}</p>
        <h2 class="senter">${esc(d.q)}</h2><div class="mellomrom"></div>
        <div id="valg">${stokk(d.valg.map((v,j)=>({...v,j}))).map(v=>`<button class="knapp knapp--valg" data-j="${v.j}">${esc(v.tekst)}</button>`).join("")}</div>
        <div id="fk"></div></div>`);
      $("#tilbake").addEventListener("click", visHjem);
      document.querySelectorAll("#valg .knapp").forEach(b=>b.addEventListener("click",()=>{
        const v=d.valg[+b.dataset.j];
        document.querySelectorAll("#valg .knapp").forEach(x=>x.disabled=true);
        b.classList.add(v.bra?"riktig":"feil");
        $("#fk").innerHTML=`<div class="forklaring">${esc(v.svar)}</div>
          <div class="mellomrom"></div><button class="knapp" id="neste">Videre</button>`;
        $("#neste").addEventListener("click",()=>{ i++; i<o.situasjoner.length ? tegn() : fullfor(); });
      }));
    };
    tegn(); return;
  }
}

/* ---------------- side fylt ---------------- */
function visSideFerdig(st, gjensyn){
  const nr = STASJONER.indexOf(st)+1;
  vis(`
    <button class="tilbake" id="tilbake">← Tilbake til Fjordboka</button>
    <div class="fylt-side">
      <div class="stor" aria-hidden="true">${st.ikon}</div>
      <h2>Side ${nr} er fylt ut!</h2>
      <div class="mellomrom"></div>
      <p style="font-weight:800">«${esc(st.sideTekst)}»</p>
    </div>
    <div class="bjorg">
      <div class="fjes" aria-hidden="true">🦞</div>
      <div class="boble"><span class="hvem">Bjørg</span>${
        gjensyn ? "Denne siden har dere allerede fylt. Fjordboka husker alt!"
        : alleFerdig() ? "Det var den siste siden! Skynd dere tilbake til Fjordboka — noe venter på dere der..."
        : `Takk! ${STASJONER.length - state.ferdig.length} side${STASJONER.length-state.ferdig.length===1?"":"r"} igjen. Finn neste dyr og neste kode!`
      }</div>
    </div>
    <button class="knapp" id="hjem">Til Fjordboka</button>`);
  $("#tilbake").addEventListener("click", visHjem);
  $("#hjem").addEventListener("click", visHjem);
}

/* ---------------- finale: ed, diplom, vegg ---------------- */
function visFinale(){
  if(!alleFerdig()) return visHjem();
  const avlagt = new Set();
  vis(`
    <div class="kort kort--sea senter"><h1>Fjordvokter-eden</h1></div>
    <div class="bjorg">
      <div class="fjes" aria-hidden="true">🦞</div>
      <div class="boble"><span class="hvem">Bjørg</span>
      Fjordboka er full — dere har møtt alle vennene mine! Nå gjenstår bare eden.
      Trykk på hvert løfte for å avlegge det:</div>
    </div>
    ${ED.map((l,i)=>`<button class="lofte" data-i="${i}" aria-pressed="false"><span class="boks-ikon" aria-hidden="true">○</span><span>${esc(l)}</span></button>`).join("")}
    <div class="mellomrom"></div>
    <button class="knapp" id="sverg" disabled>Vi sverger!</button>`);
  document.querySelectorAll(".lofte").forEach(b=>b.addEventListener("click",()=>{
    b.classList.add("avlagt"); b.setAttribute("aria-pressed","true");
    b.querySelector(".boks-ikon").textContent="✓";
    avlagt.add(b.dataset.i);
    if(avlagt.size===ED.length) $("#sverg").disabled=false;
  }));
  $("#sverg").addEventListener("click", visDiplom);
}

async function visDiplom(){
  const d=new Date();
  const dato=d.toLocaleDateString("nb-NO",{day:"numeric",month:"long",year:"numeric"});
  vis(`
    <div class="diplom">
      <h2>Fjordvokter-diplom</h2>
      <p class="lag">${esc(state.lag)}</p>
      <p style="font-weight:800">har fylt Fjordboka og avlagt Fjordvokter-eden</p>
      <div class="mellomrom"></div>
      <p class="liten">Drøbak Akvarium · ${esc(dato)}</p>
    </div>
    <div class="bjorg">
      <div class="fjes" aria-hidden="true">🦞</div>
      <div class="boble"><span class="hvem">Bjørg</span>
      Velkommen blant fjordvokterne! Navnet deres skrives nå inn på veggen min. Tusen takk — fra meg og hele fjorden.</div>
    </div>
    <div class="kort senter" id="vegg-status">
      <p id="vegg-tekst">Skriver dere inn på Fjordvokter-veggen ...</p>
      <div class="mellomrom"></div>
      <button class="knapp" id="prov-igjen" style="display:none">Prøv igjen</button>
    </div>
    <div class="kort" id="vegg-kort" style="display:none">
      <h2 class="senter">Fjordvokter-veggen</h2>
      <p class="liten senter">De nyeste fjordvokterne</p>
      <div class="mellomrom"></div>
      <ul class="vegg" id="vegg"></ul>
    </div>
    <button class="knapp knapp--sek" id="hjem">Tilbake til Fjordboka</button>`);
  $("#hjem").addEventListener("click", visHjem);
  $("#prov-igjen").addEventListener("click", skrivInn);
  skrivInn();
}

/* ---------------- Firebase / demo-vegg ---------------- */
let db=null;
function initFb(){
  if(!CONFIG.FIREBASE || !window.firebase) return false;
  if(!db){ firebase.initializeApp(CONFIG.FIREBASE); db=firebase.firestore(); }
  return true;
}
async function skrivInn(){
  const tekst=$("#vegg-tekst"), knapp=$("#prov-igjen");
  knapp.style.display="none";
  tekst.textContent="Skriver dere inn på Fjordvokter-veggen ...";
  try{
    if(!state.levert){
      const rad={ lag:state.lag.slice(0,40), tid:Date.now() };
      if(initFb()) await db.collection(CONFIG.collection).add(rad);
      else {
        const key=CONFIG.storageKey+"_demo_vegg";
        const liste=JSON.parse(localStorage.getItem(key)||"[]");
        liste.push(rad); localStorage.setItem(key, JSON.stringify(liste));
      }
      state.levert=true; lagre();
    }
    tekst.textContent="Dere står på veggen!";
    await visVegg();
  }catch(e){
    tekst.textContent="Fikk ikke kontakt med veggen (dårlig dekning?). Diplomet deres er trygt — prøv igjen om litt, gjerne nærmere utgangen!";
    knapp.style.display="block";
  }
}
async function visVegg(){
  try{
    let liste;
    if(initFb()){
      const snap=await db.collection(CONFIG.collection).orderBy("tid","desc").limit(CONFIG.veggAntall).get();
      liste=snap.docs.map(d=>d.data());
    } else {
      const key=CONFIG.storageKey+"_demo_vegg";
      liste=JSON.parse(localStorage.getItem(key)||"[]").sort((a,b)=>b.tid-a.tid).slice(0,CONFIG.veggAntall);
    }
    $("#vegg").innerHTML = liste.length
      ? liste.map(r=>{
          const t=new Date(r.tid);
          const naar=t.toLocaleDateString("nb-NO",{day:"numeric",month:"short"})+" kl. "+t.toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit"});
          return `<li><span class="lag">${esc(r.lag)}</span><span class="naar">${esc(naar)}</span></li>`;
        }).join("")
      : `<li><span class="lag">Dere er de aller første fjordvokterne!</span></li>`;
    $("#vegg-kort").style.display="block";
  }catch(e){ /* veggen er ikke kritisk */ }
}

/* ---------------- debug-panel ---------------- */
if(DEBUG){
  const p=$("#testpanel"); p.style.display="flex";
  STASJONER.forEach(s=>{
    const b=document.createElement("button"); b.textContent=s.kode;
    b.onclick=()=>{ if(!state.started){state.started=true;state.lag="Testlag";} if(!state.opplaast.includes(s.id)) state.opplaast.push(s.id); lagre(); apneStasjon(s.id); };
    p.appendChild(b);
  });
  const alle=document.createElement("button"); alle.textContent="fullfør alle";
  alle.onclick=()=>{ if(!state.started){state.started=true;state.lag="Testlag";} state.ferdig=STASJONER.map(s=>s.id); lagre(); visHjem(); };
  p.appendChild(alle);
  const reset=document.createElement("button"); reset.textContent="reset";
  reset.onclick=()=>{ state=blank(); lagre(); visLanding(); };
  p.appendChild(reset);
}

/* ---------------- oppstart ---------------- */
if(!state.started) visLanding();
else if(state.cur && stasjon(state.cur) && !state.ferdig.includes(state.cur)) apneStasjon(state.cur);
else visHjem();
</script>
