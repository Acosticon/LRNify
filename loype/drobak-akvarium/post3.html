<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post 2: Krabbe-quiz — Akvarieløypa</title>
<link rel="stylesheet" href="loype.css">
</head>
<body>
<div id="loype-topp" class="ramme"></div>
<main class="ramme">
  <div class="kort kort--sea senter">
    <h1>🦀 Krabbe-quiz</h1>
    <p id="intro"></p>
  </div>
  <div class="kort">
    <p class="liten senter" id="teller"></p>
    <h2 id="sporsmal" class="senter"></h2>
    <div class="mellomrom"></div>
    <div id="alternativer"></div>
  </div>
</main>

<script src="config.js"></script>
<script src="loype-core.js"></script>
<script>
  const POST_ID = 2;
  const CFG = LOYPE_CONFIG.post2;
  const MAKS = LOYPE_CONFIG.poster.find(p => p.id === POST_ID).maks;

  if (Loype.krevLag(POST_ID) && !Loype.sjekkAlleredeTatt(POST_ID)) {
    Loype.tegnTopp(POST_ID);
    document.getElementById("intro").textContent = CFG.intro;

    let indeks = 0, poeng = 0, laast = false;

    function visSporsmal() {
      const sp = CFG.sporsmal[indeks];
      document.getElementById("teller").textContent =
        `Spørsmål ${indeks + 1} av ${CFG.sporsmal.length}`;
      document.getElementById("sporsmal").textContent = sp.q;
      const div = document.getElementById("alternativer");
      div.innerHTML = "";
      sp.alternativer.forEach((alt, i) => {
        const b = document.createElement("button");
        b.className = "knapp knapp--valg";
        b.textContent = alt;
        b.addEventListener("click", () => svar(i, b));
        div.appendChild(b);
      });
      laast = false;
    }

    function svar(i, knapp) {
      if (laast) return;
      laast = true;
      const sp = CFG.sporsmal[indeks];
      const alle = document.querySelectorAll("#alternativer .knapp");
      alle.forEach(b => b.disabled = true);
      if (i === sp.riktig) {
        knapp.classList.add("riktig");
        poeng += CFG.poengPerRiktig;
      } else {
        knapp.classList.add("feil");
        alle[sp.riktig].classList.add("riktig"); // vis fasit
      }
      setTimeout(() => {
        indeks++;
        if (indeks >= CFG.sporsmal.length) {
          Loype.fullforPost(POST_ID, poeng, MAKS);
        } else {
          visSporsmal();
        }
      }, 1200);
    }

    visSporsmal();
  }
</script>
</body>
</html>
