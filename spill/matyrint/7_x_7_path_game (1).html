<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dungeon Dragon Math Game</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101010;
      font-family: Arial, sans-serif;
      color: white;
    }

    .wrap {
      text-align: center;
      max-width: 980px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 24px;
    }

    p {
      margin-top: 0;
      color: #bbb;
    }

    #status {
      margin: 8px 0 10px;
      color: #ddd;
      font-weight: bold;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(12, 42px);
      grid-template-rows: repeat(12, 42px);
      gap: 0;
      padding: 12px;
      background: #141414;
      border-radius: 12px;
      width: max-content;
      margin: 0 auto;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.45);
    }

    .cell {
      width: 42px;
      height: 42px;
      background: #bfbfbf;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-sizing: border-box;
      border-top: 3px solid transparent;
      border-right: 3px solid transparent;
      border-bottom: 3px solid transparent;
      border-left: 3px solid transparent;
    }

    .start-room {
      background: #80cfa1;
    }

    .boss-room {
      background: #d55a5a;
    }

    .wall-top { border-top-color: #050505; }
    .wall-right { border-right-color: #050505; }
    .wall-bottom { border-bottom-color: #050505; }
    .wall-left { border-left-color: #050505; }

    .door-top { border-top-color: #a46625; }
    .door-right { border-right-color: #a46625; }
    .door-bottom { border-bottom-color: #a46625; }
    .door-left { border-left-color: #a46625; }

    .monster::before {
      content: "👾";
      position: absolute;
      font-size: 22px;
      z-index: 2;
    }

    .dragon::before {
      content: "🐉";
      position: absolute;
      font-size: 23px;
      z-index: 2;
    }

    .player::after {
      content: "";
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: #3b82f6;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.9);
      border: 2px solid white;
      position: absolute;
      z-index: 4;
    }

    #legend {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 10px 0 12px;
      color: #ccc;
      font-size: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 16px;
      height: 16px;
      display: inline-block;
      border-radius: 3px;
    }

    #message {
      margin-top: 12px;
      min-height: 24px;
      font-weight: bold;
    }

    #combatPanel {
      display: none;
      margin: 14px auto 0;
      padding: 16px;
      max-width: 460px;
      background: #222;
      border-radius: 12px;
      border: 1px solid #444;
    }

    .hp-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: #ddd;
    }

    #enemyName {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #problem {
      font-size: 28px;
      font-weight: bold;
      margin: 12px 0;
    }

    input {
      width: 90px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
    }

    button {
      margin-top: 12px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #submitAnswer {
      margin-left: 8px;
      background: #3b82f6;
      color: white;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Dungeon Dragon Math Game</h1>
    <p>Move with W A S D. Rooms share borders; black borders are walls, brown borders are doors.</p>
    <div id="status"></div>

    <div id="legend">
      <span class="legend-item"><span class="swatch" style="background:#bfbfbf"></span> Room floor</span>
      <span class="legend-item"><span class="swatch" style="background:#050505"></span> Wall border</span>
      <span class="legend-item"><span class="swatch" style="background:#a46625"></span> Door border</span>
      <span class="legend-item">👾 Room monster</span>
      <span class="legend-item">🐉 Boss</span>
    </div>

    <div id="grid"></div>
    <div id="message"></div>

    <div id="combatPanel">
      <div id="enemyName">Monster</div>
      <div class="hp-row">
        <div>Player HP: <strong id="playerHpText">40</strong></div>
        <div>Enemy HP: <strong id="enemyHpText">15</strong></div>
      </div>
      <div id="problem"></div>
      <input id="answerInput" type="number" autocomplete="off" />
      <button id="submitAnswer">Attack</button>
      <div id="combatMessage"></div>
    </div>

    <button onclick="newGame()">Generate New Dungeon</button>
  </div>

  <script>
    const size = 12;
    const WALL = "wall";
    const DOOR = "door";
    const OPEN = "open";

    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const message = document.getElementById("message");
    const combatPanel = document.getElementById("combatPanel");
    const playerHpText = document.getElementById("playerHpText");
    const enemyHpText = document.getElementById("enemyHpText");
    const enemyName = document.getElementById("enemyName");
    const problem = document.getElementById("problem");
    const answerInput = document.getElementById("answerInput");
    const submitAnswer = document.getElementById("submitAnswer");
    const combatMessage = document.getElementById("combatMessage");

    let map = [];
    let rooms = [];
    let player = { row: 0, col: 0 };
    let currentRoom = null;
    let currentEnemy = null;
    let inCombat = false;
    let waitingForNextLevel = false;
    let playerHp = 40;
    let currentAnswer = 0;
    let level = 1;
    let operation = "addition";

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function makeCell(roomId = null) {
      return {
        roomId,
        borders: { top: OPEN, right: OPEN, bottom: OPEN, left: OPEN }
      };
    }

    function makeEmptyMap() {
      return Array.from({ length: size }, () => Array.from({ length: size }, () => makeCell()));
    }

    function opposite(dir) {
      return { top: "bottom", right: "left", bottom: "top", left: "right" }[dir];
    }

    function delta(dir) {
      return {
        top: { row: -1, col: 0 },
        right: { row: 0, col: 1 },
        bottom: { row: 1, col: 0 },
        left: { row: 0, col: -1 }
      }[dir];
    }

    function setBorder(row, col, dir, value) {
      if (row < 0 || row >= size || col < 0 || col >= size) return;
      map[row][col].borders[dir] = value;

      const d = delta(dir);
      const nr = row + d.row;
      const nc = col + d.col;
      if (nr >= 0 && nr < size && nc >= 0 && nc < size) {
        map[nr][nc].borders[opposite(dir)] = value;
      }
    }

    function addOuterWalls() {
      for (let i = 0; i < size; i++) {
        setBorder(0, i, "top", WALL);
        setBorder(size - 1, i, "bottom", WALL);
        setBorder(i, 0, "left", WALL);
        setBorder(i, size - 1, "right", WALL);
      }
    }

    function roomAt(row, col) {
      const id = map[row][col].roomId;
      return rooms.find(room => room.id === id) || null;
    }

    function centerOfRoom(room) {
      let sumRow = 0;
      let sumCol = 0;
      for (const cell of room.cells) {
        sumRow += cell.row;
        sumCol += cell.col;
      }
      return {
        row: Math.round(sumRow / room.cells.length),
        col: Math.round(sumCol / room.cells.length)
      };
    }

    function nearestRoomCell(room, target) {
      return [...room.cells].sort((a, b) => {
        const da = Math.abs(a.row - target.row) + Math.abs(a.col - target.col);
        const db = Math.abs(b.row - target.row) + Math.abs(b.col - target.col);
        return da - db;
      })[0];
    }

    function randomMonsterName() {
      const names = ["Goblin", "Skeleton", "Slime", "Bat", "Orc", "Spider", "Imp", "Wraith"];
      return names[randomInt(0, names.length - 1)];
    }

    function createRoomSeeds(count) {
      const seeds = [
        { row: 0, col: 0 },
        { row: size - 1, col: size - 1 },
        { row: 0, col: size - 1 },
        { row: size - 1, col: 0 }
      ];

      while (seeds.length < count) {
        const seed = { row: randomInt(1, size - 2), col: randomInt(1, size - 2) };
        const farEnough = seeds.every(s => Math.abs(s.row - seed.row) + Math.abs(s.col - seed.col) >= 3);
        if (farEnough) seeds.push(seed);
      }

      return seeds;
    }

    function generateRoomRegions() {
      const roomCount = randomInt(8, 11);
      const seeds = createRoomSeeds(roomCount);

      rooms = seeds.map((seed, id) => ({
        id,
        cells: [],
        kind: id === 0 ? "start" : id === 1 ? "boss" : "normal",
        monster: {
          name: id === 1 ? "Dragon" : randomMonsterName(),
          hp: id === 1 ? 35 + level * 5 : 15 + Math.floor(level / 2) * 5,
          maxHp: id === 1 ? 35 + level * 5 : 15 + Math.floor(level / 2) * 5,
          defeated: id === 0
        }
      }));

      const owner = Array.from({ length: size }, () => Array(size).fill(null));
      const frontier = [];

      seeds.forEach((seed, id) => {
        owner[seed.row][seed.col] = id;
        frontier.push({ ...seed, id });
      });

      while (frontier.length > 0) {
        const index = randomInt(0, frontier.length - 1);
        const cell = frontier.splice(index, 1)[0];
        const dirs = shuffle(["top", "right", "bottom", "left"]);

        for (const dir of dirs) {
          const d = delta(dir);
          const nr = cell.row + d.row;
          const nc = cell.col + d.col;
          if (nr < 0 || nr >= size || nc < 0 || nc >= size) continue;
          if (owner[nr][nc] !== null) continue;

          owner[nr][nc] = cell.id;
          frontier.push({ row: nr, col: nc, id: cell.id });
        }
      }

      map = makeEmptyMap();
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          map[row][col].roomId = owner[row][col];
          rooms[owner[row][col]].cells.push({ row, col });
        }
      }
    }

    function buildWallsAndDoors() {
      addOuterWalls();

      // Every border between two different rooms starts as a wall.
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          for (const dir of ["right", "bottom"]) {
            const d = delta(dir);
            const nr = row + d.row;
            const nc = col + d.col;
            if (nr >= size || nc >= size) continue;
            if (map[row][col].roomId !== map[nr][nc].roomId) {
              setBorder(row, col, dir, WALL);
            }
          }
        }
      }

      const adj = findRoomAdjacencies();
      const treePairs = makeRoomSpanningTree(adj);
      const allDoorPairs = new Set(treePairs.map(pairKey));

      // Add a few optional doors, but never more than one door between the same two rooms.
      for (const edge of shuffle([...adj])) {
        if (allDoorPairs.has(pairKey(edge))) continue;
        if (Math.random() < 0.18) allDoorPairs.add(pairKey(edge));
      }

      for (const pair of allDoorPairs) {
        const [a, b] = pair.split("-").map(Number);
        placeSingleDoorBetweenRooms(a, b);
      }
    }

    function pairKey(edge) {
      const a = Math.min(edge.a, edge.b);
      const b = Math.max(edge.a, edge.b);
      return `${a}-${b}`;
    }

    function findRoomAdjacencies() {
      const byPair = new Map();
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          for (const dir of ["right", "bottom"]) {
            const d = delta(dir);
            const nr = row + d.row;
            const nc = col + d.col;
            if (nr >= size || nc >= size) continue;

            const a = map[row][col].roomId;
            const b = map[nr][nc].roomId;
            if (a === b) continue;

            const k = `${Math.min(a, b)}-${Math.max(a, b)}`;
            if (!byPair.has(k)) byPair.set(k, { a: Math.min(a, b), b: Math.max(a, b), borders: [] });
            byPair.get(k).borders.push({ row, col, dir });
          }
        }
      }
      return [...byPair.values()];
    }

    function makeRoomSpanningTree(edges) {
      const connected = new Set([0]);
      const chosen = [];

      while (connected.size < rooms.length) {
        const candidates = edges.filter(edge =>
          connected.has(edge.a) !== connected.has(edge.b)
        );

        if (candidates.length === 0) break;
        const edge = candidates[randomInt(0, candidates.length - 1)];
        chosen.push(edge);
        connected.add(edge.a);
        connected.add(edge.b);
      }

      return chosen;
    }

    function placeSingleDoorBetweenRooms(roomA, roomB) {
      const borders = [];
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          for (const dir of ["top", "right", "bottom", "left"]) {
            const d = delta(dir);
            const nr = row + d.row;
            const nc = col + d.col;
            if (nr < 0 || nr >= size || nc < 0 || nc >= size) continue;
            const a = map[row][col].roomId;
            const b = map[nr][nc].roomId;
            if ((a === roomA && b === roomB) || (a === roomB && b === roomA)) {
              borders.push({ row, col, dir });
            }
          }
        }
      }

      if (borders.length === 0) return;
      const door = borders[randomInt(0, borders.length - 1)];
      setBorder(door.row, door.col, door.dir, DOOR);
    }

    function addInternalWalls() {
      // Interior walls are allowed inside a room, but never doors.
      // Keep them short so the room still feels open and remains accessible.
      for (const room of rooms) {
        const attempts = room.cells.length > 14 ? 3 : 1;
        for (let i = 0; i < attempts; i++) {
          const cell = room.cells[randomInt(0, room.cells.length - 1)];
          const dirs = shuffle(["top", "right", "bottom", "left"]);
          for (const dir of dirs) {
            const d = delta(dir);
            const nr = cell.row + d.row;
            const nc = cell.col + d.col;
            if (nr < 0 || nr >= size || nc < 0 || nc >= size) continue;
            if (map[nr][nc].roomId !== room.id) continue;

            const old = map[cell.row][cell.col].borders[dir];
            setBorder(cell.row, cell.col, dir, WALL);
            if (allFloorCellsReachable()) break;
            setBorder(cell.row, cell.col, dir, old);
          }
        }
      }
    }

    function canMoveFrom(row, col, dir) {
      const d = delta(dir);
      const nr = row + d.row;
      const nc = col + d.col;
      if (nr < 0 || nr >= size || nc < 0 || nc >= size) return false;
      return map[row][col].borders[dir] !== WALL;
    }

    function allFloorCellsReachable() {
      const start = { row: 0, col: 0 };
      const seen = new Set([`${start.row},${start.col}`]);
      const queue = [start];

      while (queue.length > 0) {
        const cell = queue.shift();
        for (const dir of ["top", "right", "bottom", "left"]) {
          if (!canMoveFrom(cell.row, cell.col, dir)) continue;
          const d = delta(dir);
          const next = { row: cell.row + d.row, col: cell.col + d.col };
          const k = `${next.row},${next.col}`;
          if (seen.has(k)) continue;
          seen.add(k);
          queue.push(next);
        }
      }

      return seen.size === size * size;
    }

    function monsterPosition(room) {
      if (room.kind === "boss") return nearestRoomCell(room, { row: size - 2, col: size - 2 });
      return nearestRoomCell(room, centerOfRoom(room));
    }

    function generateDungeon() {
      for (let tries = 0; tries < 50; tries++) {
        generateRoomRegions();
        buildWallsAndDoors();
        addInternalWalls();

        if (allFloorCellsReachable()) {
          player = nearestRoomCell(rooms[0], { row: 0, col: 0 });
          currentRoom = rooms[0];
          return;
        }
      }
    }

    function drawGrid() {
      grid.innerHTML = "";
      status.textContent = `Level ${level}: ${operation === "addition" ? "addition" : "subtraction"}`;

      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const data = map[row][col];
          const room = roomAt(row, col);
          const cell = document.createElement("div");
          cell.classList.add("cell");

          if (room.kind === "start") cell.classList.add("start-room");
          if (room.kind === "boss") cell.classList.add("boss-room");

          for (const dir of ["top", "right", "bottom", "left"]) {
            const border = data.borders[dir];
            if (border === WALL) cell.classList.add(`wall-${dir}`);
            if (border === DOOR) cell.classList.add(`door-${dir}`);
          }

          if (room && !room.monster.defeated) {
            const pos = monsterPosition(room);
            if (row === pos.row && col === pos.col) {
              cell.classList.add(room.kind === "boss" ? "dragon" : "monster");
            }
          }

          if (player.row === row && player.col === col) cell.classList.add("player");
          grid.appendChild(cell);
        }
      }
    }

    function movePlayer(deltaRow, deltaCol, dir) {
      if (waitingForNextLevel) {
        message.textContent = "Press Enter for next level.";
        return;
      }

      if (inCombat) {
        message.textContent = "Defeat the enemy before moving again!";
        return;
      }

      if (!canMoveFrom(player.row, player.col, dir)) {
        message.textContent = "A wall blocks your way. Look for a door.";
        return;
      }

      player = { row: player.row + deltaRow, col: player.col + deltaCol };
      message.textContent = "";

      const enteredRoom = roomAt(player.row, player.col);
      if (enteredRoom && enteredRoom !== currentRoom) {
        currentRoom = enteredRoom;
        if (!enteredRoom.monster.defeated) startCombat(enteredRoom);
      } else if (enteredRoom && !enteredRoom.monster.defeated && enteredRoom.kind !== "start") {
        startCombat(enteredRoom);
      }

      drawGrid();
    }

    function startCombat(room) {
      currentEnemy = room.monster;
      inCombat = true;
      combatPanel.style.display = "block";
      enemyName.textContent = currentEnemy.name;
      message.textContent = `${currentEnemy.name} attacks! Combat takes place in the whole room.`;
      updateHpText();
      generateProblem(room.kind === "boss");
      answerInput.focus();
    }

    function updateHpText() {
      playerHpText.textContent = playerHp;
      enemyHpText.textContent = currentEnemy ? currentEnemy.hp : "-";
    }

    function generateProblem(isBoss = false) {
      let a;
      let b;

      if (operation === "addition") {
        const max = isBoss ? 19 + level * 2 : 9;
        a = randomInt(0, max);
        b = randomInt(0, max);
        currentAnswer = a + b;
        problem.textContent = `${a} + ${b} = ?`;
      } else {
        const max = isBoss ? 29 + level * 2 : 12;
        a = randomInt(0, max);
        b = randomInt(0, a); // avoids negative answers
        currentAnswer = a - b;
        problem.textContent = `${a} - ${b} = ?`;
      }

      answerInput.value = "";
    }

    function submitCombatAnswer() {
      if (!inCombat || !currentEnemy) return;

      const userAnswer = Number(answerInput.value);
      if (answerInput.value.trim() === "") {
        combatMessage.textContent = "Enter an answer first.";
        return;
      }

      const isBoss = currentEnemy.name === "Dragon";
      if (userAnswer === currentAnswer) {
        currentEnemy.hp -= isBoss ? 5 : 5;
        combatMessage.textContent = `Correct! ${currentEnemy.name} loses 5 HP.`;
      } else {
        playerHp -= isBoss ? 7 : 5;
        combatMessage.textContent = `Wrong! The answer was ${currentAnswer}. You lose ${isBoss ? 7 : 5} HP.`;
      }

      if (currentEnemy.hp <= 0) {
        currentEnemy.hp = 0;
        currentEnemy.defeated = true;
        updateHpText();

        if (currentEnemy.name === "Dragon") {
          combatMessage.textContent = "You defeated the dragon!";
          message.textContent = "Press Enter for next level.";
          waitingForNextLevel = true;
        } else {
          combatMessage.textContent = `You defeated the ${currentEnemy.name}!`;
          message.textContent = "Room cleared. Keep exploring.";
        }

        inCombat = false;
        currentEnemy = null;
        combatPanel.style.display = "none";
        drawGrid();
        return;
      }

      if (playerHp <= 0) {
        playerHp = 0;
        updateHpText();
        combatMessage.textContent = `${currentEnemy.name} defeated you!`;
        message.textContent = "Game over. Generate a new dungeon to try again.";
        inCombat = false;
        currentEnemy = null;
        drawGrid();
        return;
      }

      updateHpText();
      generateProblem(isBoss);
      answerInput.focus();
    }

    function nextLevel() {
      level++;
      operation = "subtraction";
      waitingForNextLevel = false;
      generateDungeon();
      inCombat = false;
      currentEnemy = null;
      playerHp = Math.min(playerHp + 20, 50);
      message.textContent = "Level 2 begins: subtraction. Answers will never be negative.";
      combatMessage.textContent = "";
      combatPanel.style.display = "none";
      drawGrid();
    }

    document.addEventListener("keydown", (event) => {
      const keyPressed = event.key.toLowerCase();

      if (waitingForNextLevel && event.key === "Enter") {
        nextLevel();
        return;
      }

      if (inCombat && event.key === "Enter") {
        submitCombatAnswer();
        return;
      }

      if (["w", "a", "s", "d"].includes(keyPressed)) event.preventDefault();

      if (keyPressed === "w") movePlayer(-1, 0, "top");
      if (keyPressed === "s") movePlayer(1, 0, "bottom");
      if (keyPressed === "a") movePlayer(0, -1, "left");
      if (keyPressed === "d") movePlayer(0, 1, "right");
    });

    submitAnswer.addEventListener("click", submitCombatAnswer);

    function newGame() {
      level = 1;
      operation = "addition";
      waitingForNextLevel = false;
      generateDungeon();
      inCombat = false;
      currentEnemy = null;
      playerHp = 40;
      message.textContent = "";
      combatMessage.textContent = "";
      combatPanel.style.display = "none";
      updateHpText();
      drawGrid();
    }

    newGame();
  </script>
</body>
</html>
