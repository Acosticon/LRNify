name: Weekly blog post

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate blog post
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-blog-post.mjs

      - name: Create Pull Request
        if: steps.gen.outputs.has_post == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Blogg: ${{ steps.gen.outputs.title }}"
          branch: blog/${{ steps.gen.outputs.slug }}
          delete-branch: true
          base: main
          title: "Blogg: ${{ steps.gen.outputs.title }}"
          body: |
            Automatisk generert ukentlig blogginnlegg – se gjennom teksten før merge.

            Ressurs: `${{ steps.gen.outputs.url_path }}`

            Denne PR-en merges ikke automatisk.
          labels: blog,automated

      - name: Queue empty
        if: steps.gen.outputs.has_post == 'false'
        run: echo "### Bloggkøen er tom denne uken – ingen PR opprettet." >> "$GITHUB_STEP_SUMMARY"
