<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fotball-gloser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Bangers&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   FOTBALL-GLOSER  —  designtokens
   ========================================================================= */
:root{
  --grass-1:#3fbf5a;   --grass-2:#2aa24a;   --grass-line:#7fe49b;
  --sky-1:#5fc8ff;     --sky-2:#a9e7ff;
  --sun:#ffd23f;       --coral:#ff5a5f;     --coral-dark:#e23c41;
  --blue:#2b6cff;      --purple:#7c3aed;    --teal:#14b8a6;
  --magenta:#e11d8f;   --orange:#ff7a00;
  --ink:#1b2a4a;       --ink-soft:#3a4a6b;
  --paper:#ffffff;     --paper-2:#fff7e9;
  --good:#22c55e;      --good-dark:#15803d;
  --bad:#ef4444;       --bad-dark:#b91c1c;
  --shadow:0 10px 0 rgba(0,0,0,.12), 0 18px 30px rgba(20,30,60,.22);
  --shadow-sm:0 4px 0 rgba(0,0,0,.12), 0 8px 14px rgba(20,30,60,.18);
  --radius:26px;
  --display:'Luckiest Guy', 'Fredoka', system-ui, sans-serif;
  --body:'Fredoka', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --comic:'Bangers','Luckiest Guy', system-ui, sans-serif;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--body); color:var(--ink);
  background:#0b1c3a; overflow:hidden; touch-action:manipulation;
  font-size:clamp(15px,2.4vw,19px);
}

/* App-skall ----------------------------------------------------------------*/
#app{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}
.screen{
  position:absolute; inset:0; display:none; flex-direction:column;
  align-items:center; justify-content:center; padding:env(safe-area-inset-top) 14px 14px;
  overflow:auto;
}
.screen.active{display:flex; animation:screenIn .45s cubic-bezier(.2,.9,.3,1.3);}
@keyframes screenIn{from{opacity:0; transform:scale(.96) translateY(14px);} to{opacity:1; transform:none;}}

/* Stadionbakgrunn ----------------------------------------------------------*/
.stadium-bg{position:absolute; inset:0; overflow:hidden; z-index:0;}
.stadium-bg .sky{position:absolute; inset:0; background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 60%, #d9f3ff);}
.stadium-bg .stand{
  position:absolute; left:-5%; right:-5%; height:34%; top:6%;
  background:
    repeating-linear-gradient(90deg, #6b53c9 0 22px, #5b46b0 22px 44px);
  border-bottom:10px solid #3c2c80;
  border-radius:0 0 40px 40px / 0 0 28px 28px;
}
.stadium-bg .crowd{
  position:absolute; left:0; right:0; top:7%; height:27%; opacity:.95;
  background-image:
    radial-gradient(circle, #ff5a5f 6px, transparent 7px),
    radial-gradient(circle, #ffd23f 6px, transparent 7px),
    radial-gradient(circle, #2b6cff 6px, transparent 7px),
    radial-gradient(circle, #22c55e 6px, transparent 7px),
    radial-gradient(circle, #ffffff 6px, transparent 7px),
    radial-gradient(circle, #a78bfa 6px, transparent 7px);
  background-size:48px 30px;
  background-position:0 2px, 24px 16px, 12px 2px, 36px 16px, 6px 16px, 30px 2px;
  background-repeat:repeat;
}
.stadium-bg .light{
  position:absolute; top:0; width:18px; height:60px; background:#cfd8e6;
  border-radius:6px;
}
.stadium-bg .light::after{
  content:""; position:absolute; top:-30px; left:50%; transform:translateX(-50%);
  width:64px; height:34px; border-radius:50%/40%;
  background:radial-gradient(ellipse at center, #fff,#fff6c8 55%, transparent 72%);
  filter:blur(.4px);
}
.stadium-bg .light.l1{left:8%;} .stadium-bg .light.l2{right:8%;}
.stadium-bg .pitch{
  position:absolute; left:-4%; right:-4%; bottom:-2%; height:62%;
  background:
    repeating-linear-gradient(90deg, var(--grass-1) 0 8%, var(--grass-2) 8% 16%);
  border-top:8px solid #1f8f3f;
  border-radius:50% 50% 0 0 / 18% 18% 0 0;
  box-shadow:inset 0 18px 40px rgba(255,255,255,.18);
}
.stadium-bg .pitch::before{
  content:""; position:absolute; left:50%; top:14%; transform:translateX(-50%);
  width:42%; height:0; border-top:5px solid rgba(255,255,255,.55);
}
.stadium-bg .pitch::after{
  content:""; position:absolute; left:50%; top:14%; transform:translate(-50%,-50%);
  width:120px; height:120px; border:5px solid rgba(255,255,255,.5); border-radius:50%;
}
.adboard{
  position:absolute; left:50%; transform:translateX(-50%); top:31%;
  display:flex; gap:6px; font-family:var(--comic); letter-spacing:1px;
  white-space:nowrap; z-index:1; pointer-events:none;
}
.adboard span{
  background:var(--ink); color:#fff; padding:5px 12px; border-radius:8px;
  font-size:clamp(10px,1.6vw,15px); box-shadow:var(--shadow-sm);
}
.adboard span:nth-child(2n){background:var(--coral);}
.adboard span:nth-child(3n){background:var(--sun); color:var(--ink);}

/* Konfetti / energi --------------------------------------------------------*/
.confetti{position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden;}
.confetti i{
  position:absolute; top:-20px; width:11px; height:16px; border-radius:3px; opacity:.9;
  animation:fall linear infinite;
}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg);}}

/* Tittel / kort ------------------------------------------------------------*/
.title{
  font-family:var(--display); color:#fff; text-align:center; line-height:.98;
  font-size:clamp(44px,12vw,108px);
  text-shadow:0 5px 0 var(--coral-dark), 0 9px 0 rgba(0,0,0,.25), 0 14px 24px rgba(0,0,0,.3);
  transform:rotate(-3deg); margin:0;
  -webkit-text-stroke:3px var(--ink);
}
.title .a{color:var(--sun);} .title .b{color:#fff;}
.subtitle{
  font-family:var(--comic); color:#fff; background:var(--purple);
  padding:8px 20px; border-radius:40px; margin:18px 0 30px;
  font-size:clamp(16px,3.4vw,26px); letter-spacing:1px;
  box-shadow:var(--shadow-sm); transform:rotate(-1deg); text-align:center;
}

.card-panel{
  position:relative; z-index:2; width:min(960px,100%);
  background:rgba(255,255,255,.92); backdrop-filter:blur(4px);
  border-radius:var(--radius); padding:clamp(16px,3vw,28px);
  box-shadow:var(--shadow); border:4px solid #fff;
}
.panel-title{
  font-family:var(--display); font-size:clamp(24px,5vw,40px); color:var(--ink);
  text-align:center; margin:0 0 4px; -webkit-text-stroke:1px rgba(0,0,0,.06);
}
.panel-sub{text-align:center; color:var(--ink-soft); margin:0 0 18px; font-weight:600;}

/* Knapper ------------------------------------------------------------------*/
.btn{
  font-family:var(--display); font-size:clamp(20px,4vw,30px); color:#fff;
  background:var(--coral); border:none; cursor:pointer; border-radius:50px;
  padding:16px 40px; box-shadow:0 8px 0 var(--coral-dark), 0 14px 22px rgba(0,0,0,.28);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s; position:relative; z-index:2;
  letter-spacing:.5px; -webkit-text-stroke:1px rgba(0,0,0,.12);
}
.btn:hover{transform:translateY(-3px); filter:saturate(1.1) brightness(1.04);}
.btn:active{transform:translateY(5px); box-shadow:0 2px 0 var(--coral-dark), 0 5px 10px rgba(0,0,0,.25);}
.btn.green{background:var(--good); box-shadow:0 8px 0 var(--good-dark), 0 14px 22px rgba(0,0,0,.28);}
.btn.green:active{box-shadow:0 2px 0 var(--good-dark);}
.btn.blue{background:var(--blue); box-shadow:0 8px 0 #1b46b0, 0 14px 22px rgba(0,0,0,.28);}
.btn.blue:active{box-shadow:0 2px 0 #1b46b0;}
.btn:focus-visible, .pickcard:focus-visible, .answer:focus-visible, .iconbtn:focus-visible{
  outline:5px solid var(--sun); outline-offset:4px;
}
.btn-row{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:8px;}

/* Tema-grid ---------------------------------------------------------------*/
.grid{display:grid; gap:14px;}
.theme-grid{grid-template-columns:repeat(5,1fr);}
.player-grid{grid-template-columns:repeat(5,1fr);}
.pickcard{
  font-family:var(--body); font-weight:700; cursor:pointer; border:none;
  background:#fff; border-radius:22px; padding:14px 8px 16px; text-align:center;
  box-shadow:var(--shadow-sm); transition:transform .14s cubic-bezier(.2,.9,.3,1.4), box-shadow .14s;
  display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--ink);
  border:3px solid transparent; position:relative;
}
.pickcard:hover{transform:translateY(-6px) scale(1.03);}
.pickcard:active{transform:translateY(-2px) scale(.99);}
.pickcard .ic{
  width:62px; height:62px; border-radius:18px; display:grid; place-items:center;
  font-size:34px; box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);
}
.pickcard .nm{font-size:clamp(13px,2.4vw,18px); line-height:1.1;}
.pickcard .role{font-size:11px; color:var(--ink-soft); font-weight:600;}
.pickcard .charwrap{width:88px; height:104px;}

/* =========================================================================
   SPILLSKJERM
   ========================================================================= */
#screen-play{justify-content:flex-start; padding:0;}

/* Stadion-scoreboard (jumbotron) foran tribunen, midtstilt i x-retning */
.scoreboard{
  position:absolute; top:calc(10px + env(safe-area-inset-top)); left:50%;
  transform:translateX(-50%); z-index:7; display:flex; align-items:stretch;
  max-width:94%; padding:9px 8px;
  background:linear-gradient(180deg,#15275e,#0a1430);
  border:5px solid #060d22; border-radius:18px;
  box-shadow:0 9px 0 rgba(0,0,0,.4), 0 16px 28px rgba(0,0,0,.45), inset 0 0 0 3px #2b4a92;
}
.scoreboard::before{ /* opphengsbrakett mot tribunen */
  content:""; position:absolute; left:50%; top:-15px; transform:translateX(-50%);
  width:46%; height:15px; background:#060d22; border-radius:7px 7px 0 0;
  box-shadow:inset 0 3px 0 #2b4a92;
}
.sb-cell{display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:3px clamp(8px,2.4vw,18px); min-width:60px;}
.sb-label{font-family:var(--body); font-weight:700; letter-spacing:1.6px;
  font-size:clamp(8px,1.7vw,11px); color:#86a9ff; text-transform:uppercase;}
.sb-val{font-family:var(--display); font-size:clamp(16px,3.4vw,26px); line-height:1.05; color:#ffd23f;}
.sb-val.score{color:#7dff8e; text-shadow:0 0 9px rgba(125,255,142,.65);}
.sb-val.score b{color:#fff;}
.sb-val.qn{color:#86d4ff; text-shadow:0 0 9px rgba(134,212,255,.6);}
.sb-val.theme{color:#ffd23f; font-size:clamp(13px,2.8vw,22px); text-shadow:0 0 9px rgba(255,210,63,.55); white-space:nowrap;}
.sb-div{width:3px; align-self:stretch; margin:6px 0; border-radius:2px;
  background:linear-gradient(#2b4a92,#0a1430);}
.sb-streak{
  position:absolute; top:100%; left:50%; margin-top:8px;
  transform:translateX(-50%) scale(.5); opacity:0; transition:.22s cubic-bezier(.2,.9,.3,1.5);
  font-family:var(--comic); letter-spacing:1px; color:#fff; white-space:nowrap;
  background:linear-gradient(180deg,#8b46f0,#5b2bb8); padding:5px 16px; border-radius:30px;
  border:3px solid #c9a8ff; box-shadow:0 5px 0 rgba(0,0,0,.3); font-size:clamp(13px,2.6vw,18px);
}
.sb-streak.show{opacity:1; transform:translateX(-50%) scale(1);}

/* Flytende lyd-knapp */
.sound-float{position:absolute; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:8;}
.iconbtn{
  width:46px; height:46px; border-radius:50%; border:3px solid #fff; cursor:pointer;
  background:var(--blue); color:#fff; font-size:22px; box-shadow:var(--shadow-sm);
  display:grid; place-items:center; transition:transform .12s;
}
.iconbtn:active{transform:scale(.9);}

/* Scene -------------------------------------------------------------------*/
.stage-wrap{position:relative; z-index:4; width:100%; flex:1; min-height:0; display:flex; flex-direction:column;}
.stage{
  position:relative; width:min(900px,100%); margin:0 auto; flex:1; min-height:200px;
}
.fighter{
  position:absolute; bottom:6%; width:24%; max-width:200px;
  transition:transform .25s; will-change:transform;
}
.fighter.player{left:4%;}
.fighter.opponent{right:4%;}
.fighter .charwrap{width:100%;}
.name-tag{
  position:absolute; left:50%; transform:translateX(-50%); top:-10px;
  font-family:var(--comic); background:var(--ink); color:#fff; padding:2px 12px;
  border-radius:20px; font-size:clamp(11px,2vw,16px); letter-spacing:1px; white-space:nowrap;
}
.opponent .name-tag{background:var(--coral-dark);}

/* Idle-animasjoner */
.idle-bob{animation:bob 2.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);}}
.idle-dance{animation:dance 1.1s ease-in-out infinite;}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-9px) rotate(3deg);}}

/* Pose-animasjoner */
.charge{animation:charge .26s ease-in-out;}
@keyframes charge{0%{transform:none;} 60%{transform:translateX(-12px) rotate(-7deg);} 100%{transform:none;}}
.celebrate{animation:celebrate .8s ease;}
@keyframes celebrate{0%{transform:translateY(0);} 25%{transform:translateY(-22px) rotate(-6deg);} 50%{transform:translateY(0);} 75%{transform:translateY(-12px) rotate(4deg);} 100%{transform:translateY(0);}}
.gethit{animation:gethit .8s ease;}
@keyframes gethit{
  0%{transform:translateY(0) rotate(0);}
  12%{transform:translateY(-30px) scaleY(1.12) scaleX(.92);}
  30%{transform:translateY(-30px) rotate(8deg);}
  55%{transform:translateY(6px) rotate(-12deg) scaleY(.9);}
  80%{transform:translateY(0) rotate(6deg);}
  100%{transform:translateY(0) rotate(0);}
}
.laughpose{animation:laughpose .7s ease;}
@keyframes laughpose{0%,100%{transform:none;} 25%{transform:translateY(-6px) rotate(-5deg);} 50%{transform:translateY(0) rotate(5deg);} 75%{transform:translateY(-4px) rotate(-3deg);}}

/* Aura ved opplading */
.aura{position:absolute; inset:-8% -10%; pointer-events:none; opacity:0;}
.aura.on{animation:auraflash .4s ease;}
@keyframes auraflash{0%{opacity:0; transform:scale(.7);} 50%{opacity:1; transform:scale(1.05);} 100%{opacity:0; transform:scale(1.2);}}

/* Ball --------------------------------------------------------------------*/
.ball{
  position:absolute; width:9%; max-width:74px; aspect-ratio:1; left:24%; top:60%;
  z-index:5; transform:translate(-50%,-50%); will-change:left,top,transform;
}
.ball .spin{width:100%; height:100%;}
.ball.spinning .spin{animation:spin .35s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ball.flying::before{
  content:""; position:absolute; top:50%; right:60%; transform:translateY(-50%);
  width:120px; height:8px; border-radius:8px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.85));
  filter:blur(1px); animation:streakpulse .2s infinite alternate;
}
@keyframes streakpulse{from{opacity:.5;} to{opacity:1;}}

/* Tegneserieord -----------------------------------------------------------*/
.comic{
  position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) rotate(-8deg) scale(0);
  font-family:var(--comic); font-size:clamp(40px,12vw,96px); color:var(--sun);
  -webkit-text-stroke:5px var(--ink); text-stroke:5px var(--ink);
  z-index:9; pointer-events:none; text-shadow:0 8px 0 rgba(0,0,0,.25); letter-spacing:2px;
}
.comic.pop{animation:comicpop .8s cubic-bezier(.2,.9,.3,1.6) forwards;}
@keyframes comicpop{
  0%{transform:translate(-50%,-50%) rotate(-18deg) scale(0);}
  35%{transform:translate(-50%,-50%) rotate(6deg) scale(1.25);}
  60%{transform:translate(-50%,-50%) rotate(-4deg) scale(1);}
  100%{transform:translate(-50%,-60%) rotate(-4deg) scale(1); opacity:0;}
}

/* Partikler ---------------------------------------------------------------*/
.fx-layer{position:absolute; inset:0; z-index:8; pointer-events:none; overflow:visible;}
.particle{position:absolute; will-change:transform,opacity;}

/* Skjermristing */
@keyframes shakeit{
  0%,100%{transform:translate(0,0);}
  20%{transform:translate(-8px,4px) rotate(-.6deg);}
  40%{transform:translate(7px,-5px) rotate(.6deg);}
  60%{transform:translate(-6px,5px) rotate(-.4deg);}
  80%{transform:translate(5px,-3px) rotate(.4deg);}
}
.shake{animation:shakeit .42s;}

/* Quiz-boks ---------------------------------------------------------------*/
.quizpanel{position:relative; z-index:6; width:min(820px,100%); margin:0 auto 12px; padding:0 12px;}
.qbox{
  background:#fff; border-radius:var(--radius); padding:16px 18px 18px;
  box-shadow:var(--shadow); border:4px solid var(--sun); text-align:center;
}
.qlabel{font-weight:700; color:var(--ink-soft); margin:0 0 2px; font-size:clamp(15px,3vw,22px);}
.qword{
  font-family:var(--display); color:var(--blue); font-size:clamp(34px,9vw,64px);
  line-height:1; margin:2px 0 14px; -webkit-text-stroke:2px var(--ink);
  word-break:break-word;
}
.answers{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.answer{
  font-family:var(--body); font-weight:700; font-size:clamp(18px,4.4vw,28px); color:var(--ink);
  background:var(--paper-2); border:4px solid #ffe6b3; border-radius:20px;
  padding:18px 10px; cursor:pointer; min-height:64px;
  box-shadow:0 6px 0 #e8c98a; transition:transform .12s, box-shadow .12s, background .12s, border-color .12s;
}
.answer:hover:not(:disabled){transform:translateY(-4px); background:#fffdf6;}
.answer:active:not(:disabled){transform:translateY(3px); box-shadow:0 2px 0 #e8c98a;}
.answer:disabled{cursor:default;}
.answer.correct{background:var(--good); color:#fff; border-color:var(--good-dark); box-shadow:0 6px 0 var(--good-dark); animation:popcorrect .4s;}
.answer.wrong{background:var(--bad); color:#fff; border-color:var(--bad-dark); box-shadow:0 6px 0 var(--bad-dark); animation:wiggle .4s;}
.answer.dim{opacity:.45;}
@keyframes popcorrect{0%{transform:scale(1);}50%{transform:scale(1.08);}100%{transform:scale(1);}}
@keyframes wiggle{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}

.feedback{
  text-align:center; font-family:var(--comic); letter-spacing:1px;
  font-size:clamp(18px,4.4vw,30px); margin:12px auto 4px; min-height:1.4em;
  color:#fff; opacity:0; transition:.2s; max-width:780px;
}
.feedback.show{opacity:1;}
.feedback.good{color:#eafff0; text-shadow:0 3px 0 var(--good-dark);}
.feedback.bad{color:#fff0f0; text-shadow:0 3px 0 var(--bad-dark);}

/* Sluttskjerm -------------------------------------------------------------*/
.result-char{width:200px; height:236px; margin:0 auto 6px;}
.result-score{font-family:var(--display); font-size:clamp(40px,11vw,88px); color:var(--coral); -webkit-text-stroke:2px var(--ink); margin:6px 0;}
.result-comment{font-family:var(--comic); font-size:clamp(18px,4vw,28px); color:var(--ink); margin:0 0 18px; letter-spacing:.5px;}

/* Tilgjengelighet ---------------------------------------------------------*/
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0;}

/* Redusert bevegelse ------------------------------------------------------*/
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  .ball.flying::before{display:none;}
  .confetti{display:none;}
}
body.no-motion .idle-bob,
body.no-motion .idle-dance,
body.no-motion .confetti i,
body.no-motion .ball.spinning .spin{animation:none !important;}

/* ===================== RESPONSIV (mobil/nettbrett) ===================== */
@media (max-width:760px){
  .theme-grid{grid-template-columns:repeat(2,1fr);}
  .player-grid{grid-template-columns:repeat(2,1fr);}
  .fighter{width:30%;}
  .stage{min-height:34vh;}
  .ball{width:12%;}
}
@media (max-width:430px){
  .answers{grid-template-columns:1fr 1fr;}
  .answer{font-size:clamp(16px,5.4vw,22px); padding:16px 6px;}
  .fighter{width:34%;}
  .pickcard .charwrap{width:74px; height:90px;}
}
@media (max-height:560px) and (orientation:landscape){
  .stage{min-height:30vh;}
}
</style>
</head>
<body>
<div id="app">

  <!-- ================= STARTMENY ================= -->
  <section class="screen active" id="screen-start" aria-label="Startmeny">
    <div class="stadium-bg" id="bg-start"></div>
    <div class="confetti" id="confetti-start"></div>
    <div class="adboard"><span>GLOSEKRAFT</span><span>SPRÅK FC</span><span>ORDKRAFT</span></div>
    <div style="position:relative; z-index:3; text-align:center; display:flex; flex-direction:column; align-items:center;">
      <h1 class="title"><span class="b">Fotball</span><span class="a">-gloser</span></h1>
      <p class="subtitle">Lær engelske ord med skudd, quiz og kaos!</p>
      <button class="btn" id="btn-start">Start spillet</button>
    </div>
  </section>

  <!-- ================= TEMAVALG ================= -->
  <section class="screen" id="screen-theme" aria-label="Velg tema">
    <div class="stadium-bg"></div>
    <div class="card-panel">
      <h2 class="panel-title">Velg tema</h2>
      <p class="panel-sub">Hvilke ord vil du øve på?</p>
      <div class="grid theme-grid" id="theme-grid"></div>

/* ---------- 4. LYD (Web Audio API) ---------- */
const Sound = (function(){
  let ctx=null, enabled=true, master=null;
  function ensure(){
    if(!ctx){
      const AC = window.AudioContext||window.webkitAudioContext;
      if(!AC) return false;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value=0.5; master.connect(ctx.destination);
    }
    if(ctx.state==="suspended") ctx.resume();
    return true;
  }
  function tone(freq,dur,type="sine",vol=.3,glideTo=null,delay=0){
    if(!enabled||!ensure()) return;
    const t0=ctx.currentTime+delay;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t0);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.05);
  }
  function noise(dur,vol=.3,filterFreq=1000,delay=0){
    if(!enabled||!ensure()) return;
    const t0=ctx.currentTime+delay;
    const n=Math.floor(ctx.sampleRate*dur);
    const buf=ctx.createBuffer(1,n,ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<n;i++) data[i]=(Math.random()*2-1)*(1-i/n);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=filterFreq;
    const g=ctx.createGain(); g.gain.value=vol;
    src.connect(f); f.connect(g); g.connect(master); src.start(t0);
  }
  return {
    setEnabled(v){enabled=v;}, get enabled(){return enabled;}, kick:()=>ensure(),
    click(){tone(520,.08,"square",.18);},
    correct(){tone(523,.12,"square",.22);tone(659,.12,"square",.2,null,.1);tone(784,.18,"square",.22,null,.2);tone(1047,.3,"triangle",.22,null,.3);},
    wrong(){tone(300,.5,"sawtooth",.2,90);},
    shoot(){noise(.12,.25,1600);tone(180,.18,"square",.2,520);},
    whoosh(){noise(.3,.18,2400);},
    hit(){tone(140,.18,"square",.35,60);noise(.16,.4,800);},
    boing(){tone(200,.3,"sine",.3,640);tone(640,.3,"sine",.25,200,.12);},
    squeak(){tone(900,.25,"sine",.25,2200);tone(2200,.2,"sine",.2,1000,.18);},
    cheer(){noise(.6,.35,2800);tone(700,.5,"triangle",.08,1200);},
    aww(){tone(420,.6,"sine",.2,240);noise(.5,.12,1200);},
    combo(){tone(660,.1,"triangle",.25);tone(880,.1,"triangle",.25,null,.08);tone(1175,.2,"triangle",.25,null,.16);}
  };
})();

/* ---------- 5. SPILLTILSTAND ---------- */
const GameState = {START_MENU:0,THEME_SELECT:1,PLAYER_SELECT:2,PLAYING:3,ANSWER_FEEDBACK:4,ROUND_END:5};
let selectedTheme=null, selectedPlayerKey=null, currentOpponentKey=null;
let questions=[], currentQuestionIndex=0, score=0, streak=0, currentQuestion=null;
let gameState=GameState.START_MENU, soundEnabled=true, busy=false;

/* ---------- 6. HJELPERE ---------- */
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait=ms=>new Promise(r=>setTimeout(r, reduceMotion?Math.min(ms,120):ms));

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
}

/* ---------- 7. DEKOR: stadion-bakgrunner ---------- */
function buildStadiums(){
  document.querySelectorAll(".stadium-bg").forEach(bg=>{
    if(bg.dataset.built) return; bg.dataset.built="1";
    bg.innerHTML=`
      <div class="sky"></div>
      <div class="stand"></div>
      <div class="crowd"></div>
      <div class="light l1"></div><div class="light l2"></div>
      <div class="pitch"></div>`;
  });
}
function buildConfetti(elId){
  const el=$(elId); if(!el||el.dataset.built) return; el.dataset.built="1";
  const cols=["#ff5a5f","#ffd23f","#2b6cff","#22c55e","#a78bfa","#ff7a00"];
  let html="";
  for(let i=0;i<40;i++){
    html+=`<i style="left:${Math.random()*100}%; background:${pick(cols)};
      animation-duration:${4+Math.random()*4}s; animation-delay:${-Math.random()*6}s;
      transform:rotate(${Math.random()*360}deg)"></i>`;
  }
  el.innerHTML=html;
}

/* ---------- 8. TEMA- OG SPILLERVALG ---------- */
function buildThemeCards(){
  const grid=$("theme-grid"); grid.innerHTML="";
  themes.forEach(t=>{
    const b=document.createElement("button");
    b.className="pickcard"; b.type="button";
    b.innerHTML=`<div class="ic" style="background:${t.color}">${t.icon}</div>
                 <div class="nm">${t.key}</div><div class="role">${t.role}</div>`;
    b.addEventListener("click",()=>{Sound.click(); selectedTheme=t.key; goPlayerSelect();});
    grid.appendChild(b);
  });
}
function buildPlayerCards(){
  const grid=$("player-grid"); grid.innerHTML="";
  Object.entries(players).forEach(([key,p])=>{
    const b=document.createElement("button");
    b.className="pickcard"; b.type="button";
    b.innerHTML=`<div class="charwrap idle-bob">${characterSVG(p,"idle")}</div>
                 <div class="nm">${p.name}</div><div class="role">${p.blurb}</div>`;
    b.addEventListener("click",()=>{Sound.click(); selectedPlayerKey=key; startRound();});
    grid.appendChild(b);
  });
}

/* ---------- 9. SPØRSMÅLSGENERERING ---------- */
function buildQuestions(theme){
  const list=wordLists[theme];
  // unngå duplikate norske svar i distraktor-pool
  const themePool=[...new Set(list.map(w=>w.norwegian))];
  const globalPool=[...new Set(wordLists["Blandede ord"].map(w=>w.norwegian))];
  const chosen=shuffle(list).slice(0,10);
  return chosen.map(w=>{
    const wrong=new Set();
    const tryAdd=pool=>{
      for(const cand of shuffle(pool)){
        if(wrong.size>=3) break;
        if(cand!==w.norwegian) wrong.add(cand);
      }
    };
    tryAdd(themePool);           // helst fra samme tema
    if(wrong.size<3) tryAdd(globalPool); // ellers fra alle ord
    const options=shuffle([w.norwegian, ...wrong]);
    return {english:w.english, correct:w.norwegian, options};
  });
}

/* ---------- 10. RUNDESTART ---------- */
function startRound(){
  gameState=GameState.PLAYING;
  currentOpponentKey=pick(Object.keys(opponents));
  questions=buildQuestions(selectedTheme);
  currentQuestionIndex=0; score=0; streak=0;
  // tegn figurer
  const p=players[selectedPlayerKey], o=opponents[currentOpponentKey];
  $("player-name").textContent=p.name;
  $("opp-name").textContent=o.name;
  $("hud-theme").textContent=selectedTheme;
  renderPlayer("idle"); renderOpponent(o.shades?"idle":"idle");
  $("opp-art").parentElement.classList.toggle("idle-dance", currentOpponentKey==="neimal");
  $("opp-art").parentElement.classList.toggle("idle-bob", currentOpponentKey!=="neimal");
  $("player-art").parentElement.classList.add("idle-bob");
  showScreen("screen-play");
  updateStreakChip();
  loadQuestion();
}
function renderPlayer(mood){ $("player-art").innerHTML=characterSVG(players[selectedPlayerKey],mood); }
function renderOpponent(mood){ $("opp-art").innerHTML=characterSVG(opponents[currentOpponentKey],mood); }

/* ---------- 11. LAST SPØRSMÅL ---------- */
function loadQuestion(){
  busy=false;
  currentQuestion=questions[currentQuestionIndex];
  $("hud-score").textContent=score;
  $("hud-qn").textContent=currentQuestionIndex+1;
  $("qword").textContent="“"+currentQuestion.english+"”";
  const fb=$("feedback"); fb.className="feedback"; fb.textContent="";
  // svar-knapper
  const wrap=$("answers"); wrap.innerHTML="";
  currentQuestion.options.forEach((opt,i)=>{
    const b=document.createElement("button");
    b.className="answer"; b.type="button"; b.textContent=opt;
    b.setAttribute("aria-label",`Alternativ ${i+1}: ${opt}`);
    b.addEventListener("click",()=>handleAnswer(b,opt));
    wrap.appendChild(b);
  });
  // ball tilbake til startposisjon
  resetBall();
}

/* ---------- 12. SVARHÅNDTERING ---------- */
const goodFeedback=["Riktig! For et skudd!","Boom! Rett i blinken!","Nydelig glosemål!","Fulltreffer!","Språkskudd deluxe!","Glosekanon!"];
const comicHit=["PANG!","BOING!","FULLTREFFER!","BAM!"];
const comicMiss=["OOPS!","BONK!","AU!","PLOPP!"];

async function handleAnswer(btn, choice){
  if(busy) return; busy=true;
  gameState=GameState.ANSWER_FEEDBACK;
  const correct = choice===currentQuestion.correct;
  // lås alle knapper, marker
  const buttons=[...$("answers").children];
  buttons.forEach(b=>{
    b.disabled=true;
    if(b.textContent===currentQuestion.correct) b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  if(correct){ Sound.correct(); score++; streak++; }
  else{ Sound.wrong(); streak=0; }
  $("hud-score").textContent=score;
  updateStreakChip();

  await playShot(correct);

  // tekstfeedback
  const fb=$("feedback");
  if(correct){ fb.textContent=pick(goodFeedback); fb.className="feedback good show"; }
  else{ fb.textContent="Nesten! Riktig svar var: "+currentQuestion.correct; fb.className="feedback bad show"; }

  // combo-belønning
  if(correct && streak>=2) comboPopup(streak);

  await wait(1100);
  // neste
  currentQuestionIndex++;
  if(currentQuestionIndex>=questions.length){ endRound(); }
  else { gameState=GameState.PLAYING; loadQuestion(); }
}

/* ---------- 13. SKUDD-ANIMASJON ---------- */
function resetBall(){
  const ball=$("ball");
  ball.style.transition="none";
  ball.style.left="24%"; ball.style.top="60%";
  ball.style.transform="translate(-50%,-50%)";
  ball.classList.remove("flying");
  ball.innerHTML=`<div class="spin"><svg viewBox="0 0 60 60" width="100%" height="100%">
    <circle cx="30" cy="30" r="28" fill="#fff" stroke="#1b2a4a" stroke-width="3"/>
    <path d="M30 12 l9 7 -3.5 11 h-11 l-3.5 -11Z" fill="#1b2a4a"/>
    <path d="M30 12 l9 7 M30 12 l-9 7 M21 19 l-7 9 M39 19 l7 9 M26.5 41 l-7 7 M33.5 41 l7 7" stroke="#1b2a4a" stroke-width="3" fill="none"/>
  </svg></div>`;
  void ball.offsetWidth; // reflow
}
function moveBall(left,top,ms){
  return new Promise(res=>{
    const ball=$("ball");
    ball.style.transition=`left ${ms}ms cubic-bezier(.4,0,.6,1), top ${ms}ms cubic-bezier(.4,0,.6,1)`;
    ball.style.left=left; ball.style.top=top;
    setTimeout(res, reduceMotion?Math.min(ms,80):ms);
  });
}
async function playShot(correct){
  const ball=$("ball");
  const playerWrap=$("player-art").parentElement;
  const oppWrap=$("opp-art").parentElement;
  // stopp idle under skudd
  playerWrap.classList.remove("idle-bob");
  oppWrap.classList.remove("idle-bob","idle-dance");

  // 1) opplading
  renderPlayer("focus");
  playerWrap.classList.add("charge");
  if(players[selectedPlayerKey].hair==="longblond"||players[selectedPlayerKey].sparkle){
    $("player-aura").classList.add("on");
  }
  await wait(240); Sound.shoot();
  playerWrap.classList.remove("charge");
  $("player-aura").classList.remove("on");
  ball.classList.add("flying");

  if(correct){
    Sound.whoosh();
    await moveBall("80%","58%",430);
    onImpact(true);
    // motstander reaksjon
    renderOpponent("hurt");
    oppWrap.classList.add("gethit");
    spawnStars(78);
    Sound.hit(); Sound.boing(); Sound.squeak();
    Sound.cheer();
    renderPlayer("happy");
    playerWrap.classList.add("celebrate");
    await wait(820);
    oppWrap.classList.remove("gethit");
    playerWrap.classList.remove("celebrate");
    renderPlayer("happy");
    renderOpponent("idle");
  }else{
    Sound.whoosh();
    await moveBall("60%","42%",260);   // ball går feil
    await moveBall("20%","58%",330);   // retur mot spiller
    onImpact(false);
    renderPlayer("hurt");
    playerWrap.classList.add("gethit");
    spawnStars(22);
    Sound.hit(); Sound.boing(); Sound.squeak();
    Sound.aww();
    renderOpponent("laugh");
    oppWrap.classList.add("laughpose");
    await wait(820);
    playerWrap.classList.remove("gethit");
    oppWrap.classList.remove("laughpose");
    renderOpponent("idle");
  }
  // gjenoppta idle
  playerWrap.classList.add("idle-bob");
  oppWrap.classList.add(currentOpponentKey==="neimal"?"idle-dance":"idle-bob");
  ball.classList.remove("flying");
}
function onImpact(correct){
  // skjermristing
  const t=$("shake-target");
  t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
  // tegneserieord
  const c=$("comic");
  c.textContent = correct ? pick(comicHit) : pick(comicMiss);
  c.style.color = correct ? "#ffd23f" : "#ff8aa0";
  c.style.left = correct ? "70%" : "22%";
  c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop");
}

/* ---------- 14. PARTIKLER ---------- */
function spawnStars(xPercent){
  if(reduceMotion) return;
  const fx=$("fx");
  const cols=["#ffd23f","#ff5a5f","#fff","#7c3aed","#22c55e"];
  const stage=fx.getBoundingClientRect();
  const cx=stage.width*xPercent/100, cy=stage.height*0.58;
  for(let i=0;i<16;i++){
    const p=document.createElement("div");
    p.className="particle";
    const star=Math.random()>.5;
    p.textContent = star ? "⭐" : "✦";
    p.style.fontSize=(14+Math.random()*16)+"px";
    p.style.color=pick(cols);
    p.style.left=cx+"px"; p.style.top=cy+"px";
    fx.appendChild(p);
    const ang=Math.random()*Math.PI*2, dist=60+Math.random()*140;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-40;
    p.animate([
      {transform:"translate(-50%,-50%) scale(.3) rotate(0deg)",opacity:1},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1.1) rotate(${Math.random()*540-270}deg)`,opacity:0}
    ],{duration:720+Math.random()*300,easing:"cubic-bezier(.2,.8,.3,1)"})
     .onfinish=()=>p.remove();
  }
}
function comboPopup(s){
  let text=null;
  if(s===2) text="Dobbel glosekraft!";
  else if(s===3) text="Hat-trick-hjerne!";
  else if(s>=5) text="Gloselegende!";
  if(!text) return;
  Sound.combo();
  const el=document.createElement("div");
  el.textContent=text;
  el.style.cssText=`position:absolute; left:50%; top:24%; transform:translate(-50%,-50%);
    font-family:var(--comic); font-size:clamp(22px,6vw,46px); color:#fff; z-index:9;
    -webkit-text-stroke:3px var(--purple); text-shadow:0 4px 0 rgba(0,0,0,.25); letter-spacing:1px;`;
  $("fx").appendChild(el);
  el.animate([
    {transform:"translate(-50%,-50%) scale(.4) rotate(-8deg)",opacity:0},
    {transform:"translate(-50%,-50%) scale(1.15) rotate(4deg)",opacity:1,offset:.4},
    {transform:"translate(-50%,-80%) scale(1) rotate(0)",opacity:0}
  ],{duration:1300,easing:"cubic-bezier(.2,.9,.3,1.4)"}).onfinish=()=>el.remove();
}
function updateStreakChip(){
  const chip=$("hud-streak");
  if(streak>=2){ chip.textContent="🔥 "+streak+" på rad"; chip.classList.add("show"); }
  else chip.classList.remove("show");
}

/* ---------- 15. SLUTTSKJERM ---------- */
function endRound(){
  gameState=GameState.ROUND_END;
  $("result-art").innerHTML=characterSVG(players[selectedPlayerKey], score>=5?"happy":"idle");
  $("result-score").textContent=score+" av 10";
  let c;
  if(score===10) c="Perfekt! Du er en ekte gloselegende!";
  else if(score>=8) c="Fantastisk! Skuddfoten og hjernen er i toppform!";
  else if(score>=5) c="Bra jobbet! Litt mer trening, så blir du ustoppelig!";
  else c="Tøff kamp! Prøv igjen og slå tilbake!";
  $("result-comment").textContent=c;
  buildConfetti("confetti-end");
  if(score>=8) Sound.cheer();
  showScreen("screen-end");
}

/* ---------- 16. TASTATURSTØTTE ---------- */
document.addEventListener("keydown",e=>{
  if($("screen-play").classList.contains("active") && !busy){
    const idx={"1":0,"2":1,"3":2,"4":3}[e.key];
    if(idx!==undefined){
      const b=$("answers").children[idx];
      if(b && !b.disabled){ e.preventDefault(); b.click(); }
    }
  }
});

/* ---------- 17. NAVIGASJON ---------- */
function goPlayerSelect(){ gameState=GameState.PLAYER_SELECT; showScreen("screen-player"); }

$("btn-start").addEventListener("click",()=>{
  Sound.kick(); Sound.click();
  gameState=GameState.THEME_SELECT; showScreen("screen-theme");
});
$("btn-back-theme").addEventListener("click",()=>{Sound.click(); gameState=GameState.THEME_SELECT; showScreen("screen-theme");});
$("btn-again").addEventListener("click",()=>{Sound.click(); startRound();});
$("btn-newtheme").addEventListener("click",()=>{Sound.click(); gameState=GameState.THEME_SELECT; showScreen("screen-theme");});
$("btn-newplayer").addEventListener("click",()=>{Sound.click(); goPlayerSelect();});

$("btn-sound").addEventListener("click",()=>{
  soundEnabled=!soundEnabled; Sound.setEnabled(soundEnabled);
  const b=$("btn-sound");
  b.textContent=soundEnabled?"🔊":"🔇";
  b.setAttribute("aria-pressed",String(soundEnabled));
  if(soundEnabled){ Sound.kick(); Sound.click(); }
});

/* ---------- 18. OPPSTART ---------- */
buildStadiums();
buildConfetti("confetti-start");
buildThemeCards();
buildPlayerCards();
if(reduceMotion) document.body.classList.add("no-motion");
</script>
