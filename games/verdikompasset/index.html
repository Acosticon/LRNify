  modus:null,          // "laerer" | "elev" | "alene"
  rom:null, navn:"", elevId:null,
  rundeIdx:0, rangering:{},     // runde: [id,id,id] i valgt rekkefølge
  poeng:{},                     // verdiId -> poeng fra rangering
  dilemmaIdx:0, handling:{},    // verdiId -> antall fra dilemmavalg
  valgLogg:[],                  // {dilemma, valgtekst, verdier} — lokalt, deles ikke med rommet
  midlValg:[]                   // valgte i pågående runde
};
VERDIER.forEach(v=>{S.poeng[v.id]=0;S.handling[v.id]=0});

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function illu(nøkkel, tekst){
  const url = ILLU[nøkkel];
  if(url) return `<div class="illu har-bilde"><img src="${esc(url)}" alt=""></div>`;
  return `<div class="illu" role="img" aria-label="Illustrasjon: ${esc(tekst)}">🎨<span>Illustrasjon: ${esc(tekst)}</span><span class="grå" style="font-weight:400">(nøkkel: ${nøkkel}, 5:3)</span></div>`;
}

function visModal(html){
  const bak = document.createElement("div");
  bak.className="modal-bak";
  bak.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}<button class="btn mt16" onclick="this.closest('.modal-bak').remove()">Lukk</button></div>`;
  bak.addEventListener("click",e=>{if(e.target===bak)bak.remove()});
  document.body.appendChild(bak);
}
function visVerdi(id){
  const v=V[id];
  visModal(`<p class="eyebrow">Verdi</p><h2>${v.navn}</h2><p class="mt8">${v.def}</p>
    <h3 class="mt16">Eksempler</h3><ul>${v.eks.map(e=>`<li>${e}</li>`).join("")}</ul>`);
}

/* ============================= LAGRING (rom) ============================= */
/* Rommet ligger i Firebase Realtime Database under verdikompasset/{KODE}.
   Hver elev skriver bare til sin egen node (elever/{uid}), nøkkelen er den
   anonyme id-en fra sikreAuth() — se firebase/database.rules.json. */
async function lagreElev(status){
  if(S.modus!=="elev" || !S.rom || !S.elevId) return;
  const data = { navn:S.navn, status, poeng:S.poeng, handling:S.handling, tid:Date.now() };
  if(status==="ferdig") data.samsvar = beregnSamsvar().prosent;
  try{
    await lastFirebase();
    await FB.set(R('verdikompasset/'+S.rom+'/elever/'+S.elevId), data);
  }catch(e){/* nettverksglipp skal ikke stoppe eleven */}
}

/* ============================= BEREGNING ============================= */
function topp(obj,n=3){
  return Object.entries(obj).filter(([,p])=>p>0).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([id])=>id);
}
function beregnSamsvar(){
  const sier = topp(S.poeng,3), gjør = topp(S.handling,3);
  const felles = sier.filter(id=>gjør.includes(id));
  return {sier, gjør, felles, prosent: Math.round(felles.length/3*100)};
}

/* ============================= SKJERMER ============================= */
function skjermStart(){
  app.innerHTML = `
    ${illu("start","ungdommer med kompass")}
    <p class="eyebrow senter">Livsmestring</p>
    <h1 class="senter mb16">Verdikompasset</h1>
    <p class="senter grå mb16">Hva er viktigst for deg – og handler du etter det?</p>
    <div class="kort">
      <button class="btn mb8" onclick="startElev()">Bli med i et rom (elev)</button>
      <button class="btn sekundær mb8" onclick="startAlene()">Gjør øvelsen alene</button>
      <button class="btn sekundær" onclick="startLaerer()">Opprett rom (lærer)</button>
    </div>
    <p class="senter liten-tekst grå">Svar i et rom deles med læreren og klassen din.</p>`;
}

/* ---------- Elev / alene ---------- */
function startAlene(){ S.modus="alene"; skjermIntro(); }
function startElev(){
  app.innerHTML = `
    <h2 class="mb16">Bli med i rommet</h2>
    <div class="kort">
      <label class="mb8" style="display:block;font-weight:600">Romkode fra læreren</label>
      <input type="text" id="inpKode" maxlength="4" placeholder="F.eks. RÅDY" style="text-transform:uppercase;letter-spacing:.2em;font-size:1.4rem;text-align:center">
      <label class="mt16 mb8" style="display:block;font-weight:600">Fornavnet ditt</label>
      <input type="text" id="inpNavn" maxlength="20" placeholder="Fornavn">
      <button class="btn mt16" onclick="bliMed()">Bli med</button>
      <p id="feilElev" class="liten-tekst mt8" style="color:var(--baer)"></p>
    </div>
    <button class="btn sekundær" onclick="skjermStart()">Tilbake</button>`;
}
async function bliMed(){
  const kode = document.getElementById("inpKode").value.trim().toUpperCase();
  const navn = document.getElementById("inpNavn").value.trim();
  const feil = document.getElementById("feilElev");
  if(kode.length!==4 || !navn){ feil.textContent="Skriv inn både romkode (4 tegn) og fornavn."; return; }
  feil.textContent="Sjekker rommet …";
  let snap;
  try{
    await lastFirebase();
    snap = await FB.get(R('verdikompasset/'+kode));
  }catch(e){ feil.textContent="Fikk ikke kontakt. Sjekk internett og prøv igjen."; return; }
  if(!snap.exists()){ feil.textContent="Fant ikke rommet. Sjekk koden med læreren."; return; }
  const meg = await sikreAuth();
  if(!meg){ feil.textContent="Fikk ikke koblet til rommet akkurat nå. Prøv igjen, eller gjør øvelsen alene."; return; }
  S.modus="elev"; S.rom=kode; S.navn=navn; S.elevId=meg;
  await lagreElev("startet");
  skjermIntro();
}

function skjermIntro(){
  app.innerHTML = `
    ${illu("ranking","verdier som veies mot hverandre")}
    <h2 class="mb8">Del 1: Hva er viktigst for deg?</h2>
    <p class="grå mb16">Du får se tre verdier om gangen. Trykk på dem i rekkefølge: først den viktigste, så nummer to, så nummer tre. Trykk på ⓘ hvis du lurer på hva en verdi betyr.</p>
    <div class="kort liten-tekst">
      <b>Poeng:</b> 1. plass gir 3 poeng, 2. plass gir 2 poeng, 3. plass gir 1 poeng. Til slutt ser du din egen verdirangering.
    </div>
    <button class="btn" onclick="skjermRunde()">Start</button>`;
}

function skjermRunde(){
  const runde = RUNDER[S.rundeIdx];
  S.midlValg = [];
  app.innerHTML = `
    <div class="fremdrift">${RUNDER.map((_,i)=>`<span class="${i<S.rundeIdx?'ferdig':i===S.rundeIdx?'aktiv':''}"></span>`).join("")}</div>
    <p class="eyebrow">Runde ${S.rundeIdx+1} av ${RUNDER.length}</p>
    <h2 class="mb16">Hva setter du høyest?</h2>
    <div id="brikker">${runde.map(id=>`
      <button class="brikke" data-id="${id}" onclick="velgBrikke('${id}')">
        <span class="plass">–</span><span class="navn">${V[id].navn}</span>
        <span class="info-knapp" role="button" tabindex="0" aria-label="Om ${V[id].navn}"
          onclick="event.stopPropagation();visVerdi('${id}')"
          onkeydown="if(event.key==='Enter'){event.stopPropagation();visVerdi('${id}')}">ⓘ</span>
      </button>`).join("")}
    </div>
    <button class="btn sekundær liten" onclick="skjermRunde()">Start runden på nytt</button>
    <button class="btn mt16" id="btnNeste" disabled onclick="nesteRunde()">Neste</button>`;
}
function velgBrikke(id){
  if(S.midlValg.includes(id)) return;
  S.midlValg.push(id);
  const plass = S.midlValg.length;
  const el = document.querySelector(`.brikke[data-id="${id}"]`);
  el.classList.add("valgt"); if(plass===1) el.classList.add("plass1");
  el.querySelector(".plass").textContent = plass + ".";
  if(S.midlValg.length===3) document.getElementById("btnNeste").disabled=false;
}
function nesteRunde(){
  S.midlValg.forEach((id,i)=>{ S.poeng[id] += 3-i; });
  S.rangering[S.rundeIdx]=S.midlValg;
  S.rundeIdx++;
  if(S.rundeIdx < RUNDER.length) skjermRunde();
  else skjermMinRangering();
}

function skjermMinRangering(){
  const t = topp(S.poeng,3);
  lagreElev("rangert");
  app.innerHTML = `
    <p class="eyebrow">Del 1 ferdig</p>
    <h2 class="mb8">Dine viktigste verdier</h2>
    <div class="podium" aria-label="Pallplassering">
      <div class="p2">${V[t[1]]?.navn||""}<small>2. plass</small></div>
      <div class="p1">${V[t[0]]?.navn||""}<small>1. plass</small></div>
      <div class="p3">${V[t[2]]?.navn||""}<small>3. plass</small></div>
    </div>
    <div class="kort">
      ${Object.entries(S.poeng).sort((a,b)=>b[1]-a[1]).map(([id,p],i)=>`
        <div class="rangering-rad">
          <span class="nr">${i+1}.</span>
          <div class="bar-spor"><div class="bar" style="width:${Math.max(p/6*100,18)}%">${V[id].navn} · ${p}p</div></div>
        </div>`).join("")}
    </div>
    <h3 class="mb8">Del 2: Situasjonene</h3>
    <p class="grå mb16">Nå får du åtte situasjoner der verdier står mot hverandre. Det finnes ikke ett riktig svar – velg det du mest sannsynlig ville gjort.</p>
    <button class="btn" onclick="skjermDilemma()">Til situasjonene</button>`;
}

function skjermDilemma(){
  const d = DILEMMAER[S.dilemmaIdx];
  app.innerHTML = `
    <div class="fremdrift">${DILEMMAER.map((_,i)=>`<span class="${i<S.dilemmaIdx?'ferdig':i===S.dilemmaIdx?'aktiv':''}"></span>`).join("")}</div>
    ${illu(d.id, d.tittel)}
    <p class="eyebrow">Situasjon ${S.dilemmaIdx+1} av ${DILEMMAER.length}</p>
    <h2 class="mb8">${d.tittel}</h2>
    <p class="mb16">${d.tekst}</p>
    <p class="liten-tekst grå mb8"><b>Hva gjør du?</b></p>
    ${d.valg.map((v,i)=>`<button class="valg" onclick="velgDilemma(${i})">${v.tekst}</button>`).join("")}`;
}
function velgDilemma(i){
  const d = DILEMMAER[S.dilemmaIdx];
  const valg = d.valg[i];
  valg.verdier.forEach(id=>S.handling[id]++);
  S.valgLogg.push({dilemma:d.tittel, valg:valg.tekst, verdier:valg.verdier});
  S.dilemmaIdx++;
  if(S.dilemmaIdx < DILEMMAER.length) skjermDilemma();
  else skjermProfil();
}

function skjermProfil(){
  const r = beregnSamsvar();
  lagreElev("ferdig");
  const maksP = Math.max(...Object.values(S.poeng),1);
  const maksH = Math.max(...Object.values(S.handling),1);
  const relevante = VERDIER.filter(v=>S.poeng[v.id]>0||S.handling[v.id]>0)
    .sort((a,b)=>(S.poeng[b.id]+S.handling[b.id]*2)-(S.poeng[a.id]+S.handling[a.id]*2));
  app.innerHTML = `
    ${illu("profil","verdiprofil")}
    <p class="eyebrow">Din verdiprofil</p>
    <h1 class="mb16">${esc(S.navn)||"Din profil"}</h1>
    <div class="kort senter">
      <div class="samsvar" style="--p:${r.prosent}"><b>${r.prosent}%</b><span>samsvar</span></div>
      <p class="liten-tekst grå">Hvor godt valgene dine i situasjonene stemmer med verdiene du rangerte høyest.</p>
    </div>
    <div class="kort">
      <h3 class="mb16">Det du sier vs. det du gjør</h3>
      <div class="speil-topp"><span class="v">Sier (rangering)</span><span></span><span class="h">Gjør (valg)</span></div>
      ${relevante.map(v=>`
        <div class="speil-rad">
          <div class="speil-spor venstre"><div class="speil-fyll" style="width:${S.poeng[v.id]/maksP*100}%"></div></div>
          <div class="speil-navn">${v.navn}</div>
          <div class="speil-spor høyre"><div class="speil-fyll" style="width:${S.handling[v.id]/maksH*100}%"></div></div>
        </div>`).join("")}
    </div>
    <div class="kort">
      <h3 class="mb8">Til ettertanke</h3>
      ${lagRefleksjon(r).map(t=>`<div class="refleksjon">${t}</div>`).join("")}
    </div>
    ${S.modus==="elev" ? `<p class="senter liten-tekst grå">Profilen din er sendt til rommet <b>${S.rom}</b>. ✅</p>` : ""}
    <button class="btn sekundær mt16" onclick="location.reload()">Start på nytt</button>`;
}
function lagRefleksjon(r){
  const ut=[];
  if(r.felles.length===3) ut.push("Alle de tre viktigste verdiene dine dukket opp i valgene du tok. Hva tror du gjør at det er lett for deg å handle etter verdiene dine?");
  else if(r.felles.length>=1) ut.push(`Verdien <b>${r.felles.map(id=>V[id].navn).join(" og ")}</b> går igjen både i det du sier og det du gjør. Hva gjør denne verdien viktig for deg?`);
  const mangler = r.sier.filter(id=>!r.gjør.includes(id));
  if(mangler.length) ut.push(`Du rangerte <b>${mangler.map(id=>V[id].navn).join(" og ")}</b> høyt, men de kom lite til syne i valgene dine. Hva kan gjøre det vanskelig å handle etter disse verdiene i praksis?`);
  const overrasket = r.gjør.filter(id=>!r.sier.includes(id));
  if(overrasket.length) ut.push(`I situasjonene valgte du ofte ut fra <b>${overrasket.map(id=>V[id].navn).join(" og ")}</b> – uten at du rangerte dem øverst. Kan det hende disse verdiene betyr mer for deg enn du trodde?`);
  ut.push("Er det en situasjon fra ditt eget liv der to av verdiene dine sto mot hverandre? Hva valgte du – og hva ville du gjort i dag?");
  return ut;
}

/* ---------- Lærer ---------- */
async function startLaerer(){
  app.innerHTML = `<div class="kort senter"><p class="grå">Oppretter rom …</p></div>`;
  try{
    await lastFirebase();
    const eier = await sikreAuth();
    if(!eier) throw new Error('ingen pålogging');
    const kode = lagKode();
    await FB.set(R('verdikompasset/'+kode), { opprettet: Date.now(), owner: eier });
    S.modus="laerer"; S.rom=kode;
    skjermDashboard();
    startLarerLytter(kode);
  }catch(e){
    app.innerHTML = `<div class="kort"><h2>Fikk ikke opprettet rommet</h2><p class="grå mt8">Sjekk nettverket og prøv igjen.</p><button class="btn mt16" onclick="startLaerer()">Prøv igjen</button><button class="btn sekundær mt8" onclick="skjermStart()">Tilbake</button></div>`;
  }
}
function lagKode(){
  const b="ABDEFGHJKLMNPRSTUVY";
  return Array.from({length:4},()=>b[Math.floor(Math.random()*b.length)]).join("");
}

function skjermDashboard(){
  app.innerHTML = `
    <p class="eyebrow">Lærerrom</p>
    <h1 class="mb8">Klassens verdiprofil</h1>
    <p class="grå">Elevene blir med på koden:</p>
    <div class="romkode">${S.rom}</div>
    <div class="stat-rad">
      <div class="stat"><b id="stTot">0</b><span>påkoblet</span></div>
      <div class="stat"><b id="stFerdig">0</b><span>ferdige</span></div>
      <div class="stat"><b id="stSamsvar">–</b><span>samsvar snitt</span></div>
    </div>
    <div class="kort"><h3 class="mb8">Elever</h3><div class="elev-liste" id="elevListe"><span class="grå liten-tekst">Venter på elever …</span></div></div>
    <div class="kort"><h3 class="mb8">Klassens viktigste verdier <span class="liten-tekst grå">(rangering)</span></h3><div id="klasseRangering"><span class="grå liten-tekst">Vises når elever har rangert.</span></div></div>
    <div class="kort"><h3 class="mb8">Verdiene klassen handler etter <span class="liten-tekst grå">(valg i situasjoner)</span></h3><div id="klasseHandling"><span class="grå liten-tekst">Vises når elever er ferdige.</span></div></div>
    <button class="btn" onclick="lagreRapport()">Lagre klassens profil</button>
    <p class="senter liten-tekst grå mt8" id="lagretStatus"></p>`;
}

let sisteData = [];
let romLytter = null, romLytterSti = null;
function startLarerLytter(kode){
  if(romLytter) FB.off(R(romLytterSti),'value',romLytter);
  romLytterSti = 'verdikompasset/'+kode;
  romLytter = FB.onValue(R(romLytterSti), snap=>{
    const d = snap.val() || {};
    const elever = d.elever || {};
    sisteData = Object.values(elever);
    tegnDashboard(sisteData);
  });
}
function tegnDashboard(data){
  const ferdige = data.filter(d=>d.status==="ferdig");
  document.getElementById("stTot").textContent = data.length;
  document.getElementById("stFerdig").textContent = ferdige.length;
  const snitt = ferdige.length ? Math.round(ferdige.reduce((s,d)=>s+(d.samsvar||0),0)/ferdige.length)+"%" : "–";
  document.getElementById("stSamsvar").textContent = snitt;

  document.getElementById("elevListe").innerHTML = data.length
    ? data.map(d=>`<span class="elev-tag ${d.status==='ferdig'?'ferdig':''}">${esc(d.navn)}${d.status==='ferdig'?' ✓':''}</span>`).join("")
    : `<span class="grå liten-tekst">Venter på elever …</span>`;

  const sumRang={}, sumHand={};
  VERDIER.forEach(v=>{sumRang[v.id]=0;sumHand[v.id]=0});
  data.forEach(d=>{
    VERDIER.forEach(v=>{
      sumRang[v.id]+= d.poeng?.[v.id]||0;
      sumHand[v.id]+= d.handling?.[v.id]||0;
    });
  });
  tegnRangering("klasseRangering", sumRang, "p");
  if(ferdige.length) tegnRangering("klasseHandling", sumHand, "valg");
}
function tegnRangering(elId, obj, enhet){
  const rader = Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  const maks = Math.max(rader[0]?.[1]||0,1);
  if(!rader[0][1]) return;
  document.getElementById(elId).innerHTML = rader.map(([id,p],i)=>`
    <div class="rangering-rad">
      <span class="nr">${i+1}.</span>
      <div class="bar-spor"><div class="bar" style="width:${Math.max(p/maks*100,16)}%">${V[id].navn} · ${p} ${enhet}</div></div>
    </div>`).join("");
}
function lagreRapport(){
  const rapport = {
    rom:S.rom, dato:new Date().toISOString(),
    antall:sisteData.length,
    elever:sisteData
  };
  const blob = new Blob([JSON.stringify(rapport,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `verdiprofil-${S.rom}.json`;
  a.click();
  document.getElementById("lagretStatus").textContent = "Klassens profil er lastet ned. ✅";
}

skjermStart();
</script>
