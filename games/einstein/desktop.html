<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mysteriet i Måkeveien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fff9f0; --ink:#2b2118; --yellow:#facc15; --green:#cdeecf; --greenink:#2f6b35;
    --wall:#fffaf0; --gonepink:#f3dcd8; --goneblue:#dfe7f2; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif; font-weight:700; }
  #app{ height:100%; display:flex; flex-direction:column; padding:12px; gap:9px; }

  header{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  #title{ font-family:'Chewy',cursive; font-weight:400; font-size:clamp(19px,2.8vw,30px); margin:0; transform:rotate(-1.5deg); }
  #sub{ font-size:12px; font-weight:800; background:var(--yellow); border:3px solid var(--ink);
    border-radius:999px; padding:3px 11px; box-shadow:0 4px 0 var(--ink); transform:rotate(1deg); }
  .controls{ margin-left:auto; display:flex; gap:7px; flex-wrap:wrap; }
  button,select{ font:inherit; font-weight:800; font-size:13px; padding:7px 12px; color:var(--ink);
    background:#fff; border:3px solid var(--ink); border-radius:13px; box-shadow:0 4px 0 var(--ink); cursor:pointer; }
  #new{ background:var(--yellow); }
  button:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  button:disabled{ opacity:.4; cursor:not-allowed; box-shadow:0 4px 0 var(--ink); transform:none; }

  main{ flex:1; display:flex; gap:12px; min-height:0; }
  .left{ flex:3; display:flex; flex-direction:column; gap:9px; min-width:0; container-type:inline-size; }
  .right{ flex:2; min-width:230px; display:flex; flex-direction:column; min-height:0;
    background:#fffdf8; border:4px solid var(--ink); border-radius:18px; box-shadow:0 8px 0 var(--ink);
    transform:rotate(-.5deg); padding:11px; }
  .right h2{ font-family:'Chewy',cursive; font-weight:400; font-size:17px; margin:0 0 7px; }

  #board{ flex:1; display:grid; grid-template-columns:repeat(var(--n),1fr); gap:11px; min-height:0; }
  .card{ display:flex; flex-direction:column; gap:6px; min-height:0; padding:0 7px 8px;
    border:3.5px solid var(--ink); border-radius:16px; background:var(--wall); box-shadow:0 7px 0 var(--ink); }
  .card.tinted{ background:var(--facade); }
  .card-title{ margin:0 -7px 3px; min-height:30px; background:var(--ink); color:var(--bg);
    clip-path:polygon(50% 0, 100% 100%, 0 100%); display:flex; align-items:flex-end; justify-content:center; }
  .card-title span{ font-family:'Chewy',cursive; font-weight:400; font-size:14px; padding-bottom:3px; }

  .cell{ flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1px; padding:3px; background:#fff; border:3px solid var(--ink); border-radius:11px; box-shadow:0 3px 0 var(--ink); overflow:hidden; }
  .cat{ font-size:8px; text-transform:uppercase; letter-spacing:.02em; font-weight:800; opacity:.6; line-height:1; }
  .cell.filled.manual{ background:#fffdf3; }
  .cell.filled.auto{ background:var(--green); }
  .cell.filled.auto .value{ color:var(--greenink); font-style:italic; }
  .cell.filled.manual{ cursor:pointer; }
  .cell.filled:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .art-wrap{ width:clamp(20px,4.6cqi,34px); aspect-ratio:1; }
  .art{ width:100%; height:100%; display:block; }
  .value{ font-weight:800; font-size:clamp(11px,1.8cqi,15px); line-height:1; text-align:center; }

  .chips{ display:flex; flex-wrap:wrap; gap:2px; align-items:center; justify-content:center; }
  .chip{ display:inline-flex; align-items:center; gap:2px; border:2px solid var(--ink); background:#fbf6ec;
    border-radius:999px; padding:1px 5px 1px 2px; font-weight:800; font-size:clamp(8px,1.2cqi,11px);
    line-height:1.05; cursor:pointer; color:var(--ink); }
  .chip:active{ transform:translateY(2px); }
  .chip-art{ width:13px; height:13px; flex:none; }
  .chip.struck{ cursor:default; text-decoration:line-through; text-decoration-thickness:2px; opacity:.55; }
  .chip.struck.kat{ background:var(--gonepink); color:#a4665e; }
  .chip.struck.spor{ background:var(--goneblue); color:#5a6f8f; }
  .chip.struck .art-wrap, .chip.struck .chip-art{ opacity:.5; }

  footer{ display:flex; align-items:center; gap:8px; }
  #message{ flex:1; background:#fff; border:3px solid var(--ink); border-radius:13px; box-shadow:0 3px 0 var(--ink);
    padding:7px 11px; font-weight:800; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill{ font-weight:800; font-size:12px; background:var(--yellow); border:3px solid var(--ink); border-radius:999px;
    padding:6px 11px; box-shadow:0 3px 0 var(--ink); white-space:nowrap; }
  .pill strong{ font-family:'Nunito'; }

  #clues{ list-style:none; margin:0; padding:0; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:6px; }
  .clue{ display:grid; grid-template-columns:auto 1fr; gap:9px; align-items:start; text-align:left; width:100%;
    padding:8px 9px; border:3px solid var(--ink); border-radius:13px; background:#fff; box-shadow:0 3px 0 var(--ink);
    font-size:13px; font-weight:700; cursor:pointer; line-height:1.35; }
  .clue:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .clue .check{ width:21px; height:21px; border:2px solid var(--ink); border-radius:6px; background:#fff;
    display:grid; place-items:center; font-size:13px; flex:none; }
  .clue.used{ background:#eef7ec; color:#7b8c77; }
  .clue.used .check{ background:var(--green); }

  #win{ position:fixed; inset:0; display:none; place-items:center; z-index:30; background:rgba(43,33,24,.4); }
  #win.open{ display:grid; }
  #win .wincard{ background:#fff; border:4px solid var(--ink); border-radius:22px; box-shadow:0 12px 0 var(--ink);
    padding:22px 26px; text-align:center; max-width:430px; transform:rotate(-1deg); }
  #win h2{ font-family:'Chewy',cursive; font-weight:400; font-size:32px; margin:0 0 6px; color:var(--greenink); }
  #wintext{ margin:0 0 16px; font-weight:800; }
  .winbtns{ display:flex; gap:10px; justify-content:center; }
  #nextlevel{ background:var(--yellow); }

  #confetti{ position:fixed; inset:0; pointer-events:none; z-index:40; }
  #confetti .piece{ position:absolute; top:-14px; width:11px; height:16px; border:2px solid var(--ink);
    border-radius:3px; animation:fall 1100ms ease-out forwards; }
  @keyframes fall{ to{ transform:translateY(108vh) rotate(280deg); opacity:.2; } }
  @media (prefers-reduced-motion:reduce){ #confetti{ display:none; } }

  @media (max-width:780px){ main{ flex-direction:column; } .right{ flex:1; min-width:0; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">Mysteriet i Måkeveien</h1>
    <span id="sub"></span>
    <div class="controls">
      <select id="level" aria-label="Vanskelighetsgrad"></select>
      <button id="check">Sjekk</button>
      <button id="undo">Angre</button>
      <button id="reset">Nullstill</button>
      <button id="new">Nytt brett</button>
    </div>
  </header>
  <main>
    <div class="left">
      <div id="board"></div>
      <footer>
        <div id="message"></div>
        <div class="pill" id="progress"></div>
        <div class="pill" id="clueprog"></div>
      </footer>
    </div>
    <div class="right">
      <h2>Vitneutsagn</h2>
      <ul id="clues"></ul>
    </div>
  </main>
</div>
<div id="win" aria-live="assertive"><div class="wincard">
  <h2>Saken er løst!</h2>
  <p id="wintext"></p>
  <div class="winbtns">
    <button id="playagain">Spill på nytt</button>
    <button id="nextlevel">Neste nivå</button>
  </div>
</div></div>
<div id="confetti"></div>
<script>
/* LRNify – Einsteins gåte: ren logikkmotor (ingen DOM).
   Eksporteres for både Node-test og innbygging i HTML. */
(function (root) {
  'use strict';

  // ---- Klуetyper ----
  // assoc:    same house: (cA,vA) og (cB,vB) i samme hus
  // neg:      not same house: (cA,vA) IKKE i samme hus som (cB,vB)
  // pos:      (cA,vA) i posisjon p (0-indeksert)
  // rightOf:  (cA,vA) ligger UMIDDELBART til høyre for (cB,vB)  => pos(A)=pos(B)+1
  // neighbor: (cA,vA) ved siden av (cB,vB)                       => |pos(A)-pos(B)|=1

  function shuffle(a, rnd) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function permutation(n, rnd) {
    const a = Array.from({ length: n }, (_, i) => i);
    return shuffle(a, rnd);
  }

  // mulighetsrom for én variabel (c,v) gitt delvis tildeling
  function clueOk(clue, c, v, p, pos) {
    // returnerer false bare hvis klue involverer (c,v) og den ANDRE siden
    // allerede er plassert og bryter regelen.
    const get = (cc, vv) => pos[cc][vv]; // -1 hvis uplassert
    switch (clue.t) {
      case 'assoc': {
        if (clue.cA === c && clue.vA === v) { const o = get(clue.cB, clue.vB); return o < 0 || o === p; }
        if (clue.cB === c && clue.vB === v) { const o = get(clue.cA, clue.vA); return o < 0 || o === p; }
        return true;
      }
      case 'neg': {
        if (clue.cA === c && clue.vA === v) { const o = get(clue.cB, clue.vB); return o < 0 || o !== p; }
        if (clue.cB === c && clue.vB === v) { const o = get(clue.cA, clue.vA); return o < 0 || o !== p; }
        return true;
      }
      case 'pos': {
        if (clue.cA === c && clue.vA === v) return p === clue.p;
        return true;
      }
      case 'rightOf': {
        // pos(A) = pos(B) + 1
        if (clue.cA === c && clue.vA === v) { const o = get(clue.cB, clue.vB); return o < 0 || p === o + 1; }
        if (clue.cB === c && clue.vB === v) { const o = get(clue.cA, clue.vA); return o < 0 || o === p + 1; }
        return true;
      }
      case 'neighbor': {
        if (clue.cA === c && clue.vA === v) { const o = get(clue.cB, clue.vB); return o < 0 || Math.abs(p - o) === 1; }
        if (clue.cB === c && clue.vB === v) { const o = get(clue.cA, clue.vA); return o < 0 || Math.abs(p - o) === 1; }
        return true;
      }
    }
    return true;
  }

  // Teller løsninger opp til (cap). Returnerer faktisk antall (maks cap).
  function countSolutions(K, N, clues, cap) {
    cap = cap || 2;
    // pos[c][v] = posisjon eller -1
    const pos = Array.from({ length: K }, () => new Array(N).fill(-1));
    const usedPos = Array.from({ length: K }, () => new Array(N).fill(false));
    let assignedCount = 0;
    const total = K * N;
    let solutions = 0;

    function feasible(c, v) {
      const out = [];
      for (let p = 0; p < N; p++) {
        if (usedPos[c][p]) continue;
        let ok = true;
        for (let i = 0; i < clues.length; i++) {
          if (!clueOk(clues[i], c, v, p, pos)) { ok = false; break; }
        }
        if (ok) out.push(p);
      }
      return out;
    }

    function rec() {
      if (solutions >= cap) return;
      if (assignedCount === total) { solutions++; return; }
      // MRV: velg uplassert (c,v) med færrest mulige posisjoner
      let bestC = -1, bestV = -1, bestCand = null, bestLen = Infinity;
      for (let c = 0; c < K; c++) {
        for (let v = 0; v < N; v++) {
          if (pos[c][v] !== -1) continue;
          const cand = feasible(c, v);
          if (cand.length < bestLen) { bestLen = cand.length; bestCand = cand; bestC = c; bestV = v; if (bestLen === 0) break; }
        }
        if (bestLen === 0) break;
      }
      if (bestLen === 0) return; // dødt spor
      for (const p of bestCand) {
        pos[bestC][bestV] = p; usedPos[bestC][p] = true; assignedCount++;
        rec();
        pos[bestC][bestV] = -1; usedPos[bestC][p] = false; assignedCount--;
        if (solutions >= cap) return;
      }
    }
    rec();
    return solutions;
  }

  // Bygg kuratert kandidatpool med tak per type (balanse + fart).
  // assoc + pos tas i sin helhet (garanterer at full pool er entydig).
  // neg/neighbor/rightOf samples opp til et tak for variasjon.
  function buildPool(K, N, sol, posOf, types, rnd, caps) {
    const has = (t) => types.indexOf(t) >= 0;
    const groups = { assoc: [], neg: [], pos: [], rightOf: [], neighbor: [] };

    for (let cA = 0; cA < K; cA++) {
      for (let cB = cA + 1; cB < K; cB++) {
        for (let p = 0; p < N; p++)
          if (has('assoc')) groups.assoc.push({ t: 'assoc', cA, vA: sol[cA][p], cB, vB: sol[cB][p] });
        if (has('neg')) for (let pa = 0; pa < N; pa++) for (let pb = 0; pb < N; pb++) {
          if (pa === pb) continue;
          groups.neg.push({ t: 'neg', cA, vA: sol[cA][pa], cB, vB: sol[cB][pb] });
        }
      }
    }
    if (has('pos')) for (let c = 0; c < K; c++) for (let p = 0; p < N; p++)
      groups.pos.push({ t: 'pos', cA: c, vA: sol[c][p], p });
    for (let p = 0; p < N - 1; p++) for (let cA = 0; cA < K; cA++) for (let cB = 0; cB < K; cB++) {
      if (cA === cB) continue;
      if (has('rightOf')) groups.rightOf.push({ t: 'rightOf', cA, vA: sol[cA][p + 1], cB, vB: sol[cB][p] });
      if (has('neighbor')) groups.neighbor.push({ t: 'neighbor', cA, vA: sol[cA][p], cB, vB: sol[cB][p + 1] });
    }

    const pool = [];
    for (const t of Object.keys(groups)) {
      const g = shuffle(groups[t], rnd);
      const cap = caps && caps[t] != null ? caps[t] : g.length;
      for (let i = 0; i < Math.min(cap, g.length); i++) pool.push(g[i]);
    }
    return shuffle(pool, rnd);
  }

  function typeMix(clues) {
    const m = {};
    for (const c of clues) m[c.t] = (m[c.t] || 0) + 1;
    return m;
  }
  // godta bare brett med rimelig variasjon: nok distinkte typer og ingen som dominerer
  function diverseEnough(clues, minTypes, maxShare) {
    const m = typeMix(clues);
    const types = Object.keys(m);
    if (types.length < minTypes) return false;
    const top = Math.max(...Object.values(m));
    return top / clues.length <= maxShare;
  }

  function minimize(K, N, pool, rnd) {
    let clues = shuffle(pool.slice(), rnd);
    for (let i = 0; i < clues.length; i++) {
      const trial = clues.slice(0, i).concat(clues.slice(i + 1));
      if (countSolutions(K, N, trial, 2) === 1) { clues.splice(i, 1); i--; }
    }
    return clues;
  }

  function generate(opts) {
    const N = opts.N, K = opts.K, types = opts.types;
    const rnd = opts.rnd || Math.random;
    const maxAttempts = opts.maxAttempts || 24;
    const minTypes = opts.minTypes || Math.min(3, types.length);
    const maxShare = opts.maxShare || 0.6;
    const caps = opts.caps || { neg: 10, neighbor: 14, rightOf: 14 };

    let best = null;
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      const sol = Array.from({ length: K }, () => permutation(N, rnd));
      const posOf = Array.from({ length: K }, () => new Array(N));
      for (let c = 0; c < K; c++) for (let p = 0; p < N; p++) posOf[c][sol[c][p]] = p;

      const pool = buildPool(K, N, sol, posOf, types, rnd, caps);
      if (countSolutions(K, N, pool, 2) !== 1) continue; // pool må determinere

      // prøv noen minimeringer med ulik rekkefølge, behold mest variert
      for (let tries = 0; tries < 3; tries++) {
        const clues = minimize(K, N, pool, rnd);
        const result = { N, K, sol, posOf, clues };
        if (diverseEnough(clues, minTypes, maxShare)) return result;
        if (!best || clues.length > best.clues.length) best = result; // fallback: flest kluer = mest variert tendens
      }
    }
    return best;
  }

  function verify(K, N, clues) { return countSolutions(K, N, clues, 2); }

  // For UI: er verdi v mulig i posisjon p for kategori c, gitt delvis tildeling posMap[c][v]=pos|-1?
  // Sjekker KUN direkte brudd mot ledetrådene (ett-stegs), ikke dyp inferens.
  function candidateOk(clues, c, v, p, posMap) {
    for (let i = 0; i < clues.length; i++) if (!clueOk(clues[i], c, v, p, posMap)) return false;
    return true;
  }

  const api = { generate, verify, countSolutions, clueOk, candidateOk };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.EinsteinEngine = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

  const AVATAR_ORDER = ['Astrid', 'Bjorn', 'Cecilie', 'David', 'Emma'];

  const ICON = {

      ic('<ellipse cx="16" cy="32" rx="7" ry="13" fill="#9b6b43" ' + sw + '/><ellipse cx="48" cy="32" rx="7" ry="13" fill="#9b6b43" ' + sw + '/><circle cx="32" cy="31" r="16" fill="#9b6b43" ' + sw + '/><ellipse cx="32" cy="39" rx="9" ry="6" fill="#f2c39b" ' + sw + '/>' + eyes(27, 37, 29) + '<circle cx="32" cy="36" r="2" fill="' + INK + '"/>'),
      ic('<polygon points="46,32 59,21 59,43" fill="#4d96d8" ' + sw + '/><ellipse cx="29" cy="32" rx="20" ry="12" fill="#4d96d8" ' + sw + '/><circle cx="22" cy="29" r="2.4" fill="' + INK + '"/><path d="M36 22 Q40 32 36 42" fill="none" ' + sw + '/>'),
      ic('<circle cx="30" cy="36" r="15" fill="#f4c542" ' + sw + '/><path d="M30 36 Q40 30 44 38" fill="#e7b528" ' + sw + '/><circle cx="40" cy="22" r="10" fill="#f4c542" ' + sw + '/><polygon points="49,20 59,17 49,26" fill="#e76f51" ' + sw + '/><circle cx="42" cy="21" r="2.2" fill="' + INK + '"/>'),
      ic('<ellipse cx="25" cy="16" rx="6" ry="15" fill="#f7f1df" ' + sw + '/><ellipse cx="39" cy="16" rx="6" ry="15" fill="#f7f1df" ' + sw + '/><ellipse cx="25" cy="16" rx="2.6" ry="9" fill="#f2a7b5"/><ellipse cx="39" cy="16" rx="2.6" ry="9" fill="#f2a7b5"/><circle cx="32" cy="38" r="16" fill="#f7f1df" ' + sw + '/>' + eyes(27, 37, 36) + '<circle cx="32" cy="42" r="2" fill="#f2a7b5"/>'),

      ic('<rect x="16" y="24" width="28" height="24" rx="6" fill="#f7f1df" ' + sw + '/><path d="M44 30 Q52 30 52 37 Q52 44 44 44" fill="none" ' + sw + '/><ellipse cx="30" cy="28" rx="13" ry="3.5" fill="#6b3f25"/><path d="M26 16 Q30 12 26 8 M34 16 Q38 12 34 8" fill="none" ' + sw + '/>'),

      ic('<polygon points="22,15 42,15 38,53 26,53" fill="#fff" ' + sw + '/><path d="M24 34 L40 34 L38 51 L26 51 Z" fill="#e76f51"/><path d="M37 16 L49 6" fill="none" ' + sw + '/><circle cx="41" cy="13" r="4" fill="#facc15" ' + sw + '/>'),

      ic('<path d="M32 24 L12 18 L12 46 L32 50 Z" fill="#4d96d8" ' + sw + '/><path d="M32 24 L52 18 L52 46 L32 50 Z" fill="#3f7fb8" ' + sw + '/><path d="M32 24 L32 50" ' + sw + '/><path d="M17 25 L27 27 M17 32 L27 34" stroke="#fff" stroke-width="1.6"/>'),
      ic('<polygon points="22,38 42,38 38,54 26,54" fill="#d98b2b" ' + sw + '/><path d="M32 38 L32 24" ' + sw + '/><ellipse cx="24" cy="30" rx="6" ry="3.5" fill="#5aa469" ' + sw + '/><ellipse cx="40" cy="28" rx="6" ry="3.5" fill="#5aa469" ' + sw + '/><circle cx="20" cy="16" r="4" fill="#e76f51"/><circle cx="32" cy="12" r="4" fill="#e76f51"/><circle cx="44" cy="16" r="4" fill="#e76f51"/><circle cx="26" cy="22" r="4" fill="#e76f51"/><circle cx="38" cy="22" r="4" fill="#e76f51"/><circle cx="32" cy="18" r="4" fill="#facc15"/>'),
      ic('<ellipse cx="28" cy="46" rx="8" ry="6" fill="#b884d8" ' + sw + '/><path d="M36 46 L36 14" ' + sw + '/><path d="M36 14 Q50 18 48 30" fill="none" ' + sw + '/><circle cx="50" cy="40" r="1.8" fill="#b884d8"/><circle cx="20" cy="20" r="1.8" fill="#b884d8"/>'),
    ],
  };

  // husfarger (fasade) – "hvit" justert til kjølig hvit så den skiller seg fra krem
  const HOUSE_FILL = ['#e76f51', '#5aa469', '#f4c542', '#4d96d8', '#eef2f6'];
  const HOUSE_SWATCH = ['#e76f51', '#5aa469', '#f4c542', '#4d96d8', '#f3f5f8'];
  function swatch(vi) {
    return svg('<rect x="10" y="10" width="44" height="44" rx="9" fill="' + HOUSE_SWATCH[vi] + '" stroke="' + INK + '" stroke-width="3"/>');
  }

  root.EinsteinArt = {
    avatar(vi) { return AV[AVATAR_ORDER[vi]]; },
    icon(catKey, vi) { return ICON[catKey] ? ICON[catKey][vi] : ''; },
    swatch,
    houseFill(vi) { return HOUSE_FILL[vi]; },
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* LRNify – Einsteins gåte. Interaksjon + diegetiske ledetråder. v2-skin i template. */
(function () {
  'use strict';
  const E = window.EinsteinEngine;

  // ---------- CONFIG ----------
  const CONFIG = {
    order: ['nybegynner', 'ovet', 'ekspert'],
    levels: {
      nybegynner: { label: 'Nybegynner (3×3)', N: 3, K: 3,
        types: ['assoc', 'neg', 'pos'], caps: { neg: 8 }, minTypes: 2, maxShare: 0.7,
        intro: 'Tre hus. Bruk vitnene til å finne ut hvem som bor hvor.',
        winText: 'Saken er løst! Hele rekka er kartlagt.' },
      ovet: { label: 'Øvet (4×4)', N: 4, K: 4,
        types: ['assoc', 'neg', 'pos', 'neighbor', 'rightOf'], caps: { neg: 10, neighbor: 14, rightOf: 14 }, minTypes: 3, maxShare: 0.6,
        intro: 'Fire hus, og nå teller naboer og venstre/høyre. Hold tunga rett i munnen.',
        winText: 'Knekt! Alle spor peker samme vei.' },
      ekspert: { label: 'Ekspert (5×5)', N: 5, K: 5,
        types: ['assoc', 'neg', 'pos', 'neighbor', 'rightOf'], caps: { neg: 10, neighbor: 14, rightOf: 14 }, minTypes: 3, maxShare: 0.6,
        intro: 'Fem hus, fem kategorier, alle typer spor. Den ekte Einstein-gåten.',
        winText: 'Mesterlig! Hele Måkeveien er løst.' },
    },
    autoDeduce: false, // av: spilleren plasserer hver verdi selv, også den siste gjenværende. Ingen grønne fasit-ruter underveis.
    assist: false,    // av: spilleren gjør all klue-deduksjon selv. på: skraver brikker som bryter et spor.
  };

  // ---------- TEMA (byttbar databank) ----------
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  const THEME = {
    id: 'maakeveien',
    title: 'Mysteriet i Måkeveien',
    goal: { categoryKey: 'dyr', valueIndex: 2 }, // "Hvem eier fisken?"
    categories: [
      { key: 'farge', label: 'Husfarge', prio: 1,
        values: ['Rød', 'Grønn', 'Gul', 'Blå', 'Hvit'],
        def: ['røde', 'grønne', 'gule', 'blå', 'hvite'],
        ref(v) { return 'den som bor i det ' + this.def[v] + ' huset'; },
        place(v) { return 'det ' + this.def[v] + ' huset'; },
        pred(v, neg) { return 'bor' + (neg ? ' ikke' : '') + ' i det ' + this.def[v] + ' huset'; },
        posLine(v, n) { return 'Det ' + this.def[v] + ' huset er hus nummer ' + n + ' fra venstre.'; } },
      { key: 'navn', label: 'Beboer', prio: 5,
        values: ['Astrid', 'Bjørn', 'Cecilie', 'David', 'Emma'],
        ref(v) { return this.values[v]; },
        place(v) { return this.values[v]; },
        pred(v, neg) { return (neg ? 'er ikke ' : 'er ') + this.values[v]; },
        posLine(v, n) { return this.values[v] + ' bor i hus nummer ' + n + '.'; } },
      { key: 'dyr', label: 'Kjæledyr', prio: 3,
        values: ['Katt', 'Hund', 'Fisk', 'Fugl', 'Kanin'],
        noun: ['katten', 'hunden', 'fisken', 'fuglen', 'kaninen'],
        ref(v) { return 'den som eier ' + this.noun[v]; },
        place(v) { return 'den som eier ' + this.noun[v]; },
        pred(v, neg) { return 'eier' + (neg ? ' ikke' : '') + ' ' + this.noun[v]; },
        posLine(v, n) { return cap(this.noun[v]) + ' bor i hus nummer ' + n + '.'; } },
      { key: 'drikke', label: 'Drikke', prio: 3,
        values: ['Melk', 'Kaffe', 'Te', 'Saft', 'Vann'],
        lc: ['melk', 'kaffe', 'te', 'saft', 'vann'],
        ref(v) { return 'den som drikker ' + this.lc[v]; },
        place(v) { return 'den som drikker ' + this.lc[v]; },
        pred(v, neg) { return 'drikker' + (neg ? ' ikke' : '') + ' ' + this.lc[v]; },
        posLine(v, n) { return 'I hus nummer ' + n + ' drikker de ' + this.lc[v] + '.'; } },
      { key: 'hobby', label: 'Hobby', prio: 3,
        values: ['Maling', 'Fotball', 'Lesing', 'Hagestell', 'Musikk'],
        lc: ['maling', 'fotball', 'lesing', 'hagestell', 'musikk'],
        ref(v) { return 'den som driver med ' + this.lc[v]; },
        place(v) { return 'den som driver med ' + this.lc[v]; },
        pred(v, neg) { return 'driver' + (neg ? ' ikke' : '') + ' med ' + this.lc[v]; },
        posLine(v, n) { return 'Den som driver med ' + this.lc[v] + ' bor i hus nummer ' + n + '.'; } },
    ],
  };

  function lbl(c, v) { return THEME.categories[c].values[v]; }

  const ART = window.EinsteinArt;
  function cellArt(c, v) {
    const key = THEME.categories[c].key;
    if (key === 'navn') return ART.avatar(v);
    if (key === 'farge') return ART.swatch(v);
    return ART.icon(key, v);
  }
  const fargeIdx = THEME.categories.findIndex(x => x.key === 'farge');

  function clueText(cl) {
    const cats = THEME.categories;
    if (cl.t === 'pos') return cats[cl.cA].posLine(cl.vA, cl.p + 1);
    if (cl.t === 'assoc' || cl.t === 'neg') {
      let S = { c: cl.cA, v: cl.vA }, P = { c: cl.cB, v: cl.vB };
      if (cats[P.c].prio > cats[S.c].prio) { const t = S; S = P; P = t; }
      const subj = cats[S.c].ref(S.v);
      const pred = cats[P.c].pred(P.v, cl.t === 'neg');
      const sep = subj.startsWith('den som') ? ', ' : ' ';
      return cap(subj) + sep + pred + '.';
    }
    // spatiale: bruk place() (unngår dobbel-verb), nøytralt "er"
    if (cl.t === 'rightOf') return cap(cats[cl.cA].place(cl.vA)) + ' er rett til høyre for ' + cats[cl.cB].place(cl.vB) + '.';
    if (cl.t === 'neighbor') return cap(cats[cl.cA].place(cl.vA)) + ' er nabo med ' + cats[cl.cB].place(cl.vB) + '.';
    return '';
  }

  // ---------- TILSTAND ----------
  let levelKey = 'ekspert';
  let puzzle = null;       // {N,K,sol,posOf,clues}
  let manual = null;       // manual[p][c] = verdi-indeks | null (kun spillerens valg)
  let usedClues = null;    // bool[]
  let history = [];        // stack av manual-snapshots
  let won = false;
  let message = '';

  function snapshot() { return manual.map(r => r.slice()); }
  function pushHistory() { history.push(snapshot()); if (history.length > 100) history.shift(); }

  function newPuzzle(key) {
    levelKey = key || levelKey;
    const cfg = CONFIG.levels[levelKey];
    puzzle = E.generate({ N: cfg.N, K: cfg.K, types: cfg.types, caps: cfg.caps, minTypes: cfg.minTypes, maxShare: cfg.maxShare });
    manual = Array.from({ length: cfg.N }, () => new Array(cfg.K).fill(null));
    usedClues = new Array(puzzle.clues.length).fill(false);
    history = []; won = false;
    message = cfg.intro;
    render();
    return puzzle;
  }

  // Avled visning fra manuelle valg + auto-utfylling (samme-kategori-regel) til fikspunkt.
  function deriveDisplay() {
    const N = puzzle.N, K = puzzle.K;
    const val = Array.from({ length: N }, (_, p) => manual[p].slice());
    const src = Array.from({ length: N }, (_, p) => manual[p].map(v => (v == null ? null : 'manual')));
    if (CONFIG.autoDeduce) {
      let changed = true, guard = 0;
      while (changed && guard++ < 60) {
        changed = false;
        for (let c = 0; c < K; c++) for (let p = 0; p < N; p++) {
          if (val[p][c] != null) continue;
          const used = new Set();
          for (let q = 0; q < N; q++) if (q !== p && val[q][c] != null) used.add(val[q][c]);
          if (used.size === N - 1) {
            for (let v = 0; v < N; v++) if (!used.has(v)) { val[p][c] = v; src[p][c] = 'auto'; changed = true; break; }
          }
        }
      }
    }
    return { val, src };
  }

  function posMapFrom(val) {
    const N = puzzle.N, K = puzzle.K;
    const pm = Array.from({ length: K }, () => new Array(N).fill(-1));
    for (let p = 0; p < N; p++) for (let c = 0; c < K; c++) if (val[p][c] != null) pm[c][val[p][c]] = p;
    return pm;
  }

  // Kandidat-chips for en tom rute: hvilke verdier er fortsatt mulige, og hvorfor ikke.
  function candidatesFor(p, c, val, pm) {
    const N = puzzle.N;
    const out = [];
    for (let v = 0; v < N; v++) {
      let takenElsewhere = false;
      for (let q = 0; q < N; q++) if (q !== p && val[q][c] === v) { takenElsewhere = true; break; }
      const clueClash = CONFIG.assist && !takenElsewhere && !E.candidateOk(puzzle.clues, c, v, p, pm);
      out.push({ v, eliminated: takenElsewhere || clueClash, reason: takenElsewhere ? 'kat' : (clueClash ? 'spor' : 'ok') });
    }
    return out;
  }

  function status() {
    const { val } = deriveDisplay();
    const N = puzzle.N, K = puzzle.K;
    let filled = 0, correct = 0;
    for (let p = 0; p < N; p++) for (let c = 0; c < K; c++) {
      if (val[p][c] != null) { filled++; if (val[p][c] === puzzle.sol[c][p]) correct++; }
    }
    const total = N * K;
    return { val, filled, correct, total, allFilled: filled === total, solved: filled === total && correct === total };
  }

  function countAutoFilled() {
    const { src } = deriveDisplay();
    let n = 0; src.forEach(r => r.forEach(s => { if (s === 'auto') n++; }));
    return n;
  }

  // ---------- HANDLINGER ----------
  function assign(p, c, v) {
    if (won) return;
    const beforeAuto = countAutoFilled();
    pushHistory();
    manual[p][c] = v;
    const afterAuto = countAutoFilled();
    const snapped = afterAuto - beforeAuto;
    let msg = '«' + lbl(c, v) + '» satt inn i Hus ' + (p + 1) + '. Krysset ut «' + lbl(c, v) + '» i de andre husene.';
    if (snapped > 0) msg += ' ' + snapped + (snapped === 1 ? ' rute' : ' ruter') + ' fylte seg selv.';
    message = msg;
    const st = status();
    if (st.solved) { won = true; }
    else if (st.allFilled) message = 'Alt er fylt, men noe bryter med sporene. Sjekk på nytt.';
    render();
  }

  function clearCell(p, c) {
    if (won) return;
    if (manual[p][c] == null) return;
    pushHistory();
    manual[p][c] = null;
    message = 'Tømte Hus ' + (p + 1) + '. Regner ut på nytt.';
    render();
  }

  function undo() {
    if (!history.length) return;
    manual = history.pop();
    won = false;
    message = 'Angret ett steg.';
    render();
  }

  function check() {
    const st = status();
    if (!st.allFilled) { message = 'Ikke alt er fylt ut ennå (' + st.filled + '/' + st.total + ').'; }
    else if (st.solved) { won = true; }
    else { message = 'Noe skurrer – en eller flere verdier bryter med sporene.'; }
    render();
  }

  function nextLevel() {
    const i = CONFIG.order.indexOf(levelKey);
    newPuzzle(CONFIG.order[Math.min(CONFIG.order.length - 1, i + 1)]);
  }

  // ---------- RENDER ----------
  function render() {
    const cfg = CONFIG.levels[levelKey];
    const N = puzzle.N, K = puzzle.K;
    const st = status();
    const { val, src } = deriveDisplay();
    const pm = posMapFrom(val);

    document.getElementById('title').textContent = THEME.title;
    document.getElementById('sub').textContent = cfg.label;

    // brett: ett kort per hus
    const board = document.getElementById('board');
    board.style.setProperty('--n', N);
    let html = '';
    for (let p = 0; p < N; p++) {
      const fc = fargeIdx >= 0 ? val[p][fargeIdx] : null;
      const cardCls = fc != null ? 'card tinted' : 'card';
      const cardStyle = fc != null ? ' style="--facade:' + ART.houseFill(fc) + '"' : '';
      html += '<div class="' + cardCls + '"' + cardStyle + '><div class="card-title"><span>Hus ' + (p + 1) + '</span></div>';
      for (let c = 0; c < K; c++) {
        const v = val[p][c];
        const s = src[p][c];
        let body, cls;
        if (v != null) {
          cls = 'cell filled ' + (s === 'auto' ? 'auto' : 'manual');
          body = '<span class="art-wrap">' + cellArt(c, v) + '</span><span class="value">' + lbl(c, v) + '</span>';
        } else {
          cls = 'cell open';
          const cands = candidatesFor(p, c, val, pm);
          body = '<span class="chips">' + cands.map(o =>
            '<button class="chip ' + (o.eliminated ? 'struck ' + o.reason : '') + '" data-p="' + p + '" data-c="' + c + '" data-v="' + o.v + '"' +
            (o.eliminated ? ' disabled' : '') + ' aria-label="' + lbl(c, o.v) + (o.eliminated ? ', utelukket' : ', velg') + '">' +
            '<span class="chip-art">' + cellArt(c, o.v) + '</span><span class="chip-lbl">' + lbl(c, o.v) + '</span></button>'
          ).join('') + '</span>';
        }
        html += '<div class="' + cls + '" data-p="' + p + '" data-c="' + c + '">' +
          '<span class="cat">' + THEME.categories[c].label + '</span>' + body + '</div>';
      }
      html += '</div>';
    }
    board.innerHTML = html;
    // tap på chip = velg; tap på utfylt manuell rute = tøm
    board.querySelectorAll('button.chip:not([disabled])').forEach(b =>
      b.addEventListener('click', e => { e.stopPropagation(); assign(+b.dataset.p, +b.dataset.c, +b.dataset.v); }));
    board.querySelectorAll('.cell.filled.manual').forEach(el =>
      el.addEventListener('click', () => clearCell(+el.dataset.p, +el.dataset.c)));

    // ledetråder
    const cl = document.getElementById('clues');
    cl.innerHTML = puzzle.clues.map((c, i) =>
      '<button class="clue ' + (usedClues[i] ? 'used' : '') + '" data-i="' + i + '">' +
      '<span class="check">' + (usedClues[i] ? '✓' : '') + '</span><span>' + clueText(c) + '</span></button>'
    ).join('');
    cl.querySelectorAll('button.clue').forEach(li =>
      li.addEventListener('click', () => { const i = +li.dataset.i; usedClues[i] = !usedClues[i]; render(); }));

    // status-piller
    document.getElementById('progress').innerHTML = 'Utfylt <strong>' + st.filled + '/' + st.total + '</strong>';
    document.getElementById('clueprog').innerHTML = 'Spor brukt <strong>' + usedClues.filter(Boolean).length + '/' + puzzle.clues.length + '</strong>';
    document.getElementById('message').textContent = message;
    document.getElementById('undo').disabled = history.length === 0;

    // seier
    const win = document.getElementById('win');
    if (won) {
      const last = CONFIG.order.indexOf(levelKey) === CONFIG.order.length - 1;
      win.querySelector('#wintext').textContent = cfg.winText;
      win.querySelector('#nextlevel').style.display = last ? 'none' : '';
      win.classList.add('open');
      launchConfetti();
    } else {
      win.classList.remove('open');
    }
  }

  // ---------- konfetti (lett) ----------
  function launchConfetti() {
    const wrap = document.getElementById('confetti');
    if (wrap.dataset.on === '1') return;
    wrap.dataset.on = '1'; wrap.innerHTML = '';
    const cols = ['#facc15', '#86efac', '#bfdbfe', '#fca5a5', '#fb923c'];
    for (let i = 0; i < 40; i++) {
      const d = document.createElement('div'); d.className = 'piece';
      d.style.left = (Math.random() * 100) + '%';
      d.style.background = cols[i % cols.length];
      d.style.animationDelay = (Math.random() * 300) + 'ms';
      d.style.animationDuration = (850 + Math.random() * 600) + 'ms';
      wrap.appendChild(d);
    }
    setTimeout(() => { wrap.innerHTML = ''; wrap.dataset.on = '0'; }, 1700);
  }

  // ---------- API for test ----------
  window.__game = {
    engine: E, CONFIG, THEME,
    newPuzzle, nextLevel, undo,
    get puzzle() { return puzzle; },
    state: status,
    setCell(p, c, v) { pushHistory(); manual[p][c] = v; const st = status(); won = st.solved; render(); },
    clearCell,
    solveToWin() {
      pushHistory();
      for (let p = 0; p < puzzle.N; p++) for (let c = 0; c < puzzle.K; c++) manual[p][c] = puzzle.sol[c][p];
      won = status().solved; render(); return won;
    },
    reset() { pushHistory(); manual = Array.from({ length: puzzle.N }, () => new Array(puzzle.K).fill(null)); won = false; message = CONFIG.levels[levelKey].intro; render(); },
  };

  // ---------- oppstart ----------
  document.addEventListener('DOMContentLoaded', () => {
    const sel = document.getElementById('level');
    CONFIG.order.forEach(k => {
      const o = document.createElement('option'); o.value = k; o.textContent = CONFIG.levels[k].label;
      if (k === levelKey) o.selected = true; sel.appendChild(o);
    });
    sel.addEventListener('change', () => newPuzzle(sel.value));
    document.getElementById('new').addEventListener('click', () => newPuzzle());
    document.getElementById('reset').addEventListener('click', () => window.__game.reset());
    document.getElementById('undo').addEventListener('click', undo);
    document.getElementById('check').addEventListener('click', check);
    document.getElementById('playagain').addEventListener('click', () => newPuzzle());
    document.getElementById('nextlevel').addEventListener('click', nextLevel);
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    });
    newPuzzle();
  });
})();

</script>

<script src="/deling/deling.js" defer></script>
