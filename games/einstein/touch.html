<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mysteriet i Måkeveien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff9f0; --ink:#2b2118; --yellow:#facc15; --green:#cdeecf; --greenink:#2f6b35;
    --wall:#fffaf0; --gonepink:#f3dcd8; --goneblue:#dfe7f2;
    --bar-h:56px; --fab-size:58px; --sheet-peek:72px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif; font-weight:700; overscroll-behavior:none; }

  /* ════════════════════════════════
     TOPPBAR
  ════════════════════════════════ */
  #topbar{
    position:fixed; top:0; left:0; right:0; height:var(--bar-h);
    background:var(--bg); border-bottom:3px solid var(--ink);
    display:flex; align-items:center; padding:0 12px; gap:10px; z-index:20;
    padding-top: env(safe-area-inset-top, 0px);
  }
  #title{ font-family:'Chewy',cursive; font-weight:400; font-size:22px; margin:0; flex:1; }
  #sub{ font-size:11px; font-weight:800; background:var(--yellow); border:2.5px solid var(--ink);
    border-radius:999px; padding:2px 9px; box-shadow:0 3px 0 var(--ink); }
  #menu-btn{
    width:44px; height:44px; border:3px solid var(--ink); border-radius:13px;
    background:#fff; box-shadow:0 4px 0 var(--ink); font-size:20px; line-height:1;
    display:grid; place-items:center; cursor:pointer; touch-action:manipulation; flex:none;
  }
  #menu-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }

  /* ════════════════════════════════
     HUS-NAVIGATOR (under toppbar)
  ════════════════════════════════ */
  #house-nav{
    position:fixed; top:var(--bar-h); left:0; right:0; z-index:15;
    display:flex; align-items:center; gap:8px; padding:8px 12px;
    background:var(--bg); border-bottom:2px solid var(--ink);
  }
  .nav-arrow{
    width:40px; height:40px; flex:none; border:3px solid var(--ink); border-radius:12px;
    background:#fff; box-shadow:0 4px 0 var(--ink); font-size:18px;
    display:grid; place-items:center; cursor:pointer; touch-action:manipulation;
  }
  .nav-arrow:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .nav-arrow:disabled{ opacity:.3; pointer-events:none; }
  #house-dots{ flex:1; display:flex; justify-content:center; gap:6px; }
  .hdot{
    width:28px; height:28px; border:2.5px solid var(--ink); border-radius:8px;
    background:#fff; font-weight:800; font-size:12px;
    display:grid; place-items:center; cursor:pointer; touch-action:manipulation;
    transition:background .12s;
  }
  .hdot.active{ background:var(--ink); color:var(--bg); }
  .hdot.done{ background:var(--green); }

  /* ════════════════════════════════
     SCROLLABLE MIDTFLATE
  ════════════════════════════════ */
  #scroll-area{
    position:fixed;
    top:calc(var(--bar-h) + 58px);   /* toppbar + nav */
    left:0; right:0;
    bottom:calc(var(--sheet-peek) + var(--safe-bottom));
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:12px 12px 80px;          /* 80px = rom til FAB */
  }

  /* ════════════════════════════════
     HUS-KORT (enkeltvisning)
  ════════════════════════════════ */
  .card{
    border:3.5px solid var(--ink); border-radius:18px;
    background:var(--wall); box-shadow:0 7px 0 var(--ink);
    overflow:hidden; transition:background .2s;
  }
  .card.tinted{ background:var(--facade); }
  .card-header{
    background:var(--ink); color:var(--bg);
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px;
  }
  .card-header-title{ font-family:'Chewy',cursive; font-weight:400; font-size:20px; }
  .card-header-color{ width:24px; height:24px; border-radius:6px; border:2px solid rgba(255,255,255,.4); }

  .cat-rows{ display:flex; flex-direction:column; gap:0; }
  .cat-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; border-top:2px solid var(--ink);
  }
  .cat-label{
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
    opacity:.55; width:72px; flex:none; line-height:1.2;
  }
  .cat-content{ flex:1; min-width:0; }

  /* Utfylt celle */
  .filled-cell{
    display:flex; align-items:center; gap:10px;
    padding:6px 12px; border:3px solid var(--ink); border-radius:13px;
    background:#fffdf3; box-shadow:0 4px 0 var(--ink);
    cursor:pointer; touch-action:manipulation;
    transition:transform .1s;
  }
  .filled-cell.auto{ background:var(--green); }
  .filled-cell.auto .fill-value{ color:var(--greenink); font-style:italic; }
  .filled-cell:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .fill-art{ width:34px; height:34px; flex:none; }
  .fill-art svg{ width:100%; height:100%; display:block; }
  .fill-value{ font-weight:800; font-size:16px; }

  /* Åpen celle – chip-grid */
  .chip-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(58px, 1fr));
    gap:6px;
  }
  .chip{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    border:2.5px solid var(--ink); border-radius:12px; background:#fbf6ec;
    padding:7px 4px 5px; font-weight:800; font-size:11px; line-height:1.1;
    cursor:pointer; color:var(--ink); touch-action:manipulation; text-align:center;
  }
  .chip:active{ transform:translateY(2px); }
  .chip-art{ width:30px; height:30px; }
  .chip-art svg{ width:100%; height:100%; display:block; }
  .chip.struck{
    opacity:.5; text-decoration:line-through; text-decoration-thickness:2px;
    pointer-events:none;
  }
  .chip.struck.kat{ background:var(--gonepink); color:#a4665e; }
  .chip.struck.spor{ background:var(--goneblue); color:#5a6f8f; }

  /* ════════════════════════════════
     MELDINGS-SNACK
  ════════════════════════════════ */
  #snack{
    position:fixed; left:12px; right:12px;
    bottom:calc(var(--sheet-peek) + var(--safe-bottom) + 68px);
    background:var(--ink); color:var(--bg); border-radius:14px;
    padding:10px 16px; font-size:13px; font-weight:800;
    box-shadow:0 6px 0 rgba(0,0,0,.3); z-index:25;
    opacity:0; transform:translateY(8px);
    transition:opacity .2s, transform .2s;
    pointer-events:none;
  }
  #snack.show{ opacity:1; transform:translateY(0); }

  /* ════════════════════════════════
     FAB – Sjekk
  ════════════════════════════════ */
  #fab-check{
    position:fixed;
    right:16px;
    bottom:calc(var(--sheet-peek) + var(--safe-bottom) + 12px);
    width:var(--fab-size); height:var(--fab-size);
    background:var(--yellow); border:3px solid var(--ink);
    border-radius:50%; box-shadow:0 6px 0 var(--ink);
    font-family:'Chewy',cursive; font-size:13px; font-weight:400;
    display:grid; place-items:center; cursor:pointer;
    touch-action:manipulation; z-index:22; line-height:1.1; text-align:center;
  }
  #fab-check:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }

  /* ════════════════════════════════
     BUNNARK – Vitneutsagn
  ════════════════════════════════ */
  #sheet-backdrop{
    position:fixed; inset:0; background:rgba(43,33,24,.0);
    z-index:29; pointer-events:none;
    transition:background .25s;
  }
  #sheet-backdrop.open{ background:rgba(43,33,24,.35); pointer-events:all; }

  #sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:#fffdf8; border:3px solid var(--ink);
    border-radius:22px 22px 0 0; box-shadow:0 -6px 0 var(--ink);
    display:flex; flex-direction:column;
    transform:translateY(calc(100% - var(--sheet-peek) - var(--safe-bottom)));
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    padding-bottom:var(--safe-bottom);
  }
  #sheet.open{ transform:translateY(0); }

  #sheet-handle-area{
    padding:10px 0 4px; display:flex; flex-direction:column; align-items:center;
    gap:6px; cursor:pointer; touch-action:manipulation; flex:none;
  }
  #sheet-handle{ width:40px; height:5px; border-radius:3px; background:#ccc; }
  #sheet-top{
    display:flex; align-items:center; gap:8px; padding:0 14px 8px;
  }
  #sheet-title{ font-family:'Chewy',cursive; font-weight:400; font-size:19px; flex:1; }
  #sheet-close{
    width:36px; height:36px; border:2.5px solid var(--ink); border-radius:10px;
    background:#fff; box-shadow:0 3px 0 var(--ink); font-size:16px;
    display:grid; place-items:center; cursor:pointer; touch-action:manipulation; flex:none;
  }
  #sheet-close:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  #clue-badge{
    background:var(--ink); color:var(--bg); border-radius:999px;
    padding:2px 9px; font-size:12px; font-weight:800;
  }
  #sheet-progress{ font-size:12px; font-weight:800; opacity:.65; }

  #clues{
    list-style:none; margin:0; padding:4px 12px 12px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; gap:7px; flex:1;
  }
  .clue{
    display:grid; grid-template-columns:auto 1fr; gap:10px;
    align-items:start; text-align:left; width:100%;
    padding:10px 11px; border:3px solid var(--ink); border-radius:14px;
    background:#fff; box-shadow:0 3px 0 var(--ink);
    font-size:14px; font-weight:700; cursor:pointer; line-height:1.4;
    touch-action:manipulation;
  }
  .clue:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .clue .check{
    width:24px; height:24px; border:2px solid var(--ink); border-radius:7px;
    background:#fff; display:grid; place-items:center; font-size:14px; flex:none;
    margin-top:1px;
  }
  .clue.used{ background:#eef7ec; color:#7b8c77; }
  .clue.used .check{ background:var(--green); }

  /* ════════════════════════════════
     MENY-MODAL
  ════════════════════════════════ */
  #menu-modal{
    position:fixed; inset:0; z-index:50; display:none;
    place-items:center; background:rgba(43,33,24,.45);
  }
  #menu-modal.open{ display:grid; }
  .menu-card{
    background:var(--bg); border:4px solid var(--ink); border-radius:22px;
    box-shadow:0 10px 0 var(--ink); padding:20px; width:min(320px, 90vw);
    display:flex; flex-direction:column; gap:10px;
  }
  .menu-card h2{ font-family:'Chewy',cursive; font-weight:400; font-size:24px; margin:0 0 4px; }
  .menu-btn{
    font:inherit; font-weight:800; font-size:15px; padding:13px 16px;
    color:var(--ink); background:#fff; border:3px solid var(--ink);
    border-radius:14px; box-shadow:0 5px 0 var(--ink); cursor:pointer;
    touch-action:manipulation; text-align:left;
  }
  .menu-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  .menu-btn.yellow{ background:var(--yellow); }
  #menu-level{
    font:inherit; font-weight:800; font-size:15px; padding:13px 16px;
    color:var(--ink); background:#fff; border:3px solid var(--ink);
    border-radius:14px; box-shadow:0 5px 0 var(--ink); cursor:pointer;
    touch-action:manipulation; width:100%;
  }
  .menu-sep{ height:2px; background:var(--ink); border-radius:2px; opacity:.15; }

  /* ════════════════════════════════
     WIN-MODAL
  ════════════════════════════════ */
  #win{
    position:fixed; inset:0; display:none; place-items:center; z-index:60;
    background:rgba(43,33,24,.4);
  }
  #win.open{ display:grid; }
  #win .wincard{
    background:#fff; border:4px solid var(--ink); border-radius:22px;
    box-shadow:0 12px 0 var(--ink); padding:28px 24px; text-align:center;
    max-width:340px; width:90%; transform:rotate(-1deg);
  }
  #win h2{ font-family:'Chewy',cursive; font-weight:400; font-size:34px; margin:0 0 8px; color:var(--greenink); }
  #wintext{ margin:0 0 18px; font-weight:800; font-size:15px; line-height:1.45; }
  .winbtns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .winbtns button{
    font:inherit; font-weight:800; font-size:14px; padding:11px 18px;
    color:var(--ink); background:#fff; border:3px solid var(--ink);
    border-radius:14px; box-shadow:0 5px 0 var(--ink); cursor:pointer;
    touch-action:manipulation;
  }
  .winbtns button:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  #nextlevel{ background:var(--yellow) !important; }

  /* ════════════════════════════════
     KONFETTI
  ════════════════════════════════ */
  #confetti{ position:fixed; inset:0; pointer-events:none; z-index:70; }
  #confetti .piece{
    position:absolute; top:-14px; width:11px; height:16px;
    border:2px solid var(--ink); border-radius:3px;
    animation:fall 1100ms ease-out forwards;
  }
  @keyframes fall{ to{ transform:translateY(108vh) rotate(280deg); opacity:.2; } }
  @media (prefers-reduced-motion:reduce){ #confetti{ display:none; } }
</style>
</head>
<body>

<!-- TOPPBAR -->
<header id="topbar">
  <h1 id="title">Mysteriet i Måkeveien</h1>
  <span id="sub"></span>
  <button id="menu-btn" aria-label="Meny">⋯</button>
</header>

<!-- HUS-NAVIGATOR -->
<nav id="house-nav" aria-label="Husnavigasjon">
  <button class="nav-arrow" id="nav-prev" aria-label="Forrige hus">◀</button>
  <div id="house-dots"></div>
  <button class="nav-arrow" id="nav-next" aria-label="Neste hus">▶</button>
</nav>

<!-- SCROLLBART BRETT -->
<div id="scroll-area">
  <div id="board"></div>
</div>

<!-- SNACK-MELDING -->
<div id="snack" aria-live="polite"></div>

<!-- FAB SJEKK -->
<button id="fab-check" aria-label="Sjekk svar">Sjekk<br>svar</button>

<!-- BUNNARK: VITNEUTSAGN -->
<div id="sheet-backdrop" aria-hidden="true"></div>
<div id="sheet" role="dialog" aria-label="Vitneutsagn">
  <div id="sheet-handle-area" aria-label="Åpne vitneutsagn" role="button" tabindex="0">
    <div id="sheet-handle"></div>
    <div id="sheet-top">
      <span id="sheet-title">Vitneutsagn</span>
      <span id="clue-badge"></span>
      <span id="sheet-progress"></span>
      <button id="sheet-close" aria-label="Lukk vitneutsagn">✕</button>
    </div>
  </div>
  <ul id="clues"></ul>
</div>

<!-- MENY-MODAL -->
<div id="menu-modal" role="dialog" aria-label="Meny">
  <div class="menu-card">
    <h2>Meny</h2>
    <select id="menu-level" aria-label="Vanskelighetsgrad"></select>
    <div class="menu-sep"></div>
    <button class="menu-btn yellow" id="btn-new">🎲 Nytt brett</button>
    <button class="menu-btn" id="btn-check">✔ Sjekk svar</button>
    <button class="menu-btn" id="btn-undo">↩ Angre</button>
    <button class="menu-btn" id="btn-reset">🔄 Nullstill</button>
    <div class="menu-sep"></div>
    <button class="menu-btn" id="btn-close-menu">✕ Lukk</button>
  </div>
</div>

<!-- WIN-MODAL -->
<div id="win" aria-live="assertive">
  <div class="wincard">
    <h2>Saken er løst!</h2>
    <p id="wintext"></p>
    <div class="winbtns">
      <button id="playagain">Spill på nytt</button>
      <button id="nextlevel">Neste nivå →</button>
    </div>
  </div>
</div>

<div id="confetti"></div>
<script>
/* LRNify – Einsteins gåte: ren logikkmotor (ingen DOM).
   Eksporteres for både Node-test og innbygging i HTML. */
(function (root) {
  'use strict';

  // ---- Klуetyper ----
  // assoc:    same house: (cA,vA) og (cB,vB) i samme hus
  // neg:      not same house: (cA,vA) IKKE i samme hus som (cB,vB)
  // pos:      (cA,vA) i posisjon p (0-indeksert)
  // rightOf:  (cA,vA) ligger UMIDDELBART til høyre for (cB,vB)  => pos(A)=pos(B)+1
  // neighbor: (cA,vA) ved siden av (cB,vB)                       => |pos(A)-pos(B)|=1

  function shuffle(a, rnd) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function permutation(n, rnd) {
    const a = Array.from({ length: n }, (_, i) => i);
    return shuffle(a, rnd);
  }

  // mulighetsrom for én variabel (c,v) gitt delvis tildeling
  function clueOk(clue, c, v, p, pos) {
    // returnerer false bare hvis klue involverer (c,v) og den ANDRE siden
    // allerede er plassert og bryter regelen.
    const get = (cc, vv) => pos[cc][vv]; // -1 hvis uplassert
    switch (clue.t) {
      case 'assoc': {
        if (clue.cA === c && clue.vA === v) { const o = get(clue.cB, clue.vB); return o < 0 || o === p; }
        if (clue.cB === c && clue.vB === v) { const o = get(clue.cA, clue.vA); return o < 0 || o === p; }
        return true;
      }
      case 'neg': {
        if (clue.cA === c && clue.vA === v) { const o = get(clue.cB, clue.vB); return o < 0 || o !== p; }
        if (clue.cB === c && clue.vB === v) { const o = get(clue.cA, clue.vA); return o < 0 || o !== p; }
        return true;
      }
      case 'pos': {
        if (clue.cA === c && clue.vA === v) return p === clue.p;
        return true;
      }
      case 'rightOf': {
        // pos(A) = pos(B) + 1
        if (clue.cA === c && clue.vA === v) { const o = get(clue.cB, clue.vB); return o < 0 || p === o + 1; }
        if (clue.cB === c && clue.vB === v) { const o = get(clue.cA, clue.vA); return o < 0 || o === p + 1; }
        return true;
      }
      case 'neighbor': {
        if (clue.cA === c && clue.vA === v) { const o = get(clue.cB, clue.vB); return o < 0 || Math.abs(p - o) === 1; }
        if (clue.cB === c && clue.vB === v) { const o = get(clue.cA, clue.vA); return o < 0 || Math.abs(p - o) === 1; }
        return true;
      }
    }
    return true;
  }

  // Teller løsninger opp til (cap). Returnerer faktisk antall (maks cap).
  function countSolutions(K, N, clues, cap) {
    cap = cap || 2;
    // pos[c][v] = posisjon eller -1
    const pos = Array.from({ length: K }, () => new Array(N).fill(-1));
    const usedPos = Array.from({ length: K }, () => new Array(N).fill(false));
    let assignedCount = 0;
    const total = K * N;
    let solutions = 0;

    function feasible(c, v) {
      const out = [];
      for (let p = 0; p < N; p++) {
        if (usedPos[c][p]) continue;
        let ok = true;
        for (let i = 0; i < clues.length; i++) {
          if (!clueOk(clues[i], c, v, p, pos)) { ok = false; break; }
        }
        if (ok) out.push(p);
      }
      return out;
    }

    function rec() {
      if (solutions >= cap) return;
      if (assignedCount === total) { solutions++; return; }
      // MRV: velg uplassert (c,v) med færrest mulige posisjoner
      let bestC = -1, bestV = -1, bestCand = null, bestLen = Infinity;
      for (let c = 0; c < K; c++) {
        for (let v = 0; v < N; v++) {
          if (pos[c][v] !== -1) continue;
          const cand = feasible(c, v);
          if (cand.length < bestLen) { bestLen = cand.length; bestCand = cand; bestC = c; bestV = v; if (bestLen === 0) break; }
        }
        if (bestLen === 0) break;
      }
      if (bestLen === 0) return; // dødt spor
      for (const p of bestCand) {
        pos[bestC][bestV] = p; usedPos[bestC][p] = true; assignedCount++;
        rec();
        pos[bestC][bestV] = -1; usedPos[bestC][p] = false; assignedCount--;
        if (solutions >= cap) return;
      }
    }
    rec();
    return solutions;
  }

  // Bygg kuratert kandidatpool med tak per type (balanse + fart).
  // assoc + pos tas i sin helhet (garanterer at full pool er entydig).
  // neg/neighbor/rightOf samples opp til et tak for variasjon.
  function buildPool(K, N, sol, posOf, types, rnd, caps) {
    const has = (t) => types.indexOf(t) >= 0;
    const groups = { assoc: [], neg: [], pos: [], rightOf: [], neighbor: [] };

    for (let cA = 0; cA < K; cA++) {
      for (let cB = cA + 1; cB < K; cB++) {
        for (let p = 0; p < N; p++)
          if (has('assoc')) groups.assoc.push({ t: 'assoc', cA, vA: sol[cA][p], cB, vB: sol[cB][p] });
        if (has('neg')) for (let pa = 0; pa < N; pa++) for (let pb = 0; pb < N; pb++) {
          if (pa === pb) continue;
          groups.neg.push({ t: 'neg', cA, vA: sol[cA][pa], cB, vB: sol[cB][pb] });
        }
      }
    }
    if (has('pos')) for (let c = 0; c < K; c++) for (let p = 0; p < N; p++)
      groups.pos.push({ t: 'pos', cA: c, vA: sol[c][p], p });

  // Avled visning fra manuelle valg + auto-utfylling (samme-kategori-regel) til fikspunkt.
  function deriveDisplay() {
    const N = puzzle.N, K = puzzle.K;
    const val = Array.from({ length: N }, (_, p) => manual[p].slice());
    const src = Array.from({ length: N }, (_, p) => manual[p].map(v => (v == null ? null : 'manual')));
    if (CONFIG.autoDeduce) {
      let changed = true, guard = 0;
      while (changed && guard++ < 60) {
        changed = false;
        for (let c = 0; c < K; c++) for (let p = 0; p < N; p++) {
          if (val[p][c] != null) continue;
          const used = new Set();
          for (let q = 0; q < N; q++) if (q !== p && val[q][c] != null) used.add(val[q][c]);
          if (used.size === N - 1) {
            for (let v = 0; v < N; v++) if (!used.has(v)) { val[p][c] = v; src[p][c] = 'auto'; changed = true; break; }
          }
        }
      }
    }
    return { val, src };
  }

  function posMapFrom(val) {
    const N = puzzle.N, K = puzzle.K;
    const pm = Array.from({ length: K }, () => new Array(N).fill(-1));
    for (let p = 0; p < N; p++) for (let c = 0; c < K; c++) if (val[p][c] != null) pm[c][val[p][c]] = p;
    return pm;
  }

  // Kandidat-chips for en tom rute: hvilke verdier er fortsatt mulige, og hvorfor ikke.
  function candidatesFor(p, c, val, pm) {
    const N = puzzle.N;
    const out = [];
    for (let v = 0; v < N; v++) {
      let takenElsewhere = false;
      for (let q = 0; q < N; q++) if (q !== p && val[q][c] === v) { takenElsewhere = true; break; }
      const clueClash = CONFIG.assist && !takenElsewhere && !E.candidateOk(puzzle.clues, c, v, p, pm);
      out.push({ v, eliminated: takenElsewhere || clueClash, reason: takenElsewhere ? 'kat' : (clueClash ? 'spor' : 'ok') });
    }
    return out;
  }

  function status() {
    const { val } = deriveDisplay();
    const N = puzzle.N, K = puzzle.K;
    let filled = 0, correct = 0;
    for (let p = 0; p < N; p++) for (let c = 0; c < K; c++) {
      if (val[p][c] != null) { filled++; if (val[p][c] === puzzle.sol[c][p]) correct++; }
    }
    const total = N * K;
    return { val, filled, correct, total, allFilled: filled === total, solved: filled === total && correct === total };
  }

  function countAutoFilled() {
    const { src } = deriveDisplay();
    let n = 0; src.forEach(r => r.forEach(s => { if (s === 'auto') n++; }));
    return n;
  }

  // ---------- HANDLINGER ----------
  function assign(p, c, v) {
    if (won) return;
    const beforeAuto = countAutoFilled();
    pushHistory();
    manual[p][c] = v;
    const afterAuto = countAutoFilled();
    const snapped = afterAuto - beforeAuto;
    let msg = '«' + lbl(c, v) + '» satt inn i Hus ' + (p + 1) + '. Krysset ut «' + lbl(c, v) + '» i de andre husene.';
    if (snapped > 0) msg += ' ' + snapped + (snapped === 1 ? ' rute' : ' ruter') + ' fylte seg selv.';
    message = msg;
    const st = status();
    if (st.solved) { won = true; }
    else if (st.allFilled) message = 'Alt er fylt, men noe bryter med sporene. Sjekk på nytt.';
    render();
  }

  function clearCell(p, c) {
    if (won) return;
    if (manual[p][c] == null) return;
    pushHistory();
    manual[p][c] = null;
    message = 'Tømte Hus ' + (p + 1) + '. Regner ut på nytt.';
    render();
  }

  function undo() {
    if (!history.length) return;
    manual = history.pop();
    won = false;
    message = 'Angret ett steg.';
    render();
  }

  function check() {
    const st = status();
    if (!st.allFilled) { message = 'Ikke alt er fylt ut ennå (' + st.filled + '/' + st.total + ').'; }
    else if (st.solved) { won = true; }
    else { message = 'Noe skurrer – en eller flere verdier bryter med sporene.'; }
    render();
  }

  function nextLevel() {
    const i = CONFIG.order.indexOf(levelKey);
    newPuzzle(CONFIG.order[Math.min(CONFIG.order.length - 1, i + 1)]);
  }

  // ---------- MOBIL UI-TILSTAND ----------
  let currentHouse = 0;   // hvilken hus som vises
  let sheetOpen = false;
  let snackTimer = null;

  // ---------- RENDER ----------
  function render() {
    const cfg = CONFIG.levels[levelKey];
    const N = puzzle.N, K = puzzle.K;
    const st = status();
    const { val, src } = deriveDisplay();
    const pm = posMapFrom(val);

    // Toppbar
    document.getElementById('title').textContent = THEME.title;
    document.getElementById('sub').textContent = cfg.label;

    // Klem currentHouse innenfor gyldig rekkevidde
    if (currentHouse >= N) currentHouse = N - 1;

    // ── Navigator-prikker ──
    const dotsEl = document.getElementById('house-dots');
    let dotsHtml = '';
    for (let p = 0; p < N; p++) {
      const allFilled = val[p].every(v => v != null);
      const cls = (p === currentHouse ? 'active' : '') + (allFilled ? ' done' : '');
      dotsHtml += '<button class="hdot ' + cls + '" data-p="' + p + '" aria-label="Hus ' + (p+1) + '">' + (p+1) + '</button>';
    }
    dotsEl.innerHTML = dotsHtml;
    dotsEl.querySelectorAll('.hdot').forEach(b =>
      b.addEventListener('click', () => { currentHouse = +b.dataset.p; render(); }));
    document.getElementById('nav-prev').disabled = currentHouse === 0;
    document.getElementById('nav-next').disabled = currentHouse === N - 1;

    // ── Kort for gjeldende hus ──
    const p = currentHouse;
    const fc = fargeIdx >= 0 ? val[p][fargeIdx] : null;
    const tinted = fc != null;
    const fillColor = tinted ? ART.houseFill(fc) : null;

    let html = '<div class="card' + (tinted ? ' tinted' : '') + '"'
      + (tinted ? ' style="--facade:' + fillColor + '"' : '') + '>';

    // Korthodet
    html += '<div class="card-header">';
    html += '<span class="card-header-title">Hus ' + (p+1) + '</span>';
    if (tinted) html += '<div class="card-header-color" style="background:' + fillColor + '"></div>';
    html += '</div>';

    // Kategori-rader
    html += '<div class="cat-rows">';
    for (let c = 0; c < K; c++) {
      const v = val[p][c];
      const s = src[p][c];
      html += '<div class="cat-row">';
      html += '<span class="cat-label">' + THEME.categories[c].label + '</span>';
      html += '<div class="cat-content">';
      if (v != null) {
        const cls = 'filled-cell ' + (s === 'auto' ? 'auto' : 'manual');
        html += '<div class="' + cls + '" data-p="' + p + '" data-c="' + c + '">'
          + '<span class="fill-art">' + cellArt(c, v) + '</span>'
          + '<span class="fill-value">' + lbl(c, v) + '</span>'
          + '</div>';
      } else {
        const cands = candidatesFor(p, c, val, pm);
        html += '<div class="chip-grid">';
        cands.forEach(o => {
          const struck = o.eliminated ? ' struck ' + o.reason : '';
          html += '<button class="chip' + struck + '" data-p="' + p + '" data-c="' + c + '" data-v="' + o.v + '"'
            + (o.eliminated ? ' disabled' : '')
            + ' aria-label="' + lbl(c, o.v) + (o.eliminated ? ', utelukket' : ', velg') + '">'
            + '<span class="chip-art">' + cellArt(c, o.v) + '</span>'
            + lbl(c, o.v)
            + '</button>';
        });
        html += '</div>';
      }
      html += '</div></div>';
    }
    html += '</div></div>';

    document.getElementById('board').innerHTML = html;

    // Events
    document.querySelectorAll('.chip:not([disabled])').forEach(b =>
      b.addEventListener('click', e => { e.stopPropagation(); assign(+b.dataset.p, +b.dataset.c, +b.dataset.v); }));
    document.querySelectorAll('.filled-cell.manual').forEach(el =>
      el.addEventListener('click', () => clearCell(+el.dataset.p, +el.dataset.c)));

    // ── Vitneutsagn (bunnark) ──
    const used = usedClues.filter(Boolean).length;
    const total = puzzle.clues.length;
    document.getElementById('clue-badge').textContent = used + '/' + total + ' brukt';
    document.getElementById('sheet-progress').textContent =
      'Utfylt ' + st.filled + '/' + st.total;

    const cl = document.getElementById('clues');
    cl.innerHTML = puzzle.clues.map((c, i) =>
      '<button class="clue ' + (usedClues[i] ? 'used' : '') + '" data-i="' + i + '">'
      + '<span class="check">' + (usedClues[i] ? '✓' : '') + '</span>'
      + '<span>' + clueText(c) + '</span>'
      + '</button>'
    ).join('');
    cl.querySelectorAll('button.clue').forEach(li =>
      li.addEventListener('click', () => { const i = +li.dataset.i; usedClues[i] = !usedClues[i]; render(); }));

    // Angre-knapp tilstand
    document.getElementById('btn-undo').style.opacity = history.length === 0 ? '.4' : '1';
    document.getElementById('btn-undo').disabled = history.length === 0;

    // Snack fra message
    if (message) showSnack(message);

    // ── Seier ──
    const win = document.getElementById('win');
    if (won) {
      const last = CONFIG.order.indexOf(levelKey) === CONFIG.order.length - 1;
      win.querySelector('#wintext').textContent = cfg.winText;
      win.querySelector('#nextlevel').style.display = last ? 'none' : '';
      win.classList.add('open');
      launchConfetti();
    } else {
      win.classList.remove('open');
    }
  }

  // ── Snack ──
  function showSnack(txt) {
    const el = document.getElementById('snack');
    el.textContent = txt;
    el.classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  // ── Bunnark toggle ──
  function toggleSheet(force) {
    sheetOpen = force !== undefined ? force : !sheetOpen;
    document.getElementById('sheet').classList.toggle('open', sheetOpen);
    document.getElementById('sheet-backdrop').classList.toggle('open', sheetOpen);
  }

  // ---------- konfetti ----------
  function launchConfetti() {
    const wrap = document.getElementById('confetti');
    if (wrap.dataset.on === '1') return;
    wrap.dataset.on = '1'; wrap.innerHTML = '';
    const cols = ['#facc15', '#86efac', '#bfdbfe', '#fca5a5', '#fb923c'];
    for (let i = 0; i < 40; i++) {
      const d = document.createElement('div'); d.className = 'piece';
      d.style.left = (Math.random() * 100) + '%';
      d.style.background = cols[i % cols.length];
      d.style.animationDelay = (Math.random() * 300) + 'ms';
      d.style.animationDuration = (850 + Math.random() * 600) + 'ms';
      wrap.appendChild(d);
    }
    setTimeout(() => { wrap.innerHTML = ''; wrap.dataset.on = '0'; }, 1700);
  }

  // ---------- API for test ----------
  window.__game = {
    engine: E, CONFIG, THEME,
    newPuzzle, nextLevel, undo,
    get puzzle() { return puzzle; },
    state: status,
    setCell(p, c, v) { pushHistory(); manual[p][c] = v; const st = status(); won = st.solved; render(); },
    clearCell,
    solveToWin() {
      pushHistory();
      for (let p = 0; p < puzzle.N; p++) for (let c = 0; c < puzzle.K; c++) manual[p][c] = puzzle.sol[c][p];
      won = status().solved; render(); return won;
    },
    reset() { pushHistory(); manual = Array.from({ length: puzzle.N }, () => new Array(puzzle.K).fill(null)); won = false; message = CONFIG.levels[levelKey].intro; render(); },
  };

  // ---------- OPPSTART ----------
  document.addEventListener('DOMContentLoaded', () => {

    // Meny-modal level-velger
    const sel = document.getElementById('menu-level');
    CONFIG.order.forEach(k => {
      const o = document.createElement('option'); o.value = k; o.textContent = CONFIG.levels[k].label;
      if (k === levelKey) o.selected = true; sel.appendChild(o);
    });
    sel.addEventListener('change', () => { newPuzzle(sel.value); closeMenu(); });

    // Meny åpne/lukke
    function openMenu() { document.getElementById('menu-modal').classList.add('open'); }
    function closeMenu() { document.getElementById('menu-modal').classList.remove('open'); }
    document.getElementById('menu-btn').addEventListener('click', openMenu);
    document.getElementById('btn-close-menu').addEventListener('click', closeMenu);
    document.getElementById('menu-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeMenu(); });

    // Meny-handlinger
    document.getElementById('btn-new').addEventListener('click', () => { newPuzzle(); closeMenu(); });
    document.getElementById('btn-check').addEventListener('click', () => { check(); closeMenu(); });
    document.getElementById('btn-undo').addEventListener('click', () => { undo(); closeMenu(); });
    document.getElementById('btn-reset').addEventListener('click', () => { window.__game.reset(); closeMenu(); });

    // FAB
    document.getElementById('fab-check').addEventListener('click', check);

    // Navigasjon
    document.getElementById('nav-prev').addEventListener('click', () => { if (currentHouse > 0) { currentHouse--; render(); } });
    document.getElementById('nav-next').addEventListener('click', () => { if (currentHouse < puzzle.N - 1) { currentHouse++; render(); } });

    // Bunnark – klikk på håndtak åpner/lukker
    const handleArea = document.getElementById('sheet-handle-area');
    handleArea.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSheet(); } });
    document.getElementById('sheet-backdrop').addEventListener('click', () => toggleSheet(false));
    document.getElementById('sheet-close').addEventListener('click', () => toggleSheet(false));

    // Bunnark – touch-drag på hele arket: dra ned for å lukke, dra opp for å åpne
    const sheet = document.getElementById('sheet');
    let sheetTouchStartY = 0;
    let sheetTouchStartX = 0;
    let sheetDragging = false;

    sheet.addEventListener('touchstart', e => {
      sheetTouchStartY = e.touches[0].clientY;
      sheetTouchStartX = e.touches[0].clientX;
      sheetDragging = false;
    }, { passive: true });

    sheet.addEventListener('touchmove', e => {
      const dy = e.touches[0].clientY - sheetTouchStartY;
      const dx = e.touches[0].clientX - sheetTouchStartX;
      // Regnes som vertikal drag (ikke horisontal scroll i clue-listen)
      if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8) sheetDragging = true;
    }, { passive: true });

    sheet.addEventListener('touchend', e => {
      if (!sheetDragging) return;
      const dy = e.changedTouches[0].clientY - sheetTouchStartY;
      // Dra ned > 60px → lukk; dra opp > 60px → åpne
      if (dy > 60) toggleSheet(false);
      else if (dy < -60) toggleSheet(true);
      sheetDragging = false;
    }, { passive: true });

    // Klikk på håndtak-area toggler (bare hvis ingen drag skjedde)
    handleArea.addEventListener('click', () => { if (!sheetDragging) toggleSheet(); });

    // Swipe på brettet (venstre/høyre)
    let touchStartX = 0;
    const scrollArea = document.getElementById('scroll-area');
    scrollArea.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    scrollArea.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) {
        if (dx < 0 && currentHouse < puzzle.N - 1) { currentHouse++; render(); }
        else if (dx > 0 && currentHouse > 0) { currentHouse--; render(); }
      }
    }, { passive: true });

    // Win-knapper
    document.getElementById('playagain').addEventListener('click', () => newPuzzle());
    document.getElementById('nextlevel').addEventListener('click', nextLevel);

    // Tastatur-snarvei
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    });

    newPuzzle();
  });
})();

</script>
