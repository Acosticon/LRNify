<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mysteriet i Måkeveien</title>
<script>
  // Primær sjekk: touch-kapasitet + smal skjerm
  const hasTouch = navigator.maxTouchPoints > 0;
  const narrowScreen = window.innerWidth < 1024;

  // Backup: OS/UA-sniff for nettbrett og telefoner
  const ua = navigator.userAgent;
  const mobileUA = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);

  // Send til touch-versjon hvis to av tre indikatorer peker mot mobil/nettbrett
  const score = [hasTouch, narrowScreen, mobileUA].filter(Boolean).length;
  const target = score >= 2 ? 'touch.html' : 'desktop.html';

  // Redirect – replace() så tilbakeknappen ikke looper
  window.location.replace(target);
</script>
<!-- Fallback om JS er skrudd av -->
<noscript>
  <meta http-equiv="refresh" content="0; url=touch.html">
</noscript>
</head>
<body></body>
</html>
