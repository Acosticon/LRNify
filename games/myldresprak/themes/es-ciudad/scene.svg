<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- Sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F4FF"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6abf5e"/>
      <stop offset="100%" stop-color="#4a9e40"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#888"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
  </defs>

  <!-- Background sky -->
  <rect width="720" height="460" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="660" cy="55" r="32" fill="#FFD700" opacity="0.9"/>
  <circle cx="660" cy="55" r="38" fill="#FFD700" opacity="0.2"/>

  <!-- Clouds -->
  <g opacity="0.85">
    <ellipse cx="120" cy="60" rx="50" ry="22" fill="white"/>
    <ellipse cx="150" cy="52" rx="38" ry="20" fill="white"/>
    <ellipse cx="85" cy="65" rx="35" ry="18" fill="white"/>
  </g>
  <g opacity="0.85">
    <ellipse cx="420" cy="45" rx="55" ry="20" fill="white"/>
    <ellipse cx="455" cy="38" rx="40" ry="18" fill="white"/>
    <ellipse cx="385" cy="50" rx="32" ry="16" fill="white"/>
  </g>

  <!-- Ground / grass -->
  <rect x="0" y="390" width="720" height="70" fill="url(#grass)"/>

  <!-- Road / pavement -->
  <rect x="0" y="340" width="720" height="55" fill="url(#road)"/>
  <!-- Road markings -->
  <rect x="80" y="361" width="40" height="6" rx="3" fill="white" opacity="0.6"/>
  <rect x="180" y="361" width="40" height="6" rx="3" fill="white" opacity="0.6"/>
  <rect x="280" y="361" width="40" height="6" rx="3" fill="white" opacity="0.6"/>
  <rect x="380" y="361" width="40" height="6" rx="3" fill="white" opacity="0.6"/>
  <rect x="480" y="361" width="40" height="6" rx="3" fill="white" opacity="0.6"/>
  <rect x="580" y="361" width="40" height="6" rx="3" fill="white" opacity="0.6"/>

  <!-- Sidewalk -->
  <rect x="0" y="330" width="720" height="15" fill="#CCC"/>
  <rect x="0" y="390" width="720" height="8" fill="#BBB"/>

  <!-- ====== IGLESIA (church) — far left ====== -->
  <g id="iglesia">
    <!-- Main body -->
    <rect x="30" y="210" width="130" height="125" fill="#F5EED8" stroke="#C9A84C" stroke-width="1.5"/>
    <!-- Roof / pediment -->
    <polygon points="30,210 95,150 160,210" fill="#D4A84B" stroke="#C9A84C" stroke-width="1.5"/>
    <!-- Tower -->
    <rect x="75" y="115" width="40" height="100" fill="#F0E5C8" stroke="#C9A84C" stroke-width="1.5"/>
    <!-- Steeple -->
    <polygon points="75,115 95,80 115,115" fill="#D4A84B"/>
    <!-- Cross -->
    <rect x="91" y="68" width="8" height="20" fill="#8B6914"/>
    <rect x="85" y="74" width="20" height="5" fill="#8B6914"/>
    <!-- Bell window -->
    <ellipse cx="95" cy="140" rx="10" ry="14" fill="#A89060" stroke="#8B6914" stroke-width="1"/>
    <!-- Door -->
    <path d="M78,335 L78,265 Q95,250 112,265 L112,335 Z" fill="#8B6914" opacity="0.85"/>
    <!-- Windows -->
    <rect x="40" y="235" width="28" height="40" rx="14" fill="#87CEEB" stroke="#C9A84C" stroke-width="1.5"/>
    <rect x="122" y="235" width="28" height="40" rx="14" fill="#87CEEB" stroke="#C9A84C" stroke-width="1.5"/>
    <!-- Label -->
    <rect x="32" y="198" width="82" height="18" rx="4" fill="#8B6914" opacity="0.82"/>
    <text x="73" y="211" text-anchor="middle" fill="white" font-size="11" font-weight="bold">la iglesia</text>
  </g>

  <!-- ====== MERCADO (market) — center-left ====== -->
  <g id="mercado">
    <!-- Main building -->
    <rect x="115" y="265" width="130" height="80" fill="#E8D5A0" stroke="#B8860B" stroke-width="1.5"/>
    <!-- Awning / roof ridge -->
    <polygon points="115,265 180,225 245,265" fill="#CC4444" stroke="#990000" stroke-width="1"/>
    <!-- Awning stripes -->
    <polygon points="115,265 145,238 145,265" fill="#FF6666" opacity="0.5"/>
    <polygon points="155,248 185,225 185,265 155,265" fill="#FF6666" opacity="0.5"/>
    <polygon points="215,260 245,265 245,245" fill="#FF6666" opacity="0.5"/>
    <!-- Stall curtain -->
    <rect x="115" y="285" width="130" height="14" fill="#CC4444" opacity="0.7"/>
    <!-- Sign -->
    <rect x="130" y="270" width="100" height="18" rx="3" fill="#8B4513"/>
    <text x="180" y="283" text-anchor="middle" fill="#FFD700" font-size="10.5" font-weight="bold">MERCADO</text>
    <!-- Stall openings -->
    <rect x="122" y="302" width="28" height="30" rx="2" fill="#7B5C2A" opacity="0.7"/>
    <rect x="158" y="302" width="28" height="30" rx="2" fill="#7B5C2A" opacity="0.7"/>
    <rect x="194" y="302" width="28" height="30" rx="2" fill="#7B5C2A" opacity="0.7"/>
    <!-- Label -->
    <rect x="125" y="253" width="82" height="18" rx="4" fill="#8B4513" opacity="0.85"/>
    <text x="166" y="266" text-anchor="middle" fill="white" font-size="11" font-weight="bold">el mercado</text>
  </g>

  <!-- ====== FARMACIA (pharmacy) ====== -->
  <g id="farmacia">
    <!-- Building -->
    <rect x="250" y="265" width="90" height="80" fill="#E8F5E8" stroke="#2E8B57" stroke-width="1.5"/>
    <!-- Flat roof detail -->
    <rect x="248" y="258" width="94" height="10" fill="#2E8B57"/>
    <!-- Green cross sign -->
    <rect x="281" y="228" width="28" height="36" rx="3" fill="white" stroke="#2E8B57" stroke-width="2"/>
    <rect x="281" y="228" width="28" height="36" rx="3" fill="#2E8B57" opacity="0.15"/>
    <rect x="288" y="232" width="14" height="28" fill="#2E8B57"/>
    <rect x="282" y="239" width="26" height="14" fill="#2E8B57"/>
    <rect x="288" y="232" width="14" height="28" fill="white" opacity="0.4"/>
    <rect x="283" y="240" width="24" height="12" fill="white" opacity="0.4"/>
    <!-- Door -->
    <rect x="273" y="295" width="34" height="50" rx="2" fill="#1A6B3A" opacity="0.8"/>
    <!-- Windows -->
    <rect x="254" y="275" width="16" height="22" rx="2" fill="#87CEEB" stroke="#2E8B57" stroke-width="1"/>
    <rect x="320" y="275" width="16" height="22" rx="2" fill="#87CEEB" stroke="#2E8B57" stroke-width="1"/>
    <!-- Label -->
    <rect x="250" y="253" width="90" height="18" rx="4" fill="#2E8B57" opacity="0.85"/>
    <text x="295" y="266" text-anchor="middle" fill="white" font-size="11" font-weight="bold">la farmacia</text>
  </g>

  <!-- ====== PLAZA (square) — center ====== -->
  <g id="plaza">
    <!-- Paved area -->
    <ellipse cx="370" cy="310" rx="62" ry="30" fill="#E0D8C8" stroke="#B0A090" stroke-width="1.5"/>
    <!-- Fountain -->
    <ellipse cx="370" cy="305" rx="32" ry="18" fill="#7EC8E3" stroke="#5599AA" stroke-width="2"/>
    <ellipse cx="370" cy="300" rx="16" ry="10" fill="#A8DFF0" stroke="#5599AA" stroke-width="1.5"/>
    <!-- Fountain spout -->
    <rect x="367" y="283" width="6" height="18" rx="3" fill="#5599AA"/>
    <!-- Water droplets -->
    <ellipse cx="362" cy="287" rx="3" ry="5" fill="#7EC8E3" opacity="0.7"/>
    <ellipse cx="378" cy="287" rx="3" ry="5" fill="#7EC8E3" opacity="0.7"/>
    <!-- Benches -->
    <rect x="338" y="318" width="24" height="6" rx="2" fill="#8B6914"/>
    <rect x="370" y="318" width="24" height="6" rx="2" fill="#8B6914"/>
    <!-- Pigeons / birds -->
    <ellipse cx="355" cy="326" rx="4" ry="3" fill="#888"/>
    <ellipse cx="385" cy="323" rx="4" ry="3" fill="#888"/>
    <!-- Label -->
    <rect x="330" y="248" width="80" height="18" rx="4" fill="#7B6030" opacity="0.85"/>
    <text x="370" y="261" text-anchor="middle" fill="white" font-size="11" font-weight="bold">la plaza</text>
  </g>

  <!-- ====== BANCO (bank) ====== -->
  <g id="banco">
    <!-- Columns / classical facade -->
    <rect x="400" y="240" width="130" height="100" fill="#F0EDE0" stroke="#999" stroke-width="1.5"/>
    <!-- Pediment -->
    <polygon points="400,240 465,200 530,240" fill="#DDD8C0" stroke="#999" stroke-width="1.5"/>
    <!-- Columns -->
    <rect x="415" y="240" width="12" height="100" rx="3" fill="#E8E4D0" stroke="#BBB" stroke-width="1"/>
    <rect x="440" y="240" width="12" height="100" rx="3" fill="#E8E4D0" stroke="#BBB" stroke-width="1"/>
    <rect x="465" y="240" width="12" height="100" rx="3" fill="#E8E4D0" stroke="#BBB" stroke-width="1"/>
    <rect x="490" y="240" width="12" height="100" rx="3" fill="#E8E4D0" stroke="#BBB" stroke-width="1"/>
    <rect x="515" y="240" width="12" height="100" rx="3" fill="#E8E4D0" stroke="#BBB" stroke-width="1"/>
    <!-- BANCO sign on pediment -->
    <text x="465" y="228" text-anchor="middle" fill="#555" font-size="10" font-weight="bold">BANCO</text>
    <!-- Door -->
    <rect x="447" y="290" width="36" height="50" rx="2" fill="#888" stroke="#666" stroke-width="1.5"/>
    <!-- Label -->
    <rect x="414" y="228" width="70" height="18" rx="4" fill="#666" opacity="0.85"/>
    <text x="449" y="241" text-anchor="middle" fill="white" font-size="11" font-weight="bold">el banco</text>
  </g>

  <!-- ====== ESCUELA (school) ====== -->
  <g id="escuela">
    <!-- Main building -->
    <rect x="540" y="170" width="100" height="170" fill="#FFF3CC" stroke="#E6A817" stroke-width="1.5"/>
    <!-- Flat roof + flagpole base -->
    <rect x="538" y="162" width="104" height="12" fill="#E6A817"/>
    <!-- Flagpole -->
    <rect x="588" y="115" width="4" height="50" fill="#888"/>
    <!-- Flag -->
    <polygon points="592,115 630,125 592,135" fill="#AA0000"/>
    <polygon points="592,130 624,138 592,146" fill="#FFD700"/>
    <!-- Windows grid -->
    <rect x="550" y="182" width="24" height="22" rx="2" fill="#87CEEB" stroke="#E6A817" stroke-width="1"/>
    <rect x="582" y="182" width="24" height="22" rx="2" fill="#87CEEB" stroke="#E6A817" stroke-width="1"/>
    <rect x="614" y="182" width="24" height="22" rx="2" fill="#87CEEB" stroke="#E6A817" stroke-width="1"/>
    <rect x="550" y="215" width="24" height="22" rx="2" fill="#87CEEB" stroke="#E6A817" stroke-width="1"/>
    <rect x="582" y="215" width="24" height="22" rx="2" fill="#87CEEB" stroke="#E6A817" stroke-width="1"/>
    <rect x="614" y="215" width="24" height="22" rx="2" fill="#87CEEB" stroke="#E6A817" stroke-width="1"/>
    <!-- Door -->
    <rect x="573" y="290" width="44" height="50" rx="2" fill="#C08020" opacity="0.8"/>
    <!-- Steps -->
    <rect x="567" y="335" width="56" height="6" rx="1" fill="#DDD"/>
    <!-- ESCUELA sign -->
    <rect x="548" y="248" width="94" height="14" rx="3" fill="#E6A817" opacity="0.9"/>
    <text x="595" y="259" text-anchor="middle" fill="white" font-size="10" font-weight="bold">ESCUELA</text>
    <!-- Label -->
    <rect x="545" y="158" width="90" height="18" rx="4" fill="#C08020" opacity="0.85"/>
    <text x="590" y="171" text-anchor="middle" fill="white" font-size="11" font-weight="bold">la escuela</text>
  </g>

  <!-- ====== HOTEL ====== -->
  <g id="hotel">
    <!-- Main building tall -->
    <rect x="648" y="150" width="68" height="190" fill="#F5DEB3" stroke="#CD853F" stroke-width="1.5"/>
    <!-- Roof -->
    <rect x="646" y="142" width="72" height="12" rx="2" fill="#CD853F"/>
    <!-- Star rating -->
    <text x="682" y="155" text-anchor="middle" fill="#FFD700" font-size="12">★★★</text>
    <!-- Windows grid -->
    <rect x="656" y="165" width="18" height="18" rx="2" fill="#87CEEB" stroke="#CD853F" stroke-width="1"/>
    <rect x="692" y="165" width="18" height="18" rx="2" fill="#87CEEB" stroke="#CD853F" stroke-width="1"/>
    <rect x="656" y="193" width="18" height="18" rx="2" fill="#87CEEB" stroke="#CD853F" stroke-width="1"/>
    <rect x="692" y="193" width="18" height="18" rx="2" fill="#87CEEB" stroke="#CD853F" stroke-width="1"/>
    <rect x="656" y="221" width="18" height="18" rx="2" fill="#87CEEB" stroke="#CD853F" stroke-width="1"/>
    <rect x="692" y="221" width="18" height="18" rx="2" fill="#87CEEB" stroke="#CD853F" stroke-width="1"/>
    <rect x="656" y="249" width="18" height="18" rx="2" fill="#87CEEB" stroke="#CD853F" stroke-width="1"/>
    <rect x="692" y="249" width="18" height="18" rx="2" fill="#87CEEB" stroke="#CD853F" stroke-width="1"/>
    <!-- Awning -->
    <path d="M655,290 Q682,280 709,290 L709,300 L655,300 Z" fill="#8B0000" opacity="0.85"/>
    <!-- Door -->
    <rect x="665" y="300" width="34" height="40" rx="2" fill="#6B4423" opacity="0.85"/>
    <!-- HOTEL sign -->
    <rect x="656" y="274" width="52" height="15" rx="3" fill="#8B0000" opacity="0.85"/>
    <text x="682" y="285" text-anchor="middle" fill="white" font-size="10" font-weight="bold">HOTEL</text>
    <!-- Label -->
    <rect x="649" y="138" width="66" height="18" rx="4" fill="#8B4513" opacity="0.85"/>
    <text x="682" y="151" text-anchor="middle" fill="white" font-size="11" font-weight="bold">el hotel</text>
  </g>

  <!-- ====== PARQUE (park) — foreground ====== -->
  <g id="parque">
    <!-- Grass patch -->
    <ellipse cx="370" cy="415" rx="90" ry="28" fill="#4DBD33"/>
    <ellipse cx="370" cy="410" rx="80" ry="22" fill="#5CC43E"/>
    <!-- Trees -->
    <rect x="296" y="370" width="8" height="40" fill="#6B4423"/>
    <ellipse cx="300" cy="362" rx="22" ry="24" fill="#228B22"/>
    <ellipse cx="300" cy="358" rx="18" ry="20" fill="#2EAA2E"/>
    <rect x="338" y="380" width="7" height="32" fill="#6B4423"/>
    <ellipse cx="342" cy="373" rx="18" ry="20" fill="#228B22"/>
    <ellipse cx="342" cy="369" rx="15" ry="17" fill="#2EAA2E"/>
    <rect x="420" y="375" width="8" height="37" fill="#6B4423"/>
    <ellipse cx="424" cy="367" rx="20" ry="22" fill="#228B22"/>
    <ellipse cx="424" cy="363" rx="16" ry="18" fill="#2EAA2E"/>
    <!-- Bench -->
    <rect x="358" y="408" width="30" height="6" rx="2" fill="#8B6914"/>
    <rect x="360" y="414" width="4" height="8" fill="#6B4413"/>
    <rect x="382" y="414" width="4" height="8" fill="#6B4413"/>
    <!-- Flowers -->
    <circle cx="385" cy="405" r="4" fill="#FF69B4"/>
    <circle cx="355" cy="407" r="3" fill="#FF4500"/>
    <circle cx="393" cy="408" r="3" fill="#FFD700"/>
    <!-- Label -->
    <rect x="328" y="392" width="80" height="18" rx="4" fill="#2E7D32" opacity="0.88"/>
    <text x="368" y="405" text-anchor="middle" fill="white" font-size="11" font-weight="bold">el parque</text>
  </g>

  <!-- Border -->
  <rect x="0" y="0" width="720" height="460" fill="none" stroke="#CCC" stroke-width="1"/>
</svg>
