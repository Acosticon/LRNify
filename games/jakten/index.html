<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Relikviejakten – KRLE-detektivspill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --natt:#141a26; --natt2:#1c2433; --panel:#232d40;
    --papir:#efe3c8; --papir-m:#e2d3b0; --blekk:#2b2118;
    --gull:#d4a94c; --gull-l:#f0cd7e;
    --roed:#c0392b; --groenn:#5a9e35;
    --tekst:#e8e2d4; --dus:#9aa5b8;
    --ramme:#0c1018;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:'Nunito',system-ui,sans-serif; background:var(--natt); color:var(--tekst);
    height:100dvh; overflow:hidden; user-select:none; -webkit-user-select:none;}
  #app{height:100dvh; display:flex; flex-direction:column; padding:10px; gap:8px;}
  .hidden{display:none!important;}
  .skrivemaskin{font-family:'Special Elite',monospace;}

  header{display:flex; align-items:center; gap:10px; flex:0 0 auto; flex-wrap:wrap;}
  .brand{font-family:'Special Elite',monospace; font-size:clamp(15px,2.4vmin,20px); color:var(--dus); white-space:nowrap;}
  .brand b{color:var(--gull);}
  .stats{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .chip{background:var(--panel); border:2px solid var(--ramme); border-radius:12px; padding:6px 12px; font-weight:800;
    font-size:clamp(12px,2vmin,15px); display:flex; align-items:center; gap:6px; white-space:nowrap; box-shadow:0 3px 0 var(--ramme);}
  .btn{font-family:'Special Elite',monospace; font-size:clamp(15px,2.6vmin,21px); background:var(--gull);
    border:3px solid var(--ramme); border-radius:12px; box-shadow:0 5px 0 var(--ramme); padding:9px 20px;
    margin:10px 5px 0; cursor:pointer; color:var(--blekk); transition:transform .05s,box-shadow .05s;}
  .btn.sub{background:var(--panel); color:var(--tekst);}
  .btn.small{font-size:clamp(13px,2vmin,16px); padding:6px 12px; box-shadow:0 3px 0 var(--ramme); margin:0;}
  .btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--ramme);}

  /* ================= ARKIV ================= */
  #arkiv{flex:1 1 auto; min-height:0; overflow:auto; padding:4px 2px 20px;}
  .ark-head{text-align:center; margin:8px 0 4px;}
  .ark-head h1{font-family:'Special Elite',monospace; font-size:clamp(28px,6vmin,50px); margin:0; color:var(--gull);
    text-shadow:0 3px 0 rgba(0,0,0,.5); letter-spacing:1px;}
  .ark-head .under{font-weight:800; color:var(--dus); font-size:clamp(12px,2vmin,16px); margin-top:2px;}
  .rank{display:flex; justify-content:center; align-items:center; gap:10px; margin:10px 0 4px; flex-wrap:wrap;}
  .badge{background:var(--panel); border:2px solid var(--gull); color:var(--gull-l); border-radius:999px;
    padding:6px 16px; font-weight:900; font-size:clamp(13px,2.2vmin,16px); letter-spacing:.5px;}
  .nivarow{display:flex; justify-content:center; gap:8px; margin:8px 0 14px;}
  .niva{background:var(--panel); color:var(--tekst); border:2px solid var(--ramme); border-radius:11px;
    padding:6px 14px; font-weight:800; cursor:pointer; font-size:clamp(12px,2vmin,15px);}
  .niva.sel{background:var(--gull); color:var(--blekk); border-color:var(--gull); box-shadow:0 3px 0 var(--ramme);}
  .saker{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:14px; max-width:1050px; margin:0 auto;}
  .mappe{position:relative; background:var(--papir); color:var(--blekk); border:3px solid var(--ramme); border-radius:8px 14px 14px 14px;
    padding:34px 14px 12px; cursor:pointer; transition:transform .1s; box-shadow:0 6px 0 var(--ramme); min-height:118px;}
  .mappe::before{content:""; position:absolute; top:-14px; left:14px; width:44%; height:18px; background:var(--papir);
    border:3px solid var(--ramme); border-bottom:none; border-radius:8px 8px 0 0;}
  .mappe:hover{transform:translateY(-3px) rotate(-.4deg);}
  .mappe:active{transform:translateY(2px);}
  .mappe .snr{font-family:'Special Elite',monospace; font-size:12px; color:#8a7a5c; position:absolute; top:8px; left:16px;}
  .mappe h3{font-family:'Special Elite',monospace; margin:0 0 2px; font-size:clamp(15px,2.4vmin,19px); line-height:1.15;}
  .mappe .tr{font-weight:800; font-size:12px; color:#7a6a4a;}
  .mappe .stj{position:absolute; top:6px; right:12px; font-size:15px; letter-spacing:1px;}
  .mappe .lost{position:absolute; bottom:10px; right:10px; font-family:'Special Elite',monospace; color:var(--roed);
    border:2px solid var(--roed); border-radius:6px; padding:1px 7px; font-size:11.5px; transform:rotate(-8deg); opacity:.85;}

  /* ================= SAK ================= */
  #sak{display:flex; flex-direction:column; gap:8px; flex:1 1 auto; min-height:0;}
  .oppgavelinje{background:var(--papir); color:var(--blekk); border:3px solid var(--ramme); border-radius:14px;
    box-shadow:0 5px 0 var(--ramme); padding:8px 14px; display:flex; align-items:center; gap:12px; transform:rotate(-.4deg);}
  .oppgavelinje .fase{font-family:'Special Elite',monospace; font-size:clamp(11px,1.8vmin,13px); color:#8a7a5c; white-space:nowrap;}
  .oppgavelinje .tekst{font-weight:800; font-size:clamp(13px,2.3vmin,17px); line-height:1.25;}

  .scene{position:relative; flex:1 1 auto; min-height:0; background:var(--natt2); border:3px solid var(--ramme);
    border-radius:16px; box-shadow:0 6px 0 var(--ramme); overflow:hidden;}
  .scene .gulv{position:absolute; inset:0; background:
    radial-gradient(ellipse at 50% 115%, #2a3549 0%, transparent 55%),
    linear-gradient(180deg, #161d2b 0%, #1c2433 100%);}
  .podium{position:absolute; left:50%; bottom:8%; transform:translateX(-50%); width:min(46vmin,300px); height:22px;
    background:#31281c; border:3px solid var(--ramme); border-radius:8px;}
  .gjenstand{position:absolute; left:50%; bottom:calc(8% + 20px); transform:translateX(-50%);
    width:min(58vmin,340px); height:min(58vmin,340px);}
  .gjenstand svg{width:100%; height:100%; display:block;}

  /* lommelykt */
  .moerke{position:absolute; inset:0; pointer-events:none; z-index:3;
    background:radial-gradient(circle 150px at var(--lx,50%) var(--ly,45%),
      rgba(8,11,18,0) 0%, rgba(8,11,18,.25) 55%, rgba(8,11,18,.93) 100%);
    transition:opacity .3s;}
  .fullyst .moerke{opacity:0;}
  .lysring{position:absolute; z-index:4; pointer-events:none; width:300px; height:300px; border-radius:50%;
    left:var(--lx,50%); top:var(--ly,45%); transform:translate(-50%,-50%);
    box-shadow:inset 0 0 30px 6px rgba(240,205,126,.12);}
  .fullyst .lysring{display:none;}

  .hotspot{position:absolute; z-index:5; width:44px; height:44px; transform:translate(-50%,-50%);
    background:none; border:none; cursor:pointer; padding:0;}
  .hotspot::before{content:""; position:absolute; inset:10px; border-radius:50%;
    background:radial-gradient(circle, rgba(240,205,126,.85) 0%, rgba(240,205,126,0) 70%);
    animation:glimt 1.6s ease-in-out infinite;}
  .hotspot.funnet::before{animation:none; background:none; border:2.5px solid var(--groenn); border-radius:50%; opacity:.9;}
  .hotspot.funnet::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--groenn); font-weight:900; font-size:18px;}
  @keyframes glimt{0%,100%{opacity:.25; transform:scale(.8);}50%{opacity:.95; transform:scale(1.15);}}
  .fullyst .hotspot:not(.funnet)::before{opacity:1; animation:glimt 1.2s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){ .hotspot::before{animation:none; opacity:.7;} }

  /* sporkort */
  .sporrad{position:absolute; left:10px; top:10px; z-index:6; display:flex; flex-direction:column; gap:8px; max-width:min(46%,260px);}
  .sporkort{background:var(--papir); color:var(--blekk); border:3px solid var(--ramme); border-radius:10px;
    padding:8px 11px; box-shadow:0 4px 0 var(--ramme); transform:rotate(-1deg);}
  .sporkort.ny{animation:smell .35s cubic-bezier(.2,2,.4,1);}
  @keyframes smell{0%{transform:scale(1.6) rotate(6deg); opacity:0;}100%{transform:scale(1) rotate(-1deg); opacity:1;}}
  .sporkort b{font-family:'Special Elite',monospace; display:block; font-size:13.5px;}
  .sporkort p{margin:3px 0 0; font-weight:700; font-size:12.5px; line-height:1.3;}
  .sporkort.tom{opacity:.35; border-style:dashed; min-height:34px; display:flex; align-items:center; justify-content:center;
    font-weight:900; color:#8a7a5c; background:rgba(239,227,200,.6);}

  .verktoy{position:absolute; right:10px; top:10px; z-index:6; display:flex; flex-direction:column; gap:6px; align-items:flex-end;}
  .uu-btn{font-family:'Nunito',sans-serif; font-weight:800; font-size:clamp(11px,1.9vmin,14px);
    background:var(--panel); color:var(--tekst); border:2px solid var(--ramme); border-radius:10px; padding:5px 10px;
    cursor:pointer; box-shadow:0 3px 0 var(--ramme);}
  .uu-btn.active{background:var(--gull); color:var(--blekk);}

  /* deduksjon */
  .dedu{position:absolute; inset:0; z-index:10; background:rgba(8,11,18,.72); display:flex;
    align-items:center; justify-content:center; padding:14px; overflow:auto;}
  .notat{background:var(--papir); color:var(--blekk); border:4px solid var(--ramme); border-radius:14px;
    box-shadow:0 8px 0 var(--ramme); max-width:560px; width:100%; padding:16px 18px 14px; transform:rotate(-.5deg);
    max-height:92%; overflow:auto;}
  .notat h2{font-family:'Special Elite',monospace; margin:0 0 2px; font-size:clamp(17px,3vmin,23px);}
  .notat .sp{font-weight:800; font-size:clamp(13px,2.2vmin,16px); margin:8px 0 8px;}
  .altrad{display:flex; flex-direction:column; gap:7px;}
  .alt{background:#fff; border:3px solid var(--blekk); border-radius:10px; padding:9px 12px; font-weight:800;
    font-size:clamp(13px,2.1vmin,15.5px); cursor:pointer; text-align:left; transition:transform .06s; color:var(--blekk); font-family:'Nunito',sans-serif;}
  .alt:hover{transform:translateX(3px);}
  .alt.feil{background:#f8d3cc; border-color:var(--roed); animation:rist .3s;}
  .alt.rett{background:#dcefcf; border-color:var(--groenn);}
  @keyframes rist{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .feilrad{font-family:'Special Elite',monospace; color:var(--roed); font-size:12.5px; margin-top:8px; min-height:16px;}

  /* kart i deduksjon */
  .kartboks{border:3px solid var(--blekk); border-radius:10px; overflow:hidden; background:#cfe3ec; margin-top:4px;}
  .kartboks svg{display:block; width:100%;}
  .kartboks path.land{fill:#e9dfc6; stroke:#a99b78; stroke-width:.8;}
  .kartsted{cursor:pointer;}
  .kartsted circle{fill:var(--gull); stroke:var(--blekk); stroke-width:2; transition:r .1s;}
  .kartsted:hover circle{r:11;}
  .kartsted text{font-family:'Nunito',sans-serif; font-size:13.5px; font-weight:800; fill:var(--blekk);
    paint-order:stroke; stroke:#f4ecd8; stroke-width:3px;}
  .kartsted.feil circle{fill:var(--roed);}
  .kartsted.rett circle{fill:var(--groenn);}

  /* sak løst */
  .lostkort{text-align:center;}
  .stempel{display:inline-block; font-family:'Special Elite',monospace; color:var(--roed); border:5px solid var(--roed);
    border-radius:10px; padding:6px 22px; font-size:clamp(26px,6vmin,44px); transform:rotate(-8deg); letter-spacing:2px;
    margin:6px 0 4px;}
  .stempel.inn{animation:stemp .45s cubic-bezier(.2,2.5,.5,1);}
  @keyframes stemp{0%{transform:scale(2.6) rotate(-30deg); opacity:0;}60%{transform:scale(.92) rotate(-4deg); opacity:1;}100%{transform:scale(1) rotate(-8deg);}}
  .stjerner{font-size:clamp(28px,6vmin,44px); letter-spacing:6px; margin:4px 0;}
  .faktakort{background:#fff; border:3px solid var(--blekk); border-radius:10px; padding:10px 13px; margin-top:10px; text-align:left;}
  .faktakort b{font-family:'Special Elite',monospace;}
  .faktakort p{margin:4px 0 0; font-weight:700; font-size:clamp(12.5px,2vmin,15px); line-height:1.45;}

  .toast{position:absolute; left:50%; bottom:12px; transform:translateX(-50%) translateY(20px); z-index:20;
    background:var(--ramme); color:#fff; font-weight:800; padding:8px 16px; border-radius:12px;
    font-size:clamp(13px,2.1vmin,16px); opacity:0; transition:.2s; pointer-events:none; white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <!-- ============ ARKIVET ============ -->
  <div id="arkivScreen" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0;">
    <header>
      <div class="brand">LRN<b>ify</b> presenterer</div>
      <div class="stats"><div class="chip">⭐ <b id="totStj">0</b>/18</div></div>
    </header>
    <div id="arkiv">
      <div class="ark-head">
        <h1>🔦 RELIKVIEJAKTEN</h1>
        <div class="under">Seks gjenstander er stjålet fra Verdensmuseet. Finn ut hvor de hører hjemme.</div>
      </div>
      <div class="rank"><span class="badge" id="rankBadge">🕵️ Aspirant</span></div>
      <div class="nivarow">
        <button class="niva sel" data-niva="lett">Aspirant (5.–7. trinn)</button>
        <button class="niva" data-niva="vanskelig">Etterforsker (8.–10. trinn)</button>
      </div>
      <div class="saker" id="sakGrid"></div>
    </div>
  </div>

  <!-- ============ SAK ============ -->
  <div id="sakScreen" class="hidden" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0;gap:8px;">
    <header>
      <button class="btn small sub" id="tilArkiv">← Arkivet</button>
      <div class="brand" id="sakTittel">Sak #1</div>
      <div class="stats"><div class="chip">🔍 <b id="sporTeller">0</b>/3 spor</div></div>
    </header>
    <div id="aria-status" aria-live="polite" style="position:absolute;left:-9999px;"></div>

    <div class="oppgavelinje">
      <div class="fase" id="faseLabel">UNDERSØKELSE</div>
      <div class="tekst" id="oppgaveTekst">Lys på gjenstanden og finn tre spor.</div>
    </div>

    <div class="scene" id="scene">
      <div class="gulv"></div>
      <div class="podium"></div>
      <div class="gjenstand" id="gjenstand"></div>
      <div class="moerke" id="moerke"></div>
      <div class="lysring"></div>
      <div class="sporrad" id="sporrad"></div>
      <div class="verktoy">
        <button class="uu-btn" id="lysBtn" aria-pressed="false">💡 Full belysning</button>
      </div>
      <div class="toast" id="toast"></div>

      <!-- BRIEFING -->
      <div class="dedu" id="briefBox">
        <div class="notat">
          <h2 id="briefTittel">Sak #1</h2>
          <p class="sp skrivemaskin" id="briefTekst" style="font-weight:400;font-family:'Special Elite',monospace;"></p>
          <div style="text-align:center"><button class="btn" id="briefStart">Start undersøkelsen 🔦</button></div>
        </div>
      </div>

      <!-- DEDUKSJON -->
      <div class="dedu hidden" id="deduBox">
        <div class="notat">
          <h2>🗒️ Detektivnotatboka</h2>
          <div class="sp" id="deduSp"></div>
          <div class="altrad" id="deduAlt"></div>
          <div class="kartboks hidden" id="kartboks"></div>
          <div class="feilrad" id="feilrad"></div>
        </div>
      </div>

      <!-- SAK LØST -->
      <div class="dedu hidden" id="lostBox">
        <div class="notat lostkort">
          <div><span class="stempel" id="stempel">SAK LØST</span></div>
          <div class="stjerner" id="stjerner">⭐⭐⭐</div>
          <div class="faktakort"><b>📌 Visste du at …</b><p id="faktaTekst"></p></div>
          <button class="btn" id="nesteSak">Neste sak →</button>
          <button class="btn sub" id="lostArkiv">Arkivet</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>

  brief:'I hittegodset på jernbanestasjonen sto en metallsylinder på et trehåndtak. En reisende hadde levert den inn: «Den lå igjen på perrongen. Det føltes galt å bare la den ligge.» Verdensmuseet bekrefter: Den er deres.',
  spor:[
    {x:50,y:38,tittel:'Skrift rundt sylinderen', tekst:'Tegn fra et språk i Himalaya er preget rundt hele sylinderen. Inni ligger papirruller med samme tekst, om og om igjen.'},
    {x:78,y:52,tittel:'Kjede med lodd', tekst:'Et lite lodd i kjede hjelper sylinderen med å snurre jevnt rundt – alltid samme vei, med klokka.'},
    {x:50,y:80,tittel:'Blankslitt håndtak', tekst:'Trehåndtaket er blankslitt av bruk. Noen har holdt og snurret denne i timevis, dag etter dag.'},
  ],
  bruk:{ riktig:'Snurres med klokka – hver runde er som å resitere bønnen inni',
    vanskelig:['Kvern som maler teblader til smørte','Instrument som slår timeslag i klosteret','Beholder for røkelse under meditasjon'],
    lett:['Instrument som slår timeslag i klosteret','Leketøy som gis til barn i klosteret'] },
  fakta:'Bønnehjul brukes særlig i tibetansk buddhisme. Inni sylinderen ligger mantraet «Om mani padme hum» skrevet mange ganger på papirruller. Å snurre hjulet – alltid med klokka – regnes som å resitere mantraet like mange ganger.' },

{ id:'khanda', navn:'Emblemet i stål', tradisjon:'Sikhisme', art:'khanda', sted:'amritsar',
  brief:'Et blankpusset emblem i stål ble funnet i en pantelåners vindu. Pantelåneren sverget på at han hadde kjøpt det lovlig – men serienummeret på baksiden matcher Verdensmuseets katalog.',
  spor:[
    {x:50,y:22,tittel:'Tveegget sverd', tekst:'Et rett sverd, kvesset på begge sider, står midt i emblemet.'},
    {x:22,y:56,tittel:'Sirkelen', tekst:'En ubrutt sirkel omslutter sverdet – uten begynnelse og uten slutt.'},
    {x:79,y:60,tittel:'To krumme sverd', tekst:'To buede sverd rammer inn symbolet – ett for åndelig og ett for verdslig ansvar.'},
  ],
  bruk:{ riktig:'Hovedsymbol for en religion – pryder flagget utenfor gudshuset',
    vanskelig:['Seremonielt våpen som brukes under høytider','Symbol for de fem elvene i Punjab','Kongelig våpenskjold fra det gamle India'],
    lett:['Kongelig våpenskjold fra det gamle India','Premie fra en fekteturnering'] },
  fakta:'Khandaen er sikhismens hovedsymbol: et tveegget sverd, en sirkel (chakkar) som viser at Gud er evig, og to kirpaner som står for åndelig og verdslig ansvar. Symbolet pryder Nishan Sahib – flagget som vaier utenfor enhver gurdwara, sikhenes gudshus.' },
];

/* ============================================================
   MOTOR
   ============================================================ */
const $=id=>document.getElementById(id);
const store={ get(k,fb){try{const v=localStorage.getItem(k);return v===null?fb:JSON.parse(v);}catch(e){return fb;}},
              set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}} };
const SAVE_KEY='lrnify_relikviejakten';
let niva=store.get(SAVE_KEY+'_niva','lett');
let sak=null, sakIdx=0, funnet=[], feil=0, fase='brief', qIdx=0, laast=false;

function stjernerFor(f){ return f===0?3 : f===1?2 : 1; }
function lagret(){ return store.get(SAVE_KEY,{}); }
function totalStjerner(){ const l=lagret(); return CASES.reduce((s,c)=>s+(l[c.id]||0),0); }
function rank(){ const t=totalStjerner();
  return t>=18?'🏆 Mesterdetektiv' : t>=12?'🎖️ Førstebetjent' : t>=6?'🕵️ Etterforsker' : '🕵️ Aspirant'; }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function aria(msg){const s=$('aria-status'); s.textContent=''; requestAnimationFrame(()=>s.textContent=msg);}
let toastT=null;
function toast(msg){const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1400);}

/* ---------- arkivet ---------- */
function renderArkiv(){
  $('totStj').textContent=totalStjerner();
  $('rankBadge').textContent=rank();
  document.querySelectorAll('.niva').forEach(b=>b.classList.toggle('sel',b.dataset.niva===niva));
  const g=$('sakGrid'); g.innerHTML='';
  CASES.forEach((c,i)=>{
    const stj=lagret()[c.id]||0;
    const d=document.createElement('div'); d.className='mappe'; d.tabIndex=0; d.setAttribute('role','button');
    d.innerHTML='<div class="snr">SAK #'+String(i+1).padStart(3,'0')+'</div>'+
      '<div class="stj">'+'⭐'.repeat(stj)+'</div>'+
      '<h3>'+esc(c.navn)+'</h3>'+
      '<div class="tr">'+(stj? esc(c.tradisjon) : 'Tradisjon: ukjent')+'</div>'+
      (stj?'<div class="lost">SAK LØST</div>':'');
    d.addEventListener('click',()=>startSak(i));
    d.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();startSak(i);}});
    g.appendChild(d);
  });
}
document.querySelectorAll('.niva').forEach(b=>b.addEventListener('click',()=>{
  niva=b.dataset.niva; store.set(SAVE_KEY+'_niva',niva); renderArkiv();
}));

/* ---------- sak ---------- */
function startSak(i){
  sakIdx=i; sak=CASES[i]; funnet=[]; feil=0; qIdx=0; fase='brief'; laast=false;
  $('arkivScreen').classList.add('hidden');
  $('sakScreen').classList.remove('hidden');
  $('sakTittel').textContent='SAK #'+String(i+1).padStart(3,'0');
  $('sporTeller').textContent='0';
  $('faseLabel').textContent='BRIEFING';
  $('oppgaveTekst').textContent='Les saksmappen.';
  $('gjenstand').innerHTML=ART[sak.art];
  renderSporrad();
  ['deduBox','lostBox'].forEach(id=>$(id).classList.add('hidden'));
  $('briefBox').classList.remove('hidden');
  $('briefTittel').textContent='SAK #'+String(i+1).padStart(3,'0')+': '+sak.navn;
  $('briefTekst').textContent=sak.brief;
  /* hotspots */
  document.querySelectorAll('.hotspot').forEach(h=>h.remove());
  const gj=$('gjenstand');
  sak.spor.forEach((s,si)=>{
    const b=document.createElement('button'); b.className='hotspot';
    b.style.left=s.x+'%'; b.style.top=s.y+'%';
    b.setAttribute('aria-label','Undersøk detalj '+(si+1));
    b.addEventListener('click',()=>finnSpor(si));
    gj.appendChild(b);
  });
  aria('Ny sak: '+sak.navn+'. '+sak.brief);
}
$('briefStart').addEventListener('click',()=>{
  $('briefBox').classList.add('hidden');
  fase='undersok';
  $('faseLabel').textContent='UNDERSØKELSE';
  $('oppgaveTekst').textContent='Før lommelykten over gjenstanden og finn tre spor.';
  aria('Undersøkelsen har startet. Finn tre spor på gjenstanden. Bruk knappen Full belysning om du vil se alle sporene.');
});

function renderSporrad(){
  const r=$('sporrad'); r.innerHTML='';
  for(let i=0;i<3;i++){
    if(funnet.includes(i)){
      const s=sak.spor[i];
      r.insertAdjacentHTML('beforeend','<div class="sporkort'+(i===funnet[funnet.length-1]?' ny':'')+'"><b>🔍 SPOR '+(i+1)+': '+esc(s.tittel)+'</b><p>'+esc(s.tekst)+'</p></div>');
    } else {
      r.insertAdjacentHTML('beforeend','<div class="sporkort tom">SPOR '+(i+1)+'</div>');
    }
  }
}
function finnSpor(i){
  if(fase!=='undersok'||funnet.includes(i)) return;
  funnet.push(i);
  document.querySelectorAll('.hotspot')[i].classList.add('funnet');
  $('sporTeller').textContent=funnet.length;
  renderSporrad();
  aria('Spor funnet: '+sak.spor[i].tittel+'. '+sak.spor[i].tekst);
  if(funnet.length===3){
    toast('Alle spor funnet! 🗒️');
    setTimeout(()=>{ fase='dedu'; qIdx=0; visSporsmal(); },900);
  }
}

/* ---------- deduksjon ---------- */
function alternativer(){
  if(qIdx===0){
    const alle = niva==='lett'
      ? shuffle([sak.tradisjon, ...shuffle(TRADISJONER.filter(t=>t!==sak.tradisjon)).slice(0,2)])
      : shuffle(TRADISJONER.slice());
    return alle.map(t=>({tekst:t, rett:t===sak.tradisjon}));
  }
  if(qIdx===1){
    const d = niva==='lett'?sak.bruk.lett:sak.bruk.vanskelig;
    return shuffle([{tekst:sak.bruk.riktig,rett:true}, ...d.map(t=>({tekst:t,rett:false}))]);
  }
  return null; /* q3 = kart */
}
function visSporsmal(){
  $('faseLabel').textContent='DEDUKSJON '+(qIdx+1)+'/3';
  $('oppgaveTekst').textContent='Bruk sporene og svar i notatboka.';
  $('deduBox').classList.remove('hidden');
  $('feilrad').textContent='';
  const spEl=$('deduSp'), altEl=$('deduAlt'), kart=$('kartboks');
  if(qIdx<2){
    kart.classList.add('hidden'); altEl.classList.remove('hidden');
    spEl.textContent = qIdx===0 ? '1. Hvilken tradisjon hører gjenstanden hjemme i?' : '2. Hva brukes den til?';
    altEl.innerHTML='';
    alternativer().forEach(a=>{
      const b=document.createElement('button'); b.className='alt'; b.textContent=a.tekst;
      b.addEventListener('click',()=>svar(a.rett,b));
      altEl.appendChild(b);
    });
    aria(spEl.textContent);
  } else {
    spEl.textContent='3. Hvor skal gjenstanden leveres tilbake?';
    altEl.classList.add('hidden');
    kart.classList.remove('hidden');
    let inner='<path class="land" d="'+WORLD.land+'"/>';
    const plasser=Object.entries(STEDER);
    plasser.forEach(([k,st])=>{
      const [x,y]=WORLD.cities[k];
      const over = (k==='katmandu'||k==='istanbul'||k==='amritsar');
      inner+='<g class="kartsted" data-k="'+k+'" role="button" aria-label="'+esc(st.navn)+'">'+
        '<circle cx="'+x+'" cy="'+y+'" r="9"/>'+
        '<text x="'+x+'" y="'+(y+(over?-16:27))+'" text-anchor="middle">'+esc(st.navn.split(' i ')[1]||st.navn)+'</text></g>';
    });
    kart.innerHTML='<svg viewBox="0 0 '+WORLD.w+' '+WORLD.h+'">'+inner+'</svg>';
    kart.querySelectorAll('.kartsted').forEach(g=>{
      g.addEventListener('click',()=>svarSted(g));
    });
    aria('Velg leveringssted på kartet: '+plasser.map(p=>p[1].navn).join(', '));
  }
}
function svar(rett,btn){
  if(laast) return;
  if(rett){
    laast=true; btn.classList.add('rett');
    toast(qIdx===0?'Riktig tradisjon! ✅':'Riktig! ✅');
    setTimeout(()=>{ laast=false; qIdx++; visSporsmal(); },700);
  } else {
    feil++; btn.classList.add('feil');
    $('feilrad').textContent='✗ Etterforskningsfeil notert i protokollen ('+feil+')';
    aria('Feil. Prøv igjen.');
    setTimeout(()=>btn.classList.remove('feil'),600);
  }
}
function svarSted(g){
  if(laast) return;
  const k=g.dataset.k;
  if(k===sak.sted){
    laast=true; g.classList.add('rett');
    toast('Levert! 📦');
    setTimeout(sakLost,800);
  } else {
    feil++; g.classList.add('feil');
    $('feilrad').textContent='✗ Feil sted – '+STEDER[k].navn+' venter ikke på denne. ('+feil+')';
    aria('Feil sted. Prøv igjen.');
    setTimeout(()=>g.classList.remove('feil'),700);
  }
}

/* ---------- sak løst ---------- */
function sakLost(){
  const stj=stjernerFor(feil);
  const l=lagret(); if((l[sak.id]||0)<stj){ l[sak.id]=stj; store.set(SAVE_KEY,l); }
  $('deduBox').classList.add('hidden');
  $('lostBox').classList.remove('hidden');
  $('faseLabel').textContent='SAK LØST';
  $('oppgaveTekst').textContent=sak.navn+' er tilbake der den hører hjemme: '+STEDER[sak.sted].navn+'.';
  const st=$('stempel'); st.classList.remove('inn'); void st.offsetWidth; st.classList.add('inn');
  $('stjerner').textContent='⭐'.repeat(stj)+'☆'.repeat(3-stj);
  $('faktaTekst').textContent=sak.fakta;
  $('nesteSak').classList.toggle('hidden', sakIdx>=CASES.length-1);
  aria('Sak løst! '+stj+' av 3 stjerner. '+sak.fakta);
}
$('nesteSak').addEventListener('click',()=>startSak(sakIdx+1));
$('lostArkiv').addEventListener('click',tilArkiv);
$('tilArkiv').addEventListener('click',tilArkiv);
function tilArkiv(){
  $('sakScreen').classList.add('hidden');
  renderArkiv();
  $('arkivScreen').classList.remove('hidden');
}

/* ---------- lommelykt ---------- */
const scene=$('scene');
function flyttLys(clientX,clientY){
  const r=scene.getBoundingClientRect();
  scene.style.setProperty('--lx',((clientX-r.left)/r.width*100)+'%');
  scene.style.setProperty('--ly',((clientY-r.top)/r.height*100)+'%');
}
scene.addEventListener('pointermove',e=>flyttLys(e.clientX,e.clientY));
scene.addEventListener('pointerdown',e=>flyttLys(e.clientX,e.clientY));
$('lysBtn').addEventListener('click',()=>{
  const on=!scene.classList.contains('fullyst');
  scene.classList.toggle('fullyst',on);
  $('lysBtn').classList.toggle('active',on);
  $('lysBtn').setAttribute('aria-pressed',String(on));
});

/* ---------- oppstart ---------- */
renderArkiv();

/* ---------- test-hooks ---------- */
window.__spill={
  CASES, STEDER,
  get state(){return {sakIdx, fase, funnet:funnet.slice(), feil, qIdx, niva};},
  startSak, finnSpor,
  svarTekst(tekst){ const b=[...document.querySelectorAll('#deduAlt .alt')].find(b=>b.textContent===tekst); if(b) b.click(); return !!b; },
  svarStedKey(k){ const g=document.querySelector('.kartsted[data-k="'+k+'"]'); if(g) g.dispatchEvent(new MouseEvent('click',{bubbles:true})); return !!g; },
  brief(){ document.getElementById('briefStart').click(); },
  lagret, setNiva(n){ niva=n; },
};
</script>
<script src="/bruk/lrnify-bruk.js" defer></script>
</body>
